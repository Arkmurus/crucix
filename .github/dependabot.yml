# .github/dependabot.yml
#
# R-F1794 (2026-06-23) — supply-chain security for aria-web (audit #13).
# Automated vulnerability + version PRs for the npm deps, the Python deps, and
# the GitHub Actions themselves. Grouped weekly to avoid PR spam; GitHub still
# raises security updates out-of-band as advisories are published.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
