# R-F1081 — Deploy ARIA static fallback page to GitHub Pages.
# This page is served when the main backend is down for maintenance.
# It's a simple static HTML page with no dependencies.
name: Deploy Fallback Page

on:
  push:
    branches: [main]
    paths:
      - 'docs/fallback/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/fallback
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
