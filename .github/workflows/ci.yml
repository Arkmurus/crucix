# R-F1073 — CI pipeline: test + ecosystem audit + pre-commit verification
# Each step FAILS THE BUILD on error (no || true bypass).
name: CI

on:
  push:
    branches: [main]
    # R-F1408: skip CI on doc/data/memory-only pushes (the bulk of our commits
    # are R-number registry, training data, docs) so they don't spawn a test
    # run + email on every non-code change.
    paths-ignore:
      - 'docs/**'
      - 'data/**'
      - '**/*.md'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
          pip install -r requirements-dev.txt 2>/dev/null || true

      - name: Pre-commit verification (--check-all)
        run: |
          echo "Checking ALL Python files for non-existent function calls..."
          python scripts/pre-commit --check-all

      - name: Wiring audit (structural guard)
        run: |
          echo "Checking ALL intel modules for brain wiring..."
          python -c "
import sys
from pathlib import Path
sys.path.insert(0, 'scripts')
from pre_commit_checks import check_wiring_present
files = list(Path('aria_service/intel').rglob('*.py'))
issues = check_wiring_present(files)
if issues:
    print('WIRING AUDIT FAILED:')
    for i in issues:
        print(i)
    sys.exit(1)
print('All intel modules have brain wiring.')
"

      - name: Windows compatibility check
        run: |
          echo "Checking for Windows-incompatible patterns..."
          python -c "
import sys
from pathlib import Path
sys.path.insert(0, 'scripts')
from pre_commit_checks import check_windows_compat
files = list(Path('aria_service').rglob('*.py'))
issues = check_windows_compat(files)
if issues:
    print('WINDOWS COMPATIBILITY ISSUES:')
    for i in issues:
        print(i)
    # Don't fail CI on Windows compat (Linux CI can't fully validate)
    print('Warning: Windows compatibility issues found (non-fatal on Linux CI).')
else:
    print('No Windows compatibility issues found.')
"

      - name: Ecosystem audit
        run: |
          echo "Running ecosystem audit..."
          python scripts/ecosystem_audit.py

      - name: Run tests
        run: |
          python -m pytest aria_service/tests/ -v --tb=short -q 2>&1 | tail -50

      - name: Check for syntax errors
        run: |
          echo "Checking syntax of all Python files..."
          python -c "
import ast, sys, os
errors = []
for root, dirs, files in os.walk('aria_service'):
    if 'tests' in root or '__pycache__' in root:
        continue
    for f in files:
        if not f.endswith('.py'):
            continue
        path = os.path.join(root, f)
        try:
            with open(path, 'r', encoding='utf-8') as fh:
                ast.parse(fh.read())
        except SyntaxError as e:
            errors.append(f'{path}: {e}')
if errors:
    for e in errors:
        print(e)
    sys.exit(1)
print('All files pass syntax check.')
"

  # R-F1794 (2026-06-23) — aria-web supply-chain + Node-test gate (audit #13/#1).
  # The Node tier was entirely outside CI: no npm audit, and 77 test/*.test.mjs
  # never ran. This job adds both. Audit blocks the build only on CRITICAL prod
  # vulns (Dependabot PRs handle high/moderate); the Node suite runs for
  # visibility (continue-on-error) until triaged green, then flip to blocking.
  web-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps (clean, from lockfile)
        run: npm ci

      # R-F2734 — Node syntax gate (R-F2729): `node --check` over every tracked .mjs. Blocks
      # the R-F2119/2120 outage class (autonomous edits pushed 31 syntax errors → the whole
      # tree un-importable). Fast, deterministic; a real hard failure, not continue-on-error.
      - name: Node lint (syntax gate)
        run: npm run lint

      - name: npm audit — supply-chain (block on CRITICAL prod vulns)
        run: |
          echo "Auditing production dependencies for CRITICAL vulnerabilities..."
          npm audit --omit=dev --audit-level=critical
          echo "--- high+ (informational; Dependabot raises PRs) ---"
          npm audit --omit=dev --audit-level=high || true

      # R-F2734 — use `npm test` (R-F2731): `--test-force-exit` so the suite TERMINATES past
      # any lingering open handle (Prospector #3: the global node --test never terminated), and
      # `--import ./test/helpers/net_guard.mjs` so CI can NEVER hit a live service (a briefing
      # test had been POSTing real signals to the production brain). Integration suites needing
      # a running service (test_compliance.mjs) are not matched by default discovery → `npm run test:live`.
      - name: Node tests (aria-web)
        continue-on-error: true
        run: npm test

      # R-F1835: DD quality scorer.  R-F1840: dropped the `|| true` that hid the
      # exit code entirely — a real regression (or "no golden entries" because
      # CI has no LLM) now surfaces as a visible CI warning instead of being
      # silently swallowed. Kept continue-on-error until the gate can hard-block,
      # which needs BOTH: (1) a populated golden set with verified ground truth
      # (20-50 entities — a data task, NOT auto-generatable), and (2) an LLM
      # reachable in CI or a deterministic LLM-free golden subset. Flip
      # continue-on-error→false (blocking) only when both hold.
      - name: DD quality score (visibility; regression surfaces as warning)
        continue-on-error: true
        run: python -m scripts.dd_quality_scorer --fail-on-regression

      # R-F1835: API surface validation
      - name: API surface validation
        run: python scripts/api_surface_validator.py

      # R-F1832: AST-aware SAST security scan (canonical scanner).
      # R-F1840: the prior invocation passed `--min-severity HIGH`, a flag this
      # scanner doesn't define (argparse exit 2), and `|| true` hid it — so the
      # SAST gate never actually ran. The scanner already exits nonzero ONLY on
      # real production findings (eval/exec/secrets/shell-injection); clean = 0.
      # Run it for real; surface findings as a CI warning (continue-on-error).
      - name: SAST security scan
        continue-on-error: true
        run: python scripts/admin/sast_scan.py

      # R-F1835: Type check (mypy)
      - name: Type check (mypy)
        continue-on-error: true
        run: |
          pip install mypy 2>/dev/null || true
          python -m mypy aria_service/ --ignore-missing-imports || true

      # R-F1806 (2026-06-23) — aria-wa (WhatsApp listener) was entirely outside
      # CI (audit #10). Install + audit + run its tests. Informational
      # (continue-on-error): baileys carries known upstream advisories and the
      # listener tests aren't yet triaged green — surface, don't block.
      - name: aria-wa — install + audit + tests
        continue-on-error: true
        run: |
          cd services/wa-listener
          npm install --omit=dev
          echo "--- aria-wa npm audit (informational) ---"
          npm audit --omit=dev --audit-level=critical || true
          echo "--- aria-wa node tests ---"
          node --test . 2>&1 | tail -40 || true
