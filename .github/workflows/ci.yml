# R-F1073 — CI pipeline: test + ecosystem audit + pre-commit verification
# Each step FAILS THE BUILD on error (no || true bypass).
name: CI

on:
  push:
    branches: [main]
    # R-F1408: skip CI on doc/data/memory-only pushes (the bulk of our commits
    # are R-number registry, training data, docs) so they don't spawn a test
    # run + email on every non-code change.
    paths-ignore:
      - 'docs/**'
      - 'data/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  # R-F3826 — lets the suite-baseline-gate job RECORD its CI-environment baseline
  # on demand. Without this there is no way to create docs/suite_baseline.ci.json,
  # and the gate would sit permanently in its "no baseline yet" no-op state.
  workflow_dispatch:
    inputs:
      record_baseline:
        description: "Record docs/suite_baseline.ci.json instead of gating on it"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    # R-F3556 — a job with no timeout runs to GitHub's 6-HOUR default. The
    # pre-commit gate was quadratic (AST re-parsed per call site) and hung
    # every run, so runs stacked up and NONE ever completed. A hang must fail
    # fast and free the runner, not silently block the whole pipeline.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
          pip install -r requirements-dev.txt 2>/dev/null || true

      - name: Secret scan (R-F3720 — this repo is PUBLIC)
        run: |
          echo "Refusing any NEW credential value in tracked files..."
          python scripts/admin/secret_scan.py

      - name: Pre-commit verification (--check-all)
        run: |
          echo "Checking ALL Python files for non-existent function calls..."
          python scripts/pre-commit --check-all

      - name: Wiring audit (structural guard)
        run: |
          echo "Checking ALL intel modules for brain wiring..."
          python scripts/ci/wiring_audit.py

      - name: Windows compatibility check
        run: |
          echo "Checking for Windows-incompatible patterns..."
          python scripts/ci/windows_compat_check.py

      - name: Ecosystem audit
        run: |
          echo "Running ecosystem audit..."
          python scripts/ecosystem_audit.py

      # R-F3378 — this step ran `pytest ... 2>&1 | tail -50`. A bash pipeline
      # exits with the status of its LAST command, so `tail` (always 0) decided
      # the outcome: no test failure could ever fail this step. It read as "CI
      # runs the suite" while structurally being unable to report anything.
      #
      # It also cannot pass honestly as written: the deps installed above are
      # pytest/pytest-asyncio/httpx plus requirements-dev.txt, which carries only
      # pytest, pytest-asyncio, pytest-timeout and pyflakes — no torch, no
      # chromadb, not even fastapi. Most of the suite errors on import here.
      #
      # So the swallow is removed (the real result is now visible in the log
      # rather than truncated to the last 50 lines) and the step is DECLARED
      # advisory instead of accidentally so. Making it blocking today would turn
      # CI red on missing dependencies, not on real regressions — that needs the
      # full dep set, which is an infra/cost decision for the operator.
      #
      # The suite's real gate is scripts/admin/suite_baseline.py (R-F3373): it
      # runs foreground segments and fails only on failures NEW since
      # docs/suite_baseline.json. Point this step at that once CI installs the
      # full deps.
      - name: Run tests (ADVISORY — see R-F3378; not a gate)
        continue-on-error: true
        run: |
          python -m pytest aria_service/tests/ -v --tb=short -q

      - name: Check for syntax errors
        run: |
          echo "Checking syntax of all Python files..."
          python scripts/ci/syntax_check.py

  # ── R-F3826 — the REAL §16 suite gate (R-F3373), finally runnable in CI ──────
  #
  # The advisory step above cannot pass honestly: that job installs pytest+httpx
  # only, so 42 test files fail at import on `from fastapi import ...`. This job
  # installs the runtime manifest and runs the gate that actually means something —
  # `scripts/admin/suite_baseline.py`, which fails ONLY on failures NEW since the
  # recorded baseline, not on the standing set.
  #
  # THREE THINGS THAT HAD TO BE TRUE FIRST, each of which was measured:
  #
  # 1. A SEPARATE JOB. The `test` job caps at timeout-minutes: 25 (R-F3556, so a
  #    hang frees the runner). A single-process §16 run was measured at ~40 minutes,
  #    so it cannot live there without either timing out or weakening that cap for
  #    the fast checks too.
  # 2. A REDUCED DEP SET. requirements-ci.txt is requirements.txt minus five heavy,
  #    import-guarded packages (torch arrives via sentence-transformers; chromadb
  #    ships a native core). Verified: ZERO tests import any of the five at module
  #    level, and R-F3795 makes the tests that need them SKIP with a stated reason.
  # 3. ITS OWN BASELINE. docs/suite_baseline.json is stamped `win32 / ARM64`
  #    (R-F3794). CI is linux/x86_64. Gating CI against a laptop baseline would
  #    report every platform difference as a regression — the precise false alarm
  #    the advisory step's comment warns about. So this compares against
  #    docs/suite_baseline.ci.json, recorded IN this environment.
  #
  # BOOTSTRAP, and why adding this job cannot break main: until that CI baseline
  # exists the tool prints "no baseline … run with --record first" and exits 0. Run
  # this workflow via workflow_dispatch with record_baseline=true ONCE to create it,
  # commit the file, and the gate becomes real from the next run.
  suite-baseline-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime deps (minus the five heavy, import-guarded ones)
        run: |
          python -m pip install --upgrade pip
          pip install -r aria_service/requirements-ci.txt
          pip install -r requirements-dev.txt

      - name: Suite baseline gate (fails only on NEW failures)
        run: |
          python scripts/admin/suite_baseline.py \
            --single-process \
            --timeout 600 \
            --baseline docs/suite_baseline.ci.json \
            ${{ github.event.inputs.record_baseline == 'true' && '--record' || '' }}

      - name: Upload the recorded baseline (dispatch + record only)
        if: ${{ github.event.inputs.record_baseline == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: suite-baseline-ci
          path: docs/suite_baseline.ci.json

  # R-F1794 (2026-06-23) — aria-web supply-chain + Node-test gate (audit #13/#1).
  # The Node tier was entirely outside CI: no npm audit, and 77 test/*.test.mjs
  # never ran. This job adds both. Audit blocks the build only on CRITICAL prod
  # vulns (Dependabot PRs handle high/moderate); the Node suite runs for
  # visibility (continue-on-error) until triaged green, then flip to blocking.
  web-security:
    runs-on: ubuntu-latest
    # R-F3556 — a job with no timeout runs to GitHub's 6-HOUR default. The
    # pre-commit gate was quadratic (AST re-parsed per call site) and hung
    # every run, so runs stacked up and NONE ever completed. A hang must fail
    # fast and free the runner, not silently block the whole pipeline.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # R-F3904 — was "20", BELOW this project's own declared minimum.
          # package.json says `"engines": {"node": ">=22"}` and both production
          # images are `node:22-slim`, so CI was testing on a runtime the project
          # does not support.
          #
          # The consequence was not a subtle incompatibility — it ran ZERO TESTS.
          # `npm test` is `node --test ... "test/**/*.test.mjs"`, and Node 20's test
          # runner does not expand globs (Node 22+ does), so it reported
          #     Could not find '/home/runner/work/crucix/crucix/test/**/*.test.mjs'
          # emitted no TAP summary, and the suite gate refused with
          # "could not parse TAP totals" on 8+ consecutive commits — both agents'
          # work, entirely ungated on the Node tier, while the same command passed
          # locally with 1833 tests.
          #
          # It took R-F3903 to find this: the gate had been refusing correctly and
          # SILENTLY, so nobody could see that the runner never started. A gate that
          # cannot say why it could not measure is one nobody can act on.
          node-version: "22"

      - name: Install deps (clean, from lockfile)
        run: npm ci

      # R-F2734 — Node syntax gate (R-F2729): `node --check` over every tracked .mjs. Blocks
      # the R-F2119/2120 outage class (autonomous edits pushed 31 syntax errors → the whole
      # tree un-importable). Fast, deterministic; a real hard failure, not continue-on-error.
      - name: Node lint (syntax gate)
        run: npm run lint

      - name: npm audit — supply-chain (block on CRITICAL prod vulns)
        run: |
          echo "Auditing production dependencies for CRITICAL vulnerabilities..."
          npm audit --omit=dev --audit-level=critical
          echo "--- high+ (informational; Dependabot raises PRs) ---"
          npm audit --omit=dev --audit-level=high || true

      # R-F2734 — use `npm test` (R-F2731): `--test-force-exit` so the suite TERMINATES past
      # any lingering open handle (Prospector #3: the global node --test never terminated), and
      # `--import ./test/helpers/net_guard.mjs` so CI can NEVER hit a live service (a briefing
      # test had been POSTing real signals to the production brain). Integration suites needing
      # a running service (test_compliance.mjs) are not matched by default discovery → `npm run test:live`.
      # R-F3862 — the Node suite now GATES on its failure SET.
      #
      # This used to be a bare `npm test` with continue-on-error, because the
      # suite carries a standing set of failures and hard-failing on them would
      # keep CI permanently red. Honest, but it meant a real Node regression
      # could not fail the build either.
      #
      # node_suite_baseline.mjs is the Node counterpart to
      # scripts/admin/suite_baseline.py (R-F3373): it fails ONLY on failures
      # absent from docs/node_suite_baseline.json, reports fixed ones without
      # failing, and refuses to gate at all if the runner collected almost
      # nothing (a broken runner must not read as a green suite).
      #
      # It compares the SET, never the count — §16, learned on the Python side.
      # Proven: removing one known failure from the baseline made it exit 1 and
      # name the test, while the totals stayed identical at 1801/8.
      - name: Node suite gate (fails only on NEW failures)
        run: node scripts/admin/node_suite_baseline.mjs

      # R-F3855 — the DOM-XSS guards HARD-GATE, on their own step.
      #
      # Kept SEPARATE from the suite gate above even though that one now blocks
      # too, and deliberately so: the suite gate is baseline-relative (it permits
      # the 8 standing failures), while a DOM-XSS finding is never acceptable at
      # any baseline. Folding these in would make it possible to "fix" a red by
      # re-recording the baseline, which is exactly the wrong affordance for a
      # security invariant.
      #
      # No continue-on-error, so an unescaped interpolation or an unguarded URL
      # sink fails the build. Both suites are green and both have been proven to
      # fire on an injected regression, so a red here is a real finding.
      # R-F3872 — the execution smoke is in this blocking step deliberately.
      # Every other guard here is STATIC; a ReferenceError does not exist until
      # the code runs, and `node --check` parses a scope error happily. R-F3871
      # shipped exactly that and blanked every page while the suite stayed green
      # and the server returned 200.
      - name: DOM-XSS guards + shared-JS execution smoke (must pass)
        run: >
          node --test --test-force-exit
          --import ./test/helpers/net_guard.mjs
          test/html-interpolation-guard-rf3845.test.mjs
          test/url-sink-guard-rf3852.test.mjs
          test/shared-js-executes-rf3872.test.mjs

      # R-F1835: DD quality scorer.  R-F1840: dropped the `|| true` that hid the
      # exit code entirely — a real regression (or "no golden entries" because
      # CI has no LLM) now surfaces as a visible CI warning instead of being
      # silently swallowed. Kept continue-on-error until the gate can hard-block,
      # which needs BOTH: (1) a populated golden set with verified ground truth
      # (20-50 entities — a data task, NOT auto-generatable), and (2) an LLM
      # reachable in CI or a deterministic LLM-free golden subset. Flip
      # continue-on-error→false (blocking) only when both hold.
      - name: DD quality score (visibility; regression surfaces as warning)
        continue-on-error: true
        run: python -m scripts.dd_quality_scorer --fail-on-regression

      # R-F1835: API surface validation
      - name: API surface validation
        run: python scripts/api_surface_validator.py

      # R-F1832: AST-aware SAST security scan (canonical scanner).
      # R-F1840: the prior invocation passed `--min-severity HIGH`, a flag this
      # scanner doesn't define (argparse exit 2), and `|| true` hid it — so the
      # SAST gate never actually ran. The scanner already exits nonzero ONLY on
      # real production findings (eval/exec/secrets/shell-injection); clean = 0.
      # Run it for real; surface findings as a CI warning (continue-on-error).
      - name: SAST security scan
        continue-on-error: true
        run: python scripts/admin/sast_scan.py

      # R-F1835: Type check (mypy)
      - name: Type check (mypy)
        continue-on-error: true
        run: |
          pip install mypy 2>/dev/null || true
          python -m mypy aria_service/ --ignore-missing-imports || true

      # R-F1806 (2026-06-23) — aria-wa (WhatsApp listener) was entirely outside
      # CI (audit #10). Install + audit + run its tests. Informational
      # (continue-on-error): baileys carries known upstream advisories and the
      # listener tests aren't yet triaged green — surface, don't block.
      - name: aria-wa — install + audit + tests
        continue-on-error: true
        run: |
          cd services/wa-listener
          npm install --omit=dev
          echo "--- aria-wa npm audit (informational) ---"
          npm audit --omit=dev --audit-level=critical || true
          echo "--- aria-wa node tests ---"
          # R-F3862 — was `node --test .` with NO network guard, so a wa-listener
          # test could reach a live service from CI. That is the exact failure
          # R-F2731 exists for: a briefing test had been POSTing real signals to
          # the production brain. The guard lives at the repo root, hence the
          # relative path from services/wa-listener.
          node --test --test-force-exit --import ../../test/helpers/net_guard.mjs . 2>&1 | tail -40 || true
