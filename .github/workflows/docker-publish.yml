name: Build & Publish Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
    # R-F969 (2026-05-28) — registry/doc-only commits (the "chore: ship
    # marker R-Fxxx" commits that touch only data/r_number_reservations.json,
    # plus docs + markdown + leading-underscore session scratch) don't change
    # the image, so don't burn a full multi-arch QEMU build on them. The fly
    # deploy pipeline (test-aria.yml → deploy-fly.yml) is already path-filtered
    # to aria_service/**, so this is the only workflow that fired on every
    # commit. Reduces per-R-number CI churn.
    paths-ignore:
      - 'docs/**'
      - 'data/r_number_reservations.json'
      - '**/*.md'
      - '_*.txt'
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && vars.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ vars.DOCKERHUB_ENABLED == 'true' && format('{0}/{1}', secrets.DOCKERHUB_USERNAME, 'crucix') || '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 2026-04-21: dropped linux/arm64. Both consumers (seenode and
          # fly.io LHR) run on x86-64 and we have no arm64 consumer today.
          # Dual-arch builds took 15-25 min on cold cache, blocking seenode
          # pickup of new images exactly when changes are urgent. Single
          # amd64 is ~3 min warm, ~8 min cold. Restore arm64 only if a
          # consumer that actually needs it appears.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
