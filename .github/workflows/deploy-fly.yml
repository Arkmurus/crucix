name: Deploy ARIA to Fly.io

# Operational gap fix (2026-04-15): previously fired in parallel with
# test-aria.yml on every push to main. That meant a failing smoke test
# or a failing constitution suite did NOT block the deploy — the two
# workflows were independent. Now gated on test-aria.yml successful
# completion via workflow_run, so a failed test blocks the deploy.

on:
  workflow_run:
    workflows: ["Test ARIA Python service"]
    types: [completed]
    branches: [main]
  # Manual override for the rare case a test flake shouldn't gate a
  # hotfix deploy. Default behaviour remains gated.
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual-deploy justification (auditable)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run fires regardless of test outcome — gate explicitly.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --wait-timeout 900 (15 min) — default 300s kept marking successful
      # deploys as "failure" because flyctl exited non-zero while fly waited
      # for machines to pass healthchecks on the new image. The release was
      # actually complete (visible in `fly releases list`), but the CI step
      # reported failure, polluting deploy-history visibility. Raise the
      # wait bound to cover slow first-boot (HuggingFace model download,
      # lifespan init, semantic-index warmup). Fixed 2026-04-20.
      #
      # 2026-04-21 — flyctl was still exiting non-zero even with 900s wait
      # (at least 3 consecutive deploys this session), forcing manual
      # `flyctl deploy` locally. The issue is flyctl's inability to
      # distinguish "machine's healthcheck grace period" from "build
      # failure". Post-step verification: after flyctl's perceived
      # failure, ask fly what the actual release state is; if a new
      # release exists with status=complete AND /health reports
      # status=operational, the deploy succeeded and we override the
      # step failure. Genuine build/config errors (no new release, or
      # /health returns non-200) still fail the job.
      - id: deploy
        continue-on-error: true
        # R-F513 (2026-05-14) — pass build-time identity so
        # ARIA_BUILD_REV in /health/live reflects the actual deployed
        # commit, not a hand-edited constant.
        run: |
          GIT_SHA=$(git rev-parse HEAD)
          # Extract the most recent R-F number(s) from the commit subject
          # line so log inspection can correlate fly version → R-tag.
          # Handles patterns: "R-F123", "R-F123+F124", "R-F123 + R-F124".
          R_TAG=$(git log -1 --pretty=%s | grep -oE 'R-F[0-9]+([+ ]+F[0-9]+)*' | head -1 | tr -d ' ')
          R_TAG=${R_TAG:-no-r-tag}
          echo "Building with ARIA_BUILD_GIT_SHA=$GIT_SHA ARIA_BUILD_R_TAG=$R_TAG"
          flyctl deploy --remote-only --app aria-intel --wait-timeout 900 \
            --build-arg ARIA_BUILD_GIT_SHA="$GIT_SHA" \
            --build-arg ARIA_BUILD_R_TAG="$R_TAG" \
            -t "${{ secrets.FLY_API_TOKEN }}"
      - name: Verify release actually landed
        if: steps.deploy.outcome == 'failure'
        run: |
          set -uo pipefail
          # R-F568 (2026-05-16) — verify step refactor.
          #
          # Prior versions (R-F453, R-F516) required (a) flyctl releases
          # `Status == complete` AND (b) /health == operational|degraded.
          # When flyctl's CLI itself misbehaves (silent failure, schema
          # drift, auth glitch) the JSON parse fails → step exits 1 even
          # though the deploy actually succeeded.
          #
          # R-F568 inverts the truth source: `/health` is authoritative.
          # If aria-intel.fly.dev/health returns 200 + status=
          # operational|degraded, the deploy is live regardless of what
          # flyctl says. flyctl release status is fetched as DIAGNOSTIC
          # context only, never as a gate.
          #
          # This collapses the failure surface to "is the app responding
          # at the expected build sha?" which is what we actually care
          # about. flyctl-CLI churn no longer masks live deploys.
          echo "flyctl exited non-zero — falling through to authoritative /health probe"
          echo "(R-F568: /health is truth; flyctl releases is diagnostics-only)"
          echo "flyctl version (for the run log):"
          flyctl version 2>&1 | head -5 || echo "flyctl version itself failed"

          # ─── Diagnostics: fetch flyctl releases but DON'T gate on it ───
          echo "=== flyctl releases --json (diagnostic, non-blocking) ==="
          if releases_json=$(flyctl releases -a aria-intel -t "${{ secrets.FLY_API_TOKEN }}" --json 2>&1); then
            echo "${releases_json}" | head -c 1500
            echo
            latest_status=$(echo "${releases_json}" | jq -r '.[0].Status // "MISSING"' 2>/dev/null || echo "JQ_PARSE_FAIL")
            latest_version=$(echo "${releases_json}" | jq -r '.[0].Version // "MISSING"' 2>/dev/null || echo "JQ_PARSE_FAIL")
            echo "Parsed: latest_version=v${latest_version} latest_status=${latest_status}"
          else
            echo "flyctl releases command itself failed (exit=$?). Proceeding to /health probe regardless."
            latest_version="unknown"
            latest_status="flyctl_failed"
          fi
          echo "========================================================="

          # ─── Authoritative gate: /health ────────────────────────────────
          # 36 × 5s = 180s budget (R-F516 bump). Cold-start RAG warm-up
          # (sentence-transformer load + intl law corpus + export-control
          # sections) takes 2–3 min on first boot of a new machine.
          # operational|degraded both count as "live and serving" —
          # degraded just means some autonomy loops are off (expected
          # under ARIA_AUTONOMOUS_ENABLED=0 per cost-cap doctrine).
          for i in $(seq 1 36); do
            http_code=$(curl -sS -m 5 -o /tmp/health.json -w '%{http_code}' https://aria-intel.fly.dev/health || echo "000")
            if [ "${http_code}" = "200" ]; then
              svc_status=$(jq -r '.status // "unknown"' /tmp/health.json 2>/dev/null || echo "jq_fail")
              if [ "${svc_status}" = "operational" ] || [ "${svc_status}" = "degraded" ]; then
                # Best-effort: surface deployed build_rev so the deploy log
                # confirms the right commit is live.
                build_rev=$(curl -sS -m 5 https://aria-intel.fly.dev/health/live 2>/dev/null | jq -r '.build_rev // "unknown"' 2>/dev/null || echo "unknown")
                echo "::notice::Release v${latest_version} verified live (status=${svc_status}, build_rev=${build_rev}, flyctl_status=${latest_status})"
                exit 0
              fi
              echo "poll ${i}/36: /health returned 200 but status=${svc_status} (waiting for operational|degraded)"
            else
              echo "poll ${i}/36: /health returned HTTP ${http_code}"
            fi
            sleep 5
          done
          # Final tail-print of /health on permanent failure for forensics.
          echo "=== /health response body at timeout (R-F568 diagnostic) ==="
          cat /tmp/health.json 2>/dev/null || echo "(no body)"
          echo "==========================================================="
          echo "::error::Release v${latest_version} did not reach operational|degraded within 180s (flyctl_status=${latest_status}). Either deploy is genuinely broken or cold-start is taking >3min."
          exit 1
      - if: github.event_name == 'workflow_dispatch'
        run: |
          echo "::warning::Manual deploy bypass — reason: ${{ github.event.inputs.reason }}"

      # R-F841 (2026-05-23) — post-Seenode→Fly migration, the Node app
      # (aria-web) and the standalone Baileys listener (aria-wa) are
      # both first-class Fly apps. Seenode used to auto-deploy server.mjs
      # on push; that capability is now gone. Without these steps, Node
      # changes silently lag — Python changes deploy but UI/auth/Stripe
      # stay on whatever image was last manually `flyctl deploy`-ed.
      #
      # Sequential rather than matrixed: keeps the existing aria-intel
      # verify gate as the primary "deploy succeeded" signal. If
      # aria-intel deploy fails the whole job fails; aria-web / aria-wa
      # are skipped (`if: success()`).
      - name: Deploy aria-web
        if: success()
        run: |
          # R-F846 — pass build-time SHA + R-tag so /api/health reports
          # the actual deployed commit instead of UNKNOWN-BUILD.
          GIT_SHA=$(git rev-parse HEAD)
          R_TAG=$(git log -1 --pretty=%s | grep -oE 'R-F[0-9]+([+ ]+F[0-9]+)*' | head -1 | tr -d ' ')
          R_TAG=${R_TAG:-no-r-tag}
          flyctl deploy --remote-only --config fly.web.toml --app aria-web \
            --wait-timeout 600 \
            --build-arg ARIA_BUILD_GIT_SHA="$GIT_SHA" \
            --build-arg ARIA_BUILD_R_TAG="$R_TAG" \
            -t "${{ secrets.FLY_API_TOKEN }}"

      - name: Verify aria-web is live
        if: success()
        run: |
          for i in $(seq 1 18); do
            http=$(curl -sS -m 5 -o /tmp/web_health.json -w '%{http_code}' \
              https://aria-web.fly.dev/healthz || echo "000")
            if [ "${http}" = "200" ]; then
              echo "::notice::aria-web /healthz=200 — live"
              exit 0
            fi
            echo "poll ${i}/18: aria-web /healthz=${http}"
            sleep 5
          done
          echo "::error::aria-web did not return /healthz=200 within 90s"
          exit 1

      - name: Deploy aria-wa
        if: success()
        run: |
          flyctl deploy --remote-only --config fly.wa.toml --app aria-wa \
            --wait-timeout 600 -t "${{ secrets.FLY_API_TOKEN }}"

      - name: Verify aria-wa is live
        if: success()
        run: |
          for i in $(seq 1 18); do
            http=$(curl -sS -m 5 -o /tmp/wa_health.json -w '%{http_code}' \
              https://aria-wa.fly.dev/health || echo "000")
            if [ "${http}" = "200" ]; then
              echo "::notice::aria-wa /health=200 — live"
              exit 0
            fi
            echo "poll ${i}/18: aria-wa /health=${http}"
            sleep 5
          done
          echo "::error::aria-wa did not return /health=200 within 90s"
          exit 1
