name: Deploy ARIA to Fly.io

# R-F1079 — Deploy batching. Auto-deploy on push is REMOVED to prevent
# cold-boot outages from frequent deploys (Claude finding C, 2026-05-29:
# 5 deploys in 30 min = 5 × ~60-90s outages).
#
# Deploy ONLY via:
#   1. workflow_dispatch (manual trigger in GitHub UI) — the ONLY CI route
#   2. scripts/deploy.ps1 (Windows) / deploy.sh (POSIX) — the normal route
#
# R-F3238 — a "[deploy]" COMMIT MESSAGE DOES NOTHING, and this header claimed
# otherwise for seven weeks after it stopped working. That cost a real deploy:
# an agent read the `if:` guard below (`github.event_name == 'push'`), concluded
# a tagged commit would ship, pushed one, and waited on a build never queued.
# R-F1408 removed the `push:` trigger on 2026-06-07; with no `push` in `on:`,
# that arm of the `if:` is unreachable by construction.
#
# The `if:` stays — it costs nothing and is correct the moment anyone restores
# `push:` — but the comment that ADVERTISED the route is now the truth instead.
# Same rule the DD engine is held to: a surface may not describe a capability
# the code does not have.
#
# Use scripts/deploy.sh for local batching: it collects all pending
# R-numbers since the last deploy tag and deploys them as one batch.

on:
  # R-F1408: push trigger REMOVED 2026-06-07. It fired on every push but the
  # deploy job is gated on '[deploy]' in the commit message, so normal pushes
  # produced a skipped job → GitHub "No jobs were run" → an email per push
  # (operator noise). Deploys are manual anyway (CLAUDE.md §11/§20).
  #
  # CORRECTED 2026-08-03: this said "the CI FLY_API_TOKEN is stale ... once the
  # token is rotated", which is no longer true — the secret was updated
  # 2026-07-24 and run 30846100727 deployed 0db2ab25 through this workflow
  # successfully (6m2s, live build_rev confirmed). The note was left standing
  # after the rotation and read as "this route does not work", which is the
  # R-F3238 failure mode verbatim: a header that kept claiming something for
  # weeks after it stopped being true, and cost a real deploy.
  #
  # workflow_dispatch is the ONLY safe route while the tree is shared: it builds
  # the pushed SHA, so a peer agent's uncommitted work cannot ship.
  # scripts/deploy.ps1 builds the WORKING TREE and must not be used then.
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual-deploy justification (auditable)"
        required: true

# R-F2237 (security-auditor/github-actions-expert P0): least-privilege token — this
# job deploys via flyctl (FLY_API_TOKEN), it never needs write to the repo. It only
# reads git (rev-parse/log) + checks out. contents:read is sufficient.
permissions:
  contents: read

# R-F2237: serialise deploys so a manual workflow_dispatch can't SIGTERM ARIA's
# autonomous ci_deploy (or another dispatch) mid-boot — the R-F1478 lease-contention
# class. Queue, don't cancel: cancelling an in-flight deploy resets the ~10-min boot.
concurrency:
  group: deploy-aria-intel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # R-F1079: only deploy on push if commit message contains [deploy].
    # workflow_dispatch always works (manual trigger).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy]'))
    steps:
      - uses: actions/checkout@v4
        with:
          # R-F4366 (C-312) — the R-tag derivation scans a window of recent
          # commits; the default depth-1 checkout starves it to HEAD alone.
          fetch-depth: 50
      # R-F2237: SHA-pinned (was @master — a moving branch tip running in the
      # FLY_API_TOKEN job = total-Fly-compromise on any upstream push). Pinned to
      # v1.6 by full commit SHA; bump the SHA + comment together to upgrade.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      # --wait-timeout 900 (15 min) — default 300s kept marking successful
      # deploys as "failure" because flyctl exited non-zero while fly waited
      # for machines to pass healthchecks on the new image. The release was
      # actually complete (visible in `fly releases list`), but the CI step
      # reported failure, polluting deploy-history visibility. Raise the
      # wait bound to cover slow first-boot (HuggingFace model download,
      # lifespan init, semantic-index warmup). Fixed 2026-04-20.
      #
      # 2026-04-21 — flyctl was still exiting non-zero even with 900s wait
      # (at least 3 consecutive deploys this session), forcing manual
      # `flyctl deploy` locally. The issue is flyctl's inability to
      # distinguish "machine's healthcheck grace period" from "build
      # failure". Post-step verification: after flyctl's perceived
      # failure, ask fly what the actual release state is; if a new
      # release exists with status=complete AND /health reports
      # status=operational, the deploy succeeded and we override the
      # step failure. Genuine build/config errors (no new release, or
      # /health returns non-200) still fail the job.
      # R-F1080 — canary deployment: deploy to a SECOND machine first,
      # verify it passes health checks, then deploy to the primary.
      # If the canary fails, roll back automatically.
      - name: Get current machine count
        id: machine_count
        run: |
          COUNT=$(flyctl machines list -a aria-intel -t "${{ secrets.FLY_API_TOKEN }}" --json 2>/dev/null | jq length || echo "1")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Current machine count: $COUNT"

      - id: deploy_canary
        if: steps.machine_count.outputs.count >= '2'
        continue-on-error: true
        run: |
          GIT_SHA=$(git rev-parse HEAD)
          R_TAG=$(bash scripts/ci/derive_r_tag.sh)   # R-F4365 (C-311) — one derivation
          echo "=== Canary deploy ==="
          echo "Building with ARIA_BUILD_GIT_SHA=$GIT_SHA ARIA_BUILD_R_TAG=$R_TAG"
          # Deploy with --strategy canary to update only one machine first
          flyctl deploy --remote-only --app aria-intel --wait-timeout 900 \
            --strategy canary \
            --build-arg ARIA_BUILD_GIT_SHA="$GIT_SHA" \
            --build-arg ARIA_BUILD_R_TAG="$R_TAG" \
            -t "${{ secrets.FLY_API_TOKEN }}"

      - name: Verify canary
        if: steps.deploy_canary.outcome == 'success' && steps.machine_count.outputs.count >= '2'
        run: |
          echo "=== Verifying canary ==="
          for i in $(seq 1 36); do
            http_code=$(curl -sS -m 5 -o /tmp/canary_health.json -w '%{http_code}' https://aria-intel.fly.dev/health || echo "000")
            if [ "${http_code}" = "200" ]; then
              svc_status=$(jq -r '.status // "unknown"' /tmp/canary_health.json 2>/dev/null || echo "jq_fail")
              if [ "${svc_status}" = "operational" ] || [ "${svc_status}" = "degraded" ]; then
                echo "::notice::Canary verified live (status=${svc_status}) — proceeding to full deploy"
                exit 0
              fi
            fi
            echo "poll ${i}/36: /health returned HTTP ${http_code}"
            sleep 5
          done
          echo "::error::Canary failed to reach operational within 180s — rolling back"
          # Rollback: deploy the previous image
          PREV_IMAGE=$(flyctl releases -a aria-intel -t "${{ secrets.FLY_API_TOKEN }}" --json 2>/dev/null | jq -r '.[1].Image // ""' 2>/dev/null || echo "")
          if [ -n "$PREV_IMAGE" ]; then
            echo "Rolling back to $PREV_IMAGE"
            flyctl deploy --remote-only --app aria-intel --image "$PREV_IMAGE" \
              --wait-timeout 600 -t "${{ secrets.FLY_API_TOKEN }}" || true
          fi
          exit 1

      - id: deploy
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          GIT_SHA=$(git rev-parse HEAD)
          R_TAG=$(bash scripts/ci/derive_r_tag.sh)   # R-F4365 (C-311) — one derivation
          echo "Building with ARIA_BUILD_GIT_SHA=$GIT_SHA ARIA_BUILD_R_TAG=$R_TAG"
          flyctl deploy --remote-only --app aria-intel --wait-timeout 900 \
            --build-arg ARIA_BUILD_GIT_SHA="$GIT_SHA" \
            --build-arg ARIA_BUILD_R_TAG="$R_TAG" \
            -t "${{ secrets.FLY_API_TOKEN }}"

      - name: Verify release
        if: steps.deploy.outcome == 'failure'
        run: |
          set -uo pipefail
          # R-F3769 — the SHA this run was supposed to ship. `build_rev` embeds the
          # SHORT sha (e.g. "R-F3766 · sha 6cd1fc88"), so compare on 8 chars.
          EXPECTED_SHA=$(git rev-parse --short=8 HEAD)
          echo "flyctl exited non-zero — falling through to /health probe, expecting sha ${EXPECTED_SHA}"
          echo "flyctl version (for the run log):"
          flyctl version 2>&1 | head -5 || echo "flyctl version itself failed"

          echo "=== flyctl releases --json (diagnostic, non-blocking) ==="
          if releases_json=$(flyctl releases -a aria-intel -t "${{ secrets.FLY_API_TOKEN }}" --json 2>&1); then
            echo "${releases_json}" | head -c 1500
            echo
            latest_status=$(echo "${releases_json}" | jq -r '.[0].Status // "MISSING"' 2>/dev/null || echo "JQ_PARSE_FAIL")
            latest_version=$(echo "${releases_json}" | jq -r '.[0].Version // "MISSING"' 2>/dev/null || echo "JQ_PARSE_FAIL")
            echo "Parsed: latest_version=v${latest_version} latest_status=${latest_status}"
          else
            latest_version="unknown"
            latest_status="flyctl_failed"
          fi
          echo "========================================================="

          for i in $(seq 1 36); do
            http_code=$(curl -sS -m 5 -o /tmp/health.json -w '%{http_code}' https://aria-intel.fly.dev/health || echo "000")
            if [ "${http_code}" = "200" ]; then
              svc_status=$(jq -r '.status // "unknown"' /tmp/health.json 2>/dev/null || echo "jq_fail")
              if [ "${svc_status}" = "operational" ] || [ "${svc_status}" = "degraded" ]; then
                build_rev=$(curl -sS -m 5 https://aria-intel.fly.dev/health/live 2>/dev/null | jq -r '.build_rev // "unknown"' 2>/dev/null || echo "unknown")
                # ── R-F3769 — COMPARE the build_rev; do not merely print it ────
                #
                # This step is the fallback for a flyctl that exited non-zero
                # while the release may still have completed (§11c: a torch build
                # can outlast the client). That intent is right. The bug was that
                # it exited 0 as soon as /health was ALIVE — and then fetched
                # build_rev only to echo it.
                #
                # So when the deploy genuinely FAILED, the PREVIOUS build was
                # still serving happily, /health said operational, and the run
                # was certified green. Observed 2026-08-07 on run 31220316865:
                # "success", zero new fly releases, live build_rev still the
                # prior commit. It also skipped the R-F1080 rollback below, so a
                # failed deploy left the old build serving with no signal at all.
                #
                # A step named "Verify release" that verifies LIVENESS is the
                # absence-read-as-presence defect this repo keeps producing —
                # here in the one place meant to catch it. CLAUDE.md §11 already
                # states the rule ("a dispatched run is not a deploy until
                # build_rev matches"); the value was in hand and thrown away.
                if [ "${build_rev}" != "${build_rev#*${EXPECTED_SHA}}" ]; then
                  echo "::notice::Release v${latest_version} verified live — build_rev=${build_rev} MATCHES ${EXPECTED_SHA} (status=${svc_status}, flyctl_status=${latest_status})"
                  exit 0
                fi
                echo "poll ${i}/36: alive but build_rev=${build_rev} does NOT contain ${EXPECTED_SHA} — the OLD build is still serving, not a deploy"
              fi
              echo "poll ${i}/36: /health returned 200 but status=${svc_status}"
            else
              echo "poll ${i}/36: /health returned HTTP ${http_code}"
            fi
            sleep 5
          done
          echo "=== /health response body at timeout ==="
          cat /tmp/health.json 2>/dev/null || echo "(no body)"
          echo "==========================================================="
          echo "::error::Deploy NOT verified within 180s — /health never reported operational|degraded carrying sha ${EXPECTED_SHA} (v${latest_version}). A live OLD build is a FAILED deploy, not a passing one (R-F3769)."
          # R-F1080 — automated rollback on verify failure
          echo "Attempting automated rollback to previous release..."
          PREV_IMAGE=$(flyctl releases -a aria-intel -t "${{ secrets.FLY_API_TOKEN }}" --json 2>/dev/null | jq -r '.[1].Image // ""' 2>/dev/null || echo "")
          if [ -n "$PREV_IMAGE" ]; then
            echo "Rolling back to $PREV_IMAGE"
            flyctl deploy --remote-only --app aria-intel --image "$PREV_IMAGE" \
              --wait-timeout 600 -t "${{ secrets.FLY_API_TOKEN }}" || true
            echo "::warning::Rollback initiated — verify manually"
          fi
          exit 1
      - if: github.event_name == 'workflow_dispatch'
        run: |
          echo "::warning::Manual deploy bypass — reason: ${{ github.event.inputs.reason }}"

      # R-F1157: Node.js deploy steps REMOVED from the Python CI pipeline.
      # aria-web and aria-wa are separate Fly apps with their own build
      # pipelines. Deploying them on every Python commit was:
      #   1. Wasting build minutes (Node Docker build takes ~5min)
      #   2. Failing consistently (Node build timeout on Depot)
      #   3. Blocking Python deploys (the whole workflow marked failure)
      # Node apps deploy via their own CI triggers or manual flyctl deploy.
