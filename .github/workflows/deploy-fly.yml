name: Deploy ARIA to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'aria_service/**'
      - 'fly.toml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --app aria-intel -t "${{ secrets.FLY_API_TOKEN }}"
