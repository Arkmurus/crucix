name: Deploy ARIA to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'aria_service/**'
      - 'fly.toml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify Fly.io auth
        run: flyctl status --app aria-intel

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --app aria-intel
