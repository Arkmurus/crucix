name: Deploy ARIA to Fly.io

# Operational gap fix (2026-04-15): previously fired in parallel with
# test-aria.yml on every push to main. That meant a failing smoke test
# or a failing constitution suite did NOT block the deploy — the two
# workflows were independent. Now gated on test-aria.yml successful
# completion via workflow_run, so a failed test blocks the deploy.

on:
  workflow_run:
    workflows: ["Test ARIA Python service"]
    types: [completed]
    branches: [main]
  # Manual override for the rare case a test flake shouldn't gate a
  # hotfix deploy. Default behaviour remains gated.
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual-deploy justification (auditable)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run fires regardless of test outcome — gate explicitly.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --wait-timeout 900 (15 min) — default 300s kept marking successful
      # deploys as "failure" because flyctl exited non-zero while fly waited
      # for machines to pass healthchecks on the new image. The release was
      # actually complete (visible in `fly releases list`), but the CI step
      # reported failure, polluting deploy-history visibility. Raise the
      # wait bound to cover slow first-boot (HuggingFace model download,
      # lifespan init, semantic-index warmup). Fixed 2026-04-20.
      #
      # 2026-04-21 — flyctl was still exiting non-zero even with 900s wait
      # (at least 3 consecutive deploys this session), forcing manual
      # `flyctl deploy` locally. The issue is flyctl's inability to
      # distinguish "machine's healthcheck grace period" from "build
      # failure". Post-step verification: after flyctl's perceived
      # failure, ask fly what the actual release state is; if a new
      # release exists with status=complete AND /health reports
      # status=operational, the deploy succeeded and we override the
      # step failure. Genuine build/config errors (no new release, or
      # /health returns non-200) still fail the job.
      - id: deploy
        continue-on-error: true
        run: flyctl deploy --remote-only --app aria-intel --wait-timeout 900 -t "${{ secrets.FLY_API_TOKEN }}"
      - name: Verify release actually landed
        if: steps.deploy.outcome == 'failure'
        run: |
          set -e
          echo "flyctl exited non-zero — checking whether the release actually completed"
          # R-F453 (2026-05-13) — flyctl CLI removed the `list` subcommand.
          # Old form `flyctl releases list --json` now fails with
          # `unknown command "list" for "flyctl releases"`, jq sees empty
          # input, parse-errors at column 6, verify step exits 5 — masking
          # every real deploy outcome since the CLI bump. Same payload, new
          # entry-point: `flyctl releases --json` returns the same JSON.
          # Live evidence — run 25828493782 (commit 10a8721, R-F452):
          # step 5 failed solely on this stale syntax.
          latest_status=$(flyctl releases -a aria-intel -t "${{ secrets.FLY_API_TOKEN }}" --json | jq -r '.[0].Status')
          latest_version=$(flyctl releases -a aria-intel -t "${{ secrets.FLY_API_TOKEN }}" --json | jq -r '.[0].Version')
          echo "Latest release: v${latest_version} status=${latest_status}"
          if [ "${latest_status}" != "complete" ]; then
            echo "::error::Release did not complete — real deploy failure"
            exit 1
          fi
          # `/health.status` is "operational" when chain_resilient AND
          # autonomous_healthy; otherwise "degraded". With
          # ARIA_AUTONOMOUS_ENABLED=0 (per cost-cap doctrine) the app is
          # structurally "degraded" — CI deploys have been failing this
          # check since 2026-04-22. "degraded" is still a fully-serving
          # state: the app is responding, some autonomy loops are off.
          # Treat operational|degraded as live. Only "unknown" or non-200
          # is a real deploy failure.
          # 2026-04-26 — bumped poll budget 24×5s=120s → 36×5s=180s.
          # Cold-start RAG warm-up (sentence-transformer load + intl law
          # corpus + export-control sections) takes 2–3 min; the previous
          # 120s budget caused 4 spurious red CI runs across 2026-04-24/25
          # for deploys that were actually live.
          for i in $(seq 1 36); do
            status=$(curl -sS -m 5 -o /dev/null -w '%{http_code}' https://aria-intel.fly.dev/health || echo "000")
            if [ "${status}" = "200" ]; then
              svc_status=$(curl -sS -m 5 https://aria-intel.fly.dev/health | jq -r '.status // "unknown"')
              if [ "${svc_status}" = "operational" ] || [ "${svc_status}" = "degraded" ]; then
                echo "::notice::Release v${latest_version} verified live (status=${svc_status}, spurious flyctl exit ignored)"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Release v${latest_version} marked complete but /health never returned a live status (operational|degraded)"
          exit 1
      - if: github.event_name == 'workflow_dispatch'
        run: |
          echo "::warning::Manual deploy bypass — reason: ${{ github.event.inputs.reason }}"
