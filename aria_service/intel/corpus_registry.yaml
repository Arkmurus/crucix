# ARIA Corpus Registry — Master Source List
# ════════════════════════════════════════════════════════════════════════════
# Single source of truth for every URL ARIA should know about. Used by:
#   - aria_service/intel/corpus_registry.py (Python loader)
#   - aria_service/cli/ingest_tier_a.py     (Tier A bulk ingest)
#   - aria_service/cli/ingest_tier_c.py     (Tier C scheduled scrapers)
#   - /corpus stats command                 (WhatsApp introspection)
#
# Each entry shape:
#   url:           the source URL
#   tier:          A | B | B+ | C | C+ | D | E
#   source_class:  short publisher/origin label (used in retrieval boost)
#   category:      what topic it covers
#   region:        global / africa / lusophone / mena / asia / etc.
#   ingest_strategy: html_crawl | pdf | rss | api | manual | sub_index
#   frequency:     once | weekly | monthly | quarterly | continuous
#   cplp_relevant: true if it touches CPLP markets specifically
#   notes:         optional free-form note
#
# Tier definitions (from Antonio's master plan 2026-04-08):
#   A   — Primary sources (highest trust, citable, feed direct to RAG)
#   B   — Defence & security research (peer-reviewed, institutional)
#   B+  — World geopolitics (strategic analysis, regional intel)
#         Also: Military hardware databases (specifications, comparisons)
#   C   — Live feeds (scraped weekly, alerts to WhatsApp)
#   C+  — Lusophone Africa & CPLP (priority indexing)
#   D   — Reasoning & cognition layer (analytic engine training)
#         NOTE: Tier D is NOT retrieved as RAG — it's distilled into the
#         analytic_principles.py system prompt addendum.
#   E   — Entity & compliance verification (DD, sanctions screening)
# ════════════════════════════════════════════════════════════════════════════

