  # ──────────────────────────────────────────────────────────────────
  # RUN-EVAL-DAILY — R-F470 (2026-05-14)
  # Scores the golden set against the current ARIA every day. Without
  # this, DAILY-GOLDEN-AUTOGEN grows the eval surface but nothing
  # measures regression — accuracy can decay silently. Scheduled at
  # 06:00 UTC, 30 min after the autogen finishes, so the freshest
  # multi-source-corroborated entries are in scope.
  # ──────────────────────────────────────────────────────────────────
  - id: RUN-EVAL-DAILY
    name: Daily golden-set eval (regression detection)
    description: |
      Daily 06:00 UTC — run the golden set through the live ARIA chat
      path and emit pass_rate + score_delta vs the previous run. Surfaces
      regression honestly to the dashboard and (eventually) WhatsApp.
      Closes the loop opened by DAILY-GOLDEN-AUTOGEN.

      R-F650 (2026-05-17): DISABLED. The 06:00 UTC firing burned $12.76
      in 2 hours against claude-sonnet-4-6 — 40× the configured
      cost_cap_usd ($0.30) and 12× the timeout_seconds (600s). Neither
      gate fired because tool:run_eval bypasses the autonomous-task
      cost meter (calls show under the feature but not under by_task).
      R-F929 (2026-05-27): RE-ENABLED. Both original blockers are resolved —
      R-F651 now enforces the 600s timeout (bounds a runaway to 10 min, not the
      2h that burned $12.76) AND charges the cap to the safety breaker on
      timeout; and the expensive provider is gone (Anthropic billing declined
      per §18 — the chain is DeepSeek-only, ~20x cheaper than the Sonnet run
      that caused the incident). The new RUN-COST-GUARD task (R-F930) + the
      $300/mo cap are the live brakes.
    cron: "0 6 * * *"
    enabled: true  # R-F929 (2026-05-27) — re-enabled on DeepSeek; see description
    priority: MEDIUM
    timeout_seconds: 600
    cost_cap_usd: 2.00  # R-F929 — honest ceiling for a DeepSeek golden-set run (was 0.30)
    tool_chain:
      - tool: run_eval
        label: daily_autonomous
        # R-F3701 — record=True flows each answered entry through the SAME
        # grounding/honesty recorders the live chat path uses, populating the
        # stores autonomy_scorer.compute_composite reads. Without it Phase A
        # gate #1 had verification (0.45) and honesty (0.25) permanently
        # unmeasured and sat at confidence 0.30.
        record: true
        # limit bounds the run so it can FINISH inside timeout_seconds (600).
        # The full 500-entry set needs two LLM round-trips per entry; _save_run
        # only executes after the loop, so a timeout persisted nothing at all.
        # eval_runner's representative-stride sampler spreads the subset across
        # categories rather than taking the first N of one.
        limit: 40
    delivery_channels: [mem0]
    whatsapp_group_id: ""
    escalate_if: ["score_delta_negative", "pass_rate_below_70"]
    mem0_tags: [eval, regression, daily, autonomous]

