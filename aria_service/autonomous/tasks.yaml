  # HOURLY-COST-FREE-LEARN — R-F567 (2026-05-16)
  # ──────────────────────────────────────────────────────────────────
  # Hourly preview of the four cost-free self-learning loops:
  #   1. mastery_decay        — surface stale-high topics
  #   2. mistake_replay       — re-check ledger against current 35-clause
  #                              constitution; flag still-failing patterns
