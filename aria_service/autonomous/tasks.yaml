    name: Mozambique defence and Cabo Delgado security scan
    description: |
      Daily 06:10 UTC scan for Mozambique defence procurement, Cabo
      Delgado insurgency updates, and security cooperation developments.
    cron: "10 6 * * mon-fri"
    enabled: false
    priority: HIGH
    timeout_seconds: 180
    cost_cap_usd: 0.20
    tool_chain:
      - tool: deep_research
        entity: "Mozambique defence security Cabo Delgado FADM procurement 2026"
    delivery_channels: [mem0, intel_ledger]
    escalate_if: ["FADM", "Cabo Delgado", "Rwanda", "SADC", "contract award", "tender"]
    mem0_tags: [mozambique, procurement, security, daily, autonomous]

  - id: DAILY-LUSO-GUINEA-BISSAU
    name: Guinea-Bissau and Cape Verde security scan
    description: |
      Daily 06:20 UTC scan for Guinea-Bissau stability, security sector,
      and Cape Verde updates.
    cron: "20 6 * * mon-fri"
