  # R-F1863 (2026-06-24): the AIRTABLE-BUFFER-DRAIN task (R-F529) was
  # removed along with the Airtable integration.
  # ──────────────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────────────
  # DRAIN-COLLAB-BRIDGE (R-F1410) — drain Claude→ARIA notes from the
  # server-mediated collaboration bridge. Runs every 2 minutes so Claude's
  # notes reach the ONE ARIA brain (intel/web/wa) without relay delay.
  # cursor-guarded: each note is absorbed once. Both branches wired (§21a).
  # ──────────────────────────────────────────────────────────────────
  - id: DRAIN-COLLAB-BRIDGE
    name: Drain Claude→ARIA collaboration bridge
    description: |
      Every 2 minutes — drain new Claude→ARIA notes from the server-
      mediated collaboration bridge (collab_bridge.py). Each note is
      absorbed into the brain once (cursor-guarded). This is how Claude's
      guidance reaches the ONE ARIA brain without relay delay.
    cron: "*/2 * * * *"
    enabled: true
    priority: HIGH
    timeout_seconds: 30
    cost_cap_usd: 0.0
    tool_chain:
      - tool: collab_bridge_drain
    delivery_channels: [mem0]
    escalate_if: []
    mem0_tags: [collab, bridge, infrastructure]

  # ──────────────────────────────────────────────────────────────────
  # REFRESH-SANCTIONS-CANONICAL (R-F526) — pull OFAC SDN + EU
  # Consolidated CSV from upstream + replace the local canonical store.
  # Runs slightly BEFORE DAILY-SANCTIONS-SCREENING so the screening
  # task sees fresh data when it fires.
  # ──────────────────────────────────────────────────────────────────
  - id: REFRESH-SANCTIONS-CANONICAL
    name: Refresh canonical sanctions cache (OFAC + EU)
    description: |
      R-F2572 (2026-07-12): DISABLED — this task used `tool: shell` + `command:
      python -m scripts.refresh_sanctions`, but the autonomous engine has NO
      `shell` tool_kind handler, so it was a SILENT NO-OP and the canonical
      sanctions store went 58 DAYS stale. Superseded by the first-class
      `_sanctions_refresh_loop` in main.py (staleness-gated, off-loop, §21-wired,
      factory-respawned) which actually runs the download+load. Kept here disabled
      as an audit trail — do NOT re-enable a shell task the engine cannot execute.
      (Original intent: daily 06:00 UTC pull OFAC SDN Enhanced XML + EU CSV into
      the canonical store that lookup.check_sanctions consumes.)
    cron: "0 6 * * *"
    enabled: false
    priority: HIGH
    timeout_seconds: 300
    cost_cap_usd: 0.0
    tool_chain:
      - tool: shell
        command: "python -m scripts.refresh_sanctions"
    delivery_channels: [intel_ledger]
    escalate_if: ["download failed", "loader failed"]
    mem0_tags: [sanctions, canonical-cache, daily, infrastructure]

