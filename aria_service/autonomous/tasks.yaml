    whatsapp_group_id: ""
    escalate_if: ["stale_officeholder", "verification_failed"]
    mem0_tags: [knowledge, audit, freshness, officeholder, autonomous]

  # ═══════════════════════════════════════════════════════════════════
  # DAILY TEAM BRIEFING — morning action items for the BD team
  # ═══════════════════════════════════════════════════════════════════
  # Fires weekday mornings at 05:45 UTC (before the procurement scans).
  # Generates a pipeline summary + stale leads + deadline alerts +
  # overnight intel highlights. Delivered to WhatsApp group so the
  # team knows what to prioritise each morning.
  - id: DAILY-TEAM-BRIEFING
    name: Morning team briefing
    description: |
      Daily 05:45 UTC weekday briefing for the BD team.
      Combines: pipeline status (new/stale/dormant leads, deadlines),
      overnight autonomous task highlights, action items for today.
      Delivered to WhatsApp group and intel ledger.
    cron: "45 5 * * mon-fri"
    enabled: true
    priority: HIGH
    timeout_seconds: 120
    cost_cap_usd: 0.10
    tool_chain:
      - tool: daily_team_briefing
    delivery_channels: [whatsapp, intel_ledger]
    whatsapp_group_id: ""
    escalate_if: ["deadline", "dormant", "stale"]
    mem0_tags: [briefing, pipeline, daily, team, autonomous]

  # ═══════════════════════════════════════════════════════════════════
  # PIPELINE DORMANCY CHECK — auto-mark stale leads
  # ═══════════════════════════════════════════════════════════════════
  - id: DAILY-PIPELINE-CHECK
    name: Pipeline dormancy check
    description: |
      Daily 22:00 UTC — check for leads with no activity in 21+ days
      and auto-mark them DORMANT. Also checks for upcoming deadlines
      and generates follow-up reminders.
    cron: "0 22 * * *"
    enabled: true
    priority: LOW
    timeout_seconds: 60
    cost_cap_usd: 0.00
    tool_chain:
      - tool: pipeline_dormancy_check
    delivery_channels: [mem0]
    whatsapp_group_id: ""
    escalate_if: ["dormant", "deadline_imminent"]
    mem0_tags: [pipeline, dormancy, check, autonomous]

  # ═══════════════════════════════════════════════════════════════════
  # WEEKLY NEW MARKET SCAN — discover untapped opportunities
  # ═══════════════════════════════════════════════════════════════════
  - id: WEEKLY-NEW-MARKET-SCAN
    name: New market discovery scan
    description: |
      Weekly Thursday 10:00 UTC — search for countries with rising
      defence budgets, new procurement programmes, or emerging security
      needs where Arkmurus has no existing relationships. Specifically
      look for: rising defence spend (>10% YoY), first-time buyer
      programmes, CPLP/NATO-aspirant opportunities, technology-match
      potential. Auto-create pipeline leads for the most promising.
    cron: "0 10 * * thu"
    enabled: true
    priority: MEDIUM
    timeout_seconds: 300
    cost_cap_usd: 0.50
    tool_chain:
      - tool: investigate
        topic: >
          Search for NEW defence procurement opportunities in countries where
          Arkmurus does not yet operate. Focus on: countries with rising defence
          budgets (>10% increase), first-time equipment buyers, CPLP member states
          with security needs, NATO aspirant nations modernising their forces.
          Exclude countries already in our pipeline (Angola, Mozambique, Ghana,
          Nigeria, Kenya, Turkey). Find the next 3-5 markets we should enter.
    delivery_channels: [mem0, intel_ledger]
    whatsapp_group_id: ""
    escalate_if: ["opportunity", "new_market", "rising_budget"]
    mem0_tags: [new_market, discovery, expansion, autonomous]

  # ═══════════════════════════════════════════════════════════════════
  # SOURCE DISCOVERY — ARIA finds new data sources to ingest
  # ═══════════════════════════════════════════════════════════════════
  # Weekly Wednesday 09:00 UTC — analyzes coverage gaps, recommends
  # new intelligence sources, generates knowledge requests for the team.
  # Delivered to WhatsApp so the team sees what ARIA needs.
  - id: WEEKLY-SOURCE-DISCOVERY
    name: Intelligence source discovery
    description: |
      Weekly Wednesday 09:00 UTC — ARIA analyzes her own coverage gaps,
      identifies new data sources (think tanks, procurement portals,
      OSINT databases, regional media), and generates specific knowledge
      requests for team members based on their expertise. Makes ARIA
      proactively hungry for better data.
    cron: "0 9 * * wed"
    enabled: true
    priority: MEDIUM
    timeout_seconds: 120
    cost_cap_usd: 0.05
    tool_chain:
      - tool: source_discovery
    delivery_channels: [whatsapp, mem0]
    whatsapp_group_id: ""
    escalate_if: ["thin_coverage", "critical_gap"]
    mem0_tags: [source_discovery, self_improvement, knowledge_gap, autonomous]

  # ═══════════════════════════════════════════════════════════════════
  # CLAUSE 17 + CORE SELF-DEVELOPMENT LOOP
  # ═══════════════════════════════════════════════════════════════════
  # DAILY-FACT-REFRESH — re-verify PENDING_CORROBORATION / STALE facts.
  # Runs verified_intel.ARIAVerificationEngine.arefresh_stale_facts().
  # Disabled by default (opt-in per file header convention).
  - id: DAILY-FACT-REFRESH
    name: Verified-fact refresh (Clause 17)
    description: |
      Daily 05:00 UTC — re-verify facts whose status is
      PENDING_CORROBORATION or STALE. Runs a targeted corroboration
      search per fact; does not mutate verified records, only tags
      last_checked. Human review still required on CONTRADICTED facts.
    cron: "0 5 * * *"
    enabled: false
    priority: MEDIUM
    timeout_seconds: 300
    cost_cap_usd: 0.10
    tool_chain:
      - tool: verified_fact_refresh
        max_facts: 50
    delivery_channels: [mem0]
    whatsapp_group_id: ""
    escalate_if: ["contradicted", "human_required"]
    mem0_tags: [verified_intel, clause17, refresh, autonomous]

  # HOURLY-ECOSYSTEM-REASSESS — every hour on the hour, ARIA surveys her
  # own ecosystem: mastery drift, source freshness, mistake-ledger patterns,
  # capability gaps. Emits a priority queue `aria:core:reassess:queue` that
  # CORE-DEVELOP drains the next morning. Read-only, cheap.
  - id: HOURLY-ECOSYSTEM-REASSESS
    name: Ecosystem reassessment (hourly)
    description: |
      Every hour — ARIA surveys her ecosystem and writes a priority
      queue for CORE-DEVELOP. No external calls, no mutations.
    cron: "0 * * * *"
    enabled: false
    priority: LOW
    timeout_seconds: 60
    cost_cap_usd: 0.01
    tool_chain:
      - tool: ecosystem_reassess
    delivery_channels: [mem0]
    whatsapp_group_id: ""
    escalate_if: ["critical_gap"]
    mem0_tags: [ecosystem, reassess, self_development, autonomous]

  # DAILY-CORE-DEVELOP — 03:00 UTC daily, ARIA drains the top 3 items
  # from the reassess queue and executes them within the auto-allowed
  # bucket (ingest new sources, refine prompts, expand eval suite).
  # Every action is audit-logged.
  - id: DAILY-CORE-DEVELOP
    name: Core self-development (auto-allowed actions)
    description: |
      Daily 03:00 UTC — drains top 3 gap-queue items and acts on them.
      Per aria_autonomy_doctrine.md: only auto-allowed actions
      (source ingests, prompt refinements, new adapters, eval
      expansion). All mutations HMAC-audited.
    cron: "0 3 * * *"
    enabled: false
    priority: MEDIUM
    timeout_seconds: 600
    cost_cap_usd: 0.30
    tool_chain:
      - tool: core_develop
    delivery_channels: [mem0]
    whatsapp_group_id: ""
    escalate_if: ["validator_rejected", "blocked_by_doctrine"]
    mem0_tags: [core_develop, self_evolution, autonomous, clause17]

  # WEEKLY-CORE-META — Sunday 04:00 UTC — diffs the capability manifest
  # week-over-week, spots regressions, seeds next week's reassess queue.
  - id: WEEKLY-CORE-META
    name: Core meta-review (weekly)
    description: |
      Sunday 04:00 UTC — week-over-week capability diff, regression
      flagging, next-week queue seed. Output feeds the 05:45 team
      briefing so operators see what ARIA changed and what she plans.
    cron: "0 4 * * sun"
    enabled: false
    priority: MEDIUM
    timeout_seconds: 300
    cost_cap_usd: 0.10
    tool_chain:
      - tool: core_meta
    delivery_channels: [mem0, whatsapp]
    whatsapp_group_id: ""
    escalate_if: ["regression", "coverage_drop"]
    mem0_tags: [core_meta, weekly, self_review, autonomous]

  # DAILY-CITATION-SCOUT — 02:00 UTC — walks citations from trusted
  # sources to find authoritative citees; adds qualifying ones to the
  # Web Atlas (per-topic reliability map).
  - id: DAILY-CITATION-SCOUT
    name: Citation-graph source scout
    description: |
      Daily 02:00 UTC — crawls outbound citations from trusted Tier
      1a/1b/2 sources, scores each citee, adds qualifying ones to
      the Web Atlas. Boundary-pushing — finds sources we don't yet
      have.
    cron: "0 2 * * *"
    enabled: false
    priority: LOW
    timeout_seconds: 300
    cost_cap_usd: 0.15
    tool_chain:
      - tool: source_scout
        pattern: citation
    delivery_channels: [mem0]
    whatsapp_group_id: ""
    escalate_if: ["new_tier1a", "new_tier1b"]
    mem0_tags: [source_scout, citation_graph, web_atlas, autonomous]

  # WEEKLY-TLD-PROBE — Saturday 02:00 UTC — systematic sweep of gov/mil
  # subdomains per target market. Discovers ministerial, parliamentary,
  # gazette sources Aria may have missed.
  - id: WEEKLY-TLD-PROBE
    name: TLD probe — gov/mil subdomain sweep
    description: |
      Saturday 02:00 UTC — systematic probing of gov/mil subdomains
      across target markets (Angola, Mozambique, Nigeria, Ghana,
      Turkey, Brazil, Kenya, Indonesia, Philippines, Vietnam, UAE,
      Saudi Arabia, Poland, Romania). Adds hits to Web Atlas.
    cron: "0 2 * * sat"
    enabled: false
    priority: LOW
    timeout_seconds: 600
    cost_cap_usd: 0.20
    tool_chain:
      - tool: source_scout
        pattern: tld_probe
    delivery_channels: [mem0]
    whatsapp_group_id: ""
    escalate_if: ["new_gazette_found", "new_ministry_found"]
    mem0_tags: [source_scout, tld_probe, web_atlas, autonomous]
