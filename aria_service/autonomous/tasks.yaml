  # ──────────────────────────────────────────────────────────────────
  # BLOCK I — ARK-DD Orchestrator (disabled by default)
  # ──────────────────────────────────────────────────────────────────
  # Walks the DD watchlist once a week and runs the 7-layer
  # dd_orchestrator on every entity registered via
  # POST /api/aria/dd/watchlist. Entities can be added manually (by
  # Antonio / Ari) or programmatically when the BD intelligence layer
  # surfaces a new counterparty worth tracking.
  #
  # Disabled by default so existing deploys don't suddenly start burning
  # cost on an empty watchlist. Flip `enabled: true` AND ensure at
  # least one entity has been added via the watchlist endpoint before
  # the first scheduled run.
  - id: WEEKLY-DD-WATCHLIST
    name: Watchlist sanctions/PEP re-screen
    description: |
      Weekly Monday 07:00 UTC — re-screens every entity registered in
      crucix:dd:watchlist against the sanctions + PEP lists (no LLM, no
      deep research). This is a SANCTIONS RE-SCREEN, not a full DD: it
      does NOT re-run the 7-layer orchestrator (identity → network →
      compliance → digital → verification → synthesis) — that would
      exceed this task's 2.00 USD cap. It compares each entity's current
      sanctions status against the most recent DD report (matched by
      canonical_entity_id per R-F876) and records score/status changes.
      A new HIT (CLEAN→sanctioned) fires an escalation signal to the
      autonomous/delivery.py pipeline. For a full periodic re-DD, run the
      orchestrator on-demand via /api/aria/dd/orchestrate.
      [R-F879 (2026-05-25) — description corrected: the prior text claimed
      a 7-layer full re-DD producing a structured ARK-DD report; the task
      handler (dd_watchlist_sweep → rescreen_watchlist) only ever ran a
      sanctions/PEP re-screen.]
    cron: "0 7 * * mon"
    enabled: true
    priority: MEDIUM
    timeout_seconds: 600
    cost_cap_usd: 2.00
    tool_chain:
      - tool: dd_watchlist_sweep
    delivery_channels: [mem0, intel_ledger]
    whatsapp_group_id: ""
    escalate_if: ["RED", "HARD_STOP", "SAR"]
    mem0_tags: [dd, orchestrator, watchlist, weekly, autonomous]

  # ──────────────────────────────────────────────────────────────────
  # R-F3534 — Official sanctions designations: ARIA's highest-value lane
  # ──────────────────────────────────────────────────────────────────
  - id: HOURLY-SANCTIONS-DESIGNATIONS
    name: Official sanctions designation watch
    description: |
      Hourly — snapshots every official designation list ARIA holds and
      emits an alert for each GENUINELY NEW designation, which the golden
      intel bridge promotes to a tier_1a Grade-A `sanctions_change` signal.

      Coverage is global: US (OFAC SDN), UN Security Council, UK FCDO,
      EU consolidated, and World Bank debarment.

      WHY HOURLY, AND WHY ITS OWN TASK. Until R-F3534 this ran only as a
      non-fatal afterthought inside WEEKLY-DD-WATCHLIST ("0 7 * * mon")
      behind a bare `except: pass`. OFAC designated on seven separate days
      in July 2026 while ARIA checked once, and the EU list — 5,994 live
      designations already sitting in ARIA's own canonical store — was not
      watched at all. The measured result: zero Grade-A sanctions signals
      in a 100-signal feed, so the public channel published procurement
      instead. The value of this signal is almost entirely LATENCY: a
      designation a customer learns about a week late is history, not
      intelligence.

      Costs no LLM spend — an HTTP list fetch plus a set difference — so
      the cost cap is zero and the cadence can be tight.
    cron: "7 * * * *"
    enabled: true
    priority: HIGH
    timeout_seconds: 300
    cost_cap_usd: 0.00
    tool_chain:
      - tool: sanctions_designation_watch
    delivery_channels: [intel_ledger]
    whatsapp_group_id: ""
    escalate_if: ["RED", "HARD_STOP", "SAR"]
    mem0_tags: [sanctions, designations, golden_intel, hourly, autonomous]

