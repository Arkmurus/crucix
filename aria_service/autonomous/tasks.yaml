# ARIA Autonomous Engine — task schedule
#
# Edit this file and POST /api/aria/autonomous/reload-tasks to apply
# without redeploying. The cron field uses standard 5-field syntax with
# UTC time:
#   minute hour day-of-month month day-of-week
#
# Supported features:
#   - exact integers           "0", "5", "23"
#   - wildcard                 "*"
#   - comma lists              "0,15,30,45"
#   - ranges                   "0-5", "mon-fri"
#   - step values on wildcard  "*/5"
#   - day-of-week names        "mon", "tue", "wed", "thu", "fri", "sat", "sun"
#
# IMPORTANT — Phase 3c-α conservative defaults:
#
#   - Every task starts with `enabled: false` so the engine NEVER fires
#     anything until the operator explicitly turns it on. Manual run-now
#     via /api/aria/autonomous/run-now/<task_id> bypasses the enabled
#     flag for one-shot validation testing.
#
#   - The engine itself is also gated behind ARIA_AUTONOMOUS_ENABLED=1
#     (default OFF). Both flags must flip before anything fires.
#
#   - Even with both flags on, the engine runs in DRY_RUN mode by
#     default — task results are computed and logged but NOT delivered
#     to WhatsApp / intel ledger. Set ARIA_AUTONOMOUS_DRY_RUN=0 to
#     enable real delivery.
#
# This means the safe ramp-up sequence is:
#
#   1. Deploy with engine OFF — verify no tasks fire (default)
#   2. Set ARIA_AUTONOMOUS_ENABLED=1 — engine starts polling, still
#      no fires because all tasks are disabled here
#   3. Manually run a task via /api/aria/autonomous/run-now/<id> in
#      DRY_RUN mode — verify the response is sane, watch the cost
#   4. Enable the task here, reload — task fires on schedule but in
#      DRY_RUN mode (no real delivery)
#   5. Watch for 5+ runs, verify the run history in /status
#   6. Set ARIA_AUTONOMOUS_DRY_RUN=0 — real delivery now active

tasks:

  # ──────────────────────────────────────────────────────────────────
  # DAILY-PROC-ANGOLA — Angola defence procurement scan
  # ──────────────────────────────────────────────────────────────────
  - id: DAILY-PROC-ANGOLA
    name: Angola defence procurement scan
    description: |
      Daily 06:00 UTC scan for new defence / security / military
      procurement notices in Angola. Tool chain runs deep_research
      with the Angolan procurement context. Escalates on keywords
      that signal a real Arkmurus opportunity.

    cron: "0 6 * * mon-fri"
    enabled: false
    priority: HIGH
    timeout_seconds: 180
    cost_cap_usd: 0.20

    tool_chain:
      - tool: deep_research
        entity: "Angola defence procurement tender 2026 SIMPORTEX FAA"

    delivery_channels: [mem0, intel_ledger]
    whatsapp_group_id: ""   # leave empty until Antonio answers open question 1

    escalate_if:
      - "new tender"
      - "contract award"
      - "FAA"
      - "SIMPORTEX"
      - "MINFAR"
      - "OGE 2026"

    mem0_tags: [angola, procurement, tender, daily, autonomous]

  # ──────────────────────────────────────────────────────────────────
  # METACOG-DAILY — Daily metacognitive self-check
  # ──────────────────────────────────────────────────────────────────
  - id: METACOG-DAILY
    name: Daily metacognitive self-check
    description: |
      Daily 22:00 UTC aggregation of self-assessment scores, gap counts,
      and calibration data. Light-weight — no LLM call, just Redis reads
      and aggregation. Feeds into the weekly consciousness review.

    cron: "0 22 * * *"
    enabled: false
    priority: LOW
    timeout_seconds: 30
    cost_cap_usd: 0.00

    tool_chain:
      - tool: metacognitive_daily_check

    delivery_channels: [mem0]
    whatsapp_group_id: ""
    escalate_if: []
    mem0_tags: [metacognitive, daily, self-check]

  # ──────────────────────────────────────────────────────────────────
  # METACOG-WEEKLY — Weekly consciousness review
  # ──────────────────────────────────────────────────────────────────
  - id: METACOG-WEEKLY
    name: Weekly consciousness review
    description: |
      Sunday 20:00 UTC full consciousness report. ARIA reflects on
      the week's performance: self-assessment scores, gap detections,
      calibration data, corrections made. Generates a structured
      reflection stored permanently. Requires one LLM call (~$0.05).

    cron: "0 20 * * sun"
    enabled: false
    priority: MEDIUM
    timeout_seconds: 120
    cost_cap_usd: 0.10

    tool_chain:
      - tool: metacognitive_weekly_review

    delivery_channels: [mem0]
    whatsapp_group_id: ""
    escalate_if: []
    mem0_tags: [metacognitive, weekly, consciousness, reflection]

  # ──────────────────────────────────────────────────────────────────
  # METACOG-MONTHLY — Monthly gap-closure sprint
  # ──────────────────────────────────────────────────────────────────
  - id: METACOG-MONTHLY
    name: Monthly gap-closure sprint
    description: |
      First Sunday of each month, 18:00 UTC. Reviews the top 3
      persistent HIGH-severity gaps and generates code proposals to
      close them. All proposals have PENDING_REVIEW status — nothing
      auto-deploys. Requires 3-4 LLM calls (~$0.15-0.20).

    cron: "0 18 1-7 * sun"
    enabled: false
    priority: LOW
    timeout_seconds: 300
    cost_cap_usd: 0.30

    tool_chain:
      - tool: metacognitive_monthly_sprint

    delivery_channels: [mem0]
    whatsapp_group_id: ""
    escalate_if: []
    mem0_tags: [metacognitive, monthly, gap-closure, code-generation]
