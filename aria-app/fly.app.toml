# Fly config for aria-app (Next.js frontend).
# Deploy: flyctl deploy aria-app --config fly.app.toml --build-arg ARIA_BUILD_GIT_SHA=<sha>
# Stateless — no volume (state lives in server.mjs + the brain). No secrets required:
# /api/* is proxied to the backend over the 6PN address baked at build (BACKEND_URL).
app = "aria-app"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile.app"

  [build.args]
    # Baked into the API-proxy rewrites at build time. Non-secret 6PN internal address.
    BACKEND_URL = "http://aria-web.internal:3117"

[env]
  PORT = "3200"
  NODE_ENV = "production"
  # Runtime base for server-side fetches (lib/api.ts apiServer).
  BACKEND_URL = "http://aria-web.internal:3117"

[http_service]
  internal_port = 3200
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    # /healthz proxies to aria-web and returns 200 (rollback full-proxy mode). When the
    # app serves its own pages again, "/signin" is also valid.
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
