[pytest]
# R-F927 — bound any runaway/hanging test so one deadlock can't freeze the whole
# run. Root incident: a TestClient read-document request triggered a 21s
# `import sentence_transformers` under the embedder lock inside the index-queue
# worker thread, deadlocking the run; pytest-timeout's thread method then killed
# the process at ~45%, so the suite never completed and the §16 baseline was
# unmeasurable. The aria_service/tests/conftest.py hermetic env prevents that
# specific deadlock; this is the backstop for any future one.
#
# 120s is far above any legitimate test (full-suite baseline ~166s for thousands
# of tests) so it only trips a true hang. On CI/Linux pytest-timeout uses the
# signal method (recoverable — the hanging test fails, the suite continues); on
# Windows it uses the thread method (dumps stacks). Requires pytest-timeout.
timeout = 120

# R-F1024 — pytest-asyncio in auto mode so the suite's `async def` tests actually
# run. Without this plugin every async test errored with "async def functions are
# not natively supported", which inflated the apparent failure count (a large
# chunk of the "225 failures" the self-coder was chasing were phantom: tests that
# could not run, not broken code). auto mode runs bare `async def test_*` without
# requiring a per-test marker. Requires pytest-asyncio (in requirements).
asyncio_mode = auto

# Register custom markers to silence PytestUnknownMarkWarning.
markers =
    asyncio: mark a coroutine test (handled by pytest-asyncio)
    slow: test that spawns a subprocess or loads a model (R-F2798) — runs by default, deselect with -m "not slow"
