app = 'aria-intel'
primary_region = 'lhr'

[build]
  dockerfile = 'aria_service/Dockerfile'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

# R-F316 (2026-05-11) — cold-start probe race fix. Every redeploy logged
# `[PC01] instance refused connection. is your app listening on 0.0.0.0:8000?`
# at ~T+1s after machine create, because fly's load balancer probed the
# port BEFORE uvicorn had bound to 0.0.0.0:8000 (typically T+4s on this
# stack: init → mount /data → python -m aria_service.main → uvicorn bind).
# Result: 3-4 second window per deploy where the LB returned "instance
# refused" to clients, and every deploy emitted a misleading WARNING.
#
# Fix: add an explicit TCP healthcheck with a 30s grace_period. The LB
# now waits 30s before probing (more than enough for uvicorn cold boot
# even with sentence-transformers + chromadb + 23k knowledge facts +
# 22k ledger signals to hydrate). Once the first TCP probe succeeds,
# traffic flows normally. Reduces deploy-log noise to zero and closes
# the brief 4-second window where clients saw connection-refused.
[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  timeout = "10s"
  path = "/api/aria/health"

# ── Persistent storage for chromadb (RAG store) ─────────────────────────────
# Past incident 2026-04-09: chromadb was running with no volume mounted at
# /data, so _resolve_rag_path() in rag_store.py fell back to /tmp/aria_rag
# (ephemeral). Every machine restart wiped the corpus. The 615 chunks from
# the morning's Tier A bulk ingest were lost on the next deploy. Fix: mount
# a fly.io volume at /data so the rag_store path resolves to /data/aria_rag
# (persistent across restarts and deploys).
#
# Volume created via:  flyctl volumes create aria_rag --region lhr --size 5 -a aria-intel
#
# Single-machine constraint: fly.io volumes are NOT shared across machines.
# Each machine that wants to use the volume needs its own copy (which would
# diverge as ingests happen on one but not the other). For now we run a
# single machine (min_machines_running=1) and accept the loss of HA — the
# alternative is two independent RAG stores which is worse for data
# coherence. The volume itself has scheduled snapshots so backup is
# automatic.
[mounts]
  source = 'aria_rag'
  destination = '/data'
  initial_size = '5gb'

[[vm]]
  size = 'shared-cpu-2x'
  # Bumped to 2 CPU + 4GB on 2026-04-12: 5-language OCR (en/pt/es/fr/ro)
  # + sentence-transformers + chromadb + LLM context building needs more
  # than 2GB. EasyOCR model loading alone consumes ~800MB, plus the RAG
  # store + knowledge base + 11 knowledge modules at startup.
  memory = '4096mb'
