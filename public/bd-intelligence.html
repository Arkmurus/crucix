<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BD Intelligence | ARIA</title>
  <link rel="icon" type="image/png" href="images/fav-icon/icon.png">
  
  <link rel="stylesheet" href="css/aria.css?v=15">
  <link rel="stylesheet" href="fonts/bootstrap-icons/font-css.css">
  <style>
    .bd-tabs { display:flex; gap:2px; border-bottom:1px solid var(--sc-border); margin-bottom:20px; flex-wrap:wrap; }
    .bd-tab { background:none; border:none; border-bottom:2px solid transparent; color:var(--sc-muted); font-size:13px; font-weight:500; padding:10px 16px; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all .15s; white-space:nowrap; }
    .bd-tab:hover { color:var(--sc-text); }
    .bd-tab.active { color:var(--sc-prime); border-bottom-color:var(--sc-prime); font-weight:600; }
    .bd-tab i { font-size:15px; }
    .bd-panel { display:none; } .bd-panel.active { display:block; }
    .intel-card { background:#ffffff; border:1px solid var(--sc-border); border-left:4px solid var(--sc-prime); border-radius:12px; margin-bottom:12px; overflow:hidden; transition:transform .18s, box-shadow .18s; box-shadow:0 1px 3px rgba(15,23,42,0.04); }
    .intel-card:hover { transform:translateY(-2px); box-shadow:0 6px 24px rgba(124,58,237,0.15); }
    .ic-top { display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:12px 16px 8px; }
    .ic-body { padding:0 16px 12px; }
    .ic-title { font-size:14px; font-weight:600; color:var(--sc-heading); line-height:1.5; margin-bottom:5px; }
    .ic-text { font-size:12px; color:#57534b; line-height:1.55; }
    .ic-foot { display:flex; align-items:center; gap:10px; padding:8px 16px 10px; border-top:1px solid var(--sc-border); font-size:12px; flex-wrap:wrap; }
    .ic-row { display:flex; align-items:baseline; gap:6px; font-size:13px; color:var(--sc-text); margin-top:4px; }
    .ic-lbl { font-size:11px; color:#9b968c; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap; }
    .ic-nextstep { display:flex; align-items:flex-start; gap:6px; margin-top:8px; padding:8px 10px; background:rgba(234,88,12,0.08); border-left:3px solid rgba(234,88,12,0.4); border-radius:0 6px 6px 0; font-size:12px; color:#c2410c; }
    .ic-share { background:#f5f4ef; border:1px solid var(--sc-border); border-radius:6px; color:var(--sc-muted); cursor:pointer; width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-size:14px; transition:all .15s; margin-left:auto; flex-shrink:0; }
    .ic-share:hover { background:var(--sc-prime-soft); color:var(--sc-prime); }
    /* Share sheet */
    .share-sheet { position:fixed; inset:0; background:rgba(15,23,42,0.45); z-index:999; display:none; align-items:flex-end; justify-content:center; padding:20px; }
    .share-sheet.open { display:flex; }
    @media(min-width:600px){ .share-sheet { align-items:center; } }
    .share-panel { background:#ffffff; border:1px solid var(--sc-border); border-radius:16px 16px 0 0; width:100%; max-width:420px; box-shadow:0 12px 40px rgba(15,23,42,0.08); }
    @media(min-width:600px){ .share-panel { border-radius:16px; } }
    .share-header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--sc-border); font-size:14px; font-weight:600; color:var(--sc-heading); }
    .share-preview { padding:10px 18px; font-size:12px; color:var(--sc-muted); font-style:italic; line-height:1.5; background:#f5f4ef; border-bottom:1px solid var(--sc-border); }
    .share-btns { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:16px 18px 8px; }
    .share-btn { display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 8px; border-radius:10px; border:1px solid var(--sc-border); background:#f5f4ef; color:#57534b; cursor:pointer; font-size:11px; font-weight:600; transition:all .15s; }
    .share-btn:hover { transform:translateY(-2px); }
    .share-btn.wa:hover { background:rgba(37,211,102,0.15); color:#1a7a40; }
    .share-btn.tg:hover { background:rgba(36,161,222,0.15); color:#1d7fb0; }
    .share-btn.em:hover { background:rgba(37,99,235,0.12); color:#1d4ed8; }
    .share-btn.cp:hover { background:var(--sc-prime-soft); color:var(--sc-prime); }
    .share-copy-btn { display:flex; align-items:center; justify-content:center; margin:8px 18px 16px; padding:10px; border-radius:8px; border:1px solid var(--sc-border); background:#f5f4ef; color:#57534b; cursor:pointer; font-size:13px; font-weight:600; transition:all .15s; width:calc(100% - 36px); }
    .share-copy-btn:hover { background:var(--sc-prime-soft); color:var(--sc-prime); }
  </style>
</head>
<body>
<div id="sidebar-placeholder"></div>
<div id="header-placeholder"></div>
<main id="app-main">
  <div class="sc-page-header" style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">
    <div>
      <h1 class="sc-page-title"><i class="bi bi-graph-up"></i> BD &amp; Strategy Intelligence</h1>
      <p class="sc-page-sub" id="bd-sub">Loading…</p>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-left:auto" id="bd-stats"></div>
  </div>

  <!-- Tabs -->
  <div class="bd-tabs" id="bd-tabs">
    <button class="bd-tab active" data-tab="brain"><i class="bi bi-cpu"></i> Brain Strategy <span class="sc-badge sc-badge-prime" id="cnt-brain">0</span></button>
    <button class="bd-tab" data-tab="leads"><i class="bi bi-lightning"></i> Sales Leads <span class="sc-badge sc-badge-orange" id="cnt-leads">0</span></button>
    <button class="bd-tab" data-tab="tenders"><i class="bi bi-file-earmark-text"></i> Tenders <span class="sc-badge sc-badge-blue" id="cnt-tenders">0</span></button>
    <button class="bd-tab" data-tab="ideas"><i class="bi bi-lightbulb"></i> Ideas <span class="sc-badge sc-badge-green" id="cnt-ideas">0</span></button>
    <button class="bd-tab" data-tab="pipeline"><i class="bi bi-kanban"></i> Pipeline <span class="sc-badge sc-badge-muted" id="cnt-pipeline">0</span></button>
  </div>

  <div id="panel-brain"    class="bd-panel active"><div class="sc-loading-state"><div class="sc-spinner"></div>Loading…</div></div>
  <div id="panel-leads"    class="bd-panel"><div class="sc-loading-state"><div class="sc-spinner"></div>Loading…</div></div>
  <div id="panel-tenders"  class="bd-panel"><div class="sc-loading-state"><div class="sc-spinner"></div>Loading…</div></div>
  <div id="panel-ideas"    class="bd-panel"><div class="sc-loading-state"><div class="sc-spinner"></div>Loading…</div></div>
  <div id="panel-pipeline" class="bd-panel"><div class="sc-loading-state"><div class="sc-spinner"></div>Loading…</div></div>
</main>

<!-- Share sheet -->
<div class="share-sheet" id="share-sheet">
  <div class="share-panel" id="share-panel">
    <div class="share-header">
      <span>Share Intelligence</span>
      <button data-share="close" style="background:#f2f0e9;border:none;color:var(--sc-muted);border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center">×</button>
    </div>
    <div class="share-preview" id="share-preview"></div>
    <div class="share-btns">
      <button class="share-btn wa" data-share="wa"><span style="font-size:22px">📱</span>WhatsApp</button>
      <button class="share-btn tg" data-share="tg"><span style="font-size:22px">✈️</span>Telegram</button>
      <button class="share-btn em" data-share="em"><span style="font-size:22px">📧</span>Email</button>
      <button class="share-btn cp" data-share="copy"><span style="font-size:22px">📋</span>Copy</button>
    </div>
    <button class="share-copy-btn" data-share="copy"><i class="bi bi-clipboard"></i>&nbsp; Copy full text</button>
  </div>
</div>
<script src="js/app.js?v=10"></script>
<script src="js/sidebar.js?v=13"></script>
<script>
Auth.requireAuth();
Sidebar.init('bd');

var bdData = null;
var shareText = '';

// Tab switching via event delegation
document.getElementById('bd-tabs').addEventListener('click', function(e) {
  var btn = e.target.closest('[data-tab]');
  if (!btn) return;
  var name = btn.getAttribute('data-tab');
  document.querySelectorAll('.bd-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.bd-panel').forEach(function(p) { p.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
});

function openShare(text, url) {
  shareText = text + (url ? '\n\n' + url : '') + '\n\n· ARIA Intelligence · imaria.io';
  document.getElementById('share-preview').textContent = truncate(shareText, 180);
  document.getElementById('share-sheet').classList.add('open');
}

// Intel card share button delegation
document.addEventListener('click', function(e) {
  var shareBtn = e.target.closest('[data-sharetext]');
  if (shareBtn) {
    openShare(shareBtn.getAttribute('data-sharetext'), shareBtn.getAttribute('data-shareurl'));
  }
});

// Share sheet event delegation
document.getElementById('share-sheet').addEventListener('click', function(e) {
  var btn = e.target.closest('[data-share]');
  if (btn) {
    var action = btn.getAttribute('data-share');
    if (action === 'close') { document.getElementById('share-sheet').classList.remove('open'); return; }
    if (action === 'copy') { navigator.clipboard.writeText(shareText).then(function() { Toast.show('Copied', 'success'); }); return; }
    var enc = encodeURIComponent(shareText);
    var urls = { wa: 'https://wa.me/?text=' + enc, tg: 'https://t.me/share/url?url=' + encodeURIComponent('imaria.io') + '&text=' + enc, em: 'mailto:?subject=ARIA%20Intelligence&body=' + enc };
    if (urls[action]) window.open(urls[action], '_blank');
    return;
  }
  // Click on backdrop (outside panel) closes the sheet
  if (!e.target.closest('#share-panel')) document.getElementById('share-sheet').classList.remove('open');
});

function chip(text, cls='sc-badge-muted') {
  return `<span class="sc-badge ${escHtml(cls)}" style="margin:1px">${escHtml(text)}</span>`;
}

function renderCard(title, meta, summary, nextstep, url, shareTextFn) {
  return `<div class="intel-card">
    <div class="ic-top">${escHtml(meta)}<button class="ic-share" data-sharetext="${escHtml(shareTextFn||title)}" data-shareurl="${escHtml(url||'')}"><i class="bi bi-share"></i></button></div>
    <div class="ic-body">
      <div class="ic-title">${escHtml(title)}</div>
      ${summary?`<div class="ic-text">${escHtml(truncate(summary,200))}</div>`:''}
      ${nextstep?`<div class="ic-nextstep"><i class="bi bi-arrow-right-circle" style="flex-shrink:0;color:#ea580c;font-size:14px"></i>${escHtml(nextstep)}</div>`:''}
    </div>
    ${url?`<div class="ic-foot"><a href="${escHtml(safeHref(url))}" target="_blank" rel="noopener" style="font-size:12px;color:var(--sc-prime)"><i class="bi bi-box-arrow-up-right"></i> Source</a></div>`:''}
  </div>`;
}

// R-F229 (2026-05-11) — freshness pill helper. Renders "X min/hr/d ago"
// from any of the common timestamp fields. Returns empty string when no
// timestamp is available so cards from legacy data don't render "-".
function freshnessPill(item) {
  if (!item || typeof item !== 'object') return '';
  var ts = item.fetchedAt || item.fetched_at || item.timestamp || item.ts
        || item.discovered_at || item.published_at || item.publishedAt
        || item.created_at || item.createdAt || null;
  if (!ts) return '';
  var d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  var diffMs = Date.now() - d.getTime();
  if (diffMs < 0) return '';  // future timestamps — skip
  var mins = Math.floor(diffMs / 60000);
  var label, colour;
  if (mins < 60) { label = mins + 'm ago'; colour = '#15803d'; }
  else if (mins < 24 * 60) { label = Math.floor(mins / 60) + 'h ago'; colour = '#16a34a'; }
  else if (mins < 7 * 24 * 60) { label = Math.floor(mins / (24 * 60)) + 'd ago'; colour = '#c2410c'; }
  else { label = Math.floor(mins / (24 * 60)) + 'd ago'; colour = '#b91c1c'; }
  return '<span style="font-size:11px;color:' + colour + ';margin-left:8px;padding:1px 6px;background:#f2f0e9;border-radius:4px">' + label + '</span>';
}

async function load() {
  var data = await API.get('/api/bd-intelligence');
  // R-F2619: API.get returns null on failure only (success-empty returns a real
  // payload). A null here is a broken fetch, not "no data yet" — say so honestly
  // rather than implying the operator just needs to run a sweep (§22).
  if (!data) {
    document.getElementById('bd-sub').textContent = 'Couldn\'t load BD intelligence. Live data is unavailable. Retry shortly.';
    document.getElementById('panel-leads').innerHTML = '<p class="text-muted">Couldn\'t load. The page is up but the BD feed is unavailable right now.</p>';
    return;
  }
  bdData = data;

  var tenders = data.tenders || [];
  var ideas   = data.ideas || [];
  var brain   = data.brain || null;
  var brainLeads = (brain && brain.salesLeads) ? brain.salesLeads : [];

  // Qualified leads = HOT/WARM tenders (field is leadQuality, not urgency)
  var leads = tenders.filter(function(t) { return t.leadQuality === 'HOT' || t.leadQuality === 'WARM'; });
  // Combine with brain-generated sales leads
  var allLeads = leads.concat(brainLeads.map(function(l) {
    // R-F2009: honest lead mapping — only signal-backed data, no fabricated fields
    var summary = '';
    if (l.signalSummary) { summary = l.signalSummary; }
    else if (l.signalCount > 0) { summary = l.signalCount + ' intel signals'; }
    return { title: l.lead || l.market || '', market: l.market || '', leadQuality: 'SIGNAL', type: 'INTEL', summary: summary, nextStep: '', url: '', source: 'Brain', signalCount: l.signalCount || 0 };
  }));

  document.getElementById('cnt-brain').textContent   = brain ? '1' : '0';
  document.getElementById('cnt-leads').textContent    = allLeads.length;
  document.getElementById('cnt-tenders').textContent  = tenders.length;
  document.getElementById('cnt-ideas').textContent    = ideas.length;

  document.getElementById('bd-sub').textContent =
    allLeads.length + ' sales leads · ' + tenders.length + ' tenders · ' + ideas.length + ' ideas';

  // Stats
  var hotCount = tenders.filter(function(t) { return t.leadQuality === 'HOT'; }).length;
  document.getElementById('bd-stats').innerHTML = [
    ['Sales Leads', allLeads.length, '#7c3aed'],
    ['All Tenders', tenders.length, '#0066FF'],
    ['HOT Priority', hotCount, '#ef4444'],
    ['Brain Ideas', brainLeads.length, '#FF7A41'],
  ].map(function(a) { var lbl=a[0],val=a[1],col=a[2]; return '<div style="background:#ffffff;border:1px solid var(--sc-border);border-top:3px solid '+col+';border-radius:8px;padding:8px 14px;text-align:center;min-width:70px;box-shadow:0 1px 3px rgba(15,23,42,0.04)"><div style="font-size:1.3rem;font-weight:800;color:'+col+'">'+val+'</div><div style="font-size:10px;color:#9b968c;text-transform:uppercase;letter-spacing:.5px;margin-top:2px">'+lbl+'</div></div>'; }).join('');

  // ── Brain Strategy panel ──
  if (brain) {
    var bHtml = '';
    // R-F2002 — honesty banner: this panel is AI-generated from live signals.
    bHtml += '<div style="font-size:11px;color:#57534b;background:rgba(234,88,12,0.08);border-left:3px solid rgba(234,88,12,0.4);border-radius:0 6px 6px 0;padding:7px 10px;margin-bottom:12px"><i class="bi bi-info-circle"></i> AI-generated from live signals. Named buyers, OEMs, deal values and dates are estimates; verify independently before acting.</div>';
    // Weekly priority
    if (brain.weeklyPriority && brain.weeklyPriority.action) {
      var wp = brain.weeklyPriority;
      bHtml += '<div class="intel-card" style="border-left-color:#ef4444"><div class="ic-top">' + chip('TOP PRIORITY','sc-badge-prime') + chip(wp.market||'','sc-badge-blue') + '<button class="ic-share" data-sharetext="' + escHtml('TOP PRIORITY: ' + wp.action + (wp.whyNow ? '\nWhy now: ' + wp.whyNow : '') + (wp.firstStep ? '\nNext step: ' + wp.firstStep : '')) + '"><i class="bi bi-share"></i></button></div><div class="ic-body"><div class="ic-title">' + escHtml(wp.action) + '</div>';
      if (wp.whyNow) bHtml += '<div class="ic-text" style="margin-top:4px"><strong>Why now:</strong> ' + escHtml(wp.whyNow) + '</div>';
      if (wp.firstStep) bHtml += '<div class="ic-nextstep"><i class="bi bi-arrow-right-circle" style="flex-shrink:0;color:#ea580c;font-size:14px"></i>' + escHtml(wp.firstStep) + '</div>';
      bHtml += '</div></div>';
    }
    // Action plan
    if (brain.actionPlan && brain.actionPlan.length) {
      bHtml += '<h4 style="color:#57534b;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:18px 0 10px">Action Plan</h4>';
      brain.actionPlan.forEach(function(a) {
        bHtml += '<div class="intel-card"><div class="ic-top">' + chip(a.market||'','sc-badge-blue') + (a.winProb ? chip('Win: '+a.winProb+'%','sc-badge-green') : '') + '<button class="ic-share" data-sharetext="' + escHtml((a.market||'') + ': ' + (a.deal||'') + (a.winProb ? ' (Win: '+a.winProb+'%)' : '') + (a.steps&&a.steps.length ? '\nSteps:\n' + a.steps.map(function(s,i){return (i+1)+'. '+s;}).join('\n') : '') + (a.deadline ? '\nDeadline: '+a.deadline : '')) + '"><i class="bi bi-share"></i></button></div><div class="ic-body"><div class="ic-title">' + escHtml(a.deal||'') + '</div>';
        if (a.steps && a.steps.length) bHtml += '<div class="ic-text">' + a.steps.map(function(s,i){return (i+1)+'. '+escHtml(s);}).join('<br>') + '</div>';
        if (a.deadline) bHtml += '<div class="ic-text" style="margin-top:4px"><strong>Deadline:</strong> '+escHtml(a.deadline)+'</div>';
        bHtml += '</div></div>';
      });
    }
    // Market intelligence
    if (brain.marketIntelligence && brain.marketIntelligence.length) {
      bHtml += '<h4 style="color:#57534b;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:18px 0 10px">Market Intelligence</h4>';
      brain.marketIntelligence.forEach(function(m) {
        bHtml += renderCard(m.market + ': ' + (m.signal||''), chip(m.market||'','sc-badge-blue'), m.recommendation || '', '', '', m.market + ': ' + (m.signal||'') + (m.recommendation ? '\nRecommendation: ' + m.recommendation : ''));
      });
    }
    // Knowledge gaps
    if (brain.knowledgeGaps && brain.knowledgeGaps.length) {
      bHtml += '<h4 style="color:#57534b;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:18px 0 10px">Knowledge Gaps</h4>';
      brain.knowledgeGaps.forEach(function(g) {
        bHtml += '<div class="intel-card" style="border-left-color:#FF7A41"><div class="ic-top"><button class="ic-share" data-sharetext="' + escHtml('Knowledge Gap: ' + (g.question||'') + (g.howToFind ? '\nHow to find: ' + g.howToFind : '')) + '"><i class="bi bi-share"></i></button></div><div class="ic-body"><div class="ic-title">' + escHtml(g.question||'') + '</div><div class="ic-text">' + escHtml(g.howToFind||'') + '</div></div></div>';
      });
    }
    // Self learning
    if (brain.selfLearning) {
      var sl = brain.selfLearning;
      bHtml += '<h4 style="color:#57534b;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:18px 0 10px">Brain Learning</h4>';
      bHtml += '<div class="intel-card" style="border-left-color:#22c55e"><div class="ic-body">';
      if (sl.strategyAdjustment) bHtml += '<div class="ic-text"><strong>Strategy:</strong> '+escHtml(sl.strategyAdjustment)+'</div>';
      if (sl.nextSweepFocus) bHtml += '<div class="ic-text" style="margin-top:6px"><strong>Next focus:</strong> '+escHtml(sl.nextSweepFocus)+'</div>';
      if (sl.patternsObserved && sl.patternsObserved.length) bHtml += '<div class="ic-text" style="margin-top:6px"><strong>Patterns:</strong> '+sl.patternsObserved.map(function(p){return escHtml(p);}).join('; ')+'</div>';
      bHtml += '</div></div>';
    }
    if (brain.confidence != null) bHtml += '<div style="text-align:right;font-size:11px;color:#9b968c;margin-top:8px">Brain confidence: '+Math.round(brain.confidence*100)+'%</div>';
    document.getElementById('panel-brain').innerHTML = bHtml || '<p class="text-muted">Brain analysis available after next sweep.</p>';
  } else {
    document.getElementById('panel-brain').innerHTML = '<p class="text-muted">Brain strategy not available; requires LLM to be configured and a completed sweep.</p>';
  }

  // ── Sales Leads panel (grid cards like opportunities) ──
  document.getElementById('panel-leads').innerHTML = allLeads.length ? '<div class="sc-grid-3">' + allLeads.map(function(l) {
    // R-F2009: honest card — no fabricated scores, probabilities, or contacts
    var qCol = l.leadQuality==='HOT'?'#ef4444':l.leadQuality==='WARM'?'#FF7A41':'#6b7280';
    var qBadge = l.leadQuality==='HOT'?'sc-badge-prime':l.leadQuality==='WARM'?'sc-badge-orange':'sc-badge-muted';
    var qLabel = l.leadQuality==='HOT'?'HOT':l.leadQuality==='WARM'?'WARM':'Intel Signal';
    return '<div class="sc-card"><div class="sc-card-header"><div class="sc-card-title" style="font-size:15px">' +
      escHtml(l.market||'Global') + freshnessPill(l) + '</div>' + chip(qLabel,qBadge) + '</div><div class="sc-card-body">' +
      (l.signalCount > 0 ? '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span style="font-size:24px;font-weight:800;color:var(--sc-prime)">' + l.signalCount + '</span><span style="font-size:11px;color:#9b968c">intel signals</span></div>' : '') +
      '<div style="font-size:13px;font-weight:600;color:var(--sc-heading);margin-bottom:8px;line-height:1.5">' + escHtml(truncate(l.title||l.lead||l.market||'',120)) + '</div>' +
      (l.summary ? '<p style="font-size:12px;color:#57534b;line-height:1.6;margin-bottom:8px;border-top:1px solid var(--sc-border);padding-top:10px">' + escHtml(truncate(l.summary,300)) + '</p>' : '') +
      (l.source==='Brain' ? '<div style="font-size:11px;color:#9b968c;margin-top:6px"><i class="bi bi-info-circle"></i> AI-generated from live signals; verify independently</div>' : '') +
      '</div></div>';
  }).join('') + '</div>' : '<p class="text-muted">No qualified leads yet. Leads appear when tenders score HOT or WARM, or when the brain generates sales leads.</p>';

  // ── Tenders panel (grid cards) ──
  document.getElementById('panel-tenders').innerHTML = tenders.length ? '<div class="sc-grid-3">' + tenders.map(function(t) {
    var qBadge = t.leadQuality==='HOT'?'sc-badge-prime':t.leadQuality==='WARM'?'sc-badge-orange':'sc-badge-muted';
    return '<div class="sc-card"><div class="sc-card-header"><div class="sc-card-title" style="font-size:15px">' +
      escHtml(t.market||'Global') + freshnessPill(t) + '</div>' + chip(t.type||'TENDER','sc-badge-blue') + '<button class="ic-share" data-sharetext="' + escHtml((t.type||'TENDER') + ', ' + (t.market||'') + ': ' + (t.title||'') + ' (Score: ' + (t.score||0) + ')') + '"><i class="bi bi-share"></i></button></div><div class="sc-card-body">' +
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">' +
      '<div style="font-size:28px;font-weight:800;color:var(--sc-prime)">' + (t.score||0) + '</div>' +
      '<div style="font-size:11px;color:#9b968c">/ 100<br>Score</div></div>' +
      (t.leadQuality ? '<div style="margin-bottom:8px">' + chip(t.leadQuality,qBadge) + (t.winProbability?chip('Fit '+t.winProbability+'/100','sc-badge-green'):'') + '</div>' : '') +
      '<div style="font-size:13px;font-weight:600;color:var(--sc-heading);margin-bottom:6px;line-height:1.5">' + escHtml(truncate(t.title||'',120)) + '</div>' +
      (t.summary ? '<p style="font-size:12px;color:#57534b;line-height:1.5;margin-bottom:8px;border-top:1px solid var(--sc-border);padding-top:8px">' + escHtml(truncate(t.summary,160)) + '</p>' : '') +
      (t.url ? '<a href="'+escHtml(safeHref(t.url))+'" target="_blank" rel="noopener" style="font-size:12px;color:var(--sc-prime)"><i class="bi bi-box-arrow-up-right"></i> Source</a>' : '') +
      '</div></div>';
  }).join('') + '</div>' : '<p class="text-muted">No tenders found. Tenders are extracted from procurement feeds during sweeps.</p>';

  // ── Ideas panel (grid cards) ──
  document.getElementById('panel-ideas').innerHTML = ideas.length ? '<div class="sc-grid-3">' + ideas.map(function(i) {
    return '<div class="sc-card"><div class="sc-card-header"><div class="sc-card-title" style="font-size:15px">' +
      (i.lusophone?'<i class="bi bi-flag"></i> ':'') + escHtml(i.market||'') + '</div>' + chip(i.type||'IDEA','sc-badge-orange') + '<button class="ic-share" data-sharetext="' + escHtml((i.market||'') + ', ' + (i.type||'IDEA') + ' (Score: ' + (i.score||0) + ')\n' + (i.rationale||'') + (i.actionStep ? '\nAction: ' + i.actionStep : '')) + '"><i class="bi bi-share"></i></button></div><div class="sc-card-body">' +
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">' +
      '<div style="font-size:28px;font-weight:800;color:var(--sc-prime)">' + (i.score||0) + '</div>' +
      '<div style="font-size:11px;color:#9b968c">/ 100<br>Score</div></div>' +
      '<div style="font-size:12px;color:#57534b;margin-bottom:8px">' +
        '<i class="bi bi-broadcast" style="color:#ea580c"></i> ' + (i.signals||0) + ' signals' +
        (i.devFinance ? ' · <span style="color:#15803d">Dev Finance</span>' : '') + '</div>' +
      (i.rationale ? '<p style="font-size:12px;color:#57534b;line-height:1.6;border-top:1px solid var(--sc-border);padding-top:8px;margin-bottom:8px">' + escHtml(truncate(i.rationale,180)) + '</p>' : '') +
      (i.actionStep ? '<div style="display:flex;align-items:flex-start;gap:6px;padding:8px 10px;background:rgba(234,88,12,0.08);border-left:3px solid rgba(234,88,12,0.4);border-radius:0 6px 6px 0;font-size:12px;color:#c2410c"><i class="bi bi-arrow-right-circle" style="flex-shrink:0;color:#ea580c;font-size:13px;margin-top:1px"></i>' + escHtml(truncate(i.actionStep,150)) + '</div>' : '') +
      '</div></div>';
  }).join('') + '</div>' : '<p class="text-muted">No strategic ideas yet. Ideas are generated from multi-source intelligence convergence.</p>';

  // Pipeline
  loadPipeline();
}

async function loadPipeline() {
  const data = await API.get('/api/bd-intelligence/pipeline');
  // R-F2619: null = load failure; [] = genuinely empty. Don't render a broken
  // fetch as "No deals in pipeline yet" (§22 empty-vs-error).
  if (data === null) {
    document.getElementById('cnt-pipeline').textContent = '—';
    document.getElementById('panel-pipeline').innerHTML = '<p class="text-muted">Couldn\'t load the pipeline. Live data is unavailable. Retry shortly.</p>';
    return;
  }
  const deals = data || [];
  document.getElementById('cnt-pipeline').textContent = deals.length;
  document.getElementById('panel-pipeline').innerHTML = deals.length ?
    `<div style="overflow-x:auto"><table class="sc-table"><thead><tr><th>Deal</th><th>Market</th><th>Stage</th><th>Value</th><th>Fit (est.)</th><th></th></tr></thead><tbody>
    ${deals.map(d=>`<tr>
      <td><strong>${escHtml(d.title||d.company||'')}</strong></td>
      <td>${escHtml(d.market||d.country||'')}</td>
      <td>${chip(d.stage||'prospect','sc-badge-muted')}</td>
      <td>${escHtml(d.value?`$${Math.round(d.value/1e6)}M`:'-')}</td>
      <td>${escHtml(d.winProb?`${Math.round(d.winProb*100)}%`:'-')}</td>
      <td><button class="ic-share" data-sharetext="${escHtml((d.market||'')+ ': '+(d.title||d.company||'')+' | Stage: '+(d.stage||'')+(d.value?' | Value: $'+Math.round(d.value/1e6)+'M':'')+(d.winProb?' | Fit(est): '+Math.round(d.winProb*100)+'%':''))}"><i class="bi bi-share"></i></button></td>
    </tr>`).join('')}
    </tbody></table></div>` :
    '<p class="text-muted">No deals in pipeline yet.</p>';
}

load();
</script>
</body>
</html>
