<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | ARIA</title>
  <link rel="icon" type="image/png" href="images/fav-icon/icon.png">
  
  <link rel="stylesheet" href="css/aria.css?v=15">
  <link rel="stylesheet" href="fonts/bootstrap-icons/font-css.css">
  <style>
    .user-card { background:#ffffff; border:1px solid var(--sc-border); border-radius:10px; margin-bottom:10px; overflow:hidden; box-shadow:0 1px 3px rgba(15,23,42,0.04); }
    .user-card.pending { border-color:rgba(234,88,12,0.35); }
    .user-main { display:flex; align-items:center; gap:12px; padding:12px 16px; flex-wrap:wrap; border-bottom:1px solid var(--sc-border); }
    .user-av { width:38px; height:38px; border-radius:50%; background:var(--sc-prime-soft); border:1px solid rgba(124,58,237,0.25); color:var(--sc-prime-dark); font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .user-name { font-size:14px; font-weight:700; color:var(--sc-heading); }
    .user-meta { font-size:12px; color:var(--sc-muted); margin-top:2px; }
    .user-actions { display:flex; align-items:center; gap:6px; padding:8px 16px; flex-wrap:wrap; }
    .action-btn { font-size:12px; padding:5px 12px; border-radius:6px; border:1px solid var(--sc-border-strong); background:#f5f4ef; color:var(--sc-text); cursor:pointer; display:inline-flex; align-items:center; gap:5px; transition:all .15s; }
    .action-btn:hover { background:#f2f0e9; color:var(--sc-heading); }
    .action-btn.approve { border-color:rgba(22,163,74,0.4); color:#15803d; }
    .action-btn.approve:hover { background:rgba(34,197,94,0.12); }
    .action-btn.reject, .action-btn.delete { border-color:rgba(220,38,38,0.4); color:#b91c1c; }
    .action-btn.reject:hover, .action-btn.delete:hover { background:rgba(239,68,68,0.1); }
    .action-btn.logout-btn { border-color:rgba(234,88,12,0.4); color:#c2410c; }
    .role-sel { background:#ffffff; border:1px solid var(--sc-border-strong); border-radius:4px; color:var(--sc-prime-dark); font-size:12px; padding:4px 8px; outline:none; cursor:pointer; }
    .role-sel option { background:#ffffff; color:var(--sc-text); }
    .tab-btns { display:flex; gap:2px; border-bottom:1px solid var(--sc-border); margin-bottom:20px; }
    .tab-btn { background:none; border:none; border-bottom:2px solid transparent; color:var(--sc-muted); font-size:13px; padding:10px 16px; cursor:pointer; font-weight:500; transition:all .15s; }
    .tab-btn.active { color:var(--sc-heading); border-bottom-color:var(--sc-prime); font-weight:600; }
    .tab-panel { display:none; } .tab-panel.active { display:block; }
  </style>
</head>
<body>
<div id="sidebar-placeholder"></div>
<div id="header-placeholder"></div>
<main id="app-main">
  <div class="sc-page-header">
    <h1 class="sc-page-title"><i class="bi bi-shield-lock"></i> User Management</h1>
    <p class="sc-page-sub">Manage user accounts, roles and access</p>
  </div>

  <div id="msg-bar" style="display:none"></div>

  <!-- Ops utilities: one-click alerter tests (added 2026-04-20) -->
  <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;">
    <button type="button" id="btn-test-telegram" class="action-btn"
            style="border-color:rgba(37,99,235,0.4); color:#1d4ed8;">
      <i class="bi bi-telegram"></i> Test Telegram alerter
    </button>
    <button type="button" id="btn-test-email" class="action-btn"
            style="border-color:rgba(22,163,74,0.4); color:#15803d;">
      <i class="bi bi-envelope"></i> Test Email alerter
    </button>
  </div>

  <div class="tab-btns" id="tab-btns">
    <button class="tab-btn active" data-tab="all">All Users <span class="sc-badge sc-badge-muted" id="cnt-all">0</span></button>
    <button class="tab-btn" data-tab="pending">Pending <span class="sc-badge sc-badge-orange" id="cnt-pending">0</span></button>
    <button class="tab-btn" data-tab="audit">Audit Log</button>
  </div>

  <div id="tab-all"     class="tab-panel active"><div class="sc-loading-state"><div class="sc-spinner"></div></div></div>
  <div id="tab-pending" class="tab-panel"><div class="sc-loading-state"><div class="sc-spinner"></div></div></div>
  <div id="tab-audit"   class="tab-panel"><div class="sc-loading-state"><div class="sc-spinner"></div></div></div>
</main>
<script src="js/app.js?v=10"></script>
<script src="js/sidebar.js?v=13"></script>
<script>
if (!Auth.requireAdmin()) throw new Error('Not admin');
Sidebar.init('admin');

document.getElementById('tab-btns').addEventListener('click', function(e) {
  var btn = e.target.closest('[data-tab]');
  if (!btn) return;
  var name = btn.getAttribute('data-tab');
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if (name === 'audit') loadAudit();
});

// ── Ops utility buttons ──────────────────────────────────────────
// One-click round-trip tests for the Telegram and SMTP alerters. The
// endpoints hit themselves trigger a real send to the configured
// channel, so a successful click = verified end-to-end.
function showMsg(kind, text) {
  var bar = document.getElementById('msg-bar');
  if (!bar) return;
  var color = kind === 'ok' ? '#15803d'
            : kind === 'err' ? '#b91c1c'
            : 'var(--sc-prime-dark)';
  var bg = kind === 'ok' ? 'rgba(34,197,94,0.1)'
         : kind === 'err' ? 'rgba(239,68,68,0.1)'
         : 'var(--sc-prime-soft)';
  bar.style.cssText = 'display:block;padding:10px 14px;border-radius:8px;'
    + 'background:' + bg + ';color:' + color + ';margin-bottom:12px;font-size:13px;';
  bar.textContent = text;
  setTimeout(function(){ bar.style.display = 'none'; }, 6000);
}

document.getElementById('btn-test-telegram').addEventListener('click', async function() {
  var b = this;
  b.disabled = true;
  var originalHtml = b.innerHTML;
  b.innerHTML = '<i class="bi bi-hourglass-split"></i> Sending…';
  try {
    var r = await fetch('/api/admin/test-telegram', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + localStorage.getItem('crucix_token'),
        'Content-Type': 'application/json',
      },
    });
    var d = await r.json().catch(function(){ return { error: 'invalid response' }; });
    if (r.ok && d.sent) {
      showMsg('ok', '✓ Telegram alerter OK. Message sent at ' + (d.sent_at || 'now') + '. Check your Telegram.');
    } else if (d.configured === false) {
      showMsg('err', '✗ Not configured: TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set on the server. See env-check: ' + JSON.stringify(d.env_check || {}));
    } else {
      showMsg('err', '✗ Telegram send failed: ' + (d.error || d.reason || r.status));
    }
  } catch (err) {
    showMsg('err', '✗ Network error: ' + err.message);
  } finally {
    b.disabled = false;
    b.innerHTML = originalHtml;
  }
});

document.getElementById('btn-test-email').addEventListener('click', async function() {
  // R-F3602 — window.prompt() -> the shared Modal.form (R-F3169).
  //
  // prompt() takes one unlabelled string, cannot validate, cannot show help
  // text, and browsers suppress it after the first one in a session. A form
  // field can be typed `email`, so the browser validates the address before we
  // spend an SMTP call finding out it was malformed.
  var _r = await Modal.form({
    title: 'Send a test email',
    message: 'ARIA will send one message through the live mail provider to confirm delivery is working.',
    fields: [{ name: 'to', label: 'Recipient address', type: 'email', required: true,
               placeholder: 'you@example.com', autofocus: true,
               help: 'Use an inbox you can actually check. This proves delivery end to end.' }],
    okLabel: 'Send test email',
  });
  var to = _r && _r.to;
  if (!to) return;
  var b = this;
  b.disabled = true;
  var originalHtml = b.innerHTML;
  b.innerHTML = '<i class="bi bi-hourglass-split"></i> Sending…';
  try {
    var r = await fetch('/api/admin/test-email', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + localStorage.getItem('crucix_token'),
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ to: to }),
    });
    var d = await r.json().catch(function(){ return {}; });
    if (r.ok) {
      // R-F744: accept either sent:true OR messageId. Pre-R-F744 the
      // backend returned { sent: true } with no messageId, so this
      // branch always fell through to the "nothing sent" error even
      // when the email actually delivered. sendMail() now also
      // returns messageId via the nodemailer info object.
      var adminOk = d.adminEmail && (d.adminEmail.sent === true || !!d.adminEmail.messageId);
      var userOk  = d.testEmail  && (d.testEmail.sent  === true || !!d.testEmail.messageId);
      if (adminOk || userOk) {
        var ids = [];
        if (adminOk && d.adminEmail.messageId) ids.push('admin=' + d.adminEmail.messageId);
        if (userOk  && d.testEmail.messageId)  ids.push('test=' + d.testEmail.messageId);
        showMsg('ok', '✓ Email alerter OK. Admin: ' + (adminOk ? 'sent' : 'failed') + ', Test: ' + (userOk ? 'sent' : 'failed') + (ids.length ? ' [' + ids.join(', ') + ']' : ''));
      } else {
        var adminReason = (d.adminEmail && d.adminEmail.reason) || '';
        var userReason  = (d.testEmail  && d.testEmail.reason)  || '';
        showMsg('err', '✗ Email send failed. Admin: ' + (adminReason || 'unknown') + ' · Test: ' + (userReason || 'unknown') + '. SMTP config: ' + JSON.stringify(d.smtpConfig || {}));
      }
    } else {
      showMsg('err', '✗ Email test failed: HTTP ' + r.status);
    }
  } catch (err) {
    showMsg('err', '✗ Network error: ' + err.message);
  } finally {
    b.disabled = false;
    b.innerHTML = originalHtml;
  }
});

// R-F228 (2026-05-11) — renamed to avoid shadowing the alerter-test
// showMsg(kind, text) declared earlier at line 87. Pre-R-F228 this
// declaration silently overwrote it, so Telegram/Email test buttons
// passing showMsg('ok', '...') routed here with mismatched signature.
function showAlert(msg, type='success') {
  const el = document.getElementById('msg-bar');
  el.className = `sc-alert sc-alert-${type}`;
  el.textContent = msg; el.style.display = 'flex';
  setTimeout(() => el.style.display='none', 4000);
}

function userCard(u) {
  var initials = Auth.initials({fullName: u.fullName, username: u.username});
  var statusClass = u.status==='active'?'sc-badge-green':(u.status==='pending_approval'||u.status==='pending_verification')?'sc-badge-orange':'sc-badge-red';
  var actions = '';
  if (u.status==='pending_approval'||u.status==='pending_verification') {
    actions += '<button type="button" class="action-btn approve" data-action="approve" data-id="'+u.id+'"><i class="bi bi-check-lg"></i> Approve</button>';
    actions += '<button type="button" class="action-btn reject" data-action="reject" data-id="'+u.id+'"><i class="bi bi-x-lg"></i> Reject</button>';
  }
  if (u.status==='active') {
    actions += '<button type="button" class="action-btn logout-btn" data-action="force-logout" data-id="'+u.id+'"><i class="bi bi-box-arrow-right"></i> Force Logout</button>';
  }
  actions += '<button type="button" class="action-btn delete" data-action="delete" data-id="'+u.id+'"><i class="bi bi-trash"></i> Delete</button>';
  var login = u.lastLogin ? '<span style="font-size:11px;color:#9b968c;margin-left:auto">Last login: '+fmtDateTime(u.lastLogin)+'</span>' : '';
  return '<div class="user-card" id="user-'+u.id+'">'+
    '<div class="user-main">'+
      '<div class="user-av">'+initials+'</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div class="user-name">'+escHtml(u.fullName||u.username||'')+'</div>'+
        '<div class="user-meta">'+escHtml(u.email||'')+' · @'+escHtml(u.username||'')+'</div>'+
      '</div>'+
      '<span class="sc-badge '+statusClass+'">'+escHtml(u.status||'')+'</span>'+
      '<select class="role-sel" data-action="role" data-id="'+u.id+'">'+
        ['viewer','support','poweruser','admin'].map(function(r){return '<option value="'+r+'"'+(u.role===r?' selected':'')+'>'+r+'</option>';}).join('')+
      '</select>'+
    '</div>'+
    '<div class="user-actions">'+actions+login+'</div>'+
  '</div>';
}

let allUsers = [];

async function loadUsers() {
  const data = await API.get('/api/admin/users');
  allUsers = data || [];
  const pending = allUsers.filter(u=>u.status==='pending_approval'||u.status==='pending_verification');
  document.getElementById('cnt-all').textContent = allUsers.length;
  document.getElementById('cnt-pending').textContent = pending.length;
  document.getElementById('tab-all').innerHTML = allUsers.length ? allUsers.map(userCard).join('') : '<p class="text-muted">No users found.</p>';
  document.getElementById('tab-pending').innerHTML = pending.length ? pending.map(userCard).join('') : '<p class="text-muted" style="padding:20px">No pending accounts.</p>';
}

// Event delegation — no inline onclick needed (CSP-safe)
document.addEventListener('click', async function(e) {
  var btn = e.target.closest('[data-action]');
  if (!btn) return;
  var action = btn.getAttribute('data-action');
  var id = btn.getAttribute('data-id');
  if (!action || !id) return;

  var token = localStorage.getItem('crucix_token');
  var headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };

  if (action === 'approve') {
    btn.textContent = 'Approving...'; btn.disabled = true;
    try {
      var r = await fetch('/api/admin/users/' + id + '/approve', { method: 'POST', headers: headers, body: '{}' });
      var d = {}; try { d = await r.json(); } catch(x) {}
      if (r.ok) { showAlert('User approved. Welcome email sent'); loadUsers(); }
      else { showAlert((d.error || 'Failed, HTTP ' + r.status), 'error'); btn.textContent = 'Approve'; btn.disabled = false; }
    } catch (x) { showAlert('Network error', 'error'); btn.textContent = 'Approve'; btn.disabled = false; }
  }
  else if (action === 'reject') {
    const ok = await Modal.confirm({
      title: 'Reject this user?',
      message: 'Reject and remove this pending user account.',
      okLabel: 'Reject user',
    });
    if (!ok) return;
    try {
      var r2 = await fetch('/api/admin/users/' + id + '/reject', { method: 'POST', headers: headers, body: '{}' });
      if (r2.ok) { showAlert('User rejected'); loadUsers(); } else showAlert('Reject failed', 'error');
    } catch (x) { showAlert('Network error', 'error'); }
  }
  else if (action === 'force-logout') {
    try {
      var r3 = await fetch('/api/admin/users/' + id + '/force-logout', { method: 'POST', headers: headers, body: '{}' });
      if (r3.ok) showAlert('User logged out'); else showAlert('Failed', 'error');
    } catch (x) { showAlert('Network error', 'error'); }
  }
  else if (action === 'delete') {
    const ok = await Modal.confirm({
      title: 'Delete this user?',
      message: 'Permanently delete this user account. This cannot be undone.',
      okLabel: 'Delete user',
    });
    if (!ok) return;
    try {
      var r4 = await fetch('/api/admin/users/' + id, { method: 'DELETE', headers: headers });
      if (r4.ok) { showAlert('User deleted'); loadUsers(); } else showAlert('Delete failed', 'error');
    } catch (x) { showAlert('Network error', 'error'); }
  }
});

document.addEventListener('change', async function(e) {
  if (!e.target.matches('[data-action="role"]')) return;
  var id = e.target.getAttribute('data-id');
  var role = e.target.value;
  try {
    var r = await fetch('/api/admin/users/' + id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('crucix_token') },
      body: JSON.stringify({ role: role })
    });
    if (r.ok) showAlert('Role updated to ' + role); else showAlert('Role change failed', 'error');
  } catch (x) { showAlert('Network error', 'error'); }
});

async function loadAudit() {
  const el = document.getElementById('tab-audit');
  const data = await API.get('/api/admin/audit');
  const log = (data||[]);
  el.innerHTML = log.length ? `<table class="sc-table"><thead><tr><th>Action</th><th>Target</th><th>By</th><th>When</th></tr></thead><tbody>
    ${log.slice(0,50).map(e=>`<tr>
      <td><strong style="font-size:12px">${escHtml(e.action||'')}</strong></td>
      <td style="font-size:12px">${escHtml(e.targetEmail||e.target||'')}${e.targetName?`<br><span style="font-size:10px;color:#9b968c">${escHtml(e.targetName)}</span>`:''}</td>
      <td style="font-size:12px">${escHtml(e.adminEmail||e.byEmail||e.by||'')}</td>
      <td style="font-size:11px;color:#9b968c">${escHtml(fmtDateTime(e.ts||e.timestamp||e.at))}</td>
    </tr>`).join('')}
  </tbody></table>` : '<p class="text-muted" style="padding:20px">No audit records.</p>';
}

loadUsers();
</script>
</body>
</html>
