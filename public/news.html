<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Monitor | ARIA</title>
  <link rel="icon" type="image/png" href="images/fav-icon/icon.png">
  <link rel="stylesheet" href="css/aria.css?v=15">
  <link rel="stylesheet" href="fonts/bootstrap-icons/font-css.css">
  <style>
    :root { --bg: #faf9f5; --card: #ffffff; --border: #e9e6df; --text: #3d3a34; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
    #app-main { padding: 20px; min-width: 0; overflow-x: hidden; }  /* R-F2052: drop hardcoded 240px margin/max-width — shared aria.css #app-main handles margin + collapse */
    @media (max-width: 1024px) { #app-main { margin-left: 0; max-width: 100vw; } }
    #fetch-failure-banner { display:none; background:#fff7ed; border:1px solid #fed7aa; border-radius:6px; padding:10px 14px; margin-bottom:14px; color:#c2410c; font-size:13px; line-height:1.5; }
    .sc-page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
    .sc-page-title { font-size:1.4em; font-weight:700; color:#1f1e1c; display:flex; align-items:center; gap:10px; }
    .sc-page-title i { color:#7c3aed; }
    .sc-page-sub { color:#6b6862; font-size:0.85em; }
    .sc-grid-4 { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:14px; margin-bottom:20px; }
    .sc-stat { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; display:flex; align-items:center; gap:14px; box-shadow:0 1px 2px rgba(15,23,42,0.04); }
    .sc-stat-icon { width:40px; height:40px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; background:rgba(124,58,237,0.12); color:#7c3aed; flex-shrink:0; }
    .sc-stat-icon.green { background:rgba(22,163,74,0.12); color:#16a34a; }
    .sc-stat-icon.orange { background:rgba(234,88,12,0.12); color:#ea580c; }
    .sc-stat-icon.blue { background:rgba(37,99,235,0.12); color:#2563eb; }
    .sc-stat-value { font-size:1.5em; font-weight:700; color:#1f1e1c; }
    .sc-stat-label { font-size:0.8em; color:#6b6862; margin-top:2px; }
    .sc-card { background:var(--card); border:1px solid var(--border); border-radius:8px; margin-bottom:16px; overflow:hidden; box-shadow:0 1px 2px rgba(15,23,42,0.04); }
    .sc-card-header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); }
    .sc-card-title { font-size:0.9em; font-weight:600; color:#1f1e1c; display:flex; align-items:center; gap:8px; }
    .sc-card-title i { color:#7c3aed; }
    .sc-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:6px; font-size:0.85em; font-weight:600; cursor:pointer; border:none; transition:all 0.15s; }
    .sc-btn-primary { background:#7c3aed; color:#fff; }
    .sc-btn-primary:hover { background:#6d28d9; }
    .sc-btn-sm { padding:5px 12px; font-size:0.8em; }
    .sc-btn-outline { background:#fff; border:1px solid #dcd8cf; color:#6b6862; }
    .sc-btn-outline:hover { border-color:#7c3aed; color:#6d28d9; background:#f1ecfb; }
    .sc-pill { display:inline-block; padding:2px 10px; border-radius:12px; font-size:0.75em; font-weight:600; }
    .sc-pill-info { background:rgba(124,58,237,0.12); color:#6d28d9; border:1px solid rgba(124,58,237,0.25); }
    .sc-pill-green { background:rgba(22,163,74,0.12); color:#15803d; border:1px solid rgba(22,163,74,0.25); }
    .sc-pill-orange { background:rgba(234,88,12,0.12); color:#c2410c; border:1px solid rgba(234,88,12,0.25); }
    .sc-pill-blue { background:rgba(37,99,235,0.12); color:#1d4ed8; border:1px solid rgba(37,99,235,0.25); }
    .sc-table { width:100%; border-collapse:collapse; font-size:0.85em; }
    .sc-table th { text-align:left; padding:10px 14px; border-bottom:1px solid var(--border); color:#6b6862; font-weight:600; font-size:0.8em; text-transform:uppercase; letter-spacing:0.5px; }
    .sc-table td { padding:10px 14px; border-bottom:1px solid #e9e6df; vertical-align:top; }
    .sc-table tr:hover td { background:#f5f4ef; }
    .sc-table .title-cell { max-width:400px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sc-table .title-cell a { color:#2563eb; text-decoration:none; }
    .sc-table .title-cell a:hover { text-decoration:underline; color:#7c3aed; }
    .sc-table .source-cell { color:#6b6862; font-size:0.85em; }
    .sc-table .time-cell { color:#6b6862; font-size:0.8em; white-space:nowrap; }
    .sc-loading-state { padding:40px; text-align:center; color:#6b6862; }
    .sc-spinner { display:inline-block; width:24px; height:24px; border:2px solid var(--border); border-top-color:#7c3aed; border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:8px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .category-filter { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    .category-btn { padding:4px 12px; border-radius:16px; font-size:0.8em; cursor:pointer; border:1px solid #dcd8cf; background:#fff; color:#6b6862; transition:all 0.15s; }
    .category-btn:hover { border-color:#7c3aed; color:#6d28d9; }
    .category-btn.active { background:rgba(124,58,237,0.12); border-color:#7c3aed; color:#6d28d9; }
    /* R-F3671 — a configured category with nothing retained. Shown, never hidden
       (the dark coverage is the point), but not clickable: it cannot be served. */
    .category-btn-empty { opacity:0.45; cursor:not-allowed; border-style:dashed; }
    .category-btn-empty:hover { border-color:#dcd8cf; color:#6b6862; }
    .article-card { padding:14px 18px; border-bottom:1px solid #e9e6df; cursor:pointer; transition:background 0.1s; }
    .article-card:hover { background:#f5f4ef; }
    .article-card:last-child { border-bottom:none; }
    .article-title { font-weight:600; color:#1f1e1c; margin-bottom:4px; line-height:1.4; }
    .article-title a { color:#2563eb; text-decoration:none; }
    .article-title a:hover { color:#7c3aed; text-decoration:underline; }
    .article-meta { display:flex; gap:12px; font-size:0.8em; color:#6b6862; flex-wrap:wrap; }
    .article-meta .source { color:#7c3aed; font-weight:600; }
    .article-meta .category { }
    .article-summary { font-size:0.85em; color:#3d3a34; margin-top:6px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .article-time { font-size:0.75em; color:#9b968c; margin-top:4px; }
    .empty-state { padding:60px 20px; text-align:center; color:#6b6862; }
    .empty-state i { font-size:48px; color:#dcd8cf; margin-bottom:16px; display:block; }
    .empty-state p { font-size:0.9em; line-height:1.6; }
  </style>
</head>
<body>
<div id="sidebar-placeholder"></div>
<div id="header-placeholder"></div>

<main id="app-main">
  <div id="fetch-failure-banner" role="alert"></div>

  <div class="sc-page-header">
    <h1 class="sc-page-title"><i class="bi bi-newspaper"></i> News Monitor</h1>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="sc-page-sub" id="last-updated">Loading…</span>
      <button type="button" class="sc-btn sc-btn-primary sc-btn-sm" id="btn-poll">
        <i class="bi bi-arrow-repeat"></i> Poll Now
      </button>
    </div>
  </div>

  <p style="margin:-4px 0 18px;color:#6b6862;font-size:12px;line-height:1.5">
    <i class="bi bi-info-circle"></i> Live intelligence from <strong id="source-count">—</strong> curated defence, geopolitical, cyber, security, maritime-risk, and crisis early-warning sources. Polled hourly. <a href="/sources.html" style="color:#913BFF">Source Health</a>
  </p>

  <!-- KPI Tiles -->
  <div class="sc-grid-4 mb-24" id="kpi-row">
    <div class="sc-stat"><div class="sc-stat-icon"><i class="bi bi-newspaper"></i></div><div><div class="sc-stat-value" id="kpi-total">-</div><div class="sc-stat-label" id="kpi-total-label">Retained Articles</div></div></div>
    <div class="sc-stat"><div class="sc-stat-icon green"><i class="bi bi-globe"></i></div><div><div class="sc-stat-value" id="kpi-sources">-</div><div class="sc-stat-label">Sources</div></div></div>
    <div class="sc-stat"><div class="sc-stat-icon blue"><i class="bi bi-tags"></i></div><div><div class="sc-stat-value" id="kpi-categories">-</div><div class="sc-stat-label">Categories</div></div></div>
    <div class="sc-stat"><div class="sc-stat-icon orange"><i class="bi bi-clock"></i></div><div><div class="sc-stat-value" id="kpi-last-poll">-</div><div class="sc-stat-label">Last Poll</div></div></div>
  </div>

  <!-- Category filter -->
  <div class="category-filter" id="category-filter">
    <button class="category-btn active" data-category="all">All</button>
  </div>

  <!-- Articles list -->
  <div class="sc-card">
    <div class="sc-card-header">
      <div class="sc-card-title"><i class="bi bi-list-ul"></i> Recent Articles</div>
      <span class="sc-pill sc-pill-info" id="article-count">0</span>
    </div>
    <div id="articles-list">
      <div class="sc-loading-state"><div class="sc-spinner"></div>Loading articles…</div>
    </div>
  </div>

  <!-- Category breakdown -->
  <div class="sc-card">
    <div class="sc-card-header">
      <div class="sc-card-title"><i class="bi bi-pie-chart"></i> Coverage by Category</div>
    </div>
    <div id="category-breakdown" style="padding:14px 18px">
      <div class="sc-loading-state"><div class="sc-spinner"></div></div>
    </div>
  </div>
</main>

<script src="js/app.js?v=10"></script>
<script src="js/sidebar.js?v=13"></script>
<script>
(function() {
  if (typeof Auth !== 'undefined' && Auth.requireAuth) Auth.requireAuth();
  // R-F2875 — `API` is `const API = {...}` in app.js, a CLASSIC script, so it is a
  // LEXICAL global and `window.API` is permanently undefined: this always took the
  // fallback and silently bypassed API.get's error-envelope handling (R-F464) and
  // 401 logout. Renamed from `API` because a `const API = typeof API ...` would
  // reference the binding being declared and throw (temporal dead zone) — the
  // guard on the line above already uses the correct `typeof` idiom.
  const newsApi = (typeof API !== 'undefined' && API.get)
    ? API
    : { get: (url) => fetch(url, { headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('crucix_token') || '') } }).then(r => r.json()) };
  let allArticles = [];
  // R-F3518 — set from the response's own `filtered_server_side`, never assumed.
  // If this page is ever served against an aria-intel that predates R-F3517 the
  // flag is absent, and the browser filter below is used as a stated fallback
  // rather than the page silently rendering an unfiltered list as if filtered.
  let serverFiltered = false;
  let lastStats = null;
  let activeCategory = 'all';

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function timeAgo(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    if (isNaN(d.getTime())) return ts;
    const now = Date.now();
    const diff = now - d.getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    return days + 'd ago';
  }

  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    if (isNaN(d.getTime())) return ts;
    return d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  // R-F3518 — the list and the breakdown used to answer different questions.
  // This page fetched the newest 100 articles and filtered THOSE in the browser,
  // while "Coverage by Category" beside it was computed server-side over the full
  // retained corpus (1,000). Both numbers were true of different populations, so
  // a category whose articles were older than the newest 100 rendered
  // "No articles yet" next to a bar saying that category had plenty.
  //
  // The filter is now applied server-side (R-F3517) over the SAME population the
  // breakdown aggregates, so the two panels can no longer contradict each other.
  function renderArticles(articles) {
    const container = document.getElementById('articles-list');
    const filtered = serverFiltered
      ? articles
      : (activeCategory === 'all' ? articles : articles.filter(a => a.category === activeCategory));

    // What the corpus holds for this category, per the same aggregate the
    // breakdown renders. Showing "12 of 87" is honest about the page limit;
    // showing a bare "12" invited the reader to believe that was the total.
    const byCat = (lastStats && lastStats.by_category) || {};
    const known = activeCategory === 'all'
      ? Object.values(byCat).reduce((a, b) => a + b, 0)
      : Number(byCat[activeCategory] || 0);
    document.getElementById('article-count').textContent =
      (known && known > filtered.length) ? (filtered.length + ' of ' + known) : filtered.length;

    if (!filtered.length) {
      // An empty CATEGORY is not an empty CORPUS. Telling the operator to "Poll
      // Now" when the corpus is full and only this filter is empty is a false
      // instruction — polling would not change the result.
      container.innerHTML = (activeCategory !== 'all' && known === 0)
        ? '<div class="empty-state"><i class="bi bi-funnel"></i><p>No articles in <strong>' +
          escapeHtml(activeCategory.replace(/_/g, ' ')) + '</strong>. Other categories may have coverage: select <strong>All</strong>.</p></div>'
        : (activeCategory !== 'all')
          ? '<div class="empty-state"><i class="bi bi-exclamation-triangle"></i><p>The corpus reports <strong>' + known +
            '</strong> article(s) in this category but none could be listed. This is a server-side inconsistency, not an empty category. Please report it.</p></div>'
          : '<div class="empty-state"><i class="bi bi-inbox"></i><p>No articles yet. Click <strong>Poll Now</strong> to fetch the latest news, or wait for the hourly poll.</p></div>';
      return;
    }

    container.innerHTML = filtered.map(a => {
      const cat = a.category || 'unknown';
      const catLabel = cat.replace(/_/g, ' ');
      const catClass = cat.includes('defence') ? 'sc-pill-green' : cat.includes('finance') ? 'sc-pill-orange' : cat.includes('regional') ? 'sc-pill-blue' : 'sc-pill-info';
      return '<div class="article-card">' +
        '<div class="article-title"><a href="' + escapeHtml(safeHref(a.url || '#')) + '" target="_blank" rel="noopener">' + escapeHtml(a.title || 'Untitled') + '</a></div>' +
        '<div class="article-meta">' +
          '<span class="source">' + escapeHtml(a.source || '') + '</span>' +
          '<span class="sc-pill ' + catClass + '">' + escapeHtml(catLabel) + '</span>' +
          (a.language && a.language !== 'en' ? '<span>' + escapeHtml(a.language.toUpperCase()) + '</span>' : '') +
        '</div>' +
        (a.summary ? '<div class="article-summary">' + escapeHtml(a.summary.slice(0, 300)) + '</div>' : '') +
        '<div class="article-time">' + formatTime(a.detected_at || a.published) + ' (' + timeAgo(a.detected_at || a.published) + ')</div>' +
      '</div>';
    }).join('');
  }

  function renderCategoryBreakdown(stats) {
    const container = document.getElementById('category-breakdown');
    if (!stats || !stats.by_category) {
      container.innerHTML = '<div style="color:#6b6862;font-size:0.85em">No data yet.</div>';
      return;
    }
    const cats = stats.by_category;
    const total = Object.values(cats).reduce((a, b) => a + b, 0);
    if (!total) {
      container.innerHTML = '<div style="color:#6b6862;font-size:0.85em">No articles yet.</div>';
      return;
    }
    container.innerHTML = Object.entries(cats)
      .sort((a, b) => b[1] - a[1])
      .map(([cat, count]) => {
        const pct = ((count / total) * 100).toFixed(1);
        const label = cat.replace(/_/g, ' ');
        return '<div style="display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid #e9e6df">' +
          '<div style="flex:1;font-size:0.85em;color:#1f1e1c;text-transform:capitalize">' + escapeHtml(label) + '</div>' +
          '<div style="width:120px;height:6px;background:#e9e6df;border-radius:3px;overflow:hidden">' +
            '<div style="height:100%;width:' + pct + '%;background:#7c3aed;border-radius:3px;transition:width 0.3s"></div>' +
          '</div>' +
          '<div style="font-size:0.8em;color:#6b6862;min-width:40px;text-align:right">' + count + '</div>' +
        '</div>';
      }).join('');
  }

  // R-F3671 — the buttons and the "Coverage by Category" panel below them were
  // built from two DIFFERENT populations: this list came from `stats.categories`
  // (the CONFIGURED feeds) while the breakdown came from `stats.by_category`
  // (the RETAINED CORPUS). Live 2026-08-04 that rendered 9 buttons over 7 bars,
  // and two of them — "cyber security" and "security" — could not return a
  // single article however many times they were clicked.
  //
  // An empty configured category is NOT hidden: that it has gone dark is the
  // useful fact. It is rendered DISABLED with its count, so the page states the
  // coverage gap instead of offering a filter that silently answers nothing.
  function renderCategoryFilters(stats) {
    const container = document.getElementById('category-filter');
    if (!stats || !stats.categories) return;
    const byCat = stats.by_category || {};
    // Union: everything configured (so dark coverage stays visible) plus
    // anything the corpus holds that is not configured (so no retained article
    // is unreachable). Older servers send neither new field — the union then
    // degrades to exactly the previous list rather than throwing.
    const configured = stats.categories || [];
    const present = stats.categories_with_articles || Object.keys(byCat).filter(c => byCat[c]);
    const cats = ['all', ...Array.from(new Set([...configured, ...present])).sort()];

    container.innerHTML = cats.map(c => {
      const label = c === 'all' ? 'All' : c.replace(/_/g, ' ');
      const active = c === activeCategory ? ' active' : '';
      if (c === 'all') {
        return '<button class="category-btn' + active + '" data-category="all">All</button>';
      }
      const n = Number(byCat[c] || 0);
      if (!n) {
        // Configured, retained nothing. Say so; do not offer it as a filter.
        return '<button class="category-btn category-btn-empty" disabled data-category="' + escapeHtml(c) + '"' +
          ' title="No articles retained in this category. Its feeds are quarantined or publish less often than the retention window. Nothing to filter.">' +
          escapeHtml(label) + ' <span style="opacity:0.7">0</span></button>';
      }
      return '<button class="category-btn' + active + '" data-category="' + escapeHtml(c) + '">' +
        escapeHtml(label) + ' <span style="opacity:0.6">' + n + '</span></button>';
    }).join('');

    container.querySelectorAll('.category-btn:not([disabled])').forEach(btn => {
      btn.addEventListener('click', () => {
        container.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.category;
        // R-F3518 — re-QUERY rather than re-filter the page already in memory.
        // Re-filtering could only ever find articles inside the newest 100.
        loadArticles();
      });
    });
  }

  function updateKPI(stats, articles) {
    // The server deliberately retains a bounded rolling corpus. Calling this a
    // growing "Recent Articles" total made every new item invisible once the list
    // reached its 1,000-row cap. Show the retained count and surface the current
    // poll's new-item count separately.
    const recentTrue = (stats && typeof stats.recent_articles === 'number') ? stats.recent_articles : (articles ? articles.length : null);
    document.getElementById('kpi-total').textContent = recentTrue == null ? '-' : recentTrue;
    const retentionLimit = stats && Number(stats.retention_limit);
    document.getElementById('kpi-total-label').textContent =
      retentionLimit && recentTrue >= retentionLimit ? 'Retained Articles (cap)' : 'Retained Articles';
    // R-F3674 — this tile counted CONFIGURED feeds and read as live coverage.
    // Five of the 45 delivered nothing when this was measured and the page named
    // none of them. Same treatment as the Categories tile beside it: report
    // delivering-of-configured, and name the dark ones in the tooltip.
    const srcEl = document.getElementById('kpi-sources');
    const sh = stats && stats.source_health;
    if (sh && sh.measured) {
      srcEl.textContent = sh.dark > 0 ? (sh.delivering + ' of ' + sh.configured) : String(sh.configured);
      const parts = [];
      if (sh.failing && sh.failing.length) parts.push('Failing: ' + sh.failing.join(', '));
      if (sh.quarantined && sh.quarantined.length) parts.push('Quarantined: ' + sh.quarantined.join(', '));
      if (sh.silent && sh.silent.length) parts.push('Fetched but empty: ' + sh.silent.join(', '));
      srcEl.title = parts.length ? parts.join(' · ') : 'Every source delivered on the last poll.';
    } else {
      // Not measured is NOT healthy — say so rather than showing a clean count.
      srcEl.textContent = stats ? stats.total_sources : '-';
      srcEl.title = stats ? 'Configured sources. Live delivery not yet measured; no poll results recorded.' : '';
    }
    // R-F3671 — this tile counted CONFIGURED categories and was read as coverage:
    // it showed "9" while the corpus held articles in only 7. Show both, so the
    // gap between what ARIA is configured to watch and what it actually retained
    // is visible on the tile rather than only discoverable by clicking a dead
    // filter button.
    const catsEl = document.getElementById('kpi-categories');
    if (!stats || !stats.categories) {
      catsEl.textContent = '-';
      catsEl.removeAttribute('title');
    } else {
      const byCat = stats.by_category || {};
      const configured = stats.categories.length;
      const covered = (stats.categories_with_articles
        || Object.keys(byCat).filter(c => byCat[c])).length;
      catsEl.textContent = covered < configured ? (covered + ' of ' + configured) : String(configured);
      const empty = stats.empty_categories || [];
      catsEl.title = empty.length
        ? 'No articles retained for: ' + empty.map(c => c.replace(/_/g, ' ')).join(', ')
        : 'Every configured category has retained articles.';
    }
    const poll = stats && stats.poll_state;
    document.getElementById('kpi-last-poll').textContent =
      poll && typeof poll.articles_new === 'number' ? poll.articles_new + ' new' : 'Waiting…';
    // R-F3674 — the banner asserts "Live intelligence from N ... sources". N was
    // the configured count, so it kept claiming feeds that delivered nothing.
    document.getElementById('source-count').textContent =
      (sh && sh.measured) ? sh.delivering : (stats ? stats.total_sources : '—');
  }

  // R-F3518 — one place that fetches articles for the ACTIVE category, used both
  // by the initial load and by every filter click.
  async function loadArticles() {
    const q = '/api/aria/news/recent?limit=100' +
      (activeCategory && activeCategory !== 'all'
        ? '&category=' + encodeURIComponent(activeCategory) : '');
    const res = await newsApi.get(q);
    allArticles = (res && res.articles) || [];
    serverFiltered = !!(res && res.filtered_server_side);
    renderArticles(allArticles);
    return res;
  }

  async function loadData() {
    try {
      const [stats] = await Promise.all([
        newsApi.get('/api/aria/news/stats'),      // R-F2875
        loadArticles(),
      ]);

      lastStats = stats;
      const lastPollAt = stats && stats.poll_state && stats.poll_state.last_poll_at;
      document.getElementById('last-updated').textContent =
        lastPollAt ? 'Last poll ' + formatTime(lastPollAt) : 'Poll time unavailable';

      updateKPI(stats, allArticles);
      renderCategoryFilters(stats);
      renderArticles(allArticles);
      renderCategoryBreakdown(stats);
    } catch (err) {
      const banner = document.getElementById('fetch-failure-banner');
      banner.style.display = 'block';
      banner.textContent = 'Failed to load news data: ' + (err.message || 'unknown error') + '. The hourly poll may not have run yet.';
      document.getElementById('articles-list').innerHTML = '<div class="empty-state"><i class="bi bi-cloud-slash"></i><p>Could not load articles. The news monitor may still be initializing. Click <strong>Poll Now</strong> to trigger the first poll.</p></div>';
    }
  }

  async function triggerPoll() {
    const btn = document.getElementById('btn-poll');
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat" style="animation:spin 0.8s linear infinite"></i> Polling…';
    try {
      const result = await fetch('/api/aria/news/poll', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('crucix_token') || ''), 'Content-Type': 'application/json' },
      });
      const data = await result.json();
      btn.innerHTML = '<i class="bi bi-check"></i> ' + (data.articles_new || 0) + ' new';
      setTimeout(() => { btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Poll Now'; btn.disabled = false; }, 2000);
      await loadData();
    } catch (err) {
      btn.innerHTML = '<i class="bi bi-exclamation-triangle"></i> Failed';
      btn.disabled = false;
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    Sidebar.init('news');
    loadData();
    document.getElementById('btn-poll').addEventListener('click', triggerPoll);
    // Auto-refresh every 5 minutes
    setInterval(loadData, 300000);
  });
})();
</script>
</body>
</html>
