<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Monitor | ARIA</title>
  <link rel="icon" type="image/png" href="images/fav-icon/icon.png">
  <link rel="stylesheet" href="css/aria.css?v=15">
  <link rel="stylesheet" href="fonts/bootstrap-icons/font-css.css">
  <style>
    :root { --bg: #faf9f5; --card: #ffffff; --border: #e9e6df; --text: #3d3a34; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
    #app-main { padding: 20px; min-width: 0; overflow-x: hidden; }  /* R-F2052: drop hardcoded 240px margin/max-width — shared aria.css #app-main handles margin + collapse */
    @media (max-width: 1024px) { #app-main { margin-left: 0; max-width: 100vw; } }
    #fetch-failure-banner { display:none; background:#fff7ed; border:1px solid #fed7aa; border-radius:6px; padding:10px 14px; margin-bottom:14px; color:#c2410c; font-size:13px; line-height:1.5; }
    .sc-page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
    .sc-page-title { font-size:1.4em; font-weight:700; color:#1f1e1c; display:flex; align-items:center; gap:10px; }
    .sc-page-title i { color:#7c3aed; }
    .sc-page-sub { color:#6b6862; font-size:0.85em; }
    .sc-grid-4 { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:14px; margin-bottom:20px; }
    .sc-stat { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; display:flex; align-items:center; gap:14px; box-shadow:0 1px 2px rgba(15,23,42,0.04); }
    .sc-stat-icon { width:40px; height:40px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; background:rgba(124,58,237,0.12); color:#7c3aed; flex-shrink:0; }
    .sc-stat-icon.green { background:rgba(22,163,74,0.12); color:#16a34a; }
    .sc-stat-icon.orange { background:rgba(234,88,12,0.12); color:#ea580c; }
    .sc-stat-icon.blue { background:rgba(37,99,235,0.12); color:#2563eb; }
    .sc-stat-value { font-size:1.5em; font-weight:700; color:#1f1e1c; }
    .sc-stat-label { font-size:0.8em; color:#6b6862; margin-top:2px; }
    .sc-card { background:var(--card); border:1px solid var(--border); border-radius:8px; margin-bottom:16px; overflow:hidden; box-shadow:0 1px 2px rgba(15,23,42,0.04); }
    .sc-card-header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); }
    .sc-card-title { font-size:0.9em; font-weight:600; color:#1f1e1c; display:flex; align-items:center; gap:8px; }
    .sc-card-title i { color:#7c3aed; }
    .sc-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:6px; font-size:0.85em; font-weight:600; cursor:pointer; border:none; transition:all 0.15s; }
    .sc-btn-primary { background:#7c3aed; color:#fff; }
    .sc-btn-primary:hover { background:#6d28d9; }
    .sc-btn-sm { padding:5px 12px; font-size:0.8em; }
    .sc-btn-outline { background:#fff; border:1px solid #dcd8cf; color:#6b6862; }
    .sc-btn-outline:hover { border-color:#7c3aed; color:#6d28d9; background:#f1ecfb; }
    .sc-pill { display:inline-block; padding:2px 10px; border-radius:12px; font-size:0.75em; font-weight:600; }
    .sc-pill-info { background:rgba(124,58,237,0.12); color:#6d28d9; border:1px solid rgba(124,58,237,0.25); }
    .sc-pill-green { background:rgba(22,163,74,0.12); color:#15803d; border:1px solid rgba(22,163,74,0.25); }
    .sc-pill-orange { background:rgba(234,88,12,0.12); color:#c2410c; border:1px solid rgba(234,88,12,0.25); }
    .sc-pill-blue { background:rgba(37,99,235,0.12); color:#1d4ed8; border:1px solid rgba(37,99,235,0.25); }
    .sc-table { width:100%; border-collapse:collapse; font-size:0.85em; }
    .sc-table th { text-align:left; padding:10px 14px; border-bottom:1px solid var(--border); color:#6b6862; font-weight:600; font-size:0.8em; text-transform:uppercase; letter-spacing:0.5px; }
    .sc-table td { padding:10px 14px; border-bottom:1px solid #e9e6df; vertical-align:top; }
    .sc-table tr:hover td { background:#f5f4ef; }
    .sc-table .title-cell { max-width:400px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sc-table .title-cell a { color:#2563eb; text-decoration:none; }
    .sc-table .title-cell a:hover { text-decoration:underline; color:#7c3aed; }
    .sc-table .source-cell { color:#6b6862; font-size:0.85em; }
    .sc-table .time-cell { color:#6b6862; font-size:0.8em; white-space:nowrap; }
    .sc-loading-state { padding:40px; text-align:center; color:#6b6862; }
    .sc-spinner { display:inline-block; width:24px; height:24px; border:2px solid var(--border); border-top-color:#7c3aed; border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:8px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .category-filter { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    .category-btn { padding:4px 12px; border-radius:16px; font-size:0.8em; cursor:pointer; border:1px solid #dcd8cf; background:#fff; color:#6b6862; transition:all 0.15s; }
    .category-btn:hover { border-color:#7c3aed; color:#6d28d9; }
    .category-btn.active { background:rgba(124,58,237,0.12); border-color:#7c3aed; color:#6d28d9; }
    .article-card { padding:14px 18px; border-bottom:1px solid #e9e6df; cursor:pointer; transition:background 0.1s; }
    .article-card:hover { background:#f5f4ef; }
    .article-card:last-child { border-bottom:none; }
    .article-title { font-weight:600; color:#1f1e1c; margin-bottom:4px; line-height:1.4; }
    .article-title a { color:#2563eb; text-decoration:none; }
    .article-title a:hover { color:#7c3aed; text-decoration:underline; }
    .article-meta { display:flex; gap:12px; font-size:0.8em; color:#6b6862; flex-wrap:wrap; }
    .article-meta .source { color:#7c3aed; font-weight:600; }
    .article-meta .category { }
    .article-summary { font-size:0.85em; color:#3d3a34; margin-top:6px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .article-time { font-size:0.75em; color:#9b968c; margin-top:4px; }
    .empty-state { padding:60px 20px; text-align:center; color:#6b6862; }
    .empty-state i { font-size:48px; color:#dcd8cf; margin-bottom:16px; display:block; }
    .empty-state p { font-size:0.9em; line-height:1.6; }
  </style>
</head>
<body>
<div id="sidebar-placeholder"></div>
<div id="header-placeholder"></div>

<main id="app-main">
  <div id="fetch-failure-banner" role="alert"></div>

  <div class="sc-page-header">
    <h1 class="sc-page-title"><i class="bi bi-newspaper"></i> News Monitor</h1>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="sc-page-sub" id="last-updated">Loading…</span>
      <button type="button" class="sc-btn sc-btn-primary sc-btn-sm" id="btn-poll">
        <i class="bi bi-arrow-repeat"></i> Poll Now
      </button>
    </div>
  </div>

  <p style="margin:-4px 0 18px;color:#6b6862;font-size:12px;line-height:1.5">
    <i class="bi bi-info-circle"></i> Live news feed from <strong id="source-count">80+</strong> defence, geopolitical, financial, and regional sources. Polled hourly. <a href="/sources.html" style="color:#913BFF">Source Health</a>
  </p>

  <!-- KPI Tiles -->
  <div class="sc-grid-4 mb-24" id="kpi-row">
    <div class="sc-stat"><div class="sc-stat-icon"><i class="bi bi-newspaper"></i></div><div><div class="sc-stat-value" id="kpi-total">-</div><div class="sc-stat-label">Recent Articles</div></div></div>
    <div class="sc-stat"><div class="sc-stat-icon green"><i class="bi bi-globe"></i></div><div><div class="sc-stat-value" id="kpi-sources">-</div><div class="sc-stat-label">Sources</div></div></div>
    <div class="sc-stat"><div class="sc-stat-icon blue"><i class="bi bi-tags"></i></div><div><div class="sc-stat-value" id="kpi-categories">-</div><div class="sc-stat-label">Categories</div></div></div>
    <div class="sc-stat"><div class="sc-stat-icon orange"><i class="bi bi-clock"></i></div><div><div class="sc-stat-value" id="kpi-last-poll">-</div><div class="sc-stat-label">Last Poll</div></div></div>
  </div>

  <!-- Category filter -->
  <div class="category-filter" id="category-filter">
    <button class="category-btn active" data-category="all">All</button>
  </div>

  <!-- Articles list -->
  <div class="sc-card">
    <div class="sc-card-header">
      <div class="sc-card-title"><i class="bi bi-list-ul"></i> Recent Articles</div>
      <span class="sc-pill sc-pill-info" id="article-count">0</span>
    </div>
    <div id="articles-list">
      <div class="sc-loading-state"><div class="sc-spinner"></div>Loading articles…</div>
    </div>
  </div>

  <!-- Category breakdown -->
  <div class="sc-card">
    <div class="sc-card-header">
      <div class="sc-card-title"><i class="bi bi-pie-chart"></i> Coverage by Category</div>
    </div>
    <div id="category-breakdown" style="padding:14px 18px">
      <div class="sc-loading-state"><div class="sc-spinner"></div></div>
    </div>
  </div>
</main>

<script src="js/app.js?v=8"></script>
<script src="js/sidebar.js?v=13"></script>
<script>
(function() {
  if (typeof Auth !== 'undefined' && Auth.requireAuth) Auth.requireAuth();
  const API = window.API || { get: (url) => fetch(url, { headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('crucix_token') || '') } }).then(r => r.json()) };
  let allArticles = [];
  let activeCategory = 'all';

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function timeAgo(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    if (isNaN(d.getTime())) return ts;
    const now = Date.now();
    const diff = now - d.getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    return days + 'd ago';
  }

  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    if (isNaN(d.getTime())) return ts;
    return d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function renderArticles(articles) {
    const container = document.getElementById('articles-list');
    const filtered = activeCategory === 'all' ? articles : articles.filter(a => a.category === activeCategory);

    document.getElementById('article-count').textContent = filtered.length;

    if (!filtered.length) {
      container.innerHTML = '<div class="empty-state"><i class="bi bi-inbox"></i><p>No articles yet. Click <strong>Poll Now</strong> to fetch the latest news, or wait for the hourly poll.</p></div>';
      return;
    }

    container.innerHTML = filtered.map(a => {
      const cat = a.category || 'unknown';
      const catLabel = cat.replace(/_/g, ' ');
      const catClass = cat.includes('defence') ? 'sc-pill-green' : cat.includes('finance') ? 'sc-pill-orange' : cat.includes('regional') ? 'sc-pill-blue' : 'sc-pill-info';
      return '<div class="article-card">' +
        '<div class="article-title"><a href="' + escapeHtml(safeHref(a.url || '#')) + '" target="_blank" rel="noopener">' + escapeHtml(a.title || 'Untitled') + '</a></div>' +
        '<div class="article-meta">' +
          '<span class="source">' + escapeHtml(a.source || '') + '</span>' +
          '<span class="sc-pill ' + catClass + '">' + escapeHtml(catLabel) + '</span>' +
          (a.language && a.language !== 'en' ? '<span>' + escapeHtml(a.language.toUpperCase()) + '</span>' : '') +
        '</div>' +
        (a.summary ? '<div class="article-summary">' + escapeHtml(a.summary.slice(0, 300)) + '</div>' : '') +
        '<div class="article-time">' + formatTime(a.detected_at || a.published) + ' (' + timeAgo(a.detected_at || a.published) + ')</div>' +
      '</div>';
    }).join('');
  }

  function renderCategoryBreakdown(stats) {
    const container = document.getElementById('category-breakdown');
    if (!stats || !stats.by_category) {
      container.innerHTML = '<div style="color:#6b6862;font-size:0.85em">No data yet.</div>';
      return;
    }
    const cats = stats.by_category;
    const total = Object.values(cats).reduce((a, b) => a + b, 0);
    if (!total) {
      container.innerHTML = '<div style="color:#6b6862;font-size:0.85em">No articles yet.</div>';
      return;
    }
    container.innerHTML = Object.entries(cats)
      .sort((a, b) => b[1] - a[1])
      .map(([cat, count]) => {
        const pct = ((count / total) * 100).toFixed(1);
        const label = cat.replace(/_/g, ' ');
        return '<div style="display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid #e9e6df">' +
          '<div style="flex:1;font-size:0.85em;color:#1f1e1c;text-transform:capitalize">' + escapeHtml(label) + '</div>' +
          '<div style="width:120px;height:6px;background:#e9e6df;border-radius:3px;overflow:hidden">' +
            '<div style="height:100%;width:' + pct + '%;background:#7c3aed;border-radius:3px;transition:width 0.3s"></div>' +
          '</div>' +
          '<div style="font-size:0.8em;color:#6b6862;min-width:40px;text-align:right">' + count + '</div>' +
        '</div>';
      }).join('');
  }

  function renderCategoryFilters(stats) {
    const container = document.getElementById('category-filter');
    if (!stats || !stats.categories) return;
    const cats = ['all', ...stats.categories.sort()];
    container.innerHTML = cats.map(c => {
      const label = c === 'all' ? 'All' : c.replace(/_/g, ' ');
      const active = c === activeCategory ? ' active' : '';
      return '<button class="category-btn' + active + '" data-category="' + c + '">' + escapeHtml(label) + '</button>';
    }).join('');

    container.querySelectorAll('.category-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        container.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.category;
        renderArticles(allArticles);
      });
    });
  }

  function updateKPI(stats, articles) {
    // R-F2076 (2026-06-28 audit) — show the TRUE recent count (stats.recent_articles),
    // not the page-capped articles.length. /news/recent?limit=100 caps at 100 while the
    // real recent total is ~328, and the category-breakdown bars below already sum to
    // the real total → the KPI used to contradict its own chart. Fall back to the
    // fetched page length only if stats is unavailable.
    const recentTrue = (stats && typeof stats.recent_articles === 'number') ? stats.recent_articles : (articles ? articles.length : null);
    document.getElementById('kpi-total').textContent = recentTrue == null ? '-' : recentTrue;
    document.getElementById('kpi-sources').textContent = stats ? stats.total_sources : '-';
    document.getElementById('kpi-categories').textContent = stats && stats.categories ? stats.categories.length : '-';
    document.getElementById('kpi-last-poll').textContent = articles && articles.length ? 'Active' : 'Waiting…';
    document.getElementById('source-count').textContent = stats ? stats.total_sources : '80+';
  }

  async function loadData() {
    try {
      const [stats, articles] = await Promise.all([
        API.get('/api/aria/news/stats'),
        API.get('/api/aria/news/recent?limit=100'),
      ]);

      allArticles = (articles && articles.articles) || [];
      document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();

      updateKPI(stats, allArticles);
      renderCategoryFilters(stats);
      renderArticles(allArticles);
      renderCategoryBreakdown(stats);
    } catch (err) {
      const banner = document.getElementById('fetch-failure-banner');
      banner.style.display = 'block';
      banner.textContent = 'Failed to load news data: ' + (err.message || 'unknown error') + '. The hourly poll may not have run yet.';
      document.getElementById('articles-list').innerHTML = '<div class="empty-state"><i class="bi bi-cloud-slash"></i><p>Could not load articles. The news monitor may still be initializing. Click <strong>Poll Now</strong> to trigger the first poll.</p></div>';
    }
  }

  async function triggerPoll() {
    const btn = document.getElementById('btn-poll');
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat" style="animation:spin 0.8s linear infinite"></i> Polling…';
    try {
      const result = await fetch('/api/aria/news/poll', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('crucix_token') || ''), 'Content-Type': 'application/json' },
      });
      const data = await result.json();
      btn.innerHTML = '<i class="bi bi-check"></i> ' + (data.articles_new || 0) + ' new';
      setTimeout(() => { btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Poll Now'; btn.disabled = false; }, 2000);
      await loadData();
    } catch (err) {
      btn.innerHTML = '<i class="bi bi-exclamation-triangle"></i> Failed';
      btn.disabled = false;
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    Sidebar.init('news');
    loadData();
    document.getElementById('btn-poll').addEventListener('click', triggerPoll);
    // Auto-refresh every 5 minutes
    setInterval(loadData, 300000);
  });
})();
</script>
</body>
</html>
