<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARIA Coder — ARKMURUS</title>
  <link rel="icon" type="image/png" href="images/fav-icon/icon.png">
  <link rel="stylesheet" href="css/crucix.css?v=3">
  <link rel="stylesheet" href="fonts/bootstrap-icons/font-css.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background: #0c0919; margin: 0;
      font-family: 'Gordita', system-ui, -apple-system, sans-serif;
      color: rgba(255,255,255,0.85); line-height: 1.65;
      overflow: hidden; height: 100vh;
    }
    #app-main { height: 100vh; display: flex; flex-direction: column; }

    /* ── Top bar ─────────────────────────────────────────────── */
    .coder-topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 20px; background: rgba(0,0,0,0.3);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0; z-index: 10;
    }
    .coder-topbar .logo {
      font-size: 13px; font-weight: 800; color: #fff;
      letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px;
    }
    .coder-topbar .logo i { color: #7c3aed; font-size: 18px; }
    .coder-topbar .status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 6px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
    }
    .coder-topbar .status-badge.idle { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.4); }
    .coder-topbar .status-badge.running { background: rgba(124,58,237,0.15); color: #c4b5fd; }
    .coder-topbar .status-badge.done { background: rgba(34,197,94,0.12); color: #4ade80; }
    .coder-topbar .status-badge.error { background: rgba(239,68,68,0.12); color: #fca5a5; }
    .coder-topbar .spacer { flex: 1; }
    .coder-topbar .top-btn {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7); padding: 6px 12px; border-radius: 7px;
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all .12s;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .coder-topbar .top-btn:hover { border-color: rgba(124,58,237,0.4); color: #fff; }
    .coder-topbar .top-btn.primary {
      background: linear-gradient(135deg, #7c3aed, #2563eb); border: none; color: #fff;
      box-shadow: 0 2px 10px rgba(124,58,237,0.3);
    }
    .coder-topbar .top-btn.primary:hover { box-shadow: 0 4px 16px rgba(124,58,237,0.5); transform: translateY(-1px); }

    /* ── Main split pane ─────────────────────────────────────── */
    .coder-split {
      display: flex; flex: 1; overflow: hidden;
    }
    .coder-left {
      flex: 1; display: flex; flex-direction: column; min-width: 0;
      border-right: 1px solid rgba(255,255,255,0.06);
    }
    .coder-right {
      width: 380px; flex-shrink: 0; display: flex; flex-direction: column;
      background: rgba(0,0,0,0.15); overflow: hidden;
    }

    /* ── Left: file tabs + editor ────────────────────────────── */
    .coder-tabs {
      display: flex; background: rgba(0,0,0,0.2);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      overflow-x: auto; flex-shrink: 0;
    }
    .coder-tabs::-webkit-scrollbar { height: 3px; }
    .coder-tabs::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }
    .coder-tab {
      padding: 8px 16px; font-size: 12px; color: rgba(255,255,255,0.45);
      cursor: pointer; border-right: 1px solid rgba(255,255,255,0.04);
      white-space: nowrap; transition: all .12s; display: flex; align-items: center; gap: 6px;
    }
    .coder-tab:hover { color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.02); }
    .coder-tab.active { color: #fff; background: rgba(124,58,237,0.1); border-bottom: 2px solid #7c3aed; }
    .coder-tab .close {
      opacity: 0; font-size: 10px; cursor: pointer; padding: 2px; border-radius: 3px;
    }
    .coder-tab:hover .close { opacity: 0.5; }
    .coder-tab .close:hover { opacity: 1; background: rgba(255,255,255,0.1); }

    .coder-editor-wrap {
      flex: 1; display: flex; position: relative; overflow: hidden;
    }
    .coder-editor {
      width: 100%; height: 100%; border: none; outline: none; resize: none;
      background: #0a0718; color: rgba(255,255,255,0.85);
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 13px; line-height: 1.6; padding: 20px;
      tab-size: 2;
    }
    .coder-editor::placeholder { color: rgba(255,255,255,0.15); }

    .coder-editor-line-numbers {
      position: absolute; left: 0; top: 0; bottom: 0; width: 48px;
      padding: 20px 8px; text-align: right; overflow: hidden;
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 13px; line-height: 1.6; color: rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.2); user-select: none; pointer-events: none;
    }

    /* ── Right: directives + output ──────────────────────────── */
    .coder-panel {
      padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .coder-panel:last-child { border-bottom: none; flex: 1; overflow-y: auto; }

    .coder-panel-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.2px; color: rgba(255,255,255,0.35);
      margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
    }

    .coder-directive {
      padding: 10px 12px; margin-bottom: 6px;
      background: rgba(124,58,237,0.06); border: 1px solid rgba(124,58,237,0.12);
      border-radius: 8px; font-size: 12.5px; line-height: 1.5;
      cursor: pointer; transition: all .12s;
    }
    .coder-directive:hover { border-color: rgba(124,58,237,0.3); background: rgba(124,58,237,0.1); }
    .coder-directive .dir-head {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;
    }
    .coder-directive .dir-label {
      font-weight: 600; color: #c4b5fd; font-size: 11px;
    }
    .coder-directive .dir-status {
      font-size: 10px; padding: 2px 6px; border-radius: 4px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px;
    }
    .coder-directive .dir-status.pending { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.35); }
    .coder-directive .dir-status.active { background: rgba(124,58,237,0.15); color: #c4b5fd; }
    .coder-directive .dir-status.done { background: rgba(34,197,94,0.1); color: #4ade80; }
    .coder-directive .dir-status.failed { background: rgba(239,68,68,0.1); color: #fca5a5; }
    .coder-directive .dir-text { color: rgba(255,255,255,0.7); font-size: 12px; }

    .coder-directive-input {
      display: flex; gap: 6px; margin-top: 8px;
    }
    .coder-directive-input input {
      flex: 1; padding: 8px 10px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.3); color: #fff; font-size: 12.5px; font-family: inherit; outline: none;
    }
    .coder-directive-input input:focus { border-color: rgba(124,58,237,0.4); }
    .coder-directive-input button {
      padding: 8px 12px; border-radius: 7px; border: none;
      background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }

    /* ── Output log ──────────────────────────────────────────── */
    .coder-log {
      font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
      font-size: 11.5px; line-height: 1.6; color: rgba(255,255,255,0.5);
    }
    .coder-log .line { padding: 1px 0; word-break: break-all; }
    .coder-log .line.info { color: rgba(255,255,255,0.5); }
    .coder-log .line.success { color: #4ade80; }
    .coder-log .line.warn { color: #fbbf24; }
    .coder-log .line.error { color: #fca5a5; }
    .coder-log .line.cmd { color: #60a5fa; }
    .coder-log .line.timestamp { color: rgba(255,255,255,0.2); font-size: 10px; }

    /* ── File browser ────────────────────────────────────────── */
    .coder-files {
      max-height: 200px; overflow-y: auto; font-size: 12px;
    }
    .coder-files::-webkit-scrollbar { width: 4px; }
    .coder-files::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }
    .coder-file {
      padding: 5px 8px; cursor: pointer; border-radius: 4px;
      color: rgba(255,255,255,0.55); display: flex; align-items: center; gap: 6px;
      transition: all .1s;
    }
    .coder-file:hover { background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.8); }
    .coder-file i { font-size: 13px; width: 16px; text-align: center; }
    .coder-file .py { color: #60a5fa; }
    .coder-file .html { color: #f97316; }
    .coder-file .js { color: #fbbf24; }
    .coder-file .md { color: #4ade80; }
    .coder-file .cfg { color: rgba(255,255,255,0.3); }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 860px) {
      .coder-split { flex-direction: column; }
      .coder-right { width: 100%; max-height: 40vh; }
    }
  </style>
</head>
<body>
<div id="sidebar-placeholder"></div>
<main id="app-main">

  <!-- Top bar -->
  <div class="coder-topbar">
    <div class="logo"><i class="bi bi-code-slash"></i> ARIA Coder</div>
    <span class="status-badge idle" id="coder-status"><i class="bi bi-circle"></i> Idle</span>
    <div class="spacer"></div>
    <button class="top-btn" id="btn-files" title="Browse project files"><i class="bi bi-folder"></i> Files</button>
    <button class="top-btn" id="btn-tests" title="Run tests"><i class="bi bi-check2-square"></i> Tests</button>
    <button class="top-btn" id="btn-deploy" title="Deploy"><i class="bi bi-rocket-takeoff"></i> Deploy</button>
    <button class="top-btn primary" id="btn-execute" title="Execute current directive"><i class="bi bi-play-fill"></i> Execute</button>
  </div>

  <!-- Split pane -->
  <div class="coder-split">

    <!-- Left: editor -->
    <div class="coder-left">
      <div class="coder-tabs" id="coder-tabs">
        <div class="coder-tab active" data-file="welcome">
          <i class="bi bi-file-text"></i> welcome.md
        </div>
      </div>
      <div class="coder-editor-wrap">
        <div class="coder-editor-line-numbers" id="line-numbers">1</div>
        <textarea class="coder-editor" id="coder-editor" spellcheck="false"
          placeholder="// Code appears here. Select a file or write a directive to get started."></textarea>
      </div>
    </div>

    <!-- Right: panels -->
    <div class="coder-right">

      <!-- Directives panel -->
      <div class="coder-panel">
        <div class="coder-panel-title"><i class="bi bi-chat-quote"></i> Directives</div>
        <div id="directives-list">
          <div class="coder-directive" data-dir-id="1">
            <div class="dir-head">
              <span class="dir-label"><i class="bi bi-lightning"></i> Quick actions</span>
            </div>
            <div class="dir-text" style="color:rgba(255,255,255,0.45);font-size:11.5px">
              Click a directive below or type your own.
            </div>
          </div>
        </div>
        <div class="coder-directive-input">
          <input id="directive-input" placeholder="Type a coding directive…" autofocus>
          <button id="directive-send"><i class="bi bi-send"></i></button>
        </div>
      </div>

      <!-- Quick directives -->
      <div class="coder-panel" style="padding-top:0">
        <div style="display:flex;flex-wrap:wrap;gap:4px">
          <button class="top-btn quick-dir" style="font-size:11px;padding:4px 8px" data-dir="Fix the bug in the current file">Fix bug</button>
          <button class="top-btn quick-dir" style="font-size:11px;padding:4px 8px" data-dir="Add type hints and docstrings">Add types</button>
          <button class="top-btn quick-dir" style="font-size:11px;padding:4px 8px" data-dir="Write a capability test for this function">Add test</button>
          <button class="top-btn quick-dir" style="font-size:11px;padding:4px 8px" data-dir="Review this file for bugs">Review</button>
          <button class="top-btn quick-dir" style="font-size:11px;padding:4px 8px" data-dir="Refactor this module for clarity">Refactor</button>
          <button class="top-btn quick-dir" style="font-size:11px;padding:4px 8px" data-dir="Run tests and fix failures">Fix tests</button>
        </div>
      </div>

      <!-- Output log -->
      <div class="coder-panel" style="flex:1;overflow-y:auto">
        <div class="coder-panel-title"><i class="bi bi-terminal"></i> Output</div>
        <div class="coder-log" id="coder-log">
          <div class="line info">ARIA Coder ready. Select a file or type a directive to begin.</div>
        </div>
      </div>

    </div>
  </div>

</main>

<script src="js/app.js?v=3"></script>
<script>
Auth.requireAuth();

// ── State ────────────────────────────────────────────────────────────────
const state = {
  currentFile: 'welcome',
  files: {
    'welcome': `# ARIA Coder Interface

Welcome to the ARIA Coder. This is your direct interface to ARIA's autonomous coding engine.

## How to use

1. **Type a directive** in the input box on the right (e.g. "Fix the bug in dd_orchestrator.py")
2. **Click Execute** or press Enter to send it
3. **Watch the output** as ARIA works through the task
4. **Review the changes** in the editor before deploying

## Quick directives

Click any quick-action button to jump-start a common task:
- Fix bug — diagnose and fix a bug in the current file
- Add types — add type hints and docstrings
- Add test — write a capability test
- Review — review the current file for issues
- Refactor — restructure for clarity
- Fix tests — run tests and fix any failures

## API endpoints

This interface talks to ARIA's self-coding API:
- POST /api/aria/self/code — execute a coding directive
- POST /api/aria/self/read — read a file
- GET /api/aria/self/files — list project files
- GET /api/aria/self/staged — view staged improvements
- POST /api/aria/self/deploy/{id} — deploy a staged improvement
`,
  },
  directives: [],
  log: [],
};

// ── DOM refs ─────────────────────────────────────────────────────────────
const editor = document.getElementById('coder-editor');
const lineNumbers = document.getElementById('line-numbers');
const tabs = document.getElementById('coder-tabs');
const log = document.getElementById('coder-log');
const statusBadge = document.getElementById('coder-status');
const directiveInput = document.getElementById('directive-input');
const directiveSend = document.getElementById('directive-send');
const executeBtn = document.getElementById('btn-execute');
const directivesList = document.getElementById('directives-list');

// ── Editor: line numbers ─────────────────────────────────────────────────
function updateLineNumbers() {
  const lines = editor.value.split('\n').length;
  lineNumbers.textContent = Array.from({length: lines}, (_, i) => i + 1).join('\n');
}

editor.addEventListener('input', updateLineNumbers);
editor.addEventListener('scroll', () => {
  lineNumbers.scrollTop = editor.scrollTop;
});

// ── Editor: load file ────────────────────────────────────────────────────
function loadFile(filename) {
  state.currentFile = filename;
  const content = state.files[filename] || '// File not loaded yet. Fetching from server...';
  editor.value = content;
  updateLineNumbers();

  // Update tabs
  tabs.querySelectorAll('.coder-tab').forEach(t => t.classList.remove('active'));
  let tab = tabs.querySelector(`[data-file="${filename}"]`);
  if (!tab) {
    tab = document.createElement('div');
    tab.className = 'coder-tab active';
    tab.dataset.file = filename;
    const icon = filename.endsWith('.py') ? 'bi-filetype-py' :
                 filename.endsWith('.html') ? 'bi-filetype-html' :
                 filename.endsWith('.js') ? 'bi-filetype-js' : 'bi-file-text';
    tab.innerHTML = '<i class="' + icon + '"></i> ' + filename +
      '<span class="close" onclick="closeFile(\'' + filename + '\')">&times;</span>';
    tabs.insertBefore(tab, tabs.lastElementChild);
  } else {
    tab.classList.add('active');
  }

  addLog('info', 'Loaded file: ' + filename);
}

function closeFile(filename) {
  if (filename === 'welcome') return;
  delete state.files[filename];
  const tab = tabs.querySelector(`[data-file="${filename}"]`);
  if (tab) tab.remove();
  if (state.currentFile === filename) {
    loadFile('welcome');
  }
}

// ── Tab switching ────────────────────────────────────────────────────────
tabs.addEventListener('click', (e) => {
  const tab = e.target.closest('.coder-tab');
  if (!tab || tab.classList.contains('active')) return;
  loadFile(tab.dataset.file);
});

// ── Logging ──────────────────────────────────────────────────────────────
function addLog(level, message) {
  const time = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  line.className = 'line ' + level;
  line.innerHTML = '<span class="timestamp">[' + time + ']</span> ' + escapeHtml(message);
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
  state.log.push({level, message, time});
}

function setStatus(status, label) {
  statusBadge.className = 'status-badge ' + status;
  statusBadge.innerHTML = '<i class="bi bi-circle"></i> ' + label;
}

// ── Directives ───────────────────────────────────────────────────────────
function addDirective(text, status) {
  const id = Date.now();
  const div = document.createElement('div');
  div.className = 'coder-directive';
  div.dataset.dirId = id;
  div.innerHTML =
    '<div class="dir-head">' +
      '<span class="dir-label"><i class="bi bi-lightning"></i> Directive</span>' +
      '<span class="dir-status ' + (status || 'pending') + '">' + (status || 'pending') + '</span>' +
    '</div>' +
    '<div class="dir-text">' + escapeHtml(text) + '</div>';
  directivesList.insertBefore(div, directivesList.firstChild);
  state.directives.push({id, text, status: status || 'pending'});
  return id;
}

function updateDirectiveStatus(id, status) {
  const div = directivesList.querySelector(`[data-dir-id="${id}"]`);
  if (div) {
    const statusEl = div.querySelector('.dir-status');
    statusEl.className = 'dir-status ' + status;
    statusEl.textContent = status;
  }
  const dir = state.directives.find(d => d.id === id);
  if (dir) dir.status = status;
}

// ── Execute directive ────────────────────────────────────────────────────
async function executeDirective(text) {
  if (!text || !text.trim()) return;

  const dirId = addDirective(text, 'active');
  setStatus('running', 'Running');
  addLog('cmd', '> ' + text);

  try {
    const r = await authed('/api/aria/self/code', {
      method: 'POST',
      body: JSON.stringify({ directive: text.trim(), file: state.currentFile }),
    });

    if (!r.ok) {
      const errData = await r.json().catch(() => ({}));
      addLog('error', 'Request failed (HTTP ' + r.status + '): ' + (errData.detail || errData.error || r.statusText));
      updateDirectiveStatus(dirId, 'failed');
      setStatus('error', 'Failed');
      return;
    }

    const data = await r.json();
    addLog('success', 'Directive completed: ' + (data.summary || 'OK'));

    // If the response includes code changes, update the editor
    if (data.code && data.file) {
      state.files[data.file] = data.code;
      if (data.file === state.currentFile) {
        editor.value = data.code;
        updateLineNumbers();
      }
      addLog('info', 'Updated file: ' + data.file);
    }

    // Show any test results
    if (data.test_results) {
      for (const tr of (data.test_results || [])) {
        addLog(tr.passed ? 'success' : 'error', 'Test: ' + (tr.name || '?') + ' — ' + (tr.passed ? 'PASS' : 'FAIL'));
      }
    }

    updateDirectiveStatus(dirId, 'done');
    setStatus('done', 'Completed');

  } catch (err) {
    addLog('error', 'Error: ' + err.message);
    updateDirectiveStatus(dirId, 'failed');
    setStatus('error', 'Error');
  }
}

// ── Event handlers ───────────────────────────────────────────────────────
directiveSend.addEventListener('click', () => {
  const text = directiveInput.value.trim();
  if (text) {
    executeDirective(text);
    directiveInput.value = '';
  }
});

directiveInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const text = directiveInput.value.trim();
    if (text) {
      executeDirective(text);
      directiveInput.value = '';
    }
  }
});

executeBtn.addEventListener('click', () => {
  const text = directiveInput.value.trim();
  if (text) {
    executeDirective(text);
    directiveInput.value = '';
  }
});

// Quick directives
document.querySelectorAll('.quick-dir').forEach(btn => {
  btn.addEventListener('click', () => {
    executeDirective(btn.dataset.dir);
  });
});

// File browser
document.getElementById('btn-files').addEventListener('click', async () => {
  addLog('info', 'Fetching file list...');
  try {
    const r = await authed('/api/aria/self/files');
    if (!r.ok) {
      addLog('warn', 'File list unavailable (HTTP ' + r.status + ')');
      return;
    }
    const data = await r.json();
    const files = data.files || data || [];
    if (Array.isArray(files)) {
      addLog('success', 'Found ' + files.length + ' files');
      // Load the first few files
      for (const f of files.slice(0, 5)) {
        if (!state.files[f]) {
          state.files[f] = '// ' + f + '\n// (not yet loaded)';
        }
        // Add tab
        if (!tabs.querySelector(`[data-file="${f}"]`)) {
          const tab = document.createElement('div');
          tab.className = 'coder-tab';
          tab.dataset.file = f;
          const icon = f.endsWith('.py') ? 'bi-filetype-py' :
                       f.endsWith('.html') ? 'bi-filetype-html' :
                       f.endsWith('.js') ? 'bi-filetype-js' : 'bi-file-text';
          tab.innerHTML = '<i class="' + icon + '"></i> ' + f.split('/').pop();
          tabs.insertBefore(tab, tabs.lastElementChild);
        }
      }
    }
  } catch (err) {
    addLog('error', 'File list error: ' + err.message);
  }
});

// Test runner
document.getElementById('btn-tests').addEventListener('click', async () => {
  addLog('cmd', '> Running tests...');
  setStatus('running', 'Testing');
  try {
    const r = await authed('/api/aria/self/code', {
      method: 'POST',
      body: JSON.stringify({ directive: 'Run tests for the current file', file: state.currentFile, action: 'test' }),
    });
    if (r.ok) {
      const data = await r.json();
      for (const tr of (data.test_results || [])) {
        addLog(tr.passed ? 'success' : 'error', 'Test: ' + (tr.name || '?') + ' — ' + (tr.passed ? 'PASS' : 'FAIL'));
      }
      setStatus('done', 'Tests complete');
    } else {
      addLog('error', 'Test run failed (HTTP ' + r.status + ')');
      setStatus('error', 'Tests failed');
    }
  } catch (err) {
    addLog('error', 'Test error: ' + err.message);
    setStatus('error', 'Error');
  }
});

// Deploy
document.getElementById('btn-deploy').addEventListener('click', async () => {
  if (!confirm('Deploy staged improvements to production?')) return;
  addLog('cmd', '> Deploying...');
  setStatus('running', 'Deploying');
  try {
    const r = await authed('/api/aria/self/staged');
    if (!r.ok) {
      addLog('warn', 'No staged improvements found');
      setStatus('idle', 'Idle');
      return;
    }
    const data = await r.json();
    const improvements = data.improvements || data.staged || [];
    if (!improvements.length) {
      addLog('warn', 'No staged improvements to deploy');
      setStatus('idle', 'Idle');
      return;
    }
    for (const imp of improvements.slice(0, 3)) {
      const id = imp.id || imp.improvement_id;
      if (id) {
        const dr = await authed('/api/aria/self/deploy/' + encodeURIComponent(id), { method: 'POST' });
        addLog(dr.ok ? 'success' : 'error', 'Deploy ' + id + ': ' + (dr.ok ? 'OK' : 'HTTP ' + dr.status));
      }
    }
    setStatus('done', 'Deployed');
  } catch (err) {
    addLog('error', 'Deploy error: ' + err.message);
    setStatus('error', 'Error');
  }
});

// ── Helpers ──────────────────────────────────────────────────────────────
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── Init ─────────────────────────────────────────────────────────────────
updateLineNumbers();
addLog('info', 'ARIA Coder initialized. Select a file or type a directive.');
</script>
