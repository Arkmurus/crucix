<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opportunities | ARIA</title>
  <link rel="icon" type="image/png" href="images/fav-icon/icon.png">
  
  <link rel="stylesheet" href="css/aria.css?v=15">
  <link rel="stylesheet" href="fonts/bootstrap-icons/font-css.css">
</head>
<body>
<div id="sidebar-placeholder"></div>
<div id="header-placeholder"></div>
<main id="app-main">
  <div class="sc-page-header">
    <h1 class="sc-page-title"><i class="bi bi-briefcase"></i> Procurement Opportunities</h1>
    <p class="sc-page-sub">Scored market opportunities ranked by procurement potential</p>
  </div>

  <div id="opps-loading" class="sc-loading-state"><div class="sc-spinner"></div>Loading opportunities…</div>

  <div id="opps-content" style="display:none">
    <div id="opps-grid" class="sc-grid-3"></div>
  </div>
</main>
<script src="js/app.js?v=10"></script>
<script src="js/sidebar.js?v=13"></script>
<script>
Auth.requireAuth();
Sidebar.init('opportunities');

async function load() {
  const data = await API.get('/api/opportunities');
  document.getElementById('opps-loading').style.display = 'none';
  document.getElementById('opps-content').style.display = '';
  // R-F2619: API.get returns null on failure (401/timeout/5xx/error-envelope)
  // and a real (possibly empty) payload on success. Distinguish the two —
  // rendering "No opportunities available" on a load failure is the §22
  // empty-vs-error lie (looks like an honest empty state; it's a broken fetch).
  if (data === null) {
    document.getElementById('opps-grid').innerHTML = '<p class="text-muted">Couldn\'t load opportunities. The page is up but live data is unavailable. Retry shortly.</p>';
    return;
  }
  const opps = data?.opportunities || (Array.isArray(data) ? data : []);
  if (!opps.length) {
    document.getElementById('opps-grid').innerHTML = '<p class="text-muted">No opportunities available yet. Opportunities are generated from procurement + conflict + dev-finance signal convergence during sweeps.</p>';
    return;
  }
  document.getElementById('opps-grid').innerHTML = opps.map(o => {
    const compliance = o.complianceStatus === 'CLEAR' ? 'sc-badge-green' : 'sc-badge-red';
    const tierStr = (o.tier || '').toUpperCase();
    const tierCls = tierStr === 'HIGH' ? 'sc-badge-prime' : tierStr === 'MEDIUM' ? 'sc-badge-blue' : 'sc-badge-muted';
    const note = o.notes || o.summary || '';
    return `<div class="sc-card">
      <div class="sc-card-header">
        <div class="sc-card-title" style="font-size:15px">
          ${o.lusophone?'<i class="bi bi-flag"></i>':''} ${escHtml(o.market)}
        </div>
        <span class="sc-badge ${escHtml(tierCls)}">Tier ${escHtml(tierStr||'-')}</span>
      </div>
      <div class="sc-card-body">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
          <div style="font-size:36px;font-weight:800;color:#7c3aed">${escHtml(o.score||0)}</div>
          <div style="font-size:11px;color:#9b968c">/ 100<br>Score</div>
        </div>
        ${o.conflict?`<div style="font-size:12px;color:#3d3a34;margin-bottom:8px">
          <i class="bi bi-exclamation-triangle" style="color:#ea580c"></i>
          ${escHtml(o.conflict.events||0)} conflict events · ${escHtml(o.conflict.fatalities||0)} fatalities
        </div>`:''}
        ${(o.procurementNeeds||[]).length?`<div style="margin-bottom:10px">
          ${o.procurementNeeds.slice(0,4).map(n=>`<span class="sc-badge sc-badge-muted" style="margin:2px">${escHtml(n)}</span>`).join('')}
        </div>`:''}
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="sc-badge ${escHtml(compliance)}">${escHtml(o.complianceStatus||'-')}</span>
          ${o.devFinanceActivity?`<span class="sc-badge sc-badge-blue" style="font-size:11px">Dev Finance</span>`:''}
          ${o.explorerSignals>0?`<span class="sc-badge sc-badge-muted" style="font-size:11px">${escHtml(o.explorerSignals)} intel signal${escHtml(o.explorerSignals!==1?'s':'')}</span>`:''}
        </div>
        ${note?`<p style="font-size:12px;color:#3d3a34;margin-top:12px;line-height:1.6;border-top:1px solid #e9e6df;padding-top:10px">${escHtml(truncate(note,180))}</p>`:''}
        ${(o.sources||[]).length?`<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">
          ${o.sources.slice(0,3).map(s=>s.url?`<a href="${escHtml(safeHref(s.url))}" target="_blank" rel="noopener" style="font-size:11px;color:#7c3aed;text-decoration:none" title="${escHtml(s.title||'')}"><i class="bi bi-box-arrow-up-right"></i> ${escHtml(s.type||'source')}</a>`:'').join('')}
        </div>`:''}
      </div>
    </div>`;
  }).join('');
}
load();
</script>
</body>
</html>
