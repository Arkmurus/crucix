<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DD Reports — ARKMURUS</title>
  <link rel="icon" type="image/png" href="images/fav-icon/icon.png">
  <link rel="stylesheet" href="css/crucix.css?v=3">
  <link rel="stylesheet" href="fonts/bootstrap-icons/font-css.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #0c0919; margin: 0; font-family: 'Gordita', system-ui, -apple-system, sans-serif; color: rgba(255,255,255,0.85); line-height: 1.65; }
    .dd-shell { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }
    .dd-eyebrow { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: rgba(124,58,237,0.85); font-weight: 700; margin-bottom: 8px; }
    .dd-title { font-size: 28px; font-weight: 800; color: #fff; margin: 0 0 22px; letter-spacing: -0.02em; }

    .dd-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 22px; }
    .dd-search {
      flex: 1; min-width: 240px; padding: 10px 14px; border-radius: 9px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: #fff; font-size: 14px; font-family: inherit; outline: none;
    }
    .dd-search:focus { border-color: rgba(124,58,237,0.4); }
    .dd-new-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 16px; border-radius: 9px; border: none;
      background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;
      box-shadow: 0 2px 12px rgba(124,58,237,0.35);
    }
    .dd-new-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 18px rgba(124,58,237,0.5); }

    .dd-empty {
      padding: 48px 24px; text-align: center; color: rgba(255,255,255,0.4); font-size: 14px;
      background: rgba(255,255,255,0.02); border: 1px dashed rgba(255,255,255,0.08); border-radius: 12px;
    }
    .dd-empty i { font-size: 28px; display: block; margin-bottom: 10px; color: rgba(124,58,237,0.5); }

    .dd-table {
      width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; overflow: hidden;
    }
    .dd-table thead th {
      text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 700;
      color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px;
      background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .dd-table td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13.5px; vertical-align: top; }
    .dd-row { cursor: pointer; transition: background .12s; }
    .dd-row:hover { background: rgba(124,58,237,0.06); }
    .dd-row.expanded { background: rgba(124,58,237,0.08); }
    .dd-row td.col-entity { font-weight: 600; color: #fff; }
    .dd-row td.col-meta { color: rgba(255,255,255,0.5); font-size: 12.5px; }

    .dd-pill {
      display: inline-block; padding: 2px 8px; border-radius: 5px;
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
    }
    .dd-pill.hard_stop { background: rgba(239,68,68,0.18); color: #fca5a5; }
    .dd-pill.high { background: rgba(245,158,11,0.18); color: #fbbf24; }
    .dd-pill.medium { background: rgba(0,102,255,0.18); color: #60a5fa; }
    .dd-pill.low { background: rgba(34,197,94,0.18); color: #4ade80; }
    .dd-pill.clean { background: rgba(34,197,94,0.13); color: #4ade80; }
    .dd-pill.unknown { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.45); }

    .dd-detail-row td { padding: 0; background: #14102a; }
    .dd-detail {
      padding: 22px 28px; border-top: 1px solid rgba(124,58,237,0.18);
      border-bottom: 1px solid rgba(124,58,237,0.18);
    }
    .dd-detail-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    .dd-act-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 13px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.75);
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s;
    }
    .dd-act-btn:hover { color: #fff; border-color: rgba(124,58,237,0.4); }
    .dd-act-btn.primary { background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff; border-color: transparent; }

    /* ─── DD Pipeline Tools (audit 2026-05-09) ─────────────────────── */
    .dd-pipeline {
      margin-top: 36px; padding: 22px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06); border-radius: 14px;
    }
    .dd-pipeline-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 18px; gap: 12px;
    }
    .dd-pipeline-toggle {
      background: transparent; border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.6); width: 32px; height: 32px;
      border-radius: 7px; cursor: pointer; transition: all .15s;
    }
    .dd-pipeline-toggle:hover { color: #fff; border-color: rgba(124,58,237,0.4); }
    .dd-pipeline-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px;
    }
    .dd-pipeline-grid.collapsed { display: none; }
    .dd-tool {
      background: rgba(0,0,0,0.18); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 11px; padding: 14px 14px 12px; transition: all .15s;
      display: flex; flex-direction: column;
    }
    .dd-tool:hover { border-color: rgba(124,58,237,0.32); }
    .dd-tool-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
    .dd-tool-icon {
      width: 32px; height: 32px; flex-shrink: 0;
      border-radius: 7px; background: rgba(124,58,237,0.16);
      display: flex; align-items: center; justify-content: center;
      color: #c4b5fd; font-size: 15px;
    }
    .dd-tool-name { font-weight: 600; font-size: 13px; color: #fff; line-height: 1.25; }
    .dd-tool-rfn { font-size: 10.5px; color: rgba(255,255,255,0.35); margin-top: 2px; }
    .dd-tool-desc { font-size: 12px; color: rgba(255,255,255,0.55); line-height: 1.5; margin-bottom: 10px; }
    .dd-tool-form { display: flex; flex-direction: column; gap: 6px; }
    .dd-tool-form input, .dd-tool-form textarea {
      background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.08);
      color: #fff; padding: 7px 10px; border-radius: 6px;
      font-size: 12px; font-family: inherit; outline: none;
      transition: border-color .15s;
    }
    .dd-tool-form textarea {
      min-height: 56px; resize: vertical;
      font-family: 'Cascadia Code', Consolas, 'SF Mono', monospace; font-size: 11.5px;
    }
    .dd-tool-form input:focus, .dd-tool-form textarea:focus {
      border-color: rgba(124,58,237,0.5);
    }
    .dd-tool-run {
      align-self: flex-end; margin-top: 4px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none; color: #fff; font-size: 11.5px; font-weight: 600;
      padding: 6px 14px; border-radius: 6px; cursor: pointer;
    }
    .dd-tool-run:disabled { opacity: 0.5; cursor: wait; }
    .dd-tool-output {
      margin-top: 10px; padding: 9px 10px;
      background: rgba(0,0,0,0.3); border-radius: 6px;
      font-family: 'Cascadia Code', Consolas, 'SF Mono', monospace;
      font-size: 11px; color: rgba(255,255,255,0.85); line-height: 1.55;
      max-height: 280px; overflow-y: auto;
      white-space: pre-wrap; word-break: break-word;
    }
    .dd-tool-output:empty { display: none; }
    .dd-tool-output.error { color: #fca5a5; background: rgba(239,68,68,0.08); }

    .dd-md {
      font-size: 13.5px; line-height: 1.7; color: rgba(255,255,255,0.78);
      max-height: 60vh; overflow-y: auto; padding-right: 8px;
    }
    .dd-md::-webkit-scrollbar { width: 5px; }
    .dd-md::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 3px; }
    .dd-md h1 { font-size: 19px; color: #fff; margin: 16px 0 8px; }
    .dd-md h2 { font-size: 16px; color: #e9e3ff; margin: 14px 0 6px; }
    .dd-md h3 { font-size: 13px; color: #c4b5fd; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    .dd-md ul, .dd-md ol { padding-left: 22px; margin: 6px 0; }
    .dd-md li { margin: 3px 0; }
    .dd-md strong { color: #e9e3ff; }
    .dd-md code { background: rgba(124,58,237,0.12); border: 1px solid rgba(124,58,237,0.18); padding: 1px 5px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 12px; color: #c4b5fd; }
    .dd-md p { margin: 0 0 8px; }
    .dd-md blockquote { border-left: 3px solid rgba(124,58,237,0.35); padding: 4px 14px; color: rgba(255,255,255,0.6); font-style: italic; margin: 8px 0; }

    .dd-loading { padding: 36px; text-align: center; color: rgba(255,255,255,0.4); font-size: 13px; }

    @media (max-width: 720px) {
      .dd-table thead { display: none; }
      .dd-table, .dd-table tbody, .dd-table tr, .dd-table td { display: block; }
      .dd-table tr { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
      .dd-table td { padding: 3px 0; border: none; }
      .dd-detail-row td { padding: 0; }
      .dd-detail { padding: 18px 16px; }
    }
  </style>
</head>
<body>
<div id="sidebar-placeholder"></div>
<div id="header-placeholder"></div>

<main id="app-main">
  <div class="dd-shell">

    <div class="dd-eyebrow">Due diligence</div>
    <h1 class="dd-title">DD reports library</h1>

    <div class="dd-toolbar">
      <input class="dd-search" id="dd-search" placeholder="Search by entity name…" type="search">
      <button class="dd-new-btn" id="dd-new-btn"><i class="bi bi-plus-lg"></i> New DD</button>
    </div>

    <div id="dd-content">
      <div class="dd-loading">Loading reports…</div>
    </div>

    <!-- ──────────────────────────────────────────────────────────────────
         DD Pipeline Tools (added 2026-05-09 by Web/UI audit)
         Surfaces the 12 deterministic DD primitives shipped today
         (R-F68/F70/F71/F72/F73/F74/F75/F76/F77/F78/F80/F84). Each tool
         is one click — open the card, fill the small form, see the
         structured output. Designed to drop directly into a DD report.
         ────────────────────────────────────────────────────────────── -->
    <div class="dd-pipeline" id="dd-pipeline">
      <div class="dd-pipeline-head">
        <div>
          <div class="dd-eyebrow" style="margin-bottom:4px">Pipeline</div>
          <h2 style="font-size:18px;font-weight:700;color:#fff;margin:0">
            DD Pipeline Tools
            <span style="font-weight:400;color:rgba(255,255,255,0.4);font-size:13px;margin-left:8px">
              · 12 deterministic primitives, paste-ready output
            </span>
          </h2>
        </div>
        <button class="dd-pipeline-toggle" id="dd-pipeline-toggle"
                aria-expanded="true" aria-controls="dd-pipeline-grid"
                title="Collapse / expand">
          <i class="bi bi-chevron-up"></i>
        </button>
      </div>
      <div class="dd-pipeline-grid" id="dd-pipeline-grid"></div>
    </div>

  </div>
</main>

<script src="js/app.js?v=3"></script>
<script src="js/sidebar.js?v=3"></script>
<script>
Auth.requireAuth();
Sidebar.init('dd-reports');

// ── Markdown renderer (lifted from aria.html) ──
function mdRender(text) {
  if (!text) return '';
  const escMap = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
  let s = String(text).replace(/[&<>"']/g, c => escMap[c]);
  s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  s = s.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`(.+?)`/g, '<code>$1</code>');
  s = s.replace(/((?:^[-•] .+\n?)+)/gm, function(block) {
    const items = block.trim().split('\n').map(l => '<li>' + l.replace(/^[-•] /, '') + '</li>').join('');
    return '<ul>' + items + '</ul>';
  });
  s = s.replace(/((?:^\d+\. .+\n?)+)/gm, function(block) {
    const items = block.trim().split('\n').map(l => '<li>' + l.replace(/^\d+\. /, '') + '</li>').join('');
    return '<ol>' + items + '</ol>';
  });
  s = s.replace(/\n{2,}/g, '</p><p>');
  s = s.replace(/\n/g, '<br>');
  s = '<p>' + s + '</p>';
  s = s.replace(/<p><(h[1-3]|ul|ol)/g, '<$1');
  s = s.replace(/<\/(h[1-3]|ul|ol)><\/p>/g, '</$1>');
  s = s.replace(/<p><\/p>/g, '');
  return s;
}

const authed = (url, opts = {}) => fetch(url, {
  ...opts,
  headers: {
    ...(opts.headers || {}),
    'Authorization': 'Bearer ' + (localStorage.getItem('crucix_token') || ''),
    ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
  },
});

let _allReports = [];
let _expandedRow = null;

function fmtDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
}

function severityPill(sev) {
  if (!sev) return '<span class="dd-pill unknown">—</span>';
  const cls = (sev || '').toLowerCase().replace(/[^a-z_]/g, '');
  return '<span class="dd-pill ' + cls + '">' + sev.replace(/_/g, ' ') + '</span>';
}

function escAttr(s) { return String(s == null ? '' : s).replace(/"/g, '&quot;'); }
function escText(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderTable(reports) {
  const content = document.getElementById('dd-content');
  if (!reports.length) {
    content.innerHTML = '<div class="dd-empty"><i class="bi bi-folder2-open"></i>No DD reports yet. Click "New DD" to start one — or run a DD via the chat (e.g. "screen Acme Defence GmbH from Germany").</div>';
    return;
  }
  let html = '<table class="dd-table"><thead><tr><th>Entity</th><th>Severity</th><th>Run ID</th><th>Created</th></tr></thead><tbody>';
  for (const r of reports) {
    // R-F130 (2026-05-10): the /dd/reports index stores `risk` not
    // `severity` — the column was always rendering "—" because the
    // first three keys were never populated. Read `risk` last so old
    // entries surface their classification (GREEN / AMBER / RED /
    // HARD_STOP) until they expire.
    const sev = r.severity || r.worst_severity || r.status || r.risk || r.risk_classification || '';
    // R-F144 (2026-05-10): generated_at fallback. Existing index
    // entries from before R-F130 only have `generated_at`, not
    // `created_at` — the table was leaving the Created column empty
    // for the two real DDs (TARA Aerospace + Assan Group). Reader
    // fallback to generated_at surfaces those dates immediately.
    const created = r.created_at || r.generated_at || r.timestamp || '';
    html += '<tr class="dd-row" data-run-id="' + escAttr(r.run_id) + '">' +
      '<td class="col-entity">' + escText(r.entity_name || '(unknown)') +
        (r.jurisdiction ? ' <span style="color:rgba(255,255,255,0.4);font-weight:400">· ' + escText(r.jurisdiction) + '</span>' : '') +
      '</td>' +
      '<td>' + severityPill(sev) + '</td>' +
      '<td class="col-meta"><code style="font-size:11.5px">' + escText((r.run_id || '').slice(0, 14)) + '</code></td>' +
      '<td class="col-meta">' + fmtDate(created) + '</td>' +
    '</tr>';
  }
  html += '</tbody></table>';
  content.innerHTML = html;
  content.querySelectorAll('.dd-row').forEach(row => {
    row.addEventListener('click', () => toggleDetail(row, row.dataset.runId));
  });
}

async function toggleDetail(row, runId) {
  // Collapse previously open
  if (_expandedRow && _expandedRow !== row) {
    _expandedRow.classList.remove('expanded');
    const next = _expandedRow.nextElementSibling;
    if (next && next.classList.contains('dd-detail-row')) next.remove();
    _expandedRow = null;
  }
  if (row.classList.contains('expanded')) {
    row.classList.remove('expanded');
    const next = row.nextElementSibling;
    if (next && next.classList.contains('dd-detail-row')) next.remove();
    _expandedRow = null;
    return;
  }
  row.classList.add('expanded');
  _expandedRow = row;
  const detailRow = document.createElement('tr');
  detailRow.className = 'dd-detail-row';
  detailRow.innerHTML = '<td colspan="4"><div class="dd-detail"><div class="dd-loading">Loading report…</div></div></td>';
  row.parentNode.insertBefore(detailRow, row.nextSibling);

  try {
    const resp = await authed('/api/aria/dd/report/' + encodeURIComponent(runId) + '?format=markdown');
    if (!resp.ok) {
      detailRow.querySelector('.dd-detail').innerHTML = '<div class="dd-loading">Failed to load (HTTP ' + resp.status + ')</div>';
      return;
    }
    const data = await resp.json();
    const md = data.markdown || (data.report && data.report.markdown) || JSON.stringify(data, null, 2).slice(0, 4000);
    const entityName = (row.querySelector('.col-entity').textContent || '').trim().split(' · ')[0];
    detailRow.querySelector('.dd-detail').innerHTML =
      '<div class="dd-detail-actions">' +
        '<button class="dd-act-btn primary" data-action="rerun" data-entity="' + escAttr(entityName) + '">' +
          '<i class="bi bi-arrow-clockwise"></i> Re-run DD</button>' +
        '<a class="dd-act-btn" href="/aria.html" title="Discuss this report in chat">' +
          '<i class="bi bi-chat-dots"></i> Discuss in chat</a>' +
        '<button class="dd-act-btn" data-action="copy">' +
          '<i class="bi bi-clipboard"></i> Copy markdown</button>' +
      '</div>' +
      '<div class="dd-md">' + mdRender(md) + '</div>';

    detailRow.querySelector('[data-action="copy"]').addEventListener('click', () => {
      navigator.clipboard.writeText(md).then(() => {
        const btn = detailRow.querySelector('[data-action="copy"]');
        const orig = btn.innerHTML;
        btn.innerHTML = '<i class="bi bi-check2"></i> Copied';
        setTimeout(() => { btn.innerHTML = orig; }, 1500);
      });
    });
    detailRow.querySelector('[data-action="rerun"]').addEventListener('click', async (e) => {
      const b = e.currentTarget;
      const orig = b.innerHTML;
      b.disabled = true;
      b.innerHTML = '<i class="bi bi-hourglass-split"></i> Running…';
      try {
        const r = await authed('/api/aria/dd/orchestrate', {
          method: 'POST',
          body: JSON.stringify({ name: entityName, mode: 'standard' }),
        });
        if (!r.ok) {
          alert('Re-run failed (HTTP ' + r.status + '). Check logs.');
        } else {
          await loadReports();
        }
      } catch (err) {
        alert('Re-run error: ' + err.message);
      }
      b.disabled = false; b.innerHTML = orig;
    });
  } catch (err) {
    detailRow.querySelector('.dd-detail').innerHTML = '<div class="dd-loading">Network error: ' + escText(err.message) + '</div>';
  }
}

async function loadReports() {
  const content = document.getElementById('dd-content');
  content.innerHTML = '<div class="dd-loading">Loading reports…</div>';
  try {
    const resp = await authed('/api/aria/dd/reports?limit=100');
    if (!resp.ok) {
      content.innerHTML = '<div class="dd-empty"><i class="bi bi-exclamation-triangle"></i>Failed to load reports (HTTP ' + resp.status + ').</div>';
      return;
    }
    const data = await resp.json();
    _allReports = data.reports || [];
    applySearch();
  } catch (err) {
    content.innerHTML = '<div class="dd-empty"><i class="bi bi-wifi-off"></i>Network error: ' + escText(err.message) + '</div>';
  }
}

function applySearch() {
  const q = (document.getElementById('dd-search').value || '').trim().toLowerCase();
  const filtered = q
    ? _allReports.filter(r => (r.entity_name || '').toLowerCase().includes(q))
    : _allReports;
  renderTable(filtered);
}

document.getElementById('dd-search').addEventListener('input', applySearch);

document.getElementById('dd-new-btn').addEventListener('click', () => {
  const entity = prompt('Entity name to screen (company or person):');
  if (!entity || !entity.trim()) return;
  const jurisdiction = prompt('Jurisdiction (optional, e.g. "Germany"):') || '';
  const btn = document.getElementById('dd-new-btn');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Running…';
  authed('/api/aria/dd/orchestrate', {
    method: 'POST',
    body: JSON.stringify({ name: entity.trim(), jurisdiction: jurisdiction.trim() || undefined, mode: 'standard' }),
  }).then(async r => {
    btn.disabled = false; btn.innerHTML = orig;
    if (!r.ok) { alert('DD failed (HTTP ' + r.status + ')'); return; }
    await loadReports();
  }).catch(err => {
    btn.disabled = false; btn.innerHTML = orig;
    alert('DD error: ' + err.message);
  });
});

loadReports();

// ────────────────────────────────────────────────────────────────────
// DD Pipeline Tools — surfaces the 12 deterministic primitives shipped
// in this session. Each tool config: {id, name, icon, desc, fields[],
// endpoint, method, transform(fields)→body, render(response)→html}.
// ────────────────────────────────────────────────────────────────────
(function() {
  'use strict';
  const TOKEN = localStorage.getItem('crucix_token') || '';
  const HEADERS = {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + TOKEN,
  };

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
    );
  }

  // Renderers — each returns HTML for the output panel.
  function renderJson(obj) {
    return escapeHtml(JSON.stringify(obj, null, 2));
  }
  function renderNarrative(obj, extra) {
    const narrative = obj.narrative || obj.error || '(no narrative)';
    let out = '<div style="color:#c4b5fd;margin-bottom:6px;font-weight:600">' + escapeHtml(narrative) + '</div>';

  }

  const TOOLS = [

      fields: [{key: 'address', label: 'Wallet address', placeholder: '0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb1', required: true}],
      endpoint: function(f) { return '/api/aria/crypto/screen?address=' + encodeURIComponent(f.address); },
      method: 'GET',
      render: function(r) {
        const matched = r.matched ? 'YES — ' + (r.matches || []).length + ' match(es)' : 'no match';
        return '<div style="color:#c4b5fd;margin-bottom:6px;font-weight:600">Chain: ' + escapeHtml(r.chain || '?') + '</div>' +

    {
      id: 'forensic-benford',
      name: "Benford's Law",
      rfn: 'R-F70',
      icon: 'bi-bar-chart',
      desc: 'Forensic-accounting flag for fabricated financial figures. Min 50 values, ≥10× span.',
      fields: [{key: 'values', label: 'Values (comma or newline separated)', placeholder: '1234, 5678, 9012, 3456 ...', textarea: true, required: true}],
      endpoint: function() { return '/api/aria/forensic/benford'; },

      endpoint: function() { return '/api/aria/citations/verify'; },

    {

      endpoint: function(f) { return '/api/aria/security/counter-intel/scan?entity=' + encodeURIComponent(f.entity); },
      method: 'GET',
      render: function(r) {
        const score = r.composite_score == null ? '—' : r.composite_score;
        return renderNarrative(r, '<div style="margin-top:6px"><b>Composite:</b> ' + score + '</div>');
      },
    },
    {
      id: 'provenance-lineage',
      name: 'Provenance Lineage',
      rfn: 'R-F75',
      icon: 'bi-diagram-2',

      fields: [{key: 'node_id', label: 'Node ID', placeholder: 'FACT-12345', required: true}],
      endpoint: function(f) { return '/api/aria/provenance/lineage?node_id=' + encodeURIComponent(f.node_id); },
      method: 'GET',
      render: function(r) {
        const inv = r.invalidated ? '<span style="color:#fca5a5">⚠ INVALIDATED</span>' : 'valid';
        return '<div style="color:#c4b5fd;margin-bottom:6px;font-weight:600">Status: ' + inv + '</div>' +
               '<div><b>Lineage edges:</b> ' + ((r.lineage || []).length) + '</div>';

    {
      id: 'prompt-injection',

      desc: 'Grade a chat response against an OWASP LLM01 attack ID. Useful for retrospective audit.',
      fields: [
        {key: 'attack_id', label: 'Attack ID', placeholder: 'PI-CONTEXT-LEAK', required: true},

      ],
      endpoint: function() { return '/api/aria/security/prompt-injection/grade'; },

      render: function(r) {
        return '<div style="color:#c4b5fd;margin-bottom:6px;font-weight:600">' + escapeHtml(r.verdict || r.error || '—') + '</div>' +
               '<div><b>Refusal hits:</b> ' + ((r.refusal_markers_hit || []).length) +
               ', <b>Leak hits:</b> ' + ((r.leak_markers_hit || []).length) + '</div>';

    },
    {
      id: 'tier-router',
      name: 'Tier Router',
      rfn: 'R-F87a',
      icon: 'bi-diagram-3-fill',
      desc: 'Diagnostic — explain which LLM tier each intent maps to.',
      fields: [{key: 'intent', label: 'Intent', placeholder: 'student_quiz', required: true}],
      endpoint: function(f) { return '/api/aria/llm/tier-router/explain?intent=' + encodeURIComponent(f.intent); },
      method: 'GET',
      render: function(r) {
        return '<div style="color:#c4b5fd;margin-bottom:6px;font-weight:600">' +
               escapeHtml(r.intent || '—') + ' → ' + escapeHtml(r.chosen_provider || '—') + '</div>' +
               '<div><b>Preferred tier:</b> ' + escapeHtml(r.preferred_tier || '—') +
               (r.degraded ? ' <span style="color:#fbbf24">(degraded)</span>' : '') + '</div>';
      },

  ];

  function renderTool(tool) {
    const fieldsHtml = tool.fields.map(function(f) {
      const tag = f.textarea ? 'textarea' : 'input';
      const type = f.type || 'text';
      const attrs = [
        'id="tool-' + tool.id + '-' + f.key + '"',
        'placeholder="' + escapeHtml(f.placeholder || '') + '"',
        f.required ? 'required' : '',
        f.textarea ? '' : 'type="' + type + '"',
      ].filter(Boolean).join(' ');
      const closing = f.textarea ? ('</textarea>') : '';
      return '<label style="font-size:10.5px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.5px">' +
             escapeHtml(f.label) + '</label>' +
             '<' + tag + ' ' + attrs + (f.textarea ? '>' : '/>') + closing;
    }).join('');
    return (
      '<div class="dd-tool" data-tool="' + tool.id + '">' +
        '<div class="dd-tool-head">' +
          '<div class="dd-tool-icon"><i class="bi ' + tool.icon + '"></i></div>' +
          '<div>' +
            '<div class="dd-tool-name">' + escapeHtml(tool.name) + '</div>' +
            '<div class="dd-tool-rfn">' + escapeHtml(tool.rfn) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="dd-tool-desc">' + escapeHtml(tool.desc) + '</div>' +
        '<div class="dd-tool-form">' + fieldsHtml +
          '<button class="dd-tool-run" data-tool="' + tool.id + '">Run</button>' +
        '</div>' +
        '<div class="dd-tool-output" id="tool-' + tool.id + '-output"></div>' +
      '</div>'
    );
  }

  async function runTool(tool) {
    const fieldVals = {};
    for (const f of tool.fields) {
      const el = document.getElementById('tool-' + tool.id + '-' + f.key);
      if (!el) continue;
      fieldVals[f.key] = el.value;
      if (f.required && !el.value.trim()) {
        showOutput(tool, '⚠ ' + f.label + ' required', true);
        return;
      }
    }
    const outEl = document.getElementById('tool-' + tool.id + '-output');
    const btn = document.querySelector('.dd-tool-run[data-tool="' + tool.id + '"]');
    btn.disabled = true; btn.textContent = 'Running…';
    outEl.classList.remove('error');
    outEl.innerHTML = '<span style="color:rgba(255,255,255,0.5)">Running…</span>';

    try {
      let url = tool.endpoint(fieldVals);
      let opts = { method: tool.method || 'GET', headers: HEADERS };
      if (tool.method === 'POST') {
        opts.body = JSON.stringify(tool.transform ? tool.transform(fieldVals) : fieldVals);
      }
      const resp = await fetch(url, opts);
      const data = await resp.json().catch(function() { return null; });
      if (!resp.ok || !data) {
        showOutput(tool, '✗ HTTP ' + resp.status + (data && data.error ? ': ' + data.error : ''), true);
        return;
      }
      outEl.innerHTML = tool.render(data);
    } catch (err) {
      showOutput(tool, '✗ ' + err.message, true);
    } finally {
      btn.disabled = false; btn.textContent = 'Run';
    }
  }

  function showOutput(tool, text, isError) {
    const outEl = document.getElementById('tool-' + tool.id + '-output');
    outEl.textContent = text;
    if (isError) outEl.classList.add('error');
    else outEl.classList.remove('error');
  }

  // Render the grid
  const grid = document.getElementById('dd-pipeline-grid');
  if (grid) {
    grid.innerHTML = TOOLS.map(renderTool).join('');
    grid.addEventListener('click', function(e) {
      const btn = e.target.closest('.dd-tool-run');
      if (!btn) return;
      const id = btn.getAttribute('data-tool');
      const tool = TOOLS.find(function(t) { return t.id === id; });
      if (tool) runTool(tool);
    });

    // R-F115 (2026-05-09): URL-param-driven prefill from the Explorer
    // suggested-actions rail. /dd-reports.html?tool=<id>&entity=<name>
    // scrolls to the matching tool, prefills its primary entity-shaped
    // field, and (if the tool has a single required string field with
    // no need for structured input) auto-runs it.
    try {
      const params = new URLSearchParams(window.location.search);
      const toolId = params.get('tool');
      const entity = params.get('entity');
      if (toolId && entity) {
        const tool = TOOLS.find(t => t.id === toolId);
        const card = grid.querySelector(`[data-tool="${toolId}"]`);
        if (tool && card) {
          // Find the first text-shaped (non-textarea, non-numeric) field
          // and prefill it with the entity name. Skip if the tool's
          // primary field is JSON / numeric — those need structured input.
          const firstField = tool.fields.find(f =>
            !f.textarea && f.type !== 'number' && f.key !== 'profile'
          );
          if (firstField) {
            const input = document.getElementById('tool-' + toolId + '-' + firstField.key);
            if (input) input.value = entity;
          }
          // Smooth-scroll into view
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.style.outline = '2px solid rgba(124,58,237,0.5)';
          card.style.outlineOffset = '4px';
          setTimeout(() => {
            card.style.outline = '';
            card.style.outlineOffset = '';
          }, 2500);
          // Auto-run only when prefill was sufficient (string field
          // populated, no JSON / numeric blanks left)
          const hasOpenRequiredField = tool.fields.some(f =>
            f.required && (f.textarea || f.type === 'number' || f.key === 'profile')
            && !document.getElementById('tool-' + toolId + '-' + f.key)?.value
          );
          if (firstField && !hasOpenRequiredField) {
            setTimeout(() => runTool(tool), 600);
          }
        }
      } else if (entity && !toolId) {
        // ?entity= alone — just scroll into the pipeline section
        document.getElementById('dd-pipeline').scrollIntoView({ behavior: 'smooth' });
      }
    } catch (err) {
      console.warn('[dd-pipeline] prefill from URL params failed:', err);
    }
  }

  // Collapse / expand
  const toggleBtn = document.getElementById('dd-pipeline-toggle');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', function() {
      grid.classList.toggle('collapsed');
      toggleBtn.setAttribute('aria-expanded', !grid.classList.contains('collapsed'));
      toggleBtn.querySelector('i').className = grid.classList.contains('collapsed')
        ? 'bi bi-chevron-down' : 'bi bi-chevron-up';
    });
  }
})();
</script>
