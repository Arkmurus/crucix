<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Your Password | ARIA</title>
  <link rel="icon" type="image/png" href="images/fav-icon/icon.png">
  <link rel="stylesheet" href="css/aria.css?v=15">
  <style>
    .sp-wrap{max-width:440px;margin:0 auto;padding:56px 20px}
    .sp-card{background:var(--sc-bg,#fff);border:1px solid var(--sc-border,#e2e0d8);
      border-radius:12px;padding:28px}
    .sp-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;
      font-size:13px;color:var(--sc-muted,#666)}
    .sp-input{padding:10px 12px;border:1px solid var(--sc-border,#d5d8de);border-radius:7px;
      font-size:15px;background:var(--sc-bg,#fff);color:var(--sc-text,#111);width:100%;box-sizing:border-box}
    .sp-msg{margin-top:14px;font-size:13px;line-height:1.6}
  </style>
</head>
<body>
<!-- R-F3332 — deliberately STANDALONE: no sidebar, no shared shell, and it calls
     exactly two endpoints (GET /api/auth/me, PUT /api/auth/password), both on the
     rotation allowlist in lib/auth/passwordRotation.mjs.

     A locked account is refused on every other API, so sending it to account.html
     would have produced a page whose shell 403s on load and bounces straight back
     here. That is the R-F3311 shape (a page whose shared chrome calls an endpoint
     the visitor cannot reach) and this page exists precisely to not repeat it. -->
<main class="sp-wrap">
  <div class="sp-card">
    <h1 style="font-size:20px;margin:0 0 8px">Set your password</h1>
    <p style="font-size:14px;color:var(--sc-muted,#666);line-height:1.65;margin:0 0 22px">
      You signed in with a temporary password that was issued to you. Choose your own
      before you continue. Nobody else will know this one.
    </p>

    <label class="sp-field">Temporary password
      <input id="sp-current" class="sp-input" type="password" autocomplete="current-password">
    </label>
    <label class="sp-field">New password
      <input id="sp-new" class="sp-input" type="password" autocomplete="new-password" placeholder="At least 8 characters">
    </label>
    <label class="sp-field">Confirm new password
      <input id="sp-confirm" class="sp-input" type="password" autocomplete="new-password">
    </label>

    <button id="sp-save" class="sc-btn sc-btn-primary" style="width:100%;padding:11px">Save and continue</button>
    <div id="sp-msg" class="sp-msg"></div>
  </div>
</main>
<script src="js/app.js?v=10"></script>
<script>
if (!Auth.isLoggedIn()) window.location.href = '/signin.html';

function msg(text, ok){
  var el = document.getElementById('sp-msg');
  el.style.color = ok ? '#2e7d32' : '#c62828';
  el.textContent = text;
}

document.getElementById('sp-save').addEventListener('click', async function(){
  var btn = this;
  var current = document.getElementById('sp-current').value;
  var next = document.getElementById('sp-new').value;
  var confirm = document.getElementById('sp-confirm').value;

  if (!current || !next) { msg('Enter your temporary password and a new one.'); return; }
  if (next.length < 8) { msg('The new password must be at least 8 characters.'); return; }
  if (next !== confirm) { msg('The two new passwords do not match.'); return; }
  if (next === current) { msg('Choose a password different from the temporary one.'); return; }

  btn.disabled = true; msg('Saving…', true);
  var res = await API.put('/api/auth/password', { currentPassword: current, newPassword: next });
  if (res.ok) {
    // R-F3835 — the server now bumps tokenVersion on a password change, so every
    // session minted with the OLD password is dead, INCLUDING the token this page
    // is holding. Adopt the replacement it returns, or the navigation to
    // /dashboard.html below lands on /signin.html instead.
    if (res.data && res.data.token) {
      try { localStorage.setItem('crucix_token', res.data.token); } catch (e) {}
    }
    // The cached user carries mustChangePassword from login. Leaving it would
    // bounce this user back here on the next page load even though the server
    // has cleared the flag.
    localStorage.removeItem('crucix_user');
    Auth.user = null;
    msg('Saved. Taking you to your dashboard…', true);
    setTimeout(function(){ window.location.href = '/dashboard.html'; }, 700);
  } else {
    btn.disabled = false;
    msg((res.data && (res.data.error || res.data.detail)) || 'Could not set the password. Try again.');
  }
});
</script>
</body>
</html>
