<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watchlist | ARIA</title>
  <link rel="icon" type="image/png" href="images/fav-icon/icon.png">
  <link rel="stylesheet" href="css/aria.css?v=15">
  <link rel="stylesheet" href="fonts/bootstrap-icons/font-css.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: var(--sc-bg); margin: 0; font-family: 'Gordita', system-ui, -apple-system, sans-serif; color: var(--sc-text); line-height: 1.65; }
    .wl-shell { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }
    .wl-eyebrow { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--sc-prime); font-weight: 700; margin-bottom: 8px; }
    .wl-title { font-size: 28px; font-weight: 800; color: var(--sc-heading); margin: 0 0 22px; letter-spacing: -0.02em; }

    .wl-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 22px; }
    .wl-search {
      flex: 1; min-width: 240px; padding: 10px 14px; border-radius: 9px;
      background: #fff; border: 1px solid var(--sc-border-strong);
      color: var(--sc-heading); font-size: 14px; font-family: inherit; outline: none;
    }
    .wl-search:focus { border-color: var(--sc-prime); box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }
    .wl-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 16px; border-radius: 9px; border: none;
      background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;
      box-shadow: 0 2px 12px rgba(124,58,237,0.25);
    }
    .wl-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 18px rgba(124,58,237,0.35); }
    .wl-btn.sec {
      background: #fff; border: 1px solid var(--sc-border-strong);
      box-shadow: none; color: var(--sc-text);
    }
    .wl-btn.sec:hover { border-color: var(--sc-prime); color: var(--sc-prime-dark); background: var(--sc-prime-soft); }
    .wl-btn.danger { background: linear-gradient(135deg, #dc2626, #b91c1c); box-shadow: 0 2px 12px rgba(220,38,38,0.25); }

    .wl-table {
      width: 100%; border-collapse: collapse; background: #fff;
      border: 1px solid var(--sc-border); border-radius: 12px; overflow: hidden;
    }
    .wl-table thead th {
      text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 700;
      color: var(--sc-muted); text-transform: uppercase; letter-spacing: 1px;
      background: #f5f4ef; border-bottom: 1px solid var(--sc-border-strong);
    }
    .wl-table td { padding: 12px 14px; border-bottom: 1px solid var(--sc-border); font-size: 13.5px; vertical-align: middle; }
    .wl-row:hover { background: var(--sc-prime-soft); }

    .wl-pill {
      display: inline-block; padding: 2px 8px; border-radius: 5px;
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
    }
    .wl-pill.active { background: rgba(22,163,74,0.12); color: #15803d; }
    .wl-pill.inactive { background: #f2f0e9; color: var(--sc-muted); }

    .wl-empty {
      padding: 48px 24px; text-align: center; color: var(--sc-muted); font-size: 14px;
      background: #f5f4ef; border: 1px dashed var(--sc-border-strong); border-radius: 12px;
    }
    .wl-empty i { font-size: 28px; display: block; margin-bottom: 10px; color: var(--sc-prime); }

    .wl-alerts-section { margin-top: 28px; }
    .wl-alerts-section h2 { font-size: 18px; font-weight: 700; color: var(--sc-heading); margin: 0 0 14px; }

    .wl-alert {
      padding: 12px 16px; margin-bottom: 8px;
      background: #fff; border: 1px solid var(--sc-border);
      border-radius: 9px; font-size: 13px; line-height: 1.5;
    }
    .wl-alert:hover { border-color: var(--sc-prime); }
    .wl-alert .wl-alert-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
    .wl-alert .wl-alert-entity { font-weight: 600; color: var(--sc-heading); }
    .wl-alert .wl-alert-date { font-size: 11px; color: #9b968c; }
    .wl-alert .wl-alert-detail { color: #57534b; font-size: 12px; }
    .wl-alert-delete {
      border: 0; background: transparent; color: #9b968c; cursor: pointer;
      padding: 4px 6px; border-radius: 5px; line-height: 1; margin-left: 2px;
    }
    .wl-alert-delete:hover { color: #b91c1c; background: rgba(185,28,28,0.08); }
    .wl-alert-delete:disabled { opacity: .5; cursor: wait; }

    .wl-loading { padding: 36px; text-align: center; color: var(--sc-muted); font-size: 13px; }

    @media (max-width: 720px) {
      .wl-table thead { display: none; }
      .wl-table, .wl-table tbody, .wl-table tr, .wl-table td { display: block; }
      .wl-table tr { padding: 12px 14px; border-bottom: 1px solid var(--sc-border); }
      .wl-table td { padding: 3px 0; border: none; }
    }
  </style>
</head>
<body>
<div id="sidebar-placeholder"></div>
<div id="header-placeholder"></div>
<main id="app-main">
  <div class="wl-shell">

    <div class="wl-eyebrow">Monitoring</div>
    <h1 class="wl-title">Watchlist</h1>

    <div class="wl-toolbar">
      <input class="wl-search" id="wl-search" placeholder="Search by entity name…" type="search">
      <button class="wl-btn" id="wl-add-btn"><i class="bi bi-plus-lg"></i> Add Entity</button>
      <!-- R-F3271 — RESTORED. R-F3225 ("focused page copy cleanup") deleted this
           control and its handler without declaring it. The backend endpoint
           POST /api/aria/dd/watchlist/rescreen was left in place with no caller,
           so the user had no way to trigger a re-screen: per-entity schedules are
           periodic, and adding a high-risk counterparty needs an answer now, not
           at the next cycle. -->
      <button class="wl-btn sec" id="wl-rescreen-btn"><i class="bi bi-arrow-clockwise"></i> Re-screen All</button>
      <a class="wl-btn sec" href="/vetting.html" style="text-decoration:none"><i class="bi bi-person-check"></i> Vetting</a>
      <a class="wl-btn sec" href="/dd-reports.html" style="text-decoration:none"><i class="bi bi-folder2-open"></i> DD Reports</a>
    </div>

    <div id="wl-content">
      <div class="wl-loading">Loading watchlist…</div>
    </div>

    <div class="wl-alerts-section" id="wl-alerts-section" style="display:none">
      <h2><i class="bi bi-bell" style="color:var(--sc-prime);margin-right:8px"></i>Recent Alerts</h2>
      <div id="wl-alerts"></div>
    </div>

  </div>
</main>

<script src="js/app.js?v=9"></script>
<script src="js/sidebar.js?v=13"></script>
<script>
Auth.requireAuth();
Sidebar.init('watchlist');

const searchInput = document.getElementById('wl-search');
const content = document.getElementById('wl-content');
const alertsSection = document.getElementById('wl-alerts-section');
const alertsDiv = document.getElementById('wl-alerts');

searchInput.addEventListener('input', applySearch);

// R-F3235 — watchlist enrollment is deliberately closed over existing DD and
// vetting records. A typed name is not evidence of provenance, so the modal only
// accepts an object returned by one of these owner-pinned list endpoints.
function normaliseWatchlistCandidates(ddReports = [], vettingCases = []) {
  const candidates = [];
  const seenDd = new Set();
  for (const report of ddReports) {
    if (!report || !report.run_id) continue;
    const name = [report.entity_name, report.name, report.entity, report.query]
      .map((value) => String(value || '').trim()).find(Boolean);
    if (!name || name === '(unknown)') continue;
    const identity = String(report.canonical_entity_id || '').trim().toLowerCase()
      || [name.toLowerCase(), String(report.entity_type || 'company').toLowerCase()].join('|');
    if (seenDd.has(identity)) continue;
    seenDd.add(identity);
    candidates.push({
      key: 'dd_report|' + report.run_id,
      source: 'dd_report',
      source_ref: String(report.run_id),
      name,
      entity_type: String(report.entity_type || 'company'),
      jurisdiction: String(report.jurisdiction || '').toUpperCase(),
      canonical_entity_id: String(report.canonical_entity_id || ''),
    });
  }
  for (const record of vettingCases) {
    if (!record || !record.case_id) continue;
    const name = String(record.applicant_name || '').trim();
    if (!name) continue;
    candidates.push({
      key: 'vetting_case|' + record.case_id,
      source: 'vetting_case',
      source_ref: String(record.case_id),
      name,
      entity_type: 'person',
      jurisdiction: '',
      canonical_entity_id: '',
    });
  }
  return candidates;
}

async function loadWatchlistCandidates() {
  const results = await Promise.allSettled([
    authed('/api/aria/dd/reports?limit=200'),
    authed('/api/aria/vetting/cases'),
  ]);
  const readList = async (result, field) => {
    if (result.status !== 'fulfilled' || !result.value.ok) return [];
    const payload = await result.value.json();
    return Array.isArray(payload[field]) ? payload[field] : [];
  };
  const ddReports = await readList(results[0], 'reports');
  const vettingCases = await readList(results[1], 'cases');
  return {
    candidates: normaliseWatchlistCandidates(ddReports, vettingCases),
    available: {
      dd_report: results[0].status === 'fulfilled' && results[0].value.ok,
      vetting_case: results[1].status === 'fulfilled' && results[1].value.ok,
    },
  };
}

function resolveWatchlistCandidate(candidates, prefill = {}) {
  const sameSource = candidates.filter((candidate) => candidate.source === prefill.source);
  return sameSource.find((candidate) => candidate.source_ref === prefill.source_ref)
    || sameSource.find((candidate) => prefill.canonical_entity_id
      && candidate.canonical_entity_id === prefill.canonical_entity_id)
    || sameSource.find((candidate) => candidate.name.toLowerCase() === String(prefill.name || '').trim().toLowerCase())
    || null;
}

function openAddModal(candidates, available, prefill = {}) {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'sc-mod-overlay open';
    ov.innerHTML =
      '<div class="sc-mod" role="dialog" aria-modal="true" aria-labelledby="wl-add-title" style="max-width:460px">'
      + '<div class="sc-mod-head">'
      + '<div class="sc-mod-ico" style="background:rgba(124,58,237,0.12);color:var(--sc-prime)"><i class="bi bi-plus-lg"></i></div>'
      + '<div><h3 id="wl-add-title">Add entity to watchlist</h3><p>Select an existing DD report or vetting case, then choose its autonomous review cycle.</p></div>'
      + '<button class="sc-mod-x" data-add="cancel" type="button" aria-label="Close">&times;</button>'
      + '</div>'
      + '<div class="sc-mod-body">'
      + '<label for="wl-add-source" style="display:block;font-size:12px;font-weight:600;color:var(--sc-muted);margin:0 0 4px">Type <span style="color:var(--sc-red)">*</span></label>'
      + '<select id="wl-add-source" class="wl-search" style="width:100%;min-width:0;margin-bottom:14px">'
      + '<option value="dd_report">DD Reports</option><option value="vetting_case">Vetting</option></select>'
      + '<label for="wl-add-entity" style="display:block;font-size:12px;font-weight:600;color:var(--sc-muted);margin:0 0 4px">Entity <span style="color:var(--sc-red)">*</span></label>'
      + '<select id="wl-add-entity" class="wl-search" style="width:100%;min-width:0"></select>'
      + '<div id="wl-add-meta" style="color:var(--sc-muted);font-size:12px;margin-top:6px"></div>'
      + '<label style="display:block;font-size:12px;font-weight:600;color:var(--sc-muted);margin:14px 0 4px">Review cycle</label>'
      + '<select id="wl-add-cycle" class="wl-search" style="width:100%;min-width:0"><option value="24">Daily</option><option value="72">Every 3 days</option><option value="168" selected>Weekly</option><option value="336">Every 2 weeks</option><option value="720">Monthly</option></select>'
      + '<div id="wl-add-err" style="color:var(--sc-red);font-size:12.5px;margin-top:10px;display:none"></div>'
      + '</div>'
      + '<div class="sc-mod-foot">'
      + '<button class="sc-btn sc-btn-outline" data-add="cancel" type="button">Cancel</button>'
      + '<button class="sc-btn" data-add="ok" type="button" style="background:var(--sc-prime);color:#fff">Add to watchlist</button>'
      + '</div></div>';
    document.body.appendChild(ov);
    const prevFocus = document.activeElement;
    const sourceEl = ov.querySelector('#wl-add-source');
    const entityEl = ov.querySelector('#wl-add-entity');
    const metaEl = ov.querySelector('#wl-add-meta');
    const errEl = ov.querySelector('#wl-add-err');
    const okEl = ov.querySelector('[data-add="ok"]');
    const selectedPrefill = resolveWatchlistCandidate(candidates, prefill);
    sourceEl.value = selectedPrefill ? selectedPrefill.source
      : (prefill.source === 'vetting_case' ? 'vetting_case' : 'dd_report');
    const renderEntities = () => {
      const sourceCandidates = candidates.filter((candidate) => candidate.source === sourceEl.value);
      entityEl.innerHTML = sourceCandidates.length
        ? sourceCandidates.map((candidate) => '<option value="' + escAttr(candidate.key) + '">'
          + escText(candidate.name) + (candidate.jurisdiction ? ' · ' + escText(candidate.jurisdiction) : '')
          + '</option>').join('')
        : '<option value="">No eligible entities available</option>';
      if (selectedPrefill && selectedPrefill.source === sourceEl.value) entityEl.value = selectedPrefill.key;
      entityEl.disabled = !sourceCandidates.length;
      okEl.disabled = !sourceCandidates.length;
      metaEl.textContent = available[sourceEl.value]
        ? (sourceCandidates.length ? 'Only entities already recorded in this section can be monitored.'
          : 'No eligible entities exist in this section yet.')
        : 'This section could not be loaded. Close this window and try again.';
    };
    sourceEl.addEventListener('change', renderEntities);
    renderEntities();
    const close = (val) => {
      document.removeEventListener('keydown', onKey);
      ov.remove();
      if (prevFocus && prevFocus.focus) { try { prevFocus.focus(); } catch (e) {} }
      resolve(val);
    };
    const submit = () => {
      const selected = candidates.find((candidate) =>
        candidate.source === sourceEl.value && candidate.key === entityEl.value);
      if (!selected) {
        errEl.textContent = 'Select an entity from the available records.';
        errEl.style.display = 'block';
        entityEl.focus();
        return;
      }
      close({
        ...selected,
        review_interval_hours: Number(ov.querySelector('#wl-add-cycle').value),
      });
    };
    ov.querySelectorAll('[data-add="cancel"]').forEach(el => el.onclick = () => close(null));
    okEl.onclick = submit;
    ov.onclick = (e) => { if (e.target === ov) close(null); };
    const onKey = (e) => { if (e.key === 'Escape') close(null); };
    document.addEventListener('keydown', onKey);
    setTimeout(() => sourceEl.focus(), 0);
  });
}

async function addEntity(prefill = {}) {
  const btn = document.getElementById('wl-add-btn');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Loading…';
  try {
    const loaded = await loadWatchlistCandidates();
    const vals = await openAddModal(loaded.candidates, loaded.available, prefill);
    if (!vals) return;
    btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Adding…';
    const body = { name: vals.name, review_interval_hours: vals.review_interval_hours };
    if (vals.entity_type) body.entity_type = vals.entity_type;
    if (vals.jurisdiction) body.jurisdiction = vals.jurisdiction;
    if (vals.canonical_entity_id) body.canonical_entity_id = vals.canonical_entity_id;
    if (vals.source) body.source = vals.source;
    if (vals.source_ref) body.source_ref = vals.source_ref;
    const r = await authed('/api/aria/dd/watchlist', {
      method: 'POST',
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      Toast.show('Failed to add "' + vals.name + '" (HTTP ' + r.status + ')', 'error');
    } else {
      Toast.show('"' + vals.name + '" added to watchlist', 'success');
      await loadWatchlist();
    }
  } catch (err) {
    Toast.show('Could not load eligible entities: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.innerHTML = orig;
  }
}

document.getElementById('wl-add-btn').addEventListener('click', () => addEntity());

// R-F3271 — RESTORED with its handler. Recovered verbatim from 4598730c^ (the
// commit before R-F3225 removed it), then re-verified against the CURRENT page
// rather than trusted: Modal.confirm/Modal.info (js/app.js:450, loaded at line
// 122), Toast.show, authed(), loadWatchlist() and loadAlerts() all still exist,
// and rescreen_watchlist still returns entities_screened / changes_detected[] /
// errors[] (dd_orchestrator.py:14567). Restoring code that calls vanished helpers
// would be worse than leaving the button out.
document.getElementById('wl-rescreen-btn').addEventListener('click', async () => {
  const ok = await Modal.confirm({
    title: 'Re-screen all entities?',
    message: 'Runs sanctions + PEP checks on every entity on your watchlist. This may take a moment.',
    okLabel: 'Re-screen all', cancelLabel: 'Cancel',
    danger: false, icon: 'bi-arrow-clockwise',
  });
  if (!ok) return;
  const btn = document.getElementById('wl-rescreen-btn');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Re-screening…';
  try {
    const r = await authed('/api/aria/dd/watchlist/rescreen', { method: 'POST' });
    if (!r.ok) {
      Toast.show('Re-screen failed (HTTP ' + r.status + ')', 'error');
    } else {
      // R-F2403 — map the REAL response fields (rescreen_watchlist returns
      // entities_screened + changes_detected[] + errors[]); the old code read
      // data.scanned/alerts/errors which don't exist, so it always showed 0/0
      // and rendered "Errors: [object Object]" for the errors LIST.
      const data = await r.json();
      const scanned = data.entities_screened || 0;
      const changes = Array.isArray(data.changes_detected) ? data.changes_detected.length : (data.changes_detected || 0);
      const errs = Array.isArray(data.errors) ? data.errors.length : (data.errors || 0);
      Modal.info({
        title: 'Re-screen complete',
        icon: errs ? 'bi-exclamation-triangle-fill' : 'bi-check-circle-fill',
        tone: errs ? 'danger' : 'success',
        bodyHtml:
          '<div style="display:grid;grid-template-columns:1fr auto;gap:8px 18px;font-size:13.5px">'
          + '<span style="color:var(--sc-muted)">Entities scanned</span><span style="font-weight:600;text-align:right">' + scanned + '</span>'
          + '<span style="color:var(--sc-muted)">Changes detected</span><span style="font-weight:600;text-align:right">' + changes + '</span>'
          + '<span style="color:var(--sc-muted)">Errors</span><span style="font-weight:600;text-align:right' + (errs ? ';color:var(--sc-red)' : '') + '">' + errs + '</span>'
          + '</div>',
      });
      await loadWatchlist();
      await loadAlerts();
    }
  } catch (err) {
    Toast.show('Re-screen error: ' + err.message, 'error');
  }
  btn.disabled = false; btn.innerHTML = orig;
});

let _allEntries = [];

async function loadWatchlist() {
  content.innerHTML = '<div class="wl-loading"><i class="bi bi-hourglass-split"></i> Loading watchlist…</div>';
  try {
    const r = await authed('/api/aria/dd/watchlist');
    if (!r.ok) {
      content.innerHTML = '<div class="wl-empty"><i class="bi bi-exclamation-triangle"></i>Failed to load watchlist (HTTP ' + r.status + ').</div>';
      return;
    }
    const data = await r.json();
    _allEntries = data.watchlist || [];
    applySearch();
  } catch (err) {
    content.innerHTML = '<div class="wl-empty"><i class="bi bi-wifi-off"></i>Network error: ' + escText(err.message) + '</div>';
  }
}

function applySearch() {
  const q = (searchInput.value || '').trim().toLowerCase();
  const filtered = q
    ? _allEntries.filter(e => (e.name || '').toLowerCase().includes(q))
    : _allEntries;
  renderTable(filtered);
}

function renderTable(entries) {
  if (!entries.length) {
    content.innerHTML = '<div class="wl-empty"><i class="bi bi-eye-slash"></i>No watchlist entries yet. Click "Add Entity" to start monitoring a company or person.</div>';
    return;
  }
  // R-F2076 (2026-06-28 audit) — surface the most important field, `last_risk`
  // (the backend returns RED/AMBER/AMBER-LIGHT/GREEN), which the table previously
  // never showed; and read the real timestamp field `added_at` (was `last_checked`,
  // which the backend doesn't emit → column was always "-", looking never-screened).
  // R-F2750 (finding 5) — split "Last Checked" into "Last DD" (added_at, when the
  // entity entered monitoring) and "Last re-screen" (last_rescreened_at, from the
  // R-F2744 observation). The old single column showed the add-date even when the
  // entity had been re-screened today, which read as "never re-screened".
  let html = '<table class="wl-table"><thead><tr><th>Entity</th><th>Type</th><th>Jurisdiction</th><th>Risk</th><th>Review cycle</th><th>Next review</th><th>Last review</th><th>Actions</th></tr></thead><tbody>';
  for (const e of entries) {
    // R-F3285 — tone and label from the one shared normaliser (js/app.js). The
    // hand-written list this replaces missed AMBER-DARK entirely, so a dark-amber
    // entity rendered in the grey "not screened" colour: a real verdict shown as
    // the absence of one. It also printed the stored value verbatim, so the same
    // entity read AMBER-LIGHT here and AMBER on its own report.
    const risk = String(e.last_risk || '').toUpperCase();
    const riskCls = window.riskTone ? window.riskTone(risk) : 'unknown';
    const riskColor = riskCls === 'red' ? '#b91c1c' : riskCls === 'amber' ? '#b45309'
                    : riskCls === 'green' ? '#15803d' : '#9b968c';
    const riskText = window.riskLabel ? window.riskLabel(risk) : risk;
    const riskPill = risk ? '<span style="font-weight:600;color:' + riskColor + '">' + escText(riskText) + '</span>' : '<span style="color:#9b968c">not screened</span>';
    // R-F2750 — "Last DD" = when it entered monitoring; "Last re-screen" = the
    // last sanctions re-screen observation (never conflate the two again).
    const rescreenTs = e.last_rescreened_at;
    let lastRescreen = rescreenTs ? new Date(rescreenTs).toLocaleString() : 'not re-screened yet';
    if (rescreenTs && e.source_complete === false) lastRescreen += ' (source incomplete)';
    const nextReview = e.next_review_at ? new Date(e.next_review_at).toLocaleString() : 'Due now';
    const cycle = Number(e.review_interval_hours || 24);
    const cycleOptions = [[24, 'Daily'], [72, 'Every 3 days'], [168, 'Weekly'], [336, 'Every 2 weeks'], [720, 'Monthly']]
      .map(([hours, label]) => '<option value="' + hours + '"' + (hours === cycle ? ' selected' : '') + '>' + label + '</option>').join('');
    html += '<tr class="wl-row">' +
      '<td><strong style="color:var(--sc-heading)">' + escText(e.name || e.entity_name || '(unnamed)') + '</strong>' +
        // R-F3287 — entries added automatically before the gate landed. Each
        // one is a recurring re-screen the user never asked for, so it is
        // marked rather than left indistinguishable from a deliberate add.
        // Nothing is purged: removing a monitored entity is the user's call.
        (String(e.source || '') === 'dd_auto_enroll'
          ? '<div style="font-size:11px;color:#b45309;margin-top:2px">added automatically by a past DD, not by you</div>'
          : '') + '</td>' +
      '<td style="color:var(--sc-muted)">' + escText(e.entity_type || '-') + '</td>' +
      '<td style="color:var(--sc-muted)">' + escText(e.jurisdiction || '-') + '</td>' +
      '<td>' + riskPill + '</td>' +
      '<td><select class="wl-search wl-cycle" data-name="' + escAttr(e.name) + '" aria-label="Review cycle for ' + escAttr(e.name) + '" style="min-width:124px;padding:6px 8px">' + cycleOptions + '</select></td>' +
      '<td style="color:var(--sc-muted);font-size:12px">' + escText(nextReview) + (e.review_due ? ' <span class="wl-pill inactive">due</span>' : '') + '</td>' +
      '<td style="color:var(--sc-muted);font-size:12px">' + escText(lastRescreen) + '</td>' +
      '<td>' +
        // R-F1569 — these buttons formerly used inline onclick handlers that
        // interpolated the user-stored entity name into a single-quoted JS
        // string. A JS string inside an HTML attribute is a double-decode
        // context (HTML entities decode BEFORE the JS parses), so HTML-entity
        // escaping alone could NOT make the name safe there. Now: data-* +
        // event delegation (CSP-safe, single HTML-attribute context) so no
        // name reaches a JS string literal in markup.
        '<button class="wl-btn sec wl-act-dd" data-name="' + escAttr(e.name) + '" style="padding:4px 10px;font-size:11px" title="Run DD on this entity"><i class="bi bi-search"></i></button> ' +
        '<button class="wl-btn sec wl-act-remove" data-name="' + escAttr(e.name) + '" style="padding:4px 10px;font-size:11px;color:#b91c1c" title="Remove from watchlist"><i class="bi bi-trash"></i></button>' +
      '</td>' +
    '</tr>';
  }
  html += '</tbody></table>';
  content.innerHTML = html;
}

content.addEventListener('change', async (event) => {
  const select = event.target.closest('.wl-cycle');
  if (!select) return;
  const name = select.dataset.name || '';
  select.disabled = true;
  try {
    const response = await authed('/api/aria/dd/watchlist/' + encodeURIComponent(name) + '/schedule', {
      method: 'PATCH',
      body: JSON.stringify({ review_interval_hours: Number(select.value) }),
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    Toast.show('Review cycle updated for "' + name + '"', 'success');
    await loadWatchlist();
  } catch (error) {
    Toast.show('Could not update review cycle: ' + error.message, 'error');
    await loadWatchlist();
  }
});

async function loadAlerts() {
  try {
    const r = await authed('/api/aria/dd/watchlist/alerts?since_hours=168');
    if (!r.ok) return;
    const data = await r.json();
    const alerts = data.alerts || data.results || [];
    if (!alerts.length) {
      alertsSection.style.display = 'none';
      return;
    }
    alertsSection.style.display = 'block';
    let html = '';
    for (const a of alerts.slice(0, 20)) {
      // R-F2403 — read the REAL alert fields (get_watchlist_alerts emits
      // entity / detail / timestamp / change_type). The old code read
      // entity_name / summary / generated_at, which don't exist → every alert
      // rendered "(unknown)" with no detail.
      const entity = a.entity || a.entity_name || a.name || '(unknown)';
      const date = a.timestamp || a.generated_at || '';
      const detail = a.detail || a.summary || a.change_description || '';
      const ctype = String(a.change_type || '').replace(/_/g, ' ');
      const worsening = a.change_type === 'new_hit' || a.change_type === 'new_pep'
                        || (a.change_type === 'score_change' && (a.new_score || 0) > (a.old_score || 0));
      const chip = ctype
        ? '<span class="wl-pill ' + (worsening ? '' : 'inactive') + '" style="' + (worsening ? 'background:rgba(220,38,38,0.12);color:#b91c1c' : '') + '">' + escText(ctype) + '</span>'
        : '';
      html += '<div class="wl-alert">' +
        '<div class="wl-alert-head">' +
          '<span class="wl-alert-entity">' + escText(entity) + '</span>' +
          chip +
          (date ? '<span class="wl-alert-date" style="margin-left:auto">' + new Date(date).toLocaleString() + '</span>' : '<span style="margin-left:auto"></span>') +
          '<button type="button" class="wl-alert-delete" data-alert-id="' + escAttr(a.alert_id || '') + '" data-alert-entity="' + escAttr(entity) + '" title="Delete alert" aria-label="Delete alert for ' + escAttr(entity) + '"><i class="bi bi-trash"></i></button>' +
        '</div>' +
        (detail ? '<div class="wl-alert-detail">' + escText(detail) + '</div>' : '') +
      '</div>';
    }
    alertsDiv.innerHTML = html;
  } catch (err) {
    // Silently fail — alerts are non-critical
  }
}

async function deleteAlert(alertId, entity, btn) {
  if (!alertId) {
    Toast.show('This alert has no deletable identifier. Refresh and try again.', 'error');
    return;
  }
  const ok = await Modal.confirm({
    title: 'Delete this alert?',
    message: 'Delete the recent alert for “' + entity + '”? This does not remove the entity from the watchlist.',
    okLabel: 'Delete alert', cancelLabel: 'Cancel',
    danger: true, icon: 'bi-trash-fill',
  });
  if (!ok) return;
  btn.disabled = true;
  btn.innerHTML = '<i class="bi bi-arrow-repeat"></i>';
  try {
    const r = await authed('/api/aria/dd/watchlist/alerts/' + encodeURIComponent(alertId), {
      method: 'DELETE',
    });
    if (!r.ok) {
      Toast.show('Could not delete alert (HTTP ' + r.status + ')', 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-trash"></i>';
      return;
    }
    Toast.show('Alert deleted', 'success');
    await loadAlerts();
  } catch (err) {
    Toast.show('Could not delete alert: ' + err.message, 'error');
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-trash"></i>';
  }
}

// R-F2403 — take the button explicitly (was `event.target`, the implicit global
// `event`, which on click targeted the inner <i> icon, not the button — so the
// spinner replaced the icon's contents unreliably and disabled the wrong node).
async function runDD(name, btn) {
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="bi bi-hourglass-split"></i>';
  try {
    const r = await authed('/api/aria/dd/orchestrate', {
      method: 'POST',
      body: JSON.stringify({ name: name, mode: 'standard', type: 'company', async_mode: true }),
    });
    if (r.ok) {
      Toast.show('DD started for "' + name + '". See DD Reports when it completes', 'info', 6000);
      await loadWatchlist();
      await loadAlerts();
    } else {
      Toast.show('Could not start DD for "' + name + '" (HTTP ' + r.status + ')', 'error');
    }
  } catch (err) { Toast.show('DD error: ' + err.message, 'error'); }
  btn.disabled = false; btn.innerHTML = orig;
}

// R-F2403 — same professional delete modal + Toast as the DD reports page (was a
// primitive confirm()/alert()). Loading state on the row button while deleting.
async function removeEntry(name, btn) {
  const ok = await Modal.confirm({
    title: 'Remove from watchlist?',
    message: '“' + name + '” will no longer be re-screened against sanctions & PEP lists. You can add it back any time.',
    okLabel: 'Remove', cancelLabel: 'Cancel',
    danger: true, icon: 'bi-trash-fill',
  });
  if (!ok) return;
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="bi bi-arrow-repeat"></i>';
  try {
    const r = await authed('/api/aria/dd/watchlist/' + encodeURIComponent(name), { method: 'DELETE' });
    if (r.ok) {
      Toast.show('“' + name + '” removed from watchlist', 'success');
      await loadWatchlist();
    } else {
      Toast.show('Failed to remove (HTTP ' + r.status + ')', 'error');
      btn.disabled = false; btn.innerHTML = orig;
    }
  } catch (err) {
    Toast.show('Error removing entity: ' + err.message, 'error');
    btn.disabled = false; btn.innerHTML = orig;
  }
}

function escText(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// R-F1569 — escAttr now feeds ONLY an HTML attribute (data-name="..."), no
// longer a nested JS-string-in-attribute, so full HTML-attribute escaping is
// correct and sufficient. (Previously it escaped only the double-quote, which
// was unsafe for the old onclick JS-string context — see render refactor above.)
function escAttr(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// R-F1569 — event delegation for the per-row action buttons (replaces inline
// onclick handlers that interpolated user-stored entity names into JS strings).
content.addEventListener('click', function(ev) {
  const btn = ev.target.closest('button[data-name]');
  if (!btn) return;
  const name = btn.getAttribute('data-name') || '';
  if (btn.classList.contains('wl-act-dd')) runDD(name, btn);
  else if (btn.classList.contains('wl-act-remove')) removeEntry(name, btn);
});

alertsDiv.addEventListener('click', function(ev) {
  const btn = ev.target.closest('button[data-alert-id]');
  if (!btn) return;
  deleteAlert(
    btn.getAttribute('data-alert-id') || '',
    btn.getAttribute('data-alert-entity') || 'this entity',
    btn,
  );
});

// Load on init
loadWatchlist();
loadAlerts();
const addParams = new URLSearchParams(location.search);
if (addParams.get('add')) {
  const prefill = {
    name: addParams.get('add') || '',
    entity_type: addParams.get('type') || '',
    jurisdiction: addParams.get('jurisdiction') || '',
    canonical_entity_id: addParams.get('canonical_id') || '',
    source: addParams.get('source') || '',
    source_ref: addParams.get('source_ref') || '',
  };
  history.replaceState({}, '', location.pathname);
  setTimeout(() => addEntity(prefill), 0);
}
</script>
