  // R-F3212 — 7.3.4 asks for an interview BEFORE any offer, which is a claim
  // about a date. A boolean cannot evidence one.
  async function recordInterview(caseId) {
    let current = {};
    let currentOfferDate = '';
    try {
      const r = await authed('/api/aria/vetting/case/' + encodeURIComponent(caseId));
      if (r.ok) {
        const body = await r.json();
        current = body.inputs || {};
        currentOfferDate = body.offer_date || '';
      }
    } catch (e) { /* the form still works empty */ }
    const values = await Modal.form({
      title: 'Record the screening interview',
      message: 'BS 7858 7.3.4. The interview happens before any offer of employment.',
      icon: 'bi-mic', okLabel: 'Record',
      fields: [
        { name: 'interview_date', label: 'Date held', type: 'date', required: true, autofocus: true,
          value: current.interview_date || '' },
        { name: 'interviewed_by', label: 'Who conducted it?', type: 'text', required: true,
          value: current.interviewed_by || '' },
        { name: 'offer_date', label: 'Offer date', type: 'date', required: true,
          value: currentOfferDate,
          help: 'ARIA compares this with the interview date. The interview must be earlier.' },
      ],
    });
    if (!values) return;
    try {
      const r = await authed(`/api/aria/vetting/case/${encodeURIComponent(caseId)}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ offer_date: values.offer_date,
          inputs: Object.assign({}, current, {
          interview_done: true, interview_date: values.interview_date,
          interviewed_by: values.interviewed_by }) }),
      });
      if (!r.ok) {
        const body = await r.json().catch(() => ({}));
        Toast.show(`Not recorded: ${escHtml((body.detail && body.detail.code) || r.status)}`, 'danger', 8000);
        return;
      }
      Toast.show('Interview recorded', 'success');
      await loadDetail(caseId, true);
    } catch (e) { Toast.show('Not recorded. Service unreachable.', 'danger', 8000); }
  }

  // ── R-F3266 — move this case onto a newer version of its rule pack ────────
  //
  // Never automatic. A case's governing rules changing by itself, on a page
  // load, is the opposite of the replayability the pin exists to give — so the
  // officer is told exactly what changes and names themselves for the record.
  async function migratePack(caseId, toVersion) {
    const values = await Modal.form({
      title: `Update this case to pack v${toVersion}`,
      // R-F3278 — no em dashes in copy an officer reads. The mechanical pass turned
      // the two parenthetical dashes into a comma list ("the file, documents, career
      // history, inputs, is untouched"), which is ambiguous; written out properly here.
      message: 'The case is re-pinned to the newer rules. Everything on the file, '
             + 'including documents, career history and inputs, is untouched. Only '
             + 'which rules apply changes. The move is recorded on the case with your '
             + 'name, and the current assessment is marked for re-running, because it '
             + 'was computed under the rules being replaced. This cannot be undone: a '
             + 'case never moves backwards.',
      icon: 'bi-arrow-up-circle', okLabel: 'Update rules',
      fields: [
        { name: 'migrated_by', label: 'Who is making this change?', type: 'text',
          required: true, autofocus: true },
        { name: 'reason', label: 'Why (optional)', type: 'text' },
      ],
    });
    if (!values) return;
    try {
      const r = await authed(`/api/aria/vetting/case/${encodeURIComponent(caseId)}/pack/migrate`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ migrated_by: values.migrated_by,
                               to_version: toVersion, reason: values.reason || '' }),
      });
      if (!r.ok) {
        // Every refusal is a stated reason, not a generic failure — show it.
        const body = await r.json().catch(() => ({}));
        const msg = (body.detail && (body.detail.message || body.detail.code)) || `HTTP ${r.status}`;
        Toast.show(`Not updated: ${escHtml(msg)}`, 'danger', 9000);
        return;
      }
      const done = await r.json();
      Toast.show(`Re-pinned v${escHtml(done.from_version)} → v${escHtml(done.to_version)}. `
               + 'Re-assess to see the file under the new rules.', 'success', 7000);
      await loadCases();
      await loadDetail(caseId, true);
    } catch (e) { Toast.show('Not updated. The service was unreachable.', 'danger', 8000); }
  }

  // R-F3157/R-F3170 — record the employment decision (UK GDPR Art. 22).
  // The dialog puts the CURRENT assessment in front of the officer as
  // read-only context, and enforces the adverse-decision requirements inline —
  // the same rules the server enforces, so nobody is bounced by a rule they
  // could not see. Nothing here pre-fills a decision from the engine verdict.
  async function decide(caseId) {
    let engine = (DETAIL.get(caseId) || {}).assessment || null;
    if (!engine) {
      try {
        const r = await authed(`/api/aria/vetting/case/${encodeURIComponent(caseId)}/assess`, { method: 'POST' });
        if (r.ok) engine = await r.json();
      } catch (e) { /* handled below. We simply decide without the context */ }
    }
    const counts = (engine && engine.counts) || {};
    const blockers = Number(counts.blockers || 0);
    const statusText = engine
      ? `${esc(engine.status)} · ${blockers} blocker(s), ${Number(counts.signoffs || 0)} sign-off(s), ${Number(counts.actions || 0)} action(s)`
      : 'Could not read the current assessment. Decide only if you have the file in front of you.';

    const values = await Modal.form({
      title: 'Record employment decision',
      message: `Case ${caseId}. The decision is recorded against your name. ARIA never decides.`,
      icon: 'bi-person-check-fill', okLabel: 'Record decision',
      fields: [
        { name: 'engine', label: 'Current assessment', type: 'static',
          html: `<strong>${esc(statusText)}</strong>${blockers > 0
            ? '<br><span style="color:var(--sc-red)">Approving over open blockers requires a recorded override reason.</span>' : ''}` },
        { name: 'decision', label: 'Decision', type: 'select', required: true, autofocus: true,
          options: [
            { value: '', label: 'Select…' },
            { value: 'APPROVED', label: 'Approved' },
            { value: 'APPROVED_WITH_CONDITIONS', label: 'Approved with conditions' },
            { value: 'REJECTED', label: 'Rejected' },
            { value: 'DEFERRED', label: 'Deferred, more evidence sought' },
            { value: 'WITHDRAWN', label: 'Withdrawn by applicant' },
          ] },
        { name: 'decided_by', label: 'Your full name', type: 'text', required: true,
          help: 'An employment decision must be attributable to a named person (UK GDPR Art. 22).' },
        { name: 'reason', label: 'Reason', type: 'textarea', rows: 3,
          help: 'Required for a rejection. The applicant is entitled to be told why.' },
        { name: 'assessed_by', label: 'Who ran the screening', type: 'text',
          help: 'Required for a rejection: the screener may not also be the sole decision-maker.' },
        { name: 'blocker_override_reason', label: 'Override reason', type: 'textarea', rows: 2,
          help: 'Only needed when approving a file that still has open blockers.' },
        { name: 'conditions', label: 'Conditions', type: 'text',
          help: 'Comma-separated. Required when approving with conditions.' },
      ],
      validate: (v) => {
        const errs = {};
        const adverse = v.decision === 'REJECTED';
        const approving = v.decision === 'APPROVED' || v.decision === 'APPROVED_WITH_CONDITIONS';
        if (adverse && !v.reason) errs.reason = 'A rejection requires a stated reason.';
        if (adverse && !v.assessed_by) errs.assessed_by = 'A rejection requires a second reviewer.';
        if (adverse && v.assessed_by && v.decided_by
            && v.assessed_by.toLowerCase() === v.decided_by.toLowerCase()) {
          errs.assessed_by = 'The screener cannot be the sole decision-maker on a rejection.';
        }
        if (approving && blockers > 0 && !v.blocker_override_reason) {
          errs.blocker_override_reason = `This file has ${blockers} open blocker(s); record why you are approving over them.`;
        }
        if (v.decision === 'APPROVED_WITH_CONDITIONS' && !v.conditions) {
          errs.conditions = 'List at least one condition.';
        }
        return errs;
      },
    });
    if (!values) return;

    try {
      const r = await authed(`/api/aria/vetting/case/${encodeURIComponent(caseId)}/decision`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          decision: values.decision, decided_by: values.decided_by,
          reason: values.reason, assessed_by: values.assessed_by,
          blocker_override_reason: values.blocker_override_reason,
          conditions: values.conditions
            ? values.conditions.split(',').map((c) => c.trim()).filter(Boolean) : [],
        }),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) {
        Toast.show(`Decision not recorded: ${escHtml((body.detail && body.detail.message) || body.detail || r.status)}`, 'danger', 8000);
        return;
      }
      Toast.show(`${body.decision} recorded by ${escHtml(body.decided_by)}`, 'success');
      Modal.info({
        title: 'Decision recorded', message: `Case ${caseId}`,
        tone: 'success', icon: 'bi-check-circle-fill',
        bodyHtml:
          `<div class="sc-form-static"><strong>${escHtml(body.decision)}</strong> by ${escHtml(body.decided_by)}<br>`
          + `Engine at decision time: ${escHtml(body.engine_status)} · ${esc(body.engine_blockers)} blocker(s)<br>`
          + (body.departed_from_engine
              ? '<span style="color:#c2410c">Departed from the recommendation, recorded.</span>'
              : 'Matched the recommendation.')
          + '</div>',
      });
      await loadCases();
      await loadDetail(caseId, true);
    } catch (e) {
      Toast.show('Decision not recorded. The service was unreachable.', 'danger', 8000);
    }
  }

  // R-F3186/R-F3206 — mint and deliver a scoped upload link in ONE call. The
  // plaintext token exists for exactly one moment; there is no endpoint that
  // can show it again, by design, so the result dialog says so plainly.
  async function shareLink(caseId) {
    let caseData = null;
    try {
      const r = await authed('/api/aria/vetting/case/' + encodeURIComponent(caseId));
      if (r.ok) caseData = await r.json();
    } catch (e) { /* the dialog still works without the period list */ }

    const refByEntry = {};
    const entries = ((caseData && caseData.career) || []).map(function (e) {
      const nomName = (e.referee_name || '').trim();
      const nomTo = (e.referee_email || '').trim() || (e.referee_phone || '').trim();
      refByEntry[e.entry_id] = { name: nomName, to: nomTo };
      const base = (e.organisation || e.entry_type) + ' (' + e.start + ' → ' + (e.end || 'present') + ')';
      const tag = nomName
        ? ' · ' + nomName + (nomTo ? '' : ' (no contact on file)')
        : '. No referee nominated';
      return { value: e.entry_id, label: base + tag };
    });

    // Scoped to THIS page: Modal.form has no change hook, and adding one would
    // touch a component every page's dialogs use, on a tier with no CI. NEVER
    // clobbers typing — it writes only when the box is empty or still holds
    // what this wiring last put there.
    const _wireRefereeAutofill = function () {
      const sel = document.querySelector('select[name="entry_id"]');
      const nameEl = document.querySelector('input[name="referee_name"]');
      const toEl = document.querySelector('input[name="to"]');
      const kindEl = document.querySelector('select[name="kind"]');
      if (!sel || !nameEl || !toEl) return false;
      let auto = { name: '', to: '' };
      const apply = function () {
        if (kindEl && kindEl.value !== 'REFEREE') return;
        const nom = refByEntry[sel.value];
        if (!nom) return;
        if (!nameEl.value || nameEl.value === auto.name) { nameEl.value = nom.name; auto.name = nom.name; }
        if (!toEl.value || toEl.value === auto.to) { toEl.value = nom.to; auto.to = nom.to; }
      };
      sel.addEventListener('change', apply);
      if (kindEl) kindEl.addEventListener('change', apply);
      apply();
      return true;
    };

    const _formPromise = Modal.form({
      title: 'Share a secure upload link',
      message: 'Case ' + caseId + '. The link is shown once. Copy or send it now.',
      icon: 'bi-qr-code', okLabel: 'Create and share',
      fields: [
        { name: 'kind', label: 'Who is this for?', type: 'select', required: true, autofocus: true,
          options: [
            { value: 'APPLICANT', label: 'The person being vetted. Upload their own documents' },
            { value: 'REFEREE', label: 'A referee or previous employer, confirm one period' },
          ],
          help: 'A referee link reveals only the one engagement they are confirming.' },
        { name: 'entry_id', label: 'Which period? (referee links only)', type: 'select',
          options: [{ value: '', label: '(none)' }].concat(entries),
          help: 'Required for a referee link. Nothing else on the file is shared with them.' },
        { name: 'referee_name', label: 'Recipient name', type: 'text',
          help: 'Auto-filled from the referee the applicant nominated for the selected period.' },
        { name: 'channel', label: 'How to send', type: 'select', required: true,
          options: [
            { value: 'link', label: 'Just give me the link and QR code' },
            { value: 'email', label: 'Email it' },
            { value: 'whatsapp', label: 'WhatsApp it' },
          ],
          help: 'SMS is not offered: no SMS provider is configured on this platform.' },
        { name: 'to', label: 'Email address or WhatsApp number', type: 'text',
          help: 'Not needed if you are only copying the link.' },
        { name: 'ttl_days', label: 'Expires after (days)', type: 'number', value: '14',
          help: 'Maximum 90.' },
      ],
      validate: function (v) {
        const errs = {};
        if (v.kind === 'REFEREE' && !v.entry_id) errs.entry_id = 'A referee link must name the period it covers.';
        if (v.channel !== 'link' && !v.to) errs.to = 'Enter where to send it, or choose "just give me the link".';
        if (v.channel === 'email' && v.to && v.to.indexOf('@') === -1) errs.to = 'That does not look like an email address.';
        return errs;
      },
    });
    if (!_wireRefereeAutofill()) setTimeout(_wireRefereeAutofill, 0);
    const values = await _formPromise;
    if (!values) return;

    let body;
    try {
      const r = await authed('/api/vetting/share', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          case_id: caseId, kind: values.kind, entry_id: values.entry_id,
          referee_name: values.referee_name, channel: values.channel,
          to: values.to, ttl_days: Number(values.ttl_days) || 14,
          applicant_name: (caseData && caseData.applicant_name) || '',
        }),
      });
      body = await r.json().catch(function () { return {}; });
      if (!r.ok) {
        Toast.show('Link not created: ' + escHtml((body && (body.error || (body.detail && body.detail.message))) || r.status), 'danger', 9000);
        return;
      }
    } catch (e) {
      Toast.show('Link not created. The service was unreachable.', 'danger', 9000);
      return;
    }

    const d = body.delivery || {};
    const deliveryLine = !d.attempted
      ? '<span class="sc-badge sc-badge-muted">not sent. Copy or scan below</span>'
      : d.sent
        ? '<span class="sc-badge sc-badge-green">sent by ' + escHtml(d.channel) + '</span>'
        : '<span class="sc-badge sc-badge-orange">not sent</span><div class="vt-ref" style="margin-top:6px">' + escHtml(d.detail || 'delivery failed') + '</div>';
    const qrSrc = '/api/vetting/qr?url=' + encodeURIComponent(body.link);
    Modal.info({
      title: 'Secure link created',
      message: 'This link is shown once. Copy it now. It cannot be displayed again.',
      tone: 'vls', icon: 'bi-qr-code',
      bodyHtml:
        '<div style="text-align:center;margin-bottom:16px">' +
        '<img src="' + escHtml(qrSrc) + '" alt="QR code for the upload link" ' +
        'style="width:200px;height:200px;border:1px solid var(--sc-border);border-radius:10px;padding:6px;background:#fff"></div>' +
        '<div class="sc-form-static" style="word-break:break-all;font-size:12px">' + escHtml(body.link) + '</div>' +
        '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' +
        '<button class="sc-btn sc-btn-outline sc-btn-sm" id="vt-copy" type="button">Copy link</button>' +
        '<a class="sc-btn sc-btn-outline sc-btn-sm" href="' + escHtml(qrSrc) + '" download="vetting-qr-' + escHtml(caseId) + '.svg">Download QR</a>' +
        '</div><div style="margin-top:14px">' + deliveryLine + '</div>' +
        '<p class="vt-ref" style="margin-top:12px">Expires ' + escHtml(String(body.expires_at || '').slice(0, 10)) +
        '. Anyone holding this link can upload to this case. Do not post it in a shared channel.</p>',
    });
    setTimeout(function () {
      const btn = document.getElementById('vt-copy');
      if (!btn) return;
      btn.onclick = async function () {
        try { await navigator.clipboard.writeText(body.link); btn.textContent = 'Copied'; }
        catch (e) { btn.textContent = 'Select the link above and copy'; }
      };
    }, 50);
    await loadDetail(caseId, true);
  }

  // Art. 15 export. Downloaded rather than rendered inline: it is a record to
  // be handed to a person, and inlining it would invite screenshots of
  // criminal-offence data into whatever chat the operator is in.
  async function subjectAccess(caseId) {
    try {
      const r = await authed(`/api/aria/vetting/case/${encodeURIComponent(caseId)}/subject-access`);
      if (!r.ok) { Toast.show(`Export failed (HTTP ${r.status}).`, 'danger', 8000); return; }
      const blob = new Blob([JSON.stringify(await r.json(), null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `subject-access-${caseId}.json`; a.click();
      URL.revokeObjectURL(url);
      Toast.show('Subject-access export downloaded', 'success');
    } catch (e) {
      Toast.show('Export failed. The service was unreachable.', 'danger', 8000);
    }
  }

  async function loadRetention() {
    try {
      const r = await authed('/api/aria/vetting/retention');
      if (!r.ok) return;
      const data = await r.json();
      const overdue = data.overdue_count || 0;
      const el = $('retention-note');
      if (!el) return;
      el.className = overdue ? 'vt-pack vt-pack-warn' : 'vt-pack';
      el.style.display = '';
      el.innerHTML = `<i class="bi bi-clock-history" aria-hidden="true"></i><div>`
        + (overdue
          ? `<strong>${esc(overdue)} case(s) past their retention period</strong>. Dispose to satisfy the storage-limitation duty (Art. 5(1)(e)).`
          : `No case is past its retention period.`)
        + ` <span class="vt-ref">reviewed as of ${esc(data.as_of)}</span></div>`;
    } catch (e) { /* retention is advisory here; never block the page */ }
  }

  async function createCase() {
    if (!PACKS.length) await loadPacks();
    if (!PACKS.length) {
      Modal.info({
        title: 'BS 7858 standard unavailable',
        message: 'The active BS 7858:2019 standard could not be loaded.',
        tone: 'danger', icon: 'bi-exclamation-triangle-fill',
        bodyHtml: '<div class="sc-form-static">This usually means the vetting service is '
          + 'unreachable. Nothing has been created. Try Refresh, and if it persists the '
          + 'screening service needs attention.</div>',
      });
      return;
    }
    const today = new Date().toISOString().slice(0, 10);
    const values = await Modal.form({
      title: 'New vetting case',
      message: 'ARIA monitors this case against the single active BS 7858:2019 standard.',
      icon: 'bi-folder-plus', okLabel: 'Create and assess',
      fields: [
        { name: 'case_id', label: 'Case reference', type: 'text', required: true,
          autofocus: true, placeholder: 'VET-2026-001',
          help: 'Your own reference. Must be unique within your organisation.' },
        { name: 'applicant_name', label: 'Applicant full name', type: 'text', required: true,
          placeholder: 'As it appears on their identity document' },
        { name: 'date_of_birth', label: 'Date of birth', type: 'date', required: true,
          help: 'Used to floor the screening period at the 16th birthday.' },
        { name: 'employment_start', label: 'Employment start date', type: 'date', required: true,
          value: today, help: 'The screening period is counted back from this date.' },
      ],
      validate: (v) => {
        const errs = {};
        const dob = new Date(v.date_of_birth);
        const start = new Date(v.employment_start);
        if (v.date_of_birth && isNaN(dob.getTime())) errs.date_of_birth = 'Not a valid date.';
        if (v.employment_start && isNaN(start.getTime())) errs.employment_start = 'Not a valid date.';
        if (!errs.date_of_birth && !errs.employment_start) {
          if (dob >= start) {
            errs.date_of_birth = 'Date of birth must precede the employment start date.';
          } else {
            const years = (start - dob) / (365.25 * 24 * 3600 * 1000);
            if (years < 16) errs.date_of_birth = `Applicant would be ${Math.floor(years)} at the start date; screening assumes at least 16.`;
            if (years > 100) errs.date_of_birth = 'Date of birth looks implausible. Please re-check.';
          }
        }
        return errs;
      },
    });
    if (!values) return;

    try {
      const r = await authed('/api/aria/vetting/cases', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(values),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) {
        const msg = (body.detail && (body.detail.message || (body.detail.errors || []).join('; ')))
                    || body.detail || `HTTP ${r.status}`;
        Toast.show(`Case not created: ${escHtml(msg)}`, 'danger', 9000);
        return;
      }
      Toast.show(`Case ${escHtml(values.case_id)} created`, 'success');
      await loadCases();
      // Open it straight away: the officer's next question is always "what is
      // outstanding?", and the expanded file answers it without a second click.
      const card = document.querySelector(`[data-case="${CSS.escape(values.case_id)}"]`);
      if (card) { card.open = true; await loadDetail(values.case_id, true); }
    } catch (e) {
      Toast.show('Case not created. The vetting service was unreachable.', 'danger', 9000);
    }
  }

  // ── event wiring ───────────────────────────────────────────────────────
  // Native <details> with a delegated toggle listener: keyboard-accessible,
  // survives a re-render without state bookkeeping, and loads a file's detail
  // only when someone actually opens it. A queue of twenty cases must not
  // fetch twenty assessments to draw itself.
  $('cases').addEventListener('toggle', (ev) => {
    const card = ev.target.closest('.vt-case');
    if (card && card.open) loadDetail(card.getAttribute('data-case'));
  }, true);

  $('cases').addEventListener('change', (ev) => {
    const input = ev.target.closest('[data-upload-req]');
    if (input && input.files && input.files[0]) {
      const file = input.files[0];
      const caseId = input.getAttribute('data-case');
      const type = input.getAttribute('data-type') || 'OTHER';
      input.value = '';
      upload(caseId, file, type);
    }
  });

  $('cases').addEventListener('click', (ev) => {
    const hit = (attr) => ev.target.closest(`[data-${attr}]`);
    let el;
    if ((el = hit('assess'))) {
      Toast.show('Re-assessing…', 'info', 1500);
      loadDetail(el.getAttribute('data-assess'), true); return;
    }
    if ((el = hit('watch'))) {
      const caseId = el.getAttribute('data-watch');
      const record = CASES.find((item) => item.case_id === caseId) || {};
      const params = new URLSearchParams({
        add: record.applicant_name || '',
        type: 'person',
        source: 'vetting_case',
        source_ref: caseId,
      });
      location.href = '/watchlist.html?' + params.toString();
      return;
    }
    if ((el = hit('view'))) {
      viewDocument(el.getAttribute('data-case'), el.getAttribute('data-view')); return;
    }
    if ((el = hit('sighting'))) {
      setSighting(el.getAttribute('data-case'), el.getAttribute('data-sighting')); return;
    }
    if ((el = hit('addreq'))) { addRequirement(el.getAttribute('data-addreq')); return; }
    if ((el = hit('waive'))) {
      waiveRequirement(el.getAttribute('data-case'), el.getAttribute('data-waive'),
                       el.getAttribute('data-label')); return;
    }
    if ((el = hit('unwaive'))) {
      const c = el.getAttribute('data-case');
      simpleDelete(c, `/api/aria/vetting/case/${encodeURIComponent(c)}/requirements/waive/${encodeURIComponent(el.getAttribute('data-unwaive'))}`,
                   'Waiver withdrawn'); return;
    }
    if ((el = hit('delreq'))) {
      const c = el.getAttribute('data-case');
      simpleDelete(c, `/api/aria/vetting/case/${encodeURIComponent(c)}/requirements/${encodeURIComponent(el.getAttribute('data-delreq'))}`,
                   'Requirement removed'); return;
    }
    if ((el = hit('migrate'))) {
      migratePack(el.getAttribute('data-migrate'), el.getAttribute('data-to')); return;
    }
    if ((el = hit('interview'))) { recordInterview(el.getAttribute('data-interview')); return; }
    if ((el = hit('decide'))) { decide(el.getAttribute('data-decide')); return; }
    if ((el = hit('share'))) { shareLink(el.getAttribute('data-share')); return; }
    if ((el = hit('sar'))) { subjectAccess(el.getAttribute('data-sar')); }
  });

  // R-F3269 — live filtering on input, as on the DD library. Re-rendering the
  // list collapses any open card, which is why the filter is on the list only:
  // the stat strip above it never moves while typing.
  document.getElementById('case-search').addEventListener('input', applyCaseSearch);

  $('new-case-btn').addEventListener('click', createCase);
  $('refresh-btn').addEventListener('click', async () => {
    DETAIL.clear();
    await loadCases();
    await loadRetention();
    Toast.show('Refreshed', 'info', 2000);
  });
  // R-F3250 — loaded EAGERLY, not on first expand. The scope statement now
  // sits above the queue, so its collapsed line has to carry real numbers from
  // the moment the page renders; a lazy load would leave "loading…" sitting
  // under the title until someone happened to click it, and an unread scope
  // limit is the same as no scope limit.
  await Promise.all([loadPacks(), loadDocTypes(), loadStandard()]);
  await loadCases();
  await loadRetention();

  // R-F3466 — an open file is a live control surface, not a snapshot. Refresh
  // the authoritative assessment, document states and request ledger while the
  // officer is looking at it. Hidden tabs do no work; returning to the tab
  // resumes from the server rather than replaying stale browser state.
  window.setInterval(() => {
    if (document.hidden) return;
    document.querySelectorAll('.vt-case[open]').forEach((card) => {
      const caseId = card.getAttribute('data-case');
      if (caseId) loadDetail(caseId, true);
    });
  }, 30000);
})();
}  // R-F4004 (C-83) — closes the `else` opened by the Auth.requireAuth() gate above.
</script>
</body>
</html>
