<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vetting | ARIA</title>
  <link rel="icon" type="image/png" href="images/fav-icon/icon.png">
  <link rel="stylesheet" href="css/aria.css?v=15">
  <link rel="stylesheet" href="fonts/bootstrap-icons/font-css.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: var(--sc-bg); margin: 0; font-family: 'gorditaregular', 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--sc-text); line-height: 1.65; }
    .vt-shell { max-width: 1180px; margin: 0 auto; padding: 28px 24px 60px; }
    .vt-eyebrow { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--sc-prime); font-weight: 700; margin-bottom: 8px; }
    .vt-title { font-size: 28px; font-weight: 800; color: var(--sc-heading); margin: 0 0 22px; letter-spacing: -0.02em; }
    .vt-sub { font-size: 13px; color: var(--sc-muted); margin: 0 0 22px; max-width: 74ch; }

    .vt-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
    .vt-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 16px; border-radius: 9px; border: none;
      background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    /* R-F3269 — the DD library's search field, declaration for declaration.
       Two list surfaces in one product should not have two dialects of the
       same control; a regression test compares these rules against
       .dd-search so they cannot drift apart quietly. */
    .vt-search {
      flex: 1; min-width: 240px; padding: 10px 14px; border-radius: 9px;
      background: #fff; border: 1px solid var(--sc-border-strong);
      color: var(--sc-heading); font-size: 14px; font-family: inherit; outline: none;
    }
    .vt-search:focus { border-color: var(--sc-prime); box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }
    .vt-search-note { font-size: 12px; color: var(--sc-muted); margin: -8px 0 14px; }
    .vt-btn.secondary { background: #fff; color: var(--sc-heading); border: 1px solid var(--sc-border-strong); }
    .vt-btn.sm { padding: 6px 11px; font-size: 12px; border-radius: 7px; }
    .vt-btn:disabled { opacity: .55; cursor: not-allowed; }

    .vt-pack { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; background: #f5f4ef; border: 1px solid var(--sc-border); border-radius: 10px; margin-bottom: 14px; font-size: 12.5px; }
    .vt-pack-warn { background: rgba(245,158,11,0.10); border-color: rgba(245,158,11,0.32); }

    /* ── R-F3213: the QUEUE summary. The page answers "what needs me today?";
       the card answers "what is this file?". The old page had a single global
       verdict banner that belonged to whichever case was assessed last, which
       is a per-file answer rendered where a per-queue question is asked. */
    .vt-queue { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .vt-qstat {
      flex: 1; min-width: 128px; background: #fff; border: 1px solid var(--sc-border);
      border-radius: 11px; padding: 12px 14px;
    }
    .vt-qstat-num { font-size: 22px; font-weight: 800; color: var(--sc-heading); line-height: 1.1; }
    .vt-qstat-lab { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--sc-muted); font-weight: 700; margin-top: 3px; }
    .vt-qstat.red .vt-qstat-num { color: #dc2626; }
    .vt-qstat.orange .vt-qstat-num { color: #d97706; }
    .vt-qstat.blue .vt-qstat-num { color: #2563eb; }
    .vt-qstat.green .vt-qstat-num { color: #16a34a; }

    .vt-section { margin-bottom: 26px; }
    .vt-section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .vt-section-name { font-size: 13px; font-weight: 800; color: var(--sc-heading); text-transform: uppercase; letter-spacing: 1.2px; }
    .vt-section-count { font-size: 11px; font-weight: 700; color: var(--sc-muted); background: #ece9e2; border-radius: 20px; padding: 2px 9px; }
    .vt-section-hint { font-size: 12px; color: var(--sc-muted); }

    .vt-empty { padding: 26px; text-align: center; color: var(--sc-muted); font-size: 13px; border: 1px dashed var(--sc-border-strong); border-radius: 12px; }
    .vt-error { padding: 14px 18px; border-radius: 10px; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.3); color: #b91c1c; font-size: 13px; }
    .vt-note { font-size: 12px; color: var(--sc-muted); font-style: italic; margin-top: 10px; }
    .vt-ref { font-size: 11px; color: var(--sc-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    .vt-pill { display: inline-block; padding: 3px 9px; border-radius: 5px; font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; flex-shrink: 0; }
    .vt-pill.blocker { background: rgba(239,68,68,0.16); color: #b91c1c; }
    .vt-pill.signoff { background: rgba(245,158,11,0.18); color: #c2410c; }
    .vt-pill.action { background: rgba(37,99,235,0.14); color: #1d4ed8; }
    .vt-pill.deadline { background: rgba(217,119,6,0.16); color: #b45309; }
    .vt-pill.info { background: rgba(120,113,108,0.14); color: #57534e; }

    /* ── the case card ─────────────────────────────────────────────────── */
    .vt-case { padding: 0; overflow: hidden; background: #fff; border: 1px solid var(--sc-border); border-radius: 12px; }
    .vt-case + .vt-case { margin-top: 10px; }
    .vt-case[open] { border-color: var(--sc-border-strong); box-shadow: 0 2px 14px rgba(15,23,42,0.06); }
    .vt-summary { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; cursor: pointer; list-style: none; transition: background .12s; }
    .vt-summary::-webkit-details-marker { display: none; }
    .vt-summary:hover { background: #faf9f6; }
    .vt-case[open] .vt-summary { border-bottom: 1px solid var(--sc-border); background: #faf9f6; }
    /* Initials, not photographs. We hold passports, so a face is technically
       available, but extracting one is biometric processing (Art. 9) and would
       move the product toward biometric categorisation under the EU AI Act,
       which our own assessment records that we do NOT do. Initials give the
       same at-a-glance recognition at none of that cost. */
    .vt-avatar {
      display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; margin-top: 2px;
      background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff;
      font-size: 12px; font-weight: 800; letter-spacing: .5px;
    }
    .vt-ident { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    /* R-F3183 — the applicant's FULL name, always. On a screening file the name
       IS the identity being verified, and a clipped name is the one field an
       officer cannot afford to guess at. Long names wrap; the card grows. */
    .vt-name { font-size: 14.5px; font-weight: 700; color: var(--sc-heading); white-space: normal; overflow-wrap: anywhere; word-break: break-word; }
    .vt-status, .vt-chev { flex-shrink: 0; margin-top: 2px; }
    .vt-chev { color: var(--sc-muted); font-size: 13px; transition: transform .15s; }
    .vt-case[open] .vt-chev { transform: rotate(180deg); }

    /* Face-level progress: documents accepted out of documents required. Two
       numbers an officer can act on, not a percentage that averages them. */
    .vt-face { display: flex; align-items: center; gap: 10px; margin-top: 5px; flex-wrap: wrap; }
    .vt-bar { width: 108px; height: 5px; border-radius: 4px; background: #e7e5e0; overflow: hidden; flex-shrink: 0; }
    .vt-bar span { display: block; height: 100%; background: #16a34a; }
    .vt-facemeta { font-size: 11.5px; color: var(--sc-muted); }

    .vt-body { padding: 0; }
    .vt-loading { padding: 22px; text-align: center; color: var(--sc-muted); font-size: 12.5px; }

    /* verdict strip — the card's own honest header */
    .vt-vstrip { display: flex; gap: 14px; align-items: flex-start; padding: 15px 18px; border-bottom: 1px solid var(--sc-border); }
    .vt-vstrip i { font-size: 26px; flex-shrink: 0; }
    .vt-vstrip-title { font-size: 15px; font-weight: 800; margin: 0; line-height: 1.25; }
    .vt-vstrip-sub { font-size: 12.5px; margin: 4px 0 0; color: var(--sc-text); }
    .vt-vstrip.unknown { background: rgba(120,113,108,0.07); color: #57534e; }
    .vt-vstrip.not_ready { background: rgba(239,68,68,0.07); color: #b91c1c; }
    .vt-vstrip.awaiting_signoff { background: rgba(245,158,11,0.09); color: #c2410c; }
    .vt-vstrip.in_progress { background: rgba(37,99,235,0.06); color: #1d4ed8; }
    .vt-vstrip.ready_for_controller_review, .vt-vstrip.evidence_complete { background: rgba(34,197,94,0.07); color: #15803d; }

    .vt-acts { display: flex; gap: 7px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--sc-border); background: #fcfbf9; }

    /* DD-report-style sections inside the card */
    .vt-sec { border-bottom: 1px solid var(--sc-border); }
    .vt-sec:last-child { border-bottom: none; }
    .vt-sec-head { display: flex; align-items: center; gap: 9px; padding: 12px 18px 0; flex-wrap: wrap; }
    .vt-sec-name { font-size: 11px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; color: var(--sc-muted); }
    .vt-sec-tag { font-size: 10.5px; font-weight: 700; color: var(--sc-muted); background: #ece9e2; border-radius: 20px; padding: 1px 8px; }
    .vt-sec-body { padding: 10px 18px 16px; }
    .vt-sec-spacer { flex: 1; }

    /* stage strip */
    .vt-stages { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .vt-stage {
      flex: 1 0 auto; min-width: 132px; border: 1px solid var(--sc-border);
      border-radius: 9px; padding: 11px 13px; background: #fff;
    }
    .vt-stage-lab { font-size: 13px; font-weight: 700; color: var(--sc-heading); }
    .vt-stage-num { font-size: 12px; color: var(--sc-muted); margin-top: 2px; }
    .vt-stage-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: #d6d3ce; }
    .vt-stage.NOT_STARTED { background: #fbfaf8; }
    .vt-stage.IN_PROGRESS { border-color: rgba(37,99,235,0.35); }
    .vt-stage.IN_PROGRESS .vt-stage-dot { background: #2563eb; }
    .vt-stage.COMPLETE { border-color: rgba(34,197,94,0.35); }
    .vt-stage.COMPLETE .vt-stage-dot { background: #16a34a; }
    .vt-stage.BLOCKED { border-color: rgba(239,68,68,0.45); background: rgba(239,68,68,0.05); }
    .vt-stage.BLOCKED .vt-stage-dot { background: #dc2626; }
    .vt-stage.current { box-shadow: 0 0 0 2px rgba(124,58,237,0.22); }

    /* requirement rows — the core of the officer's day */
    .vt-req { display: flex; align-items: flex-start; gap: 11px; padding: 10px 0; border-top: 1px dashed var(--sc-border); }
    .vt-req:first-child { border-top: none; }
    .vt-req-ico { font-size: 16px; width: 18px; text-align: center; flex-shrink: 0; margin-top: 1px; }
    .vt-req-main { flex: 1; min-width: 0; }
    .vt-req-lab { font-size: 13.5px; font-weight: 700; color: var(--sc-heading); }
    .vt-req-meta { font-size: 11.5px; color: var(--sc-muted); margin-top: 2px; }
    .vt-req-why { font-size: 11.5px; color: #b45309; margin-top: 3px; }
    .vt-req-acts { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
    .vt-req.OUTSTANDING .vt-req-ico { color: #dc2626; }
    .vt-req.PARTIAL .vt-req-ico { color: #d97706; }
    .vt-req.RECEIVED .vt-req-ico { color: #2563eb; }
    .vt-req.ACCEPTED .vt-req-ico { color: #16a34a; }
    .vt-req.WAIVED .vt-req-ico { color: #78716c; }
    .vt-req.WAIVED .vt-req-lab { text-decoration: line-through; color: var(--sc-muted); }
    .vt-state { font-size: 10px; font-weight: 800; letter-spacing: .6px; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; }
    .vt-state.OUTSTANDING { background: rgba(239,68,68,0.14); color: #b91c1c; }
    .vt-state.PARTIAL { background: rgba(245,158,11,0.16); color: #b45309; }
    .vt-state.RECEIVED { background: rgba(37,99,235,0.13); color: #1d4ed8; }
    .vt-state.ACCEPTED { background: rgba(34,197,94,0.15); color: #15803d; }
    .vt-state.WAIVED { background: rgba(120,113,108,0.13); color: #57534e; }

    /* coverage grid */
    .vt-cov-row { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
    .vt-cov-year { font-size: 12px; color: var(--sc-muted); width: 42px; flex-shrink: 0; font-family: ui-monospace, monospace; }
    .vt-cov-cell { width: 27px; height: 21px; border-radius: 4px; background: #efede9; font-size: 11px; color: #a8a29e; display: flex; align-items: center; justify-content: center; }
    .vt-cov-cell.VERIFIED { background: #16a34a; color: #fff; }
    .vt-cov-cell.UNVERIFIED { background: #fcd34d; color: #78350f; }
    .vt-cov-cell.UNDECLARED { background: #fca5a5; color: #7f1d1d; }
    .vt-cov-cell.none { background: #f5f4f1; color: #d6d3ce; }
    .vt-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--sc-muted); margin-top: 8px; }
    .vt-legend b { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

    /* findings + tables */
    .vt-find { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px dashed var(--sc-border); }
    .vt-find:first-child { border-top: none; }
    .vt-find-msg { font-size: 12.5px; margin: 0; }
    .vt-row { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px dashed var(--sc-border); font-size: 12.5px; }
    .vt-row:first-child { border-top: none; }
    .vt-row-main { flex: 1; min-width: 0; }
    .vt-row-name { font-weight: 600; color: var(--sc-heading); overflow-wrap: anywhere; }

    /* standard coverage disclosure */
    /* R-F3256 — 18px below, matching .vt-queue's own margin-bottom, so the
       gap above the queue equals the gap below it. `margin-top: 30px` was a
       leftover from when this block sat at the FOOT of the page; the title
       already carries its own 22px, so keeping it stacked two margins and
       left none underneath. The box butted straight into the stat tiles
       while everything below them was evenly spaced. */
    .vt-std { margin: 0 0 18px; background: #fff; border: 1px solid var(--sc-border); border-radius: 12px; padding: 0; }
    .vt-std > summary { padding: 14px 18px; cursor: pointer; list-style: none; font-size: 13px; font-weight: 700; color: var(--sc-heading); }
    .vt-std > summary::-webkit-details-marker { display: none; }
    /* The count travels with the title even when collapsed. */
    .vt-std-headline { font-weight: 600; color: var(--sc-muted); font-size: 12px; margin-left: 8px; }
    .vt-std > summary::after { content: '▾'; float: right; color: var(--sc-muted); }
    .vt-std[open] > summary::after { content: '▴'; }
    .vt-std-body { padding: 0 18px 18px; }
    .vt-clause { padding: 9px 0; border-top: 1px dashed var(--sc-border); font-size: 12.5px; }
    .vt-clause-id { font-family: ui-monospace, monospace; font-weight: 700; color: var(--sc-prime-dark, #6d28d9); }
  </style>
</head>
<body>
<div id="sidebar-placeholder"></div>
<div id="header-placeholder"></div>

<main id="app-main">
  <div class="vt-shell">

    <h1 class="vt-title">Vetting</h1>

    <!-- R-F3250 — the scope statement sits DIRECTLY under the title, above the
         queue, because it governs how everything below it should be read. At
         the foot of the page it was a footnote a user reaches after forming a
         view; here it is the first thing they see. It states the clause count
         AND what the module does not model, and the two travel together: a
         coverage figure read on its own reads as completeness. -->
    <details class="vt-std" id="standard">
      <summary>
        <i class="bi bi-journal-check"></i> Which parts of BS 7858 this module implements
        <span id="standard-headline" class="vt-std-headline">loading the clause register…</span>
      </summary>
      <div class="vt-std-body" id="standard-body">
        <div class="vt-loading">Loading the clause register…</div>
      </div>
    </details>

    <div id="queue" class="vt-queue"></div>
    <div id="retention-note" class="vt-pack" style="display:none"></div>

    <div class="vt-toolbar">
      <input class="vt-search" id="case-search" type="search"
             placeholder="Search by applicant name or case reference…"
             aria-label="Search vetting cases by applicant name or case reference">
      <button class="vt-btn" id="new-case-btn"><i class="bi bi-plus-lg"></i> New case</button>
      <button class="vt-btn secondary" id="refresh-btn"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
    </div>

    <div class="vt-search-note" id="search-note" style="display:none"></div>
    <div id="cases"><div class="vt-empty">Loading…</div></div>

  </div>
</main>

<script src="js/app.js?v=10"></script>
<script src="js/sidebar.js?v=13"></script>
<script>
// R-F4004 (C-83) — require a session BEFORE anything renders or fetches.
//
// This was the only authenticated PRODUCT page with neither a server-side page
// gate (lib/auth/operatorPages.mjs) nor a client-side check, so an anonymous
// visitor received the full chrome of a personnel-screening tool with every panel
// failing and no explanation. No data leaked — all nine APIs are gated — but a
// compliance product that renders a broken shell to strangers is not the
// impression it needs to make.
//
// Sidebar.init() does NOT imply auth: it renders navigation and nothing more. The
// page was relying on a function that never checked, which is why the gap
// survived. requireAuth() redirects to /signin.html and returns false, so the
// early return stops the page before it asks for data it cannot have.
if (!Auth.requireAuth()) {
  // Redirecting; do not initialise the page.
} else {
Sidebar.init('vetting');

// ── R-F3213 — the vetting case file ──────────────────────────────────────
//
// What changed and why. The card used to show five facts and five buttons.
// Everything the engine knew about a file — which documents were outstanding,
// where the screening had got to, which months of the career history were
// still uncovered, what the findings actually said — was either computed and
// never rendered (the coverage grid, live since R-F3177) or not computed at
// all. An officer could not answer "what does this file still need?" without
// running an assessment that then printed its findings into a panel at the
// bottom of the page, belonging to whichever case was assessed last.
//
// So: the PAGE is the queue, and the CARD is the file. Expanding a card loads
// that file's assessment, documents and request ledger and lays them out as
// sections, in the order an officer works: verdict, where we are, what is
// missing, what is covered, what the engine found, what we hold, what we have
// asked for.
//
// Honesty contract, inherited from R-F2819 and not negotiable here: nothing
// renders green until a real assessment has been read back from the server. A
// failed or unreachable /assess returns the card to UNKNOWN and says so. On a
// screening product a false clean is the one failure that matters.
(async () => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const STATUS_TEXT = {
    NOT_READY: ['Not ready', 'Blocking findings must be cleared before this file can go to review.'],
    AWAITING_SIGNOFF: ['Awaiting sign-off', 'Requires a documented top-management acceptance-of-risk decision.'],
    IN_PROGRESS: ['In progress', 'Outstanding actions remain on the checklist, documents or timeline.'],
    READY_FOR_CONTROLLER_REVIEW: ['Ready for controller review', 'Evidence is complete. A named human makes the employment decision. This module does not.'],
    EVIDENCE_COMPLETE: ['Evidence complete', 'Organised under a framework-only pack, which cannot issue jurisdictional decision-readiness.'],
  };
  const ICONS = {
    NOT_READY: 'bi-x-octagon-fill', AWAITING_SIGNOFF: 'bi-exclamation-triangle-fill',
    IN_PROGRESS: 'bi-hourglass-split', READY_FOR_CONTROLLER_REVIEW: 'bi-check-circle-fill',
    EVIDENCE_COMPLETE: 'bi-check-circle',
  };
  const STATUS_BADGE = {
    NOT_READY: ['sc-badge-red', 'Blocked'],
    AWAITING_SIGNOFF: ['sc-badge-orange', 'Sign-off'],
    IN_PROGRESS: ['sc-badge-blue', 'In progress'],
    READY_FOR_CONTROLLER_REVIEW: ['sc-badge-green', 'Ready for review'],
    EVIDENCE_COMPLETE: ['sc-badge-green', 'Evidence complete'],
  };
  const REQ_ICON = {
    OUTSTANDING: 'bi-circle', PARTIAL: 'bi-circle-half', RECEIVED: 'bi-record-circle',
    ACCEPTED: 'bi-check-circle-fill', WAIVED: 'bi-slash-circle',
  };
  const MONTHS = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
  const BASIS_TEXT = {
    STANDARD: 'required by the standard',
    STATUTORY: 'required by law',
    HOUSE_PRACTICE: 'house practice, not demanded by the standard',
    CLIENT_CONTRACT: 'asked for by the customer',
  };

  let PACKS = [];
  let DOC_TYPES = [];              // [{label, types:[...]}]
  let CASES = [];
  const DETAIL = new Map();        // case_id -> {assessment, documents, requests}
  const DETAIL_LOADING = new Set();

  function initials(name) {
    const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
  }

  // ── card face ──────────────────────────────────────────────────────────
  //
  // Sections ordered by what demands attention, not alphabetically or by date.
  // A screening queue's only real question is "what is stuck?", so blocked
  // files sort first and completed ones sink.
  const SECTIONS = [
    { key: 'NOT_READY', title: 'Blocked', hint: 'Blocking findings must clear before review',
      match: (c) => c.last_status === 'NOT_READY' },
    { key: 'AWAITING_SIGNOFF', title: 'Awaiting sign-off', hint: 'Needs a documented management decision',
      match: (c) => c.last_status === 'AWAITING_SIGNOFF' },
    { key: 'IN_PROGRESS', title: 'In progress', hint: 'Outstanding actions on the checklist, documents or timeline',
      match: (c) => c.last_status === 'IN_PROGRESS' },
    // R-F3172 — sits ABOVE the clean sections deliberately: a stale verdict is
    // the one most likely to be trusted, because it looks settled.
    { key: 'STALE', title: 'Changed since last assessment', hint: 'Re-assess. The recorded verdict no longer describes this file',
      match: (c) => c.assessment_stale },
    { key: 'UNKNOWN', title: 'Not yet assessed', hint: 'No assessment has been run. Status is unknown, not clear',
      match: (c) => !c.last_status },
    { key: 'DONE', title: 'Ready / complete', hint: 'Evidence complete; the decision is a human’s',
      match: (c) => c.last_status === 'READY_FOR_CONTROLLER_REVIEW'
                 || c.last_status === 'EVIDENCE_COMPLETE' },
  ];

  function caseCard(c) {
    const stale = !!c.assessment_stale;
    const [badgeCls, badgeText] = stale
      ? ['sc-badge-orange', 'Re-assess']
      : (STATUS_BADGE[c.last_status] || ['sc-badge-muted', 'Not assessed']);
    const asOf = !c.last_assessed_at
      ? 'never assessed'
      : stale ? `file changed since ${esc(c.last_assessed_at)}`
              : `assessed ${esc(c.last_assessed_at)}`;
    return `
      <details class="vt-case" data-case="${esc(c.case_id)}">
        <summary class="vt-summary">
          <span class="vt-avatar">${esc(initials(c.applicant_name))}</span>
          <span class="vt-ident">
            <span class="vt-name">${esc(c.applicant_name || '(unnamed)')}</span>
            <span class="vt-ref">${esc(c.case_id)} · ${esc(asOf)} · BS 7858:2019</span>
            <span class="vt-face" data-face-for="${esc(c.case_id)}">
              <span class="vt-facemeta">${esc(Number(c.document_count || 0))} document(s) on file, expand for detail</span>
            </span>
          </span>
          <span class="sc-badge ${esc(badgeCls)} vt-status">${esc(badgeText)}</span>
          <i class="bi bi-chevron-down vt-chev" aria-hidden="true"></i>
        </summary>
        <div class="vt-body" data-body-for="${esc(c.case_id)}">
          <div class="vt-loading"><i class="bi bi-hourglass-split"></i> Opening the file…</div>
        </div>
      </details>`;
  }

  function renderSections(cases) {
    const used = new Set();
    let html = '';
    for (const section of SECTIONS) {
      const rows = cases.filter((c) => !used.has(c.case_id) && section.match(c));
      rows.forEach((c) => used.add(c.case_id));
      if (!rows.length) continue;
      html += `
        <div class="vt-section">
          <div class="vt-section-head">
            <span class="vt-section-name">${esc(section.title)}</span>
            <span class="vt-section-count">${esc(rows.length)}</span>
            <span class="vt-section-hint">${esc(section.hint)}</span>
          </div>
          <div>${rows.map(caseCard).join('')}</div>
        </div>`;
    }
    // Anything the sections did not claim still has to appear — a case that
    // silently vanishes from a screening queue is the worst possible bug here.
    const orphans = cases.filter((c) => !used.has(c.case_id));
    if (orphans.length) {
      html += `<div class="vt-section">
        <div class="vt-section-head"><span class="vt-section-name">Other</span>
        <span class="vt-section-count">${esc(orphans.length)}</span></div>
        <div>${orphans.map(caseCard).join('')}</div></div>`;
    }
    return html;
  }

  function renderQueue(cases) {
    const count = (fn) => cases.filter(fn).length;
    const stats = [
      ['red', count((c) => c.last_status === 'NOT_READY'), 'Blocked'],
      ['orange', count((c) => c.last_status === 'AWAITING_SIGNOFF'), 'Awaiting sign-off'],
      ['blue', count((c) => c.last_status === 'IN_PROGRESS'), 'In progress'],
      ['orange', count((c) => c.assessment_stale), 'Need re-assessing'],
      // Deliberately labelled "Not assessed", never folded into a clean count:
      // an unassessed file's status is unknown, and unknown is not clear.
      ['', count((c) => !c.last_status), 'Not assessed'],
      ['green', count((c) => c.last_status === 'READY_FOR_CONTROLLER_REVIEW'
                          || c.last_status === 'EVIDENCE_COMPLETE'), 'Ready / complete'],
    ];
    $('queue').innerHTML = stats.map(([tone, n, label]) => `
      <div class="vt-qstat ${esc(tone)}">
        <div class="vt-qstat-num">${esc(n)}</div>
        <div class="vt-qstat-lab">${esc(label)}</div>
      </div>`).join('');
  }

  // ── the file, section by section ───────────────────────────────────────
  function sec(name, tag, body, extra) {
    return `<div class="vt-sec">
      <div class="vt-sec-head">
        <span class="vt-sec-name">${esc(name)}</span>
        ${tag ? `<span class="vt-sec-tag">${esc(tag)}</span>` : ''}
        <span class="vt-sec-spacer"></span>${esc(extra || '')}
      </div>
      <div class="vt-sec-body">${body}</div>
    </div>`;
  }

  function verdictStrip(a) {
    const known = STATUS_TEXT[a && a.status];
    if (!known) {
      return `<div class="vt-vstrip unknown">
        <i class="bi bi-question-circle"></i>
        <div><p class="vt-vstrip-title">Assessment unavailable</p>
        <p class="vt-vstrip-sub">No conclusion can be drawn from this. Run an assessment.</p></div></div>`;
    }
    const c = a.counts || {};
    const pack = a.pack || {};
    const period = a.screening_period || [];
    return `<div class="vt-vstrip ${esc(String(a.status).toLowerCase())}">
      <i class="bi ${esc(ICONS[a.status] || 'bi-question-circle')}"></i>
      <div>
        <p class="vt-vstrip-title">${esc(known[0])}</p>
        <p class="vt-vstrip-sub">${esc(known[1])}</p>
        <p class="vt-vstrip-sub"><strong>${esc(Number(c.blockers || 0))}</strong> blocker(s) ·
          <strong>${esc(Number(c.signoffs || 0))}</strong> sign-off(s) ·
          <strong>${esc(Number(c.actions || 0))}</strong> action(s)</p>
        <p class="vt-ref" style="margin-top:5px">BS 7858:2019 · United Kingdom ·
          screening period ${esc(period[0])} → ${esc(period[1])} · assessed as of ${esc(a.as_of)}</p>
        ${pack.employment_decision_eligible ? '' :
          `<p class="vt-vstrip-sub" style="color:#b45309">FRAMEWORK-ONLY pack. It organises and grades
           evidence but cannot state whether screening is lawful or sufficient in any jurisdiction.</p>`}
      </div></div>`;
  }

  function stagesSection(a) {
    const stages = a.stages || [];
    if (!stages.length) return '';
    const body = `<div class="vt-stages">${stages.map((s) => `
      <div class="vt-stage ${esc(s.state)} ${esc(s.key === a.current_stage ? 'current' : '')}"
           title="${esc((s.outstanding || []).join(' · ') || s.hint)}">
        <div class="vt-stage-lab"><span class="vt-stage-dot"></span>${esc(s.label)}</div>
        <div class="vt-stage-num">${esc(s.total ? `${s.done}/${s.total} done` : 'nothing outstanding')}${
          s.blockers ? ` · <span style="color:#dc2626">${esc(s.blockers)} blocker(s)</span>` : ''}</div>
      </div>`).join('')}</div>
      <p class="vt-note">Derived from the file on every assessment, never advanced by hand.
        A stage completes when its evidence is present and nothing in it is still flagged.</p>`;
    const current = stages.find((s) => s.key === a.current_stage);
    return sec('Where this file is', current ? current.label : '', body);
  }

  // ── R-F3266: is a newer PRODUCTION version of this case's pack available? ──
  //
  // Compared NUMERICALLY. A string compare puts "1.9.0" above "1.10.0", which
  // would quietly stop offering the upgrade at the tenth revision — the exact
  // bug R-F3175 fixed on the server side of this same question.
  function packVersionKey(v) {
    return String(v || '').split('.').map((c) => parseInt(c.replace(/\D/g, ''), 10) || 0);
  }
  function packVersionNewer(a, b) {          // a > b ?
    const x = packVersionKey(a), y = packVersionKey(b);
    for (let i = 0; i < Math.max(x.length, y.length); i++) {
      const d = (x[i] || 0) - (y[i] || 0);
      if (d) return d > 0;
    }
    return false;
  }
  function newerPackFor(a) {
    const cur = a && a.pack;
    if (!cur || !cur.pack_id || !cur.version) return null;
    // PACKS is already filtered to PRODUCTION — a case must never be offered a
    // move onto a DRAFT pack, which the server refuses anyway.
    return (PACKS || [])
      .filter((p) => p.pack_id === cur.pack_id && packVersionNewer(p.version, cur.version))
      .sort((p, q) => (packVersionNewer(p.version, q.version) ? -1 : 1))[0] || null;
  }
  function upgradeButton(caseId, a) {
    const next = newerPackFor(a);
    if (!next) return '';
    return `<button class="vt-btn secondary sm" data-migrate="${esc(caseId)}"
              data-to="${esc(next.version)}" title="Move this case onto ${esc(next.pack_id)} v${esc(next.version)}">
              <i class="bi bi-arrow-up-circle"></i> Update rules to v${esc(next.version)}</button>`;
  }

  function requirementsSection(caseId, a) {
    const reqs = a.requirements || [];
    const s = a.requirements_summary || {};
    const add = `<button class="vt-btn secondary sm" data-addreq="${esc(caseId)}">
      <i class="bi bi-plus-lg"></i> Add requirement</button>`;
    if (!reqs.length) {
      return sec('Required documents', 'none defined',
        `<div class="vt-empty">This historical case has no document requirements.
         Do not treat it as BS 7858 complete. An administrator must bring it onto
         the active standard before a decision is recorded.</div>`, add);
    }
    const rows = reqs.map((r) => {
      const acts = [];
      if (r.state !== 'WAIVED') {
        acts.push(`<label class="vt-btn secondary sm" style="margin:0">
          <i class="bi bi-upload"></i> Upload
          <input type="file" hidden data-upload-req="${esc(r.key)}" data-case="${esc(caseId)}"
                 data-type="${esc((r.accepted || [])[0] || 'OTHER')}">
        </label>`);
      }
      (r.documents || []).forEach((d) => {
        acts.push(`<button class="vt-btn secondary sm" data-view="${esc(d.document_id)}"
          data-case="${esc(caseId)}"><i class="bi bi-eye"></i> View</button>`);
      });
      if (r.state === 'WAIVED') {
        acts.push(`<button class="vt-btn secondary sm" data-unwaive="${esc(r.key)}"
          data-case="${esc(caseId)}">Restore</button>`);
      } else {
        acts.push(`<button class="vt-btn secondary sm" data-waive="${esc(r.key)}"
          data-case="${esc(caseId)}" data-label="${esc(r.label)}">Waive</button>`);
      }
      if (r.origin === 'MANUAL') {
        acts.push(`<button class="vt-btn secondary sm" data-delreq="${esc(r.key)}"
          data-case="${esc(caseId)}" title="Remove this manually added requirement">
          <i class="bi bi-x-lg"></i></button>`);
      }

      const why = [];
      (r.documents || []).forEach((d) => {
        (d.reasons || []).forEach((x) => why.push(x));
        (d.sighting_reasons || []).forEach((x) => why.push(x));
      });
      const count = r.needed > 1 ? `${r.held} of ${r.needed}` : (r.held ? 'on file' : 'not on file');
      return `<div class="vt-req ${esc(r.state)}">
        <i class="bi ${esc(REQ_ICON[r.state] || 'bi-circle')} vt-req-ico"></i>
        <div class="vt-req-main">
          <div class="vt-req-lab">${esc(r.label)}
            <span class="vt-state ${esc(r.state)}">${esc(r.state)}</span></div>
          <div class="vt-req-meta">${esc(count)} ·
            ${esc(r.reference || 'no reference')} · ${esc(BASIS_TEXT[r.basis] || r.basis)}
            ${esc(r.origin === 'MANUAL' ? ' · added by hand' : '')}</div>
          ${r.note ? `<div class="vt-req-meta">${esc(r.note)}</div>` : ''}
          ${r.state === 'WAIVED'
            ? `<div class="vt-req-why">Waived by ${esc(r.waived_by)}: ${esc(r.waived_reason)}.
               It is not satisfied; it is no longer being pursued.</div>`
            : ''}
          ${why.length ? `<div class="vt-req-why"><i class="bi bi-exclamation-triangle"></i>
             ${esc(why.slice(0, 3).join(' · '))}</div>` : ''}
        </div>
        <div class="vt-req-acts">${acts.join('')}</div>
      </div>`;
    }).join('');

    return sec('Required documents',
      `${s.accepted || 0}/${s.total || 0} accepted`,
      rows + `<p class="vt-note">ACCEPTED means the document is on the file and nothing about it is
        still waiting on a person. RECEIVED means it arrived but has not been read, or the original
        has not been sighted, present is not checked.</p>`,
      add);
  }

  function coverageSection(a) {
    const cells = a.coverage || [];
    if (!cells.length) return '';
    const cs = a.coverage_summary || {};
    const byYear = new Map();
    cells.forEach((c) => {
      if (!byYear.has(c.year)) byYear.set(c.year, new Array(12).fill(null));
      byYear.get(c.year)[c.month - 1] = c.state;
    });
    const rows = [...byYear.entries()].map(([year, months]) => `
      <div class="vt-cov-row"><span class="vt-cov-year">${esc(year)}</span>
        ${months.map((state, i) => `<span class="vt-cov-cell ${esc(state || 'none')}"
          title="${esc(year)}-${esc(String(i + 1).padStart(2, '0'))}: ${esc(state || 'outside the screening period')}"
          >${esc(MONTHS[i])}</span>`).join('')}</div>`).join('');
    return sec('Career timeline coverage',
      `${cs.verified || 0} verified · ${cs.unverified || 0} declared · ${cs.undeclared || 0} uncovered`,
      rows + `<div class="vt-legend">
        <span><b style="background:#16a34a"></b>verified</span>
        <span><b style="background:#fcd34d"></b>declared, not yet verified</span>
        <span><b style="background:#fca5a5"></b>nothing covers this month</span>
        <span><b style="background:#f5f4f1"></b>outside the screening period</span>
      </div>
      <p class="vt-note">A navigation aid, not the compliance test. The grid works in months; the
        31-day unverified limit works in days, so the findings below remain the authority.</p>`);
  }

  // ── R-F3274 — the periods the coverage grid is computed from ──────────────
  //
  // The grid says WHICH months are covered; it cannot say which periods a
  // human typed and which a model read off an application form. Now that
  // extraction can propose periods, that is the first thing an officer needs
  // to be able to see — an unattributed period on a screening file is an
  // assertion with nobody behind it.
  const PERIOD_STATE = {
    VERIFIED: ['#16a34a', 'verified'],
    EVIDENCE_RECEIVED: ['#2563eb', 'evidence received, not yet verified'],
    COVERED_BY_STAT_DEC: ['#7c3aed', 'covered by statutory declaration'],
    VERIFICATION_FAILED: ['#dc2626', 'verification failed'],
    UNVERIFIED: ['#d97706', 'declared, no evidence yet'],
  };

  function periodsSection(a) {
    const entries = a.career || [];
    if (!entries.length) {
      return sec('Declared periods', 'none on file',
        `<div class="vt-empty">No career periods are on this file yet, which is why the grid
         above is entirely uncovered. Upload the application form and the declared history is
         read from it, or add periods by hand.</div>`);
    }
    const extracted = entries.filter((e) => e.source === 'EXTRACTED_FROM_DOCUMENT').length;
    const rows = entries.map((e) => {
      const [colour, label] = PERIOD_STATE[e.state] || ['#78716c', String(e.state || '')];
      const docs = (e.supporting_documents || []).length;
      return `<div class="vt-find">
        <span class="vt-pill" style="background:${esc(colour)}1f;color:${esc(colour)}">${esc(e.state)}</span>
        <div class="vt-row-main">
          <p class="vt-find-msg">${esc(e.organisation || e.entry_type)}
            <span class="vt-ref">${esc(e.start)} → ${esc(e.end || 'present')}</span></p>
          <span class="vt-ref">${esc(e.entry_type)} · ${esc(label)} ·
            ${esc(docs)} document(s)${esc(e.referee_name ? ' · referee ' + esc(e.referee_name) : '')}</span>
          ${e.source === 'EXTRACTED_FROM_DOCUMENT' ? `<p class="vt-note" style="margin-top:3px">
            Read from a document on this file. This is the applicant's declaration as a model read it,
            not confirmed by a person. Check it against the document before relying on it.</p>` : ''}
        </div></div>`;
    }).join('');
    return sec('Declared periods', `${entries.length} period(s)`,
      rows + (extracted ? `<p class="vt-note">${esc(extracted)} of these were read from an uploaded
        document. Nothing read from a document is ever recorded as verified: a document arriving
        is evidence received, and verification stays a person's decision.</p>` : ''));
  }

  function findingsSection(a) {
    const actions = a.next_actions || [];
    const body = actions.length
      ? actions.map((f) => `
        <div class="vt-find">
          <span class="vt-pill ${esc(String(f.priority || '').toLowerCase())}">${esc(f.priority)}</span>
          <div class="vt-row-main">
            <p class="vt-find-msg">${esc(f.action)}</p>
            <span class="vt-ref">${esc(f.code)} · ${esc(f.reference)}${esc(f.due_date ? ' · due ' + esc(f.due_date) : '')}</span>
          </div>
        </div>`).join('')
      : '<div class="vt-empty">No outstanding actions were returned for this assessment.</div>';
    const notes = (a.controller_notes || []).join(' · ');
    return sec('ARIA action plan', String(actions.length),
      body + (notes ? `<p class="vt-note">${esc(notes)}</p>` : ''));
  }

  function documentsSection(caseId, docs) {
    if (!docs) {
      return sec('Documents on file', 'unavailable',
        '<div class="vt-error">The document list could not be loaded. Nothing can be concluded from that. It is not an empty file.</div>');
    }
    if (!docs.length) {
      return sec('Documents on file', '0',
        '<div class="vt-empty">Nothing has been uploaded to this case yet.</div>');
    }
    const rows = docs.map((d) => {
      const integrity = d.integrity || {};
      const bad = integrity.artifact_valid === false || integrity.metadata_valid === false;
      return `<div class="vt-row">
        <div class="vt-row-main">
          <div class="vt-row-name">${esc(d.filename || '(no filename)')}</div>
          <span class="vt-ref">${esc(d.doc_type)}${esc(d.issuer ? ' · ' + esc(d.issuer) : '')}${
            esc(d.covers_from ? ' · covers ' + esc(d.covers_from) + '→' + esc(d.covers_to || '') : '')}
            · sighting ${esc(d.sighting)}${esc(d.examined_by ? ' by ' + esc(d.examined_by) : '')}
            · ${esc(d.encrypted ? 'encrypted' : 'NOT encrypted')}</span>
          ${bad ? '<div class="vt-req-why">Integrity verification FAILED. Do not rely on this copy.</div>' : ''}
        </div>
        <button class="vt-btn secondary sm" data-sighting="${esc(d.document_id)}" data-case="${esc(caseId)}">
          <i class="bi bi-eyeglasses"></i> Sighting</button>
        ${d.viewable
          ? `<button class="vt-btn secondary sm" data-view="${esc(d.document_id)}" data-case="${esc(caseId)}">
               <i class="bi bi-eye"></i> View</button>`
          : '<span class="vt-ref">not retrievable</span>'}
      </div>`;
    }).join('');
    return sec('Documents on file', String(docs.length), rows);
  }

  function requestsSection(caseId, data) {
    if (!data) return '';
    const rows = data.requests || [];
    const s = data.summary || {};
    const body = rows.length
      ? rows.map((r) => `<div class="vt-row">
          <span class="vt-pill ${esc(r.overdue ? 'deadline' : (r.is_open ? 'action' : 'info'))}">${esc(r.code)}</span>
          <div class="vt-row-main">
            <div class="vt-row-name">${esc(r.label)} · ${esc(r.sent_to)}</div>
            <span class="vt-ref">sent ${esc(r.sent_at)}${esc(r.channel ? ' by ' + esc(r.channel) : '')} ·
              ${esc(r.status)}${esc(r.is_open ? ` · ${r.days_outstanding} day(s) outstanding` : '')}${
                esc(r.overdue ? ' · OVERDUE' : '')}</span>
          </div>
        </div>`).join('')
      : '<div class="vt-empty">Nothing has been requested on this case yet. Sharing a referee link records the request automatically.</div>';
    return sec('Verification requests',
      `${s.open || 0} open · ${s.overdue || 0} overdue`, body);
  }

  // ── loading one file ───────────────────────────────────────────────────
  async function loadDetail(caseId, force) {
    const body = document.querySelector(`[data-body-for="${CSS.escape(caseId)}"]`);
    if (!body) return;
    if (DETAIL.has(caseId) && !force) { paint(caseId); return; }
    if (DETAIL_LOADING.has(caseId)) return;
    DETAIL_LOADING.add(caseId);
    body.innerHTML = '<div class="vt-loading"><i class="bi bi-hourglass-split"></i> Opening the file…</div>';

    try {
      // The assessment is the authority; documents and the ledger are context.
      // A failure in either context call must not block the verdict, and must
      // not be rendered as "none" — see documentsSection.
      const [assessment, documents, requests] = await Promise.all([
        authed(`/api/aria/vetting/case/${encodeURIComponent(caseId)}/assess`, { method: 'POST' })
          .then((r) => (r.ok ? r.json() : null)).catch(() => null),
        authed(`/api/aria/vetting/case/${encodeURIComponent(caseId)}/documents`)
          .then((r) => (r.ok ? r.json() : null)).catch(() => null),
        authed(`/api/aria/vetting/case/${encodeURIComponent(caseId)}/requests`)
          .then((r) => (r.ok ? r.json() : null)).catch(() => null),
      ]);
      DETAIL.set(caseId, {
        assessment,
        documents: documents ? (documents.documents || []) : null,
        requests,
      });
      paint(caseId);
      refreshFace(caseId);
    } finally {
      DETAIL_LOADING.delete(caseId);
    }
  }

  function paint(caseId) {
    const body = document.querySelector(`[data-body-for="${CSS.escape(caseId)}"]`);
    const detail = DETAIL.get(caseId);
    if (!body || !detail) return;
    const a = detail.assessment;
    const actions = `<div class="vt-acts">
      <button class="vt-btn secondary sm" data-assess="${esc(caseId)}"><i class="bi bi-clipboard-check"></i> Re-assess</button>
      <button class="vt-btn secondary sm" data-watch="${esc(caseId)}"><i class="bi bi-eye"></i> Monitor</button>
      <label class="vt-btn secondary sm" style="margin:0"><i class="bi bi-upload"></i> Upload document
        <input type="file" hidden data-upload-req="" data-case="${esc(caseId)}" data-type="OTHER"></label>
      <button class="vt-btn secondary sm" data-share="${esc(caseId)}"><i class="bi bi-qr-code"></i> Share link</button>
      <button class="vt-btn secondary sm" data-interview="${esc(caseId)}"><i class="bi bi-mic"></i> Record interview</button>
      <button class="vt-btn secondary sm" data-decide="${esc(caseId)}"><i class="bi bi-person-check"></i> Decide</button>
      <button class="vt-btn secondary sm" data-sar="${esc(caseId)}"><i class="bi bi-file-earmark-person"></i> Subject access</button>
    </div>`;

    if (!a) {
      body.innerHTML = verdictStrip(null) + actions + sec('This file', '',
        '<div class="vt-error">The assessment could not be completed, so nothing about this file is being asserted. Try Re-assess.</div>');
      return;
    }
    body.innerHTML =
      verdictStrip(a) + actions +
      stagesSection(a) +
      requirementsSection(caseId, a) +
      coverageSection(a) +
      periodsSection(a) +
      findingsSection(a) +
      documentsSection(caseId, detail.documents) +
      requestsSection(caseId, detail.requests);
  }

  function refreshFace(caseId) {
    const face = document.querySelector(`[data-face-for="${CSS.escape(caseId)}"]`);
    const detail = DETAIL.get(caseId);
    if (!face || !detail || !detail.assessment) return;
    const a = detail.assessment;
    const s = a.requirements_summary || {};
    const total = Number(s.total || 0);
    const done = Number(s.accepted || 0);
    const pct = total ? Math.round((done / total) * 100) : 0;
    const c = a.counts || {};
    face.innerHTML =
      `<span class="vt-bar"><span style="width:${esc(pct)}%"></span></span>` +
      `<span class="vt-facemeta">${esc(done)}/${esc(total)} documents accepted · ` +
      `${esc(Number(c.blockers || 0))} blocker(s) · ${esc(Number(c.actions || 0))} action(s)</span>`;
    // Keep the badge honest after a re-assess without a full list reload.
    const card = document.querySelector(`[data-case="${CSS.escape(caseId)}"]`);
    const badge = card && card.querySelector('.vt-status');
    if (badge && STATUS_BADGE[a.status]) {
      badge.className = `sc-badge ${STATUS_BADGE[a.status][0]} vt-status`;
      badge.textContent = STATUS_BADGE[a.status][1];
    }
  }

  // ── loaders ────────────────────────────────────────────────────────────
  async function loadPacks() {
    try {
      const r = await authed('/api/aria/vetting/packs');
      if (!r.ok) return;
      PACKS = ((await r.json()).packs || []).filter((p) => p.status === 'PRODUCTION');
    } catch (e) { /* the dialog reports this; never block page load */ }
  }

  async function loadDocTypes() {
    try {
      const r = await authed('/api/aria/vetting/document-types');
      if (r.ok) DOC_TYPES = (await r.json()).groups || [];
    } catch (e) { /* the picker falls back to OTHER */ }
  }

  function docTypeOptions(selected) {
    // Flattened from the SERVER's grouping, so the picker cannot offer a type
    // the engine would reject.
    const out = [];
    DOC_TYPES.forEach((g) => (g.types || []).forEach((t) => {
      out.push({ value: t, label: `${g.label} · ${t.replace(/_/g, ' ').toLowerCase()}` });
    }));
    if (!out.length) out.push({ value: 'OTHER', label: 'Other' });
    if (selected && !out.some((o) => o.value === selected)) {
      out.unshift({ value: selected, label: selected });
    }
    return out;
  }

  // ── R-F3269: finding a named file ──────────────────────────────────────
  //
  // The filter narrows the LIST only. The stat strip above it answers "what
  // needs me today?" about the whole caseload, and a search that could empty
  // it would render "Blocked 0" — a statement about the text box that reads as
  // a statement about the queue. renderQueue is therefore always handed CASES.
  //
  // Matching covers the name and the case reference because both are printed
  // on the face of every card, and the reference is how a file gets referred
  // to out loud. Pack id is deliberately not matched: every case shares one,
  // so it would return the whole queue and look like a bug.
  function applyCaseSearch() {
    const q = (($('case-search') || {}).value || '').trim().toLowerCase();
    const filtered = q
      ? CASES.filter((c) => (c.applicant_name || '').toLowerCase().includes(q)
                         || (c.case_id || '').toLowerCase().includes(q))
      : CASES;

    const note = $('search-note');
    if (note) {
      // While a filter is active the page states the size of what it is
      // hiding. A screening list that silently drops files is the worst bug
      // this page can carry.
      note.style.display = q ? '' : 'none';
      note.textContent = q
        ? `Showing ${filtered.length} of ${CASES.length} case(s) matching “${q}”.`
        : '';
    }

    if (!filtered.length) {
      $('cases').innerHTML = q
        ? `<div class="vt-empty">No case matches “${esc(q)}”. Try part of the applicant's
             name or the case reference, or clear the search.</div>`
        : '<div class="vt-empty">No vetting cases yet. Create one to begin.</div>';
      return;
    }
    $('cases').innerHTML = renderSections(filtered);
  }

  function renderCases() {
    renderQueue(CASES);          // always the full caseload — never filtered
    applyCaseSearch();
  }

  async function loadCases() {
    try {
      // limit=500 is the endpoint's ceiling. The default is 50, and filtering
      // client-side over a 50-case window would answer "no case matches" for a
      // case that exists — the one answer a screening queue must never give.
      const r = await authed('/api/aria/vetting/cases?limit=500');
      if (!r.ok) {
        $('cases').innerHTML = `<div class="vt-error">Could not load cases (HTTP ${esc(r.status)}).</div>`;
        return;
      }
      CASES = (await r.json()).cases || [];
      renderCases();
    } catch (e) {
      $('cases').innerHTML = '<div class="vt-error">Could not reach the vetting service.</div>';
    }
  }

  // R-F3214 — what the module implements, and what it does not.
  //
  // The scope limits render alongside the count, never behind a second click.
  // A coverage figure read on its own reads as completeness.
  async function loadStandard() {
    const body = $('standard-body');
    const headline = $('standard-headline');
    if (!body) return;
    try {
      const r = await authed('/api/aria/vetting/standard');
      if (!r.ok) {
        body.innerHTML = '<div class="vt-error">The clause register could not be loaded.</div>';
        // Never leave the collapsed line implying coverage we could not read.
        if (headline) headline.textContent = 'coverage unavailable, could not be read';
        return;
      }
      const d = await r.json();
      const c = d.counts || {};
      // The collapsed line carries BOTH numbers. "26 clauses implemented" on
      // its own is the completeness claim this register exists to refuse, so
      // the scope limit is never one click away from the count.
      if (headline) {
        headline.textContent =
          `${c.encoded || 0} clauses implemented · ${(d.not_modelled || []).length} stated scope limits`;
      }
      const rows = (d.clauses || []).map((x) => `
        <div class="vt-clause">
          <span class="vt-clause-id">${esc(x.clause)}</span> · <strong>${esc(x.title)}</strong>
          <span class="vt-state ${esc(x.status === 'ENCODED' ? 'ACCEPTED' : (x.status === 'OPERATOR_CONTROL' ? 'RECEIVED' : 'OUTSTANDING'))}">${esc(x.status)}</span>
          <div style="margin-top:3px">${esc(x.requirement)}</div>
          <div class="vt-ref" style="margin-top:3px">${esc((x.implemented_by || []).join(' · '))}${
            esc(x.verified_on ? ' · read against the licensed standard ' + esc(x.verified_on) : ' · NOT verified')}</div>
          ${x.note ? `<div class="vt-req-meta">${esc(x.note)}</div>` : ''}
        </div>`).join('');
      body.innerHTML =
        `<p style="font-size:13px;margin:0 0 10px"><strong>${esc(d.honest_summary)}</strong></p>` +
        `<p class="vt-ref" style="margin-bottom:12px">${esc(c.encoded)} encoded · ${esc(c.corroborated)} corroborated against the live pack · ` +
        `${esc(c.claimed_not_corroborated)} claiming code the pack cannot corroborate · ${esc(c.operator_control)} organisational controls</p>` +
        `<div class="vt-pack vt-pack-warn"><i class="bi bi-exclamation-triangle"></i><div>
           <strong>Not modelled.</strong><ul style="margin:6px 0 0;padding-left:18px">` +
        (d.not_modelled || []).map((x) => `<li>${esc(x)}</li>`).join('') +
        `</ul></div></div>` + rows +
        `<p class="vt-note">${esc(d.copyright_note)}</p>`;
    } catch (e) {
      body.innerHTML = '<div class="vt-error">The clause register could not be loaded.</div>';
      if (headline) headline.textContent = 'coverage unavailable, could not be read';
    }
  }

  // R-F3210 — the officer says WHAT they are uploading.
  //
  // The control used to send `declared_doc_type: "OTHER"` for every file, so
  // every real document landed as OTHER — and OTHER satisfies no requirement.
  // That was not cosmetic: PDFs and images are not text-extractable here by
  // design, so the declaration is the only signal there is for most uploads.
  async function upload(caseId, file, presetType) {
    let career = [];
    try {
      const r = await authed('/api/aria/vetting/case/' + encodeURIComponent(caseId));
      if (r.ok) career = ((await r.json()).career || []);
    } catch (e) { /* attaching to a period is optional */ }

    const values = await Modal.form({
      title: 'Add a document to the file',
      message: `${file.name} · ${(file.size / 1024).toFixed(0)} KB`,
      icon: 'bi-file-earmark-arrow-up',
      okLabel: 'Upload',
      fields: [
        { name: 'declared_doc_type', label: 'What is this document?', type: 'select',
          required: true, autofocus: true, value: presetType || 'OTHER',
          options: docTypeOptions(presetType),
          // R-F3265 made this text false: PDFs, images, DOCX and emails ARE
          // read now. Leaving "nothing here reads a PDF" in place would have
          // the page asserting a limitation the product no longer has, which
          // is its own kind of dishonesty.
          help: 'The file is read where it can be: PDF, scan, photo, DOCX, or an email and '
              + 'its attachments. What is read is recorded as DECLARED, never as verified, '
              + 'and your answer here wins if the two disagree.' },
        { name: 'attach_to_entry_id', label: 'Evidence for which period? (optional)', type: 'select',
          options: [{ value: '', label: '(not tied to a career period)' }].concat(
            career.map((e) => ({ value: e.entry_id,
              label: `${e.organisation || e.entry_type} (${e.start} → ${e.end || 'present'})` }))),
          help: 'Optional. A document that states the period it covers is matched to the '
              + 'overlapping periods on its own; naming one here overrides that.' },
      ],
    });
    if (!values) return;

    Toast.show('Uploading…', 'info', 2000);
    try {
      const buf = await file.arrayBuffer();
      const bytes = new Uint8Array(buf);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      const r = await authed(`/api/aria/vetting/case/${encodeURIComponent(caseId)}/documents`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          filename: file.name, content_base64: btoa(binary),
          declared_doc_type: values.declared_doc_type,
          attach_to_entry_id: values.attach_to_entry_id || null,
        }),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) {
        Toast.show(`Upload failed (HTTP ${r.status}). The document was NOT added to the file.`, 'danger', 9000);
        return;
      }
      // R-F3274 — say what the document DID to the timeline, including when
      // the answer is "nothing, because …". A bare "stored" leaves the officer
      // unable to tell a document that evidenced a period from one that was
      // filed and ignored.
      const t = body.timeline || {};
      const linked = (t.linked_entry_ids || []).length;
      const created = (t.created_entry_ids || []).length;
      let what = '';
      if (created) what = `, ${created} declared period(s) read from it`;
      else if (linked) what = `, evidence against ${linked} period(s)`;
      else if (t.reason) what = `, not applied to the timeline: ${t.reason}`;
      Toast.show(
        `${body.doc_type} stored` + what
        + (body.needs_human_review ? ' · needs your review' : ''),
        body.needs_human_review ? 'info' : 'success', linked || created ? 6000 : 9000);
      await loadDetail(caseId, true);
    } catch (e) {
      Toast.show('Upload failed. The service was unreachable. The document was NOT added.', 'danger', 9000);
    }
  }

  // R-F3209 — open a stored document.
  //
  // Fetched with the auth header and handed to the browser as a blob, rather
  // than linked directly: the API is reached through the authenticated proxy,
  // so a bare <a href> would arrive without credentials and 401. The object
  // URL is revoked on a timer so the decrypted bytes do not sit in the page.
  async function viewDocument(caseId, documentId) {
    try {
      const r = await authed(
        `/api/aria/vetting/case/${encodeURIComponent(caseId)}/documents/${encodeURIComponent(documentId)}/content`);
      if (!r.ok) {
        const body = await r.json().catch(() => ({}));
        Toast.show(
          (body && body.detail && body.detail.message)
            || `That document could not be opened (HTTP ${r.status}).`, 'danger', 9000);
        return;
      }
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const opened = window.open(url, '_blank', 'noopener');
      if (!opened) Toast.show('Your browser blocked the document window.', 'info', 6000);
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e) {
      Toast.show('That document could not be opened. The service was unreachable.', 'danger', 9000);
    }
  }
