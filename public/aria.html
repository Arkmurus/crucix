<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARIA — ARKMURUS</title>
  <link rel="icon" type="image/png" href="images/fav-icon/icon.png">
  <link rel="stylesheet" href="css/crucix.css?v=3">
  <link rel="stylesheet" href="fonts/bootstrap-icons/font-css.css">
  <style>
    /* ── Claude-warm-dark palette (R-F533, 2026-05-15) ──
       Replaces the high-saturation #0c0919 brand dark with a calmer
       charcoal+off-white scheme; purple retained only on accent
       surfaces (send button, active row tint, ARIA badge, focus ring). */
    :root {
      --warm-bg: #1a1a1a;
      --warm-bg-sidebar: #171717;
      --warm-bg-input: #232323;
      --warm-border: rgba(255,255,255,0.07);
      --warm-border-strong: rgba(255,255,255,0.14);
      --warm-hover: rgba(255,255,255,0.04);
      --warm-active: rgba(255,255,255,0.08);
      --warm-text: #ececec;
      --warm-text-muted: rgba(255,255,255,0.58);
      --warm-text-faint: rgba(255,255,255,0.32);
      --warm-bubble-user: #2a2a2a;
      --accent: #c896ff;
      --accent-strong: #a875ff;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--warm-bg); font-family: 'Gordita', system-ui, -apple-system, sans-serif; color: var(--warm-text); }

    /* 100dvh handles iOS Safari's dynamic viewport (URL bar collapse +
       on-screen keyboard) better than 100vh, which is fixed to the
       initial layout viewport. Older browsers fall back to 100vh. */
    #app-main {
      padding: 0; display: flex; flex-direction: row;
      height: calc(100vh - var(--header-h, 52px));
      height: calc(100dvh - var(--header-h, 52px));
      overflow: hidden;
    }

    /* ── Conversations panel ── */
    .convos-panel {
      width: 280px; flex-shrink: 0; display: flex; flex-direction: column;
      background: var(--warm-bg-sidebar); border-right: 1px solid var(--warm-border);
      transition: margin-left .2s ease;
    }
    .convos-panel.collapsed { margin-left: -280px; }
    .convos-head {
      padding: 14px 12px 10px; border-bottom: 1px solid var(--warm-border);
      display: flex; flex-direction: column; gap: 10px;
    }
    .convos-head-top { display: flex; align-items: center; gap: 6px; }
    .convos-new-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      background: transparent; border: 1px solid var(--warm-border-strong);
      color: var(--warm-text); font-size: 13px; font-weight: 500;
      padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: all .15s;
    }
    .convos-new-btn:hover { background: var(--warm-active); border-color: rgba(255,255,255,0.22); }
    .convos-new-btn i { font-size: 14px; }
    .convos-collapse-btn {
      width: 34px; height: 34px; flex-shrink: 0;
      background: transparent; border: 1px solid transparent;
      color: var(--warm-text-faint); cursor: pointer;
      border-radius: 7px; display: flex; align-items: center; justify-content: center;
      font-size: 14px; transition: all .15s;
    }
    .convos-collapse-btn:hover { color: var(--warm-text); background: var(--warm-hover); }

    .convos-search-wrap { position: relative; display: flex; align-items: center; }
    .convos-search {
      width: 100%; background: var(--warm-bg);
      border: 1px solid var(--warm-border); border-radius: 8px;
      padding: 7px 30px 7px 30px; color: var(--warm-text);
      font: inherit; font-size: 13px; outline: none; transition: all .15s;
    }
    .convos-search::placeholder { color: var(--warm-text-faint); }
    .convos-search:focus { border-color: var(--warm-border-strong); background: var(--warm-bg-input); }
    .convos-search-icon {
      position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
      color: var(--warm-text-faint); font-size: 13px; pointer-events: none;
    }
    .convos-search-clear {
      position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
      width: 22px; height: 22px; border: none; background: transparent;
      color: var(--warm-text-faint); cursor: pointer; display: none;
      align-items: center; justify-content: center; border-radius: 4px;
      font-size: 12px;
    }
    .convos-search-clear:hover { background: var(--warm-active); color: var(--warm-text); }
    .convos-search-wrap.has-text .convos-search-clear { display: flex; }

    .convos-list { flex: 1; overflow-y: auto; padding: 6px 8px 24px; }
    .convos-list::-webkit-scrollbar { width: 6px; }
    .convos-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
    .convos-list::-webkit-scrollbar-track { background: transparent; }

    .convos-section {
      padding: 14px 10px 6px; font-size: 10.5px; font-weight: 600;
      color: var(--warm-text-faint); letter-spacing: 0.06em;
      text-transform: uppercase; user-select: none;
    }
    .convos-section:first-child { padding-top: 8px; }

    .convo-item {
      position: relative; padding: 8px 56px 8px 10px;
      margin: 1px 0; border-radius: 7px; cursor: pointer;
      transition: background .12s; line-height: 1.35;
      color: var(--warm-text-muted);
    }
    .convo-item:hover { background: var(--warm-hover); color: var(--warm-text); }
    .convo-item.active { background: var(--warm-active); color: var(--warm-text); }
    .convo-item:focus { outline: none; box-shadow: inset 0 0 0 2px rgba(200,150,255,0.45); }
    .convo-title-line {
      font-size: 13.5px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .convo-meta { font-size: 11px; color: var(--warm-text-faint); margin-top: 2px; }
    .convo-item .convo-actions {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      display: flex; gap: 2px; opacity: 0; transition: opacity .12s;
    }
    .convo-item:hover .convo-actions,
    .convo-item:focus-within .convo-actions { opacity: 1; }
    .convo-act-btn {
      width: 24px; height: 24px; padding: 0; border: none; background: transparent;
      color: var(--warm-text-faint); cursor: pointer; border-radius: 5px;
      display: flex; align-items: center; justify-content: center; font-size: 12px;
    }
    .convo-act-btn:hover { background: rgba(255,255,255,0.1); color: var(--warm-text); }
    .convo-act-btn.danger:hover { background: rgba(220,38,38,0.18); color: #fca5a5; }
    .convo-title-edit {
      width: 100%; padding: 0; border: none; border-bottom: 1px solid var(--accent);
      background: transparent; color: var(--warm-text); font: inherit; font-size: 13.5px;
      font-weight: 500; outline: none;
    }

    .convos-empty {
      padding: 24px 14px; font-size: 12.5px; color: var(--warm-text-faint);
      text-align: center; line-height: 1.55;
    }
    .convos-load-older {
      margin: 14px 10px 4px; padding: 8px; text-align: center;
      font-size: 12px; color: var(--warm-text-faint); cursor: pointer;
      border: 1px dashed var(--warm-border); border-radius: 7px;
      transition: all .15s;
    }
    .convos-load-older:hover { color: var(--warm-text); border-color: var(--warm-border-strong); }

    /* ── Titlebar (shown when sidebar collapsed) ── */
    .chat-titlebar {
      display: none; align-items: center; gap: 10px;
      padding: 9px 14px; min-height: 48px;
      border-bottom: 1px solid var(--warm-border);
      background: var(--warm-bg);
      position: sticky; top: 0; z-index: 5; flex-shrink: 0;
    }
    .convos-toggle, .titlebar-new {
      width: 34px; height: 34px; flex-shrink: 0;
      border-radius: 7px; border: 1px solid var(--warm-border);
      background: transparent; color: var(--warm-text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; transition: all .15s;
    }
    .convos-toggle:hover, .titlebar-new:hover {
      color: var(--warm-text); border-color: var(--warm-border-strong); background: var(--warm-hover);
    }
    .chat-title-text {
      flex: 1; min-width: 0; font-size: 13px; font-weight: 500;
      color: var(--warm-text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .convos-panel.collapsed ~ .chat-shell .chat-titlebar { display: flex; }

    /* ── Chat shell ── */
    .chat-shell {
      flex: 1; display: flex; flex-direction: column;
      height: 100%; background: var(--warm-bg);
      position: relative; min-width: 0;
    }

    /* ── Messages scroll ── */
    .chat-scroll { flex: 1; overflow-y: auto; padding: 0; scroll-behavior: smooth; }
    .chat-scroll::-webkit-scrollbar { width: 7px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }

    .chat-feed { max-width: 760px; margin: 0 auto; padding: 28px 24px 16px; }

    /* ── Message blocks ── */
    .msg { margin-bottom: 28px; animation: fadeUp .2s ease; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

    .msg-user { display: flex; justify-content: flex-end; }
    .msg-user-bubble {
      max-width: 85%;
      background: var(--warm-bubble-user); border: 1px solid var(--warm-border);
      border-radius: 18px; padding: 12px 16px;
      font-size: 15px; line-height: 1.6; color: var(--warm-text);
      white-space: pre-wrap; word-break: break-word;
    }

    .msg-aria-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .msg-aria-name {
      font-size: 11px; font-weight: 700; color: var(--warm-text-faint);
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .msg-aria-badge {
      font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px;
      background: rgba(200,150,255,0.12); color: var(--accent);
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .streaming-badge { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:0.55; } 50% { opacity:1; } }

    .msg-aria-body {
      font-size: 15px; line-height: 1.75; color: var(--warm-text);
      white-space: pre-wrap; word-break: break-word;
    }
    .msg-aria-body strong { color: #fff; font-weight: 600; }
    .msg-aria-body em { color: var(--warm-text-muted); }
    .msg-aria-body code {
      background: rgba(255,255,255,0.06); border: 1px solid var(--warm-border);
      border-radius: 4px; padding: 1px 5px;
      font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px;
      color: #e9d9ff;
    }
    .msg-aria-body h2 { font-size: 16px; font-weight: 700; color: #fff; margin: 18px 0 6px; letter-spacing: -0.005em; }
    .msg-aria-body h3 { font-size: 13.5px; font-weight: 700; color: rgba(255,255,255,0.85); margin: 14px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    .msg-aria-body ul, .msg-aria-body ol { margin: 6px 0; padding-left: 22px; }
    .msg-aria-body li { margin: 4px 0; }
    .msg-aria-body li::marker { color: var(--accent); }
    .msg-aria-body p { margin: 0 0 10px; }
    .msg-aria-body p:last-child { margin-bottom: 0; }
    .msg-aria-body blockquote {
      border-left: 2px solid var(--warm-border-strong); margin: 10px 0; padding: 4px 14px;
      color: var(--warm-text-muted); font-style: italic;
    }

    .msg-actions { display: flex; gap: 4px; margin-top: 10px; opacity: 0; transition: opacity .15s; flex-wrap: wrap; }
    .msg:hover .msg-actions { opacity: 1; }
    .msg-action-btn, .regen-btn {
      background: transparent; border: 1px solid var(--warm-border); border-radius: 6px;
      color: var(--warm-text-faint); font-size: 11.5px; padding: 4px 9px; cursor: pointer;
      transition: all .15s; display: flex; align-items: center; gap: 5px;
    }
    .msg-action-btn:hover, .regen-btn:hover {
      background: var(--warm-hover); color: var(--warm-text); border-color: var(--warm-border-strong);
    }
    .msg-action-btn.copied { color: #4ade80; border-color: rgba(74,222,128,0.3); }

    /* ── Thinking dots ── */
    .thinking { display: flex; align-items: center; gap: 8px; margin-bottom: 28px; animation: fadeUp .2s ease; }
    .thinking-dots { display: flex; gap: 5px; }
    .thinking-dots span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--warm-text-faint);
      animation: dot-pulse 1.2s ease-in-out infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: .15s; }
    .thinking-dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes dot-pulse { 0%,70%,100%{transform:scale(.6);opacity:.35} 35%{transform:scale(1.1);opacity:1} }
    .thinking-text { font-size: 12px; color: var(--warm-text-faint); font-style: italic; }

    /* ── Welcome ── */
    .welcome {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 60vh; padding: 40px 20px; text-align: center;
    }
    .welcome-mark {
      width: 48px; height: 48px; border-radius: 12px;
      background: rgba(200,150,255,0.08); border: 1px solid rgba(200,150,255,0.22);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; color: var(--accent);
      margin-bottom: 18px;
    }
    .welcome h2 { font-size: 22px; font-weight: 600; color: var(--warm-text); margin: 0 0 10px; letter-spacing: -0.01em; }
    .welcome p { font-size: 14px; color: var(--warm-text-muted); line-height: 1.6; max-width: 480px; margin: 0 0 28px; }
    .chips { display: flex; flex-direction: column; gap: 6px; max-width: 560px; width: 100%; }
    .chip {
      text-align: left;
      background: transparent; border: 1px solid var(--warm-border);
      border-radius: 9px; padding: 11px 14px; font-size: 13.5px;
      color: var(--warm-text-muted); cursor: pointer; transition: all .15s;
      line-height: 1.4; font-family: inherit;
    }
    .chip:hover {
      background: var(--warm-hover); border-color: var(--warm-border-strong);
      color: var(--warm-text);
    }

    /* ── Input ── */
    .input-area {
      flex-shrink: 0; padding: 0 24px 14px;
      background: linear-gradient(to top, var(--warm-bg) 70%, transparent);
    }
    .input-wrap {
      max-width: 760px; margin: 0 auto;
      background: var(--warm-bg-input); border: 1px solid var(--warm-border);
      border-radius: 16px; overflow: hidden;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-wrap.focused { border-color: var(--warm-border-strong); box-shadow: 0 0 0 4px rgba(255,255,255,0.03); }
    .input-wrap.think-on { border-color: rgba(200,150,255,0.45); box-shadow: 0 0 0 4px rgba(200,150,255,0.08); }

    #chat-input {
      display: block; width: 100%; background: transparent; border: none; outline: none;
      color: var(--warm-text); font-size: 15px; line-height: 1.55;
      padding: 14px 16px 6px; resize: none; font-family: inherit;
      min-height: 24px; max-height: 200px; overflow-y: auto;
    }
    #chat-input::placeholder { color: var(--warm-text-faint); }

    .input-bar { display: flex; align-items: center; padding: 6px 10px 10px 12px; gap: 6px; }

    .think-btn, .upload-btn {
      display: flex; align-items: center; gap: 5px; padding: 5px 10px;
      border: 1px solid var(--warm-border); border-radius: 7px;
      background: transparent; color: var(--warm-text-muted); font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .think-btn:hover, .upload-btn:hover {
      border-color: var(--warm-border-strong); color: var(--warm-text); background: var(--warm-hover);
    }
    .think-btn.on { background: rgba(200,150,255,0.12); border-color: rgba(200,150,255,0.35); color: var(--accent); }
    .upload-btn i { font-size: 13px; }

    .input-hint { margin-left: auto; font-size: 11px; color: var(--warm-text-faint); white-space: nowrap; }

    .send-btn {
      width: 32px; height: 32px; border-radius: 8px; border: none;
      background: rgba(255,255,255,0.06); color: var(--warm-text-faint);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 14px; transition: all .15s; flex-shrink: 0;
    }
    .send-btn.ready { background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #fff; box-shadow: 0 2px 10px rgba(200,150,255,0.25); }
    .send-btn.ready:hover { transform: translateY(-1px); box-shadow: 0 3px 14px rgba(200,150,255,0.35); }
    .send-btn.stop { background: linear-gradient(135deg, #dc2626, #b91c1c); color: #fff; opacity: 1; }
    .send-btn.stop:hover { box-shadow: 0 2px 14px rgba(220,38,38,0.5); }
    .send-btn:disabled { opacity: .45; cursor: not-allowed; }

    .input-foot {
      text-align: center; font-size: 11px; color: var(--warm-text-faint);
      padding: 8px 0 0; max-width: 760px; margin: 0 auto;
    }

    .chat-scroll.drag-over {
      outline: 2px dashed rgba(200,150,255,0.4); outline-offset: -8px;
      background: rgba(200,150,255,0.03);
    }

    @media (max-width: 900px) {
      .convos-panel { position: absolute; top: 0; left: 0; bottom: 0; z-index: 4; box-shadow: 4px 0 18px rgba(0,0,0,0.5); }
      .convos-panel.collapsed { margin-left: -280px; box-shadow: none; }
      /* Mobile: always show titlebar so user can re-open drawer. */
      .chat-titlebar { display: flex; }
    }
    @media (max-width: 640px) {
      .chat-feed { max-width: 100%; padding: 18px 16px 12px; }
      .input-wrap { max-width: 100%; }
      .input-hint, .input-foot { display: none; }
      .msg-user-bubble { max-width: 92%; }
      .convos-panel { width: 80vw; max-width: 300px; }
      /* 44px minimum tap targets per Apple HIG / Material Design. */
      .send-btn { width: 40px; height: 40px; font-size: 16px; }
      .think-btn, .upload-btn { min-height: 36px; padding: 7px 11px; }
      .convo-item { padding: 12px 60px 12px 14px; }
      .convo-item .convo-actions { opacity: 1; }
      .input-area { padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
      .welcome h2 { font-size: 19px; }
    }
  </style>
</head>
<body>
<div id="sidebar-placeholder"></div>
<div id="header-placeholder"></div>
<main id="app-main">

<aside class="convos-panel" id="convos-panel">
  <div class="convos-head">
    <div class="convos-head-top">
      <button class="convos-new-btn" id="convos-new" title="Start a new conversation"><i class="bi bi-plus-lg" aria-hidden="true"></i> New chat</button>
      <button class="convos-collapse-btn" id="convos-collapse" title="Hide conversations panel" aria-label="Hide conversations panel"><i class="bi bi-layout-sidebar" aria-hidden="true"></i></button>
    </div>
    <div class="convos-search-wrap" id="convos-search-wrap">
      <i class="bi bi-search convos-search-icon" aria-hidden="true"></i>
      <input id="convos-search" class="convos-search" type="text" placeholder="Search conversations" aria-label="Search conversations" autocomplete="off">
      <button class="convos-search-clear" id="convos-search-clear" title="Clear search" aria-label="Clear search"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
    </div>
  </div>
  <div class="convos-list" id="convos-list" role="listbox" aria-label="Conversation history">
    <div class="convos-empty" id="convos-empty"><span class="sc-skeleton sc-skeleton-text" aria-label="Loading conversations"></span></div>
  </div>
</aside>

<div class="chat-shell">

  <div class="chat-titlebar" id="chat-titlebar">
    <button class="convos-toggle" id="convos-toggle" title="Show conversations" aria-label="Show conversations panel"><i class="bi bi-layout-sidebar" aria-hidden="true"></i></button>
    <div class="chat-title-text" id="chat-title-text">New conversation</div>
    <button class="titlebar-new" id="titlebar-new" title="New conversation" aria-label="New conversation"><i class="bi bi-plus-lg" aria-hidden="true"></i></button>
  </div>

  <div class="chat-scroll" id="chat-scroll">
    <div class="chat-feed" id="chat-feed">
      <div class="welcome" id="welcome">
        <div class="welcome-mark">A</div>
        <h2>How can I help you today?</h2>
        <p>I'm ARIA, your defence market analyst. Ask about procurement, intelligence, compliance, or strategy.</p>
        <div class="chips" id="chips">
          <button class="chip">What are the top procurement opportunities this week?</button>
          <button class="chip">Summarise the latest Lusophone Africa intelligence</button>
          <button class="chip">Which markets have active tenders right now?</button>
          <button class="chip">Brief me on Angola's defence procurement pipeline</button>
          <button class="chip">Any export control alerts I should know about?</button>
          <button class="chip">Give me a strategic priority assessment</button>
        </div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap" id="input-wrap">
      <textarea id="chat-input" placeholder="Message ARIA…" rows="1"></textarea>
      <div class="input-bar">
        <button class="think-btn" id="think-btn" title="Deep analysis mode" aria-label="Toggle deep analysis mode"><i class="bi bi-cpu" aria-hidden="true"></i> Think</button>
        <button class="upload-btn" id="upload-btn" title="Upload document" aria-label="Upload document"><i class="bi bi-paperclip" aria-hidden="true"></i> Attach</button>
        <span class="input-hint">Enter to send · Drop files here</span>
        <button class="send-btn" id="send-btn" disabled aria-label="Send message"><i class="bi bi-arrow-up" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="input-foot">ARIA can make mistakes. Verify critical intelligence.</div>
  </div>

</div>
</main>

<script src="js/app.js?v=3"></script>
<script src="js/sidebar.js?v=3"></script>
<script>
Auth.requireAuth();
Sidebar.init('aria');

// SID is composed as `<userId>_<ts>_<rand>` so the Python side can extract
// userId via session_id.rsplit('_', 1)[0] and bucket conversations per user.
// Until /api/auth/me resolves, fall back to 'anon'; first send rebuilds SID
// with the real userId once it's known.
var CURRENT_USER = null;
var USER_ID_SLUG = 'anon';
function newSID() {
  return USER_ID_SLUG + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
}
var SID = newSID();

// R-F722 (2026-05-19) — Claude-style conversation auto-resume.
// Pre-R-F722 the side panel listed past conversations but never auto-
// opened one — chat feed always started empty on page load even though
// conversation_store had everything persisted. Users hit refresh, lost
// their UI state, didn't realise the side panel had their chats, and
// reported "Aria isn't saving conversations". Fix: persist active SID
// per-user in localStorage; on auth resolve + Convos.refresh(), if the
// saved SID belongs to this user and appears in their list, auto-load
// it. New-chat button clears the key so next refresh stays fresh.
function LAST_SID_KEY() { return 'aria_last_sid_' + USER_ID_SLUG; }
function saveLastSid(sid) {
  try { if (sid) localStorage.setItem(LAST_SID_KEY(), sid); } catch(e) {}
}
function clearLastSid() {
  try { localStorage.removeItem(LAST_SID_KEY()); } catch(e) {}
}
function getLastSid() {
  try { return localStorage.getItem(LAST_SID_KEY()) || ''; } catch(e) { return ''; }
}

// AUTH_READY resolves once /api/auth/me returns. send() awaits this before
// the first turn so the SID prefix is the real userId, not 'anon'. Without
// this, a user clicking a chip within the first ~200ms could get their
// first conversation bucketed under the anon user. Resolves with the user
// object (or null on failure) — never rejects.
var AUTH_READY = Auth.me().then(function(user) {
  if (user) {
    CURRENT_USER = user;
    USER_ID_SLUG = (user.id || user.username || 'anon').toString().replace(/[^A-Za-z0-9]/g, '');
    var welcomeEl = document.getElementById('welcome');
    if (welcomeEl && welcomeEl.style.display !== 'none') SID = newSID();
  }
  return user;
}).catch(function(e) { console.warn('[Auth] me() failed:', e); return null; });

// ── Markdown renderer ──
function md(text) {
  if (!text) return '';
  var s = escHtml(text);
  s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  s = s.replace(/`(.+?)`/g, '<code>$1</code>');
  s = s.replace(/((?:^[-•] .+\n?)+)/gm, function(block) {
    var items = block.trim().split('\n').map(function(l) { return '<li>' + l.replace(/^[-•] /, '') + '</li>'; }).join('');
    return '<ul>' + items + '</ul>';
  });
  s = s.replace(/((?:^\d+\. .+\n?)+)/gm, function(block) {
    var items = block.trim().split('\n').map(function(l) { return '<li>' + l.replace(/^\d+\. /, '') + '</li>'; }).join('');
    return '<ol>' + items + '</ol>';
  });
  s = s.replace(/\n{2,}/g, '</p><p>');
  s = s.replace(/\n/g, '<br>');
  s = '<p>' + s + '</p>';
  s = s.replace(/<p><(h[23]|ul|ol)/g, '<$1');
  s = s.replace(/<\/(h[23]|ul|ol)><\/p>/g, '</$1>');
  s = s.replace(/<p><\/p>/g, '');
  return s;
}

// ── Export message as audit-grade PDF ──
async function exportMsgAsPdf(btn) {
  var msgEl = btn.closest('.msg');
  if (!msgEl) return;
  var idx = parseInt(msgEl.dataset.msgIndex, 10);
  if (!Number.isFinite(idx)) {
    alert('Cannot export — message index missing.');
    return;
  }
  var orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Generating…';
  try {
    var token = localStorage.getItem('crucix_token') || '';
    var resp = await fetch('/api/reports/pdf', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token,
      },
      body: JSON.stringify({
        sessionId: SID,
        messageIndex: idx,
        classification: 'CONFIDENTIAL',
      }),
    });
    if (!resp.ok) {
      var data = await resp.json().catch(() => ({}));
      alert('PDF export failed: ' + (data.error || resp.status));
      return;
    }
    var blob = await resp.blob();
    var disp = resp.headers.get('Content-Disposition') || '';
    var nameMatch = disp.match(/filename="([^"]+)"/);
    var filename = nameMatch ? nameMatch[1] : ('aria-report-' + idx + '.pdf');
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function() {
      URL.revokeObjectURL(url);
      a.remove();
    }, 1000);
    var signed = resp.headers.get('X-Report-Signed') === '1';
    btn.innerHTML = signed
      ? '<i class="bi bi-check2 text-success"></i> Downloaded (signed)'
      : '<i class="bi bi-exclamation-triangle"></i> Downloaded (UNSIGNED)';
    setTimeout(function() {
      btn.innerHTML = orig;
      btn.disabled = false;
    }, 2500);
  } catch (err) {
    console.error('[Export PDF]', err);
    alert('Export error: ' + err.message);
    btn.innerHTML = orig;
    btn.disabled = false;
  }
}

}

// ── Send message (SSE streaming) ──
async function send(text, opts) {
  opts = opts || {};
  if (!text || sending) return;
  if (!CURRENT_USER) {
    try {
      await Promise.race([
        AUTH_READY,
        new Promise(function(r) { setTimeout(r, 600); }),
      ]);
    } catch(e) {}
  }
  sending = true;
  lastUserMessage = text;
  if (!opts.keepInput) {
    ta.value = ''; ta.style.height = 'auto';
  }
  resize();

  if (!opts.skipUserBubble) addUser(text);

  // Think mode still uses the blocking endpoint (structured output)
  if (thinkMode) {
    showThinking();
    try {
      var result = await API.post('/api/aria/think', { question: text, context: {}, fast: false, session_id: SID });
      removeThinking();
      if (!result.ok || !result.data) {
        addAria(md((result.data && result.data.error) || 'Something went wrong.'));
      } else {
        var d = result.data;
        var reply = '';
        if (d.conclusion && d.conclusion.statement) {
          if (d.orientation) reply += '## Orientation\n' + d.orientation + '\n\n';
          reply += '## Conclusion\n' + d.conclusion.statement;
          if (d.conclusion.confidence) reply += '\n\n**Confidence:** ' + d.conclusion.confidence + '% (' + (d.conclusion.epistemic_status || 'ASSESSED') + ')';
          if (d.reasoning) reply += '\n\n## Reasoning\n' + d.reasoning;
          if (d.conclusion.action && d.conclusion.action.what) reply += '\n\n## Recommended Action\n' + d.conclusion.action.what;
          if (d.metacognition && d.metacognition.biggest_gap) reply += '\n\n**Knowledge gap:** ' + d.metacognition.biggest_gap;
        } else {
          reply = d.full_text || d.response || 'No analysis returned.';
        }
        addAria(md(reply), 'DEEP ANALYSIS');
      }
    } catch (err) { removeThinking(); addAria(md('Connection error.')); console.error(err); }
    finally {
      try { if (window._ariaTurnFinished) window._ariaTurnFinished(SID, lastUserMessage); } catch(e) {}
      sending = false; resize(); ta.focus();
    }
    return;
  }

  // ── SSE streaming path ──
  var ariaDiv = document.createElement('div');
  ariaDiv.className = 'msg msg-aria';
  ariaDiv.dataset.msgIndex = String(nextMsgIndex++);
  ariaDiv.innerHTML =
    '<div class="msg-aria-header">' +
      '<span class="msg-aria-name">ARIA</span>' +
      '<span class="msg-aria-badge streaming-badge" id="stream-badge">streaming</span>' +
    '</div>' +
    '<div class="msg-aria-body" id="stream-body"></div>';
  document.getElementById('welcome').style.display = 'none';
  feed.appendChild(ariaDiv);
  var streamBody = document.getElementById('stream-body');
  var streamBadge = document.getElementById('stream-badge');
  bottom();

  var fullText = '';
  var toolUsed = '';

  streamAbort = new AbortController();
  try {
    var token = localStorage.getItem('crucix_token') || '';
    var resp = await fetch('/api/aria/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ message: text, session_id: SID, user_id: USER_ID_SLUG, auto_tools: true }),
      signal: streamAbort.signal,
    });

    if (!resp.ok) {
      streamBody.innerHTML = md('Error: ' + resp.status + ' — ' + (await resp.text().catch(function(){return '';})).slice(0,200));
      streamBadge.remove();
      sending = false; resize(); ta.focus();
      return;
    }

    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';

    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, { stream: true });

      var events = buffer.split('\n\n');
      buffer = events.pop() || '';

      for (var i = 0; i < events.length; i++) {
        var raw = events[i];
        if (!raw.startsWith('data: ')) continue;
        try {
          var evt = JSON.parse(raw.slice(6));
          if (evt.type === 'chunk' && evt.text) {
            fullText += evt.text;
            streamBody.innerHTML = md(fullText);
            bottom();
          } else if (evt.type === 'status' && evt.message) {
            streamBadge.textContent = evt.message;
            streamBadge.style.opacity = '1';
          } else if (evt.type === 'done') {
            SID = evt.session_id || SID;
          } else if (evt.type === 'meta') {
            toolUsed = evt.tool_used || '';
          } else if (evt.type === 'error') {
            // R-F467 (2026-05-14): always append a visible cut marker.
            // Pre-R-F467, mid-stream errors after the first chunk were
            // silently dropped (the `if (!fullText)` guard hid them),
            // so the operator saw a truncated answer and had no way to
            // tell if it was a complete response or a network/LB cut.
            var _r467_reason = evt.message || evt.reason || 'unknown';
            fullText = (fullText ? fullText + '\n\n' : '')
                     + '⚠️ [!stream cut: ' + _r467_reason + ']';
            streamBody.innerHTML = md(fullText);
          }
        } catch(e) { /* skip malformed SSE */ }
      }
    }

    // Finalize
    streamBadge.remove();
    if (!fullText) streamBody.innerHTML = md('No response received.');

    var actions = document.createElement('div');
    actions.className = 'msg-actions';
    actions.innerHTML =
      '<button class="msg-action-btn" onclick="copyMsg(this)" title="Copy"><i class="bi bi-clipboard"></i> Copy</button>' +
      '<button class="msg-action-btn" onclick="exportMsgAsPdf(this)" title="Export as audit-grade PDF"><i class="bi bi-file-earmark-pdf"></i> Export PDF</button>';
    ariaDiv.appendChild(actions);
    if (toolUsed) {
      var tb = document.createElement('span');
      tb.className = 'msg-aria-badge';
      tb.textContent = toolUsed;
      ariaDiv.querySelector('.msg-aria-header').appendChild(tb);
    }

  } catch (err) {
    // AbortError is expected when the user presses Stop — keep whatever
    // partial text streamed in so far and mark it, don't show an error.
    if (err && (err.name === 'AbortError' || /abort/i.test(err.message || ''))) {
      if (streamBody && !fullText) {
        streamBody.innerHTML = md('_(stopped by user)_');
      } else if (streamBody) {
        streamBody.innerHTML = md(fullText + '\n\n_(stopped by user)_');
      }
      if (streamBadge) streamBadge.remove();
    } else {
      streamBody.innerHTML = md('Connection error — please try again.');
      streamBadge.remove();
      console.error('[ARIA stream]', err);
    }
  } finally {
    streamAbort = null;
    try { if (window._ariaTurnFinished) window._ariaTurnFinished(SID, lastUserMessage); } catch(e) {}
    if (ariaDiv && lastUserMessage) {
      var regenBtn = document.createElement('button');
      regenBtn.className = 'regen-btn';
      regenBtn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Regenerate';
      regenBtn.onclick = function() {
        if (ariaDiv && ariaDiv.parentNode) ariaDiv.parentNode.removeChild(ariaDiv);
        send(lastUserMessage, { skipUserBubble: true });
      };
      var actionsWrap = ariaDiv.querySelector('.msg-actions');
      if (actionsWrap) actionsWrap.appendChild(regenBtn);
    }
    if (streamBody) streamBody.removeAttribute('id');
    if (streamBadge) streamBadge.removeAttribute('id');
    sending = false;
    resize();
    ta.focus();
  }
}

// ── File upload handler ──
var fileInput = document.createElement('input');
fileInput.type = 'file';
fileInput.accept = '.pdf,.docx,.xlsx,.xls,.csv,.txt,.json,.xml,.png,.jpg,.jpeg';
fileInput.style.display = 'none';
document.body.appendChild(fileInput);

fileInput.addEventListener('change', async function() {
  if (!fileInput.files.length) return;
  var file = fileInput.files[0];
  fileInput.value = '';

  // R-F718 (2026-05-19) — capture the textarea query BEFORE clearing it,
  // and inject the extracted document text into a chat-stream call so the
  // LLM actually sees the file. Pre-R-F718 the extract-document response
  // was rendered to the DOM and nothing else — chat-stream never saw the
  // text, so "review these documents" follow-ups returned "no parsed text
  // or file content reached my context". Symptom: user uploaded Peru
  // economics PDF 2026-05-19 10:41/10:50, both times ARIA couldn't see it.
  var userContext = ta.value.trim();
  var queryForLLM = userContext || 'Review this document and flag blockers or anything missed.';

  var formData = new FormData();
  formData.append('file', file);
  formData.append('context', queryForLLM);
  var token = localStorage.getItem('crucix_token') || '';

  addUser('📎 ' + file.name + (userContext ? '\n' + userContext : ''));
  // Clear textarea immediately so the user doesn't see their query lingering
  // through the extraction wait — send() would clear it anyway.
  ta.value = '';
  ta.style.height = 'auto';
  resize();
  showThinking();

  try {
    var resp = await fetch('/api/aria/extract-document', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token },
      body: formData,
    });
    removeThinking();
    if (!resp.ok) {
      addAria(md('Failed to process ' + file.name + ': ' + resp.status));
      return;
    }
    var data = await resp.json();
    if (data.error) {
      addAria(md('Failed to process ' + file.name + ': ' + data.error));
      return;
    }
    var docText = (data.text || '').trim();
    if (!docText) {
      // Strategies all failed (or gave only metadata) — fall back to
      // the legacy display path so the user at least sees what happened.
      addAria(md(data.summary || data.gap_description || 'Document processed but no usable text extracted.'), file.name);
      return;
    }
    // R-F718 — fire a streaming chat with the extracted text embedded as
    // an [ATTACHED DOCUMENT] block. send() handles the SSE reply, persists
    // the turn into conversation_store, and any future follow-up in this
    // session will see the doc via conversation history.
    var label = file.name + ' · ' + (data.method || 'extracted') +
                ' · ' + Math.round((data.confidence || 0) * 100) + '%' +
                (data.pages_extracted && data.total_pages
                  ? ' · ' + data.pages_extracted + '/' + data.total_pages + ' pages'
                  : '');
    var promptText =
      '[ATTACHED DOCUMENT: ' + label + ']\n' +
      docText + '\n' +
      '[/ATTACHED DOCUMENT]\n\n' +
      queryForLLM;
    // skipUserBubble — the upload bubble was already added above.
    send(promptText, { skipUserBubble: true });
  } catch(err) {
    removeThinking();
    addAria(md('Upload failed: ' + err.message));
  }
});

// ── Conversations panel (R-F533, 2026-05-15) ──
// Rewritten around a `rows[]` cache so we can re-render with date groups
// + client-side search on every change. Bumping a conversation to the top
// after a turn ends preserves the group structure.
var Convos = (function() {
  var listEl = document.getElementById('convos-list');
  var emptyEl = document.getElementById('convos-empty');
  var panel = document.getElementById('convos-panel');
  var toggleBtn = document.getElementById('convos-toggle');
  var collapseBtn = document.getElementById('convos-collapse');
  var searchEl = document.getElementById('convos-search');
  var searchWrap = document.getElementById('convos-search-wrap');
  var searchClear = document.getElementById('convos-search-clear');
  var COLLAPSE_KEY = 'aria_convos_collapsed';
  var loadedOffset = 0;
  var pageSize = 30;
  var allLoaded = false;
  var activeSid = null;
  // Single source of truth for what's rendered. Each entry is the API row
  // shape: { session_id, title, createdAt, updatedAt, messageCount }.
  var rows = [];
  var searchTerm = '';

  var GROUP_LABELS = {
    today: 'Today',
    yesterday: 'Yesterday',
    past7: 'Previous 7 days',
    past30: 'Previous 30 days',
    older: 'Older',
  };
  var GROUP_ORDER = ['today', 'yesterday', 'past7', 'past30', 'older'];

  function tsOf(c) { return c.updatedAt || c.createdAt || 0; }

  function groupOf(ts) {
    if (!ts) return 'older';
    var nowD = new Date();
    var todayStart = new Date(nowD.getFullYear(), nowD.getMonth(), nowD.getDate()).getTime() / 1000;
    var yesterdayStart = todayStart - 86400;
    var sevenAgo = todayStart - 86400 * 7;
    var thirtyAgo = todayStart - 86400 * 30;
    if (ts >= todayStart) return 'today';
    if (ts >= yesterdayStart) return 'yesterday';
    if (ts >= sevenAgo) return 'past7';
    if (ts >= thirtyAgo) return 'past30';
    return 'older';
  }

  function fmtTime(ts) {
    if (!ts) return '';
    var d = new Date(ts * 1000);
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    if (sameDay) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    var diffDays = (now - d) / 86400000;
    if (diffDays < 7) return d.toLocaleDateString([], { weekday: 'short' });
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  async function authedJson(method, url, body) {
    var token = localStorage.getItem('crucix_token') || '';
    var opts = { method: method, headers: { 'Authorization': 'Bearer ' + token } };
    if (body !== undefined) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    var resp = await fetch(url, opts);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return resp.json();
  }

  function renderRow(c) {
    var row = document.createElement('div');
    row.className = 'convo-item' + (c.session_id === activeSid ? ' active' : '');
    row.dataset.sid = c.session_id;
    var title = (c.title && c.title.trim()) || 'Untitled';
    // Keyboard accessibility: role=option / parent listbox so screen
    // readers announce "X of N conversations".
    row.setAttribute('role', 'option');
    row.setAttribute('tabindex', '0');
    row.setAttribute('aria-selected', c.session_id === activeSid ? 'true' : 'false');
    row.setAttribute('aria-label', title + ', ' + fmtTime(tsOf(c)));
    row.innerHTML =
      '<div class="convo-title-line">' + escHtml(title) + '</div>' +
      '<div class="convo-meta">' + fmtTime(tsOf(c)) +
        (c.messageCount ? ' · ' + c.messageCount + ' msg' : '') +
      '</div>' +
      '<div class="convo-actions">' +
        '<button class="convo-act-btn convo-rename" title="Rename" aria-label="Rename conversation"><i class="bi bi-pencil" aria-hidden="true"></i></button>' +
        '<button class="convo-act-btn convo-del danger" title="Delete" aria-label="Delete conversation"><i class="bi bi-trash" aria-hidden="true"></i></button>' +
      '</div>';
    row.addEventListener('click', function(e) {
      if (e.target.closest('.convo-actions')) return;
      if (e.target.closest('.convo-title-edit')) return;
      load(c.session_id);
    });
    // Keyboard handlers
    //   Enter / Space     → load
    //   F2                → rename
    //   ArrowDown/Up      → focus next/prev item
    //   Home / End        → first / last
    //   Delete            → delete (with confirmation)
    row.addEventListener('keydown', function(e) {
      var key = e.key;
      if (key === 'Enter' || key === ' ') {
        e.preventDefault();
        load(c.session_id);
      } else if (key === 'F2') {
        e.preventDefault();
        startRename(row, c);
      } else if (key === 'ArrowDown') {
        e.preventDefault();
        var next = row.nextElementSibling;
        while (next && !next.classList.contains('convo-item')) next = next.nextElementSibling;
        if (next) next.focus();
      } else if (key === 'ArrowUp') {
        e.preventDefault();
        var prev = row.previousElementSibling;
        while (prev && !prev.classList.contains('convo-item')) prev = prev.previousElementSibling;
        if (prev) prev.focus();
      } else if (key === 'Home') {
        e.preventDefault();
        var first = listEl.querySelector('.convo-item');
        if (first) first.focus();
      } else if (key === 'End') {
        e.preventDefault();
        var items = listEl.querySelectorAll('.convo-item');
        if (items.length) items[items.length - 1].focus();
      } else if (key === 'Delete' || (key === 'Backspace' && e.shiftKey)) {
        e.preventDefault();
        del(c.session_id, title);
      }
    });
    row.querySelector('.convo-del').addEventListener('click', function(e) {
      e.stopPropagation();
      del(c.session_id, title);
    });
    row.querySelector('.convo-rename').addEventListener('click', function(e) {
      e.stopPropagation();
      startRename(row, c);
    });
    return row;
  }

  function startRename(row, c) {
    var titleEl = row.querySelector('.convo-title-line');
    if (!titleEl || row.querySelector('.convo-title-edit')) return;
    var current = c.title || titleEl.textContent || '';
    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'convo-title-edit';
    input.value = current;
    input.maxLength = 120;
    titleEl.replaceWith(input);
    input.focus();
    input.select();

    function commit() {
      var next = (input.value || '').trim();
      if (!next || next === current) { cancel(); return; }
      // Optimistic UI; rollback on failure.
      var optimistic = next;
      var newTitleLine = document.createElement('div');
      newTitleLine.className = 'convo-title-line';
      newTitleLine.textContent = optimistic;
      input.replaceWith(newTitleLine);
      c.title = optimistic;
      authedJson('PUT', '/api/aria/conversations/' + encodeURIComponent(c.session_id) + '/title',
                 { title: optimistic, user_id: USER_ID_SLUG })
        .catch(function(err) {
          console.error('[Convos] rename', err);
          c.title = current;
          newTitleLine.textContent = current;
          alert('Rename failed.');
        });
    }
    function cancel() {
      var orig = document.createElement('div');
      orig.className = 'convo-title-line';
      orig.textContent = current;
      input.replaceWith(orig);
    }
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    });
    input.addEventListener('blur', commit);
    input.addEventListener('click', function(e) { e.stopPropagation(); });
  }

  function render() {
    // Clear list (preserve nothing — the empty / load-older are recreated).
    while (listEl.firstChild) listEl.removeChild(listEl.firstChild);
    var term = searchTerm.toLowerCase();
    var filtered = !term ? rows.slice() : rows.filter(function(c) {
      return (c.title || '').toLowerCase().indexOf(term) !== -1;
    });
    if (!filtered.length) {
      var msg;
      if (rows.length && term) {
        msg = 'No matches for “' + escHtml(searchTerm) + '”.';
      } else {
        msg = 'No conversations yet — start chatting and they’ll appear here.';
      }
      var emptyDiv = document.createElement('div');
      emptyDiv.className = 'convos-empty';
      emptyDiv.innerHTML = msg;
      listEl.appendChild(emptyDiv);
      return;
    }
    // Build groups in insertion order. The API returns rows already
    // sorted newest-first; group buckets inherit that order.
    var groups = {};
    filtered.forEach(function(c) {
      var g = groupOf(tsOf(c));
      (groups[g] = groups[g] || []).push(c);
    });
    GROUP_ORDER.forEach(function(g) {
      if (!groups[g]) return;
      var header = document.createElement('div');
      header.className = 'convos-section';
      header.textContent = GROUP_LABELS[g];
      listEl.appendChild(header);
      groups[g].forEach(function(c) { listEl.appendChild(renderRow(c)); });
    });
    // Load-older button — only when not searching and the server has more.
    if (!allLoaded && !term) appendLoadOlder();
  }

  function appendLoadOlder() {
    var btn = document.createElement('div');
    btn.className = 'convos-load-older';
    btn.textContent = 'Load older';
    btn.addEventListener('click', loadOlder);
    listEl.appendChild(btn);
  }

  async function refresh() {
    if (!CURRENT_USER) return;
    loadedOffset = 0;
    allLoaded = false;
    rows = [];
    // Brief skeleton while we fetch first page.
    while (listEl.firstChild) listEl.removeChild(listEl.firstChild);
    var skel = document.createElement('div');
    skel.className = 'convos-empty';
    skel.textContent = 'Loading…';
    listEl.appendChild(skel);
    try {
      var data = await authedJson(
        'GET',
        '/api/aria/conversations?user_id=' + encodeURIComponent(USER_ID_SLUG) + '&offset=0&limit=' + pageSize,
      );
      var convos = (data && data.conversations) || [];
      rows = convos.slice();
      loadedOffset = convos.length;
      if (convos.length < pageSize) allLoaded = true;
      render();
    } catch (err) {
      while (listEl.firstChild) listEl.removeChild(listEl.firstChild);
      var fail = document.createElement('div');
      fail.className = 'convos-empty';
      fail.textContent = 'Failed to load.';
      listEl.appendChild(fail);
      console.error('[Convos] refresh', err);
    }
  }

  async function loadOlder() {
    if (allLoaded || !CURRENT_USER) return;
    var btn = listEl.querySelector('.convos-load-older');
    if (btn) btn.textContent = 'Loading…';
    try {
      var data = await authedJson(
        'GET',
        '/api/aria/conversations?user_id=' + encodeURIComponent(USER_ID_SLUG) +
          '&offset=' + loadedOffset + '&limit=' + pageSize,
      );
      var convos = (data && data.conversations) || [];
      rows = rows.concat(convos);
      loadedOffset += convos.length;
      if (convos.length < pageSize) allLoaded = true;
      render();
    } catch (err) {
      console.error('[Convos] loadOlder', err);
      if (btn) btn.textContent = 'Load older (retry)';
    }
  }

  async function load(sid) {
    if (sending) return;
    try {
      var data = await authedJson('GET', '/api/aria/conversations/' + encodeURIComponent(sid) + '/detail');
      SID = sid;
      activeSid = sid;
      saveLastSid(sid);  // R-F722 — remember which conversation is open
      Array.prototype.forEach.call(listEl.querySelectorAll('.convo-item'), function(n) {
        var on = n.dataset.sid === sid;
        n.classList.toggle('active', on);
        n.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      feed.querySelectorAll('.msg, .thinking').forEach(function(n) { n.remove(); });
      document.getElementById('welcome').style.display = 'none';
      resetMsgIndex(0);
      var msgs = data.messages || [];
      msgs.forEach(function(m) {
        if (m.role === 'user') addUser(m.content || '');
        else addAria(md(m.content || ''));
      });
      bottom();
      setTitlebar(data.title || 'Conversation');
      if (window.innerWidth <= 900) panel.classList.add('collapsed');
    } catch (err) {
      console.error('[Convos] load', err);
      addAria(md('Failed to load conversation.'));
    }
  }

  async function del(sid, title) {
    if (!CURRENT_USER) return;
    if (!confirm('Delete “' + title + '”? This cannot be undone.')) return;
    try {
      await authedJson('DELETE', '/api/aria/conversations/' + encodeURIComponent(sid) +
        '?user_id=' + encodeURIComponent(USER_ID_SLUG));
      rows = rows.filter(function(c) { return c.session_id !== sid; });
      if (sid === activeSid) startNewConversation();
      render();
    } catch (err) {
      console.error('[Convos] delete', err);
      alert('Delete failed.');
    }
  }

  function setActive(sid) {
    activeSid = sid;
    Array.prototype.forEach.call(listEl.querySelectorAll('.convo-item'), function(n) {
      var on = n.dataset.sid === sid;
      n.classList.toggle('active', on);
      n.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }

  // After a turn ends: move the active conversation to the top of its
  // group (which is "today" for any active conversation, so it floats to
  // the very top of the list).
  function bumpToTop(sid, fallbackTitle) {
    if (!CURRENT_USER || !sid) return;
    var existing = rows.find(function(c) { return c.session_id === sid; });
    var nowSecs = Date.now() / 1000;
    if (existing) {
      existing.updatedAt = nowSecs;
      existing.messageCount = (existing.messageCount || 0) + 2;
      rows = [existing].concat(rows.filter(function(c) { return c.session_id !== sid; }));
    } else {
      var stub = {
        session_id: sid,
        title: fallbackTitle || 'New conversation',
        updatedAt: nowSecs,
        createdAt: nowSecs,
        messageCount: 2,
      };
      rows.unshift(stub);
    }
    activeSid = sid;
    render();
    setTitlebar((rows[0] && rows[0].title) || 'Conversation');
  }

  // ── Search ──
  searchEl.addEventListener('input', function() {
    searchTerm = searchEl.value || '';
    searchWrap.classList.toggle('has-text', searchTerm.length > 0);
    render();
  });
  searchEl.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && searchTerm) {
      e.preventDefault();
      searchEl.value = '';
      searchTerm = '';
      searchWrap.classList.remove('has-text');
      render();
    } else if (e.key === 'ArrowDown') {
      var first = listEl.querySelector('.convo-item');
      if (first) { e.preventDefault(); first.focus(); }
    }
  });
  searchClear.addEventListener('click', function() {
    searchEl.value = '';
    searchTerm = '';
    searchWrap.classList.remove('has-text');
    render();
    searchEl.focus();
  });

  // ── Collapse / expand (desktop persists in localStorage) ──
  function isDesktop() { return window.innerWidth > 900; }
  function applyInitialCollapse() {
    if (isDesktop()) {
      var stored = localStorage.getItem(COLLAPSE_KEY);
      panel.classList.toggle('collapsed', stored === '1');
    } else {
      // Mobile defaults to collapsed (drawer overlay).
      panel.classList.add('collapsed');
    }
  }
  function toggle() {
    panel.classList.toggle('collapsed');
    if (isDesktop()) {
      localStorage.setItem(COLLAPSE_KEY, panel.classList.contains('collapsed') ? '1' : '0');
    }
  }
  collapseBtn.addEventListener('click', toggle);
  toggleBtn.addEventListener('click', toggle);
  applyInitialCollapse();

  return { refresh: refresh, load: load, setActive: setActive, bumpToTop: bumpToTop };
})();

// Once the auth probe resolves, refresh the conversation list. CURRENT_USER
// + USER_ID_SLUG are already set by then.
// R-F722 (2026-05-19) — after the list loads, auto-resume the last
// active conversation for this user (Claude-style). Only loads if the
// saved SID belongs to this user (prefix match) AND appears in their
// returned conversations list (defensive against stale localStorage
// entries pointing at deleted convos). Falls through silently to a
// fresh chat if anything is missing.
AUTH_READY.then(function(user) {
  if (!user) return;
  Convos.refresh().then(function() {
    var saved = getLastSid();
    if (!saved || !saved.indexOf || saved.indexOf(USER_ID_SLUG + '_') !== 0) return;
    Convos.load(saved).catch(function(e) {
      console.warn('[Convos] auto-resume failed, starting fresh:', e);
      clearLastSid();
    });
  });
});

// After every successful send, bump the conversation to the top.
window._ariaTurnFinished = function(sid, firstUserMessage) {
  if (!sid) return;
  Convos.bumpToTop(sid, firstUserMessage ? firstUserMessage.slice(0, 60) : 'New conversation');
  saveLastSid(sid);  // R-F722 — remember current SID so refresh resumes here
};
</script>
</body>
</html>
