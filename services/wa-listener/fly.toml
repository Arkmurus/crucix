app = 'aria-wa'
primary_region = 'lhr'

# R-F1803 (audit #2) — let SIGTERM drain in-flight work on deploy before Fly
# sends SIGKILL (default 5s). Must be >= SHUTDOWN_GRACE_MS in the listener.
kill_timeout = '25s'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 5070
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/health"

[mounts]
  source = 'aria_wa_data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
