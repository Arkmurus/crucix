# R-F1603 — SearXNG config for ARIA's self-hosted search backend.
# Inherits SearXNG defaults; overrides only what ARIA needs:
#   - search.formats: enables the JSON API (search_searxng adapter requires it;
#     SearXNG ships with JSON OFF by default).
#   - server.secret_key: placeholder "ultrasecretkey" is replaced at boot by the
#     official image entrypoint with $SEARXNG_SECRET (set as a fly secret), so no
#     real secret is committed.
#   - limiter/public_instance off: this instance is INTERNAL-ONLY (reached via
#     aria-searxng.internal on fly's private network), not a public instance.
#
# R-F1659 — RESILIENT ENGINE SET. Live probe 2026-06-18 found this instance was
# effectively single-engine: of its default general engines, brave / duckduckgo /
# startpage all return "Suspended: too many requests" / "CAPTCHA" because the Fly
# DATACENTER IP is rate-limited/CAPTCHA'd by them — the same block that killed the
# direct backends, just one hop upstream. Only Google was carrying results, and
# some queries came back 200-with-0-results. Fix: explicitly ENABLE the
# datacenter-tolerant engines (mojeek = independent crawler, bing, wikipedia,
# wikidata, qwant) so search has real redundancy, and DISABLE the three
# perma-blocked engines so they stop adding CAPTCHA noise + per-query timeout
# latency to every search. Listed engines override the matching default by name;
# unlisted defaults are untouched.
use_default_settings: true

general:
  instance_name: "aria-searxng"
  debug: false

server:
  secret_key: "ultrasecretkey"   # replaced by $SEARXNG_SECRET at boot
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json

# R-F3863 (2026-08-11) — IDENTIFY OURSELVES. Several APIs do not block this
# datacenter IP at all; they block UNIDENTIFIED CLIENTS, and we were being refused
# for a reason we could simply fix. Measured directly from inside aria-intel against
# the Wikipedia API:
#
#     User-Agent: python-requests/2.0                    -> HTTP 403
#         "Please set a user-agent and respect our robot policy"
#     User-Agent: AriaIntelligence/1.0 (aria@arkmurus.com) -> HTTP 200
#         hits = ['Rosoboronexport', 'KAB-1500', 'Aleksandr Mikheyev']
#
# Same IP, same query, same second. So "blocked from a datacenter" was the wrong
# diagnosis for this class of source — the right move is COMPLIANCE, not evasion.
# Wikimedia's robot policy asks for a descriptive agent with a contact address;
# this provides one. It also reduces the 429s that were the other half of
# wikipedia's failures here, because Wikimedia throttles unidentified clients
# harder than identified ones.
#
# This is deliberately the OPPOSITE of the tempting fix. Routing this instance
# through residential proxies would also "work", and it would mean evading
# anti-bot controls to take data a provider is refusing us — untenable for a
# due-diligence product, and the same reasoning that already stopped us scraping
# TrustOnline (§18) and using Find Case Law unlicensed.
outgoing:
  useragent_suffix: "AriaIntelligence/1.0 (defence-DD research; aria@arkmurus.com)"
  request_timeout: 6.0
  max_request_timeout: 12.0

# R-F3849 (2026-08-11) — R-F1659's "datacenter-tolerant" set HAS ROTTED.
#
# R-F1659 (2026-06-18) enabled google/bing/mojeek/qwant/wikipedia/wikidata as the
# engines that still tolerated a Fly datacenter IP, and disabled the three that were
# already perma-blocked. Two months later, measured live from inside aria-intel via
# /stats/errors?format=json, the "tolerant" set is blocked too:
#
#     google    SearxEngineCaptchaException          ← was carrying the results
#     mojeek    SearxEngineAccessDeniedException
#     qwant     SearxEngineAccessDeniedException
#     wikidata  SearxEngineAccessDeniedException
#     bing      httpx.ReadTimeout / TimeoutException ← the only one still answering
#
# THE CONSEQUENCE WAS NOT "FEWER RESULTS", IT WAS WRONG RESULTS. With effectively one
# timing-out engine left, the instance began returning QUERY-INDEPENDENT result sets:
# the same DD query run four times gave four unrelated answers ("Nova Launcher FAQ",
# "Outlook", a Danish Google Help page), all engine=bing, ten well-formed results
# each. Four identical inputs producing four different outputs rules out query
# mangling — it is response cross-contamination. That noise seeded the crawl registry
# (C-14) and reached a customer DD report (C-19).
#
# So the blocked engines are disabled here for the SAME reason R-F1659 disabled the
# first three: they contribute nothing but CAPTCHA/timeout latency, and every engine
# left waiting is another chance for a response to be mismatched.
#
# THIS LIST WILL ROT AGAIN — that is the honest expectation, not a defect. A
# datacenter-hosted metasearch scraping consumer engines is a decaying asset; each
# engine blocks the IP sooner or later. Do NOT treat this file as settled truth.
# Re-measure with:
#     curl -s http://aria-searxng.internal:8080/stats/errors?format=json
# and re-tune. The protection that does NOT rot is R-F3844: aria-intel now rejects a
# query-independent result set as a backend FAILURE instead of trusting it, and
# R-F3847 makes Brave the sole DD search engine, so this instance's health no longer
# decides whether a customer report is honest.
# R-F3853 (2026-08-11) — WHY BING ALONE WAS WORSE THAN NO ENGINE, and what fixed it.
#
# R-F3849 (above) diagnosed the noise as "response cross-contamination". Measured
# again from inside aria-intel, that was WRONG, and the real mechanism matters
# because it decides the fix. Bing is not mixing responses. It answers CORRECTLY
# for popular queries and serves a soft-404 / trending page for queries it has no
# hits on — which SearXNG's bing engine scrapes into ten well-formed "results".
# The page's contents rotate per request, which is what made the same query look
# like it returned four different answers.
#
#   engines=bing, token-overlap with the query:
#     "Microsoft Corporation"          9/10 related   ← popular: correct
#     "BAE Systems"                    9/10 related
#     "London weather forecast"       10/10 related
#     "Rosoboronexport"                0/10 related   ← niche: pure junk
#     "Modirum Gespi Ltd"              0/10 related
#     "qwzzxlkj nonexistent entity 99" 0/10 related
#
# DD AND RESEARCH QUERIES ARE ALWAYS THE NICHE CASE — a specific company, an
# obscure entity, a person. So the one surviving engine was failing hardest in
# exactly the place ARIA depends on it, and passing in the place she does not.
#
# THE FIX IS AN ENGINE THAT ACTUALLY HAS AN INDEX. A bake-off of 18 engines
# against "Rosoboronexport" from this datacenter IP: duckduckgo/qwant/startpage
# CAPTCHA, mojeek/brave access-denied, google returns bing-grade junk, and `yep`
# (Ahrefs' independent index) returned 20/20 related. Verified on the real cases:
#     "Rosoboronexport sanctions"      20/20  — TASS + Kyiv Post sanctions coverage
#     "Modirum Gespi Ltd"              11/17  — modirumgespi.com + LAAD Security
#     "Silverbrook Capital Management" 10/20  — incl. the SEC EDGAR 10-Q
# That last one is the entity whose report was contaminated (C-19).
#
# BING STAYS ENABLED because it is genuinely good on popular queries, and losing
# it would put this instance back to one engine. Its junk is contained upstream:
# R-F3853 applies the R-F3844 query-independence test PER ENGINE, so bing's
# all-unrelated contribution is dropped while yep's real results are kept. Without
# that, a merged 20-good + 10-junk set passes the whole-set gate and the junk rides
# through diluted — which is how it reached a customer report in the first place.
# ⚠️ R-F3853 POSTSCRIPT, SAME DAY (2026-08-11) — `yep` ANSWERED FOR ABOUT AN HOUR,
# THEN 403'd THIS IP. Measured: `SearxEngineAccessDeniedException`, and still denied
# after a 3-minute backoff. The most likely trigger is the bake-off itself — ~40
# queries in a few minutes from one datacenter IP — so it may be viable under ARIA's
# ordinary load and is deliberately LEFT ENABLED rather than ripped out. Re-measure
# before trusting or removing it.
#
# The honest state of this instance as measured 2026-08-11: EVERY general web engine
# is blocked (yep access-denied, mojeek access-denied, duckduckgo timeout,
# brave/google too-many-requests, startpage CAPTCHA) and bing answers only popular
# queries. This is not a tuning problem. A datacenter-hosted metasearch scraping
# consumer engines is structurally a decaying asset, and the engine list will keep
# rotting.
#
# ⚠️ DO NOT TRUST THE PARAGRAPH ABOVE AS CURRENT — IT IS A SNAPSHOT, AND THE WHOLE
# POINT OF THIS FILE'S HISTORY IS THAT SUCH SNAPSHOTS ROT. R-F3873 (2026-08-11) made
# the state MEASURED: SearXNG reports `unresponsive_engines` on every response and
# ARIA now consumes it, so the live answer is
#     GET /api/aria/search/health → engine_relevance.blocked
# Read that before editing anything here. `yep` in particular oscillates — it was
# serving 81 observations at 2.5% junk while SearXNG simultaneously reported it
# "Suspended: access denied", which is exactly why a hand-written status comment is
# the wrong instrument and why nothing above should be treated as today's truth.
#
# WHAT KEEPS ARIA WORKING ANYWAY — measured end-to-end through web_search.search(),
# which fans out across MANY backends, not just this one:
#     "Rosoboronexport sanctions"  10 results, 10 related  (google_news, semantic_scholar)
#     "BAE Systems plc"            10 results, 10 related  (google_news, bing_news, memory)
#     "Modirum Gespi Ltd"          10 results,  5 related  (memory, google_news, crossref)
# So SearXNG being degraded is a REDUNDANCY loss, not a blackout. Do not conclude
# from a SearXNG-only probe that ARIA cannot search — measure the real path.
#
# And the reason a degraded instance is now merely useless rather than harmful:
# R-F3844 + R-F3853 + R-F3857 make it report a BACKEND FAILURE instead of returning
# junk as success. Verified live post-deploy: a niche query with every engine
# serving junk returns ok=False, count=0 — where before R-F3857 it would have
# returned ok=True with zero results, which an adverse-media sweep reads as CLEAN.
engines:
  # Independent index (Ahrefs). Answered 20/20 on the niche query that defeats every
  # other engine — then began returning 403 within the hour (see postscript above).
  # Left enabled: when it answers it is the only thing standing between a niche
  # research query and bing's trending page, and it costs nothing while suspended.
  - name: yep
    disabled: false
  # Correct on popular queries, soft-404 junk on niche ones. Kept for the former;
  # the latter is filtered per-engine by R-F3853 in search_searxng.py.
  - name: bing
    disabled: false
  # R-F3863 — API-BASED, POLICY-COMPLIANT, and now identified (see `outgoing`
  # above). These are the tier that does NOT rot: they are not scraped, they do not
  # CAPTCHA, and they refuse us only when we fail to say who we are. Re-enabled
  # together with the user-agent suffix that a direct probe proved is the whole
  # difference between 403 and 200.
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false
  # BLOCKED from the Fly datacenter IP, measured 2026-08-11. Disabled so they stop
  # adding CAPTCHA/access-denied noise and per-query timeout latency.
  - name: google
    disabled: true
  - name: mojeek
    disabled: true
  - name: qwant
    disabled: true
  # Perma-blocked since R-F1659 (2026-06-18).
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: startpage
    disabled: true

ui:
  static_use_hash: true
