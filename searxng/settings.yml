# R-F1603 — SearXNG config for ARIA's self-hosted search backend.
# Inherits SearXNG defaults; overrides only what ARIA needs:
#   - search.formats: enables the JSON API (search_searxng adapter requires it;
#     SearXNG ships with JSON OFF by default).
#   - server.secret_key: placeholder "ultrasecretkey" is replaced at boot by the
#     official image entrypoint with $SEARXNG_SECRET (set as a fly secret), so no
#     real secret is committed.
#   - limiter/public_instance off: this instance is INTERNAL-ONLY (reached via
#     aria-searxng.internal on fly's private network), not a public instance.
#
# R-F1659 — RESILIENT ENGINE SET. Live probe 2026-06-18 found this instance was
# effectively single-engine: of its default general engines, brave / duckduckgo /
# startpage all return "Suspended: too many requests" / "CAPTCHA" because the Fly
# DATACENTER IP is rate-limited/CAPTCHA'd by them — the same block that killed the
# direct backends, just one hop upstream. Only Google was carrying results, and
# some queries came back 200-with-0-results. Fix: explicitly ENABLE the
# datacenter-tolerant engines (mojeek = independent crawler, bing, wikipedia,
# wikidata, qwant) so search has real redundancy, and DISABLE the three
# perma-blocked engines so they stop adding CAPTCHA noise + per-query timeout
# latency to every search. Listed engines override the matching default by name;
# unlisted defaults are untouched.
use_default_settings: true

general:
  instance_name: "aria-searxng"
  debug: false

server:
  secret_key: "ultrasecretkey"   # replaced by $SEARXNG_SECRET at boot
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json

# R-F3849 (2026-08-11) — R-F1659's "datacenter-tolerant" set HAS ROTTED.
#
# R-F1659 (2026-06-18) enabled google/bing/mojeek/qwant/wikipedia/wikidata as the
# engines that still tolerated a Fly datacenter IP, and disabled the three that were
# already perma-blocked. Two months later, measured live from inside aria-intel via
# /stats/errors?format=json, the "tolerant" set is blocked too:
#
#     google    SearxEngineCaptchaException          ← was carrying the results
#     mojeek    SearxEngineAccessDeniedException
#     qwant     SearxEngineAccessDeniedException
#     wikidata  SearxEngineAccessDeniedException
#     bing      httpx.ReadTimeout / TimeoutException ← the only one still answering
#
# THE CONSEQUENCE WAS NOT "FEWER RESULTS", IT WAS WRONG RESULTS. With effectively one
# timing-out engine left, the instance began returning QUERY-INDEPENDENT result sets:
# the same DD query run four times gave four unrelated answers ("Nova Launcher FAQ",
# "Outlook", a Danish Google Help page), all engine=bing, ten well-formed results
# each. Four identical inputs producing four different outputs rules out query
# mangling — it is response cross-contamination. That noise seeded the crawl registry
# (C-14) and reached a customer DD report (C-19).
#
# So the blocked engines are disabled here for the SAME reason R-F1659 disabled the
# first three: they contribute nothing but CAPTCHA/timeout latency, and every engine
# left waiting is another chance for a response to be mismatched.
#
# THIS LIST WILL ROT AGAIN — that is the honest expectation, not a defect. A
# datacenter-hosted metasearch scraping consumer engines is a decaying asset; each
# engine blocks the IP sooner or later. Do NOT treat this file as settled truth.
# Re-measure with:
#     curl -s http://aria-searxng.internal:8080/stats/errors?format=json
# and re-tune. The protection that does NOT rot is R-F3844: aria-intel now rejects a
# query-independent result set as a backend FAILURE instead of trusting it, and
# R-F3847 makes Brave the sole DD search engine, so this instance's health no longer
# decides whether a customer report is honest.
engines:
  # Still answering (with timeouts) — the only general-web engine left.
  - name: bing
    disabled: false
  - name: wikipedia
    disabled: false
  # BLOCKED from the Fly datacenter IP, measured 2026-08-11. Disabled so they stop
  # adding CAPTCHA/access-denied noise and per-query timeout latency.
  - name: google
    disabled: true
  - name: mojeek
    disabled: true
  - name: qwant
    disabled: true
  - name: wikidata
    disabled: true
  # Perma-blocked since R-F1659 (2026-06-18).
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: startpage
    disabled: true

ui:
  static_use_hash: true
